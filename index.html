годня", "/kɔːl ɪt ə deɪ/"], ["no big deal", "ничего страшного", "/noʊ bɪɡ diːl/"], ["catch you later", "до скорого", "/kætʃ juː ˈleɪtər/"], ["my bad", "моя вина (сленг)", "/maɪ bæd/"]]}, {"t": "ФИНАЛЬНЫЙ ЭКЗАМЕН\n\nЦель: проверить всё освоенное: произношение, лексику, скорость и спокойствие.\n\nФормат (30 минут):\n1) 2 минуты: легенда без бумажки.\n2) 3 минуты: бытовой диалог по роли (магазин, отель).\n3) 5 минут: допрос с неожиданными вопросами.\n4) 3 минуты: пересказ новости.\n5) Запись всего экзамена на диктофон.\n\nКритерии самооценки (по 5 баллов):\n- понятность речи;\n- темп и ритм;\n- отсутствие долгих пауз;\n- богатство лексики и идиом;\n- уверенность.\n\nПосле экзамена прослушайте запись, выпишите 5 слабых мест и вернитесь к соответствующим урокам.\nПроверка: 20 баллов и выше означает, что курс пройден; ниже — повторите слабые разделы.", "w": [["confident", "уверенный", "/ˈkɑːnfɪdənt/"], ["fluency", "беглость", "/ˈfluːənsi/"], ["accent", "акцент", "/ˈæksɛnt/"], ["improve", "улучшать", "/ɪmˈpruːv/"], ["score", "балл", "/skɔːr/"], ["challenge", "вызов", "/ˈtʃælɪndʒ/"], ["progress", "прогресс", "/ˈprɑːɡrɛs/"], ["level", "уровень", "/ˈlɛvəl/"]]}], "comm": [{"t": "УРОК 1. ПРИВЕТСТВИЯ И ЗНАКОМСТВО (РАСШИРЕННЫЙ КУРС)\nОбъём: 4 недели, 5–6 дней в неделю по 45–60 минут (около 20–25 часов). Уровень: A1 (с нуля).\nУчебный язык: объяснения по-русски, примеры по-английски.\n\n## Как устроен урок\nТеория (разделы 1–8), практика (разделы 9–16), контроль (разделы 17–19). Сначала прочитайте теорию целиком без заучивания, затем работайте с практикой и возвращайтесь к теории по мере необходимости. Для знакомства важнее всего автоматизм: фразы должны вылетать без раздумий.\n\n## Раздел 0. Научная основа метода\n1. Входной материал (input): язык усваивается, когда вы много слышите и читаете понятного. Поэтому в уроке есть диалоги, тексты и диктовка.\n2. Выходная речь (output): когда вы говорите и пишете, вы замечаете пробелы (идея лингвиста Мерилл Суэйн). Поэтому говорение и письмо обязательны.\n3. Активное вспоминание: вспоминать эффективнее, чем перечитывать. Закрывайте перевод и воспроизводите фразы.\n4. Интервальные повторения: возвращайтесь к материалу через 1, 3, 7, 14 дней. Для этого есть вкладка «Карточки».\n5. Обратная связь: ошибки нужно разбирать. Поэтому есть таблица ошибок и ключи.\n\n## Раздел 1. Приветствия, прощания, представление\nПриветствия по времени суток: Good morning (с утра до полудня), Good afternoon (после полудня до вечера), Good evening (вечером, при встрече). Good night используется только при прощании перед сном.\nРегистры:\n- Формальный: Good morning. How do you do? (очень официально; ответ повторяет вопрос) Pleased to meet you.\n- Нейтральный: Hello. Hi. How are you? Nice to meet you.\n- Неформальный: Hey. What's up? How's it going? You alright? (британский вариант).\nОтветы на How are you?: Fine, thanks. And you? / Good, thanks. / Not bad. / Pretty good. / Can't complain.\nВ США How are you? — приветствие, а не просьба рассказать о здоровье. Подробный ответ о проблемах здесь неуместен.\nПрощания: Goodbye (нейтрально), Bye, See you later, See you tomorrow, Take care, Have a nice day.\nОбращения: Mr /ˈmɪstər/ (мужчина), Mrs /ˈmɪsɪz/ (замужняя женщина), Ms /mɪz/ (универсальное, не указывает семейное положение), Dr (врач или учёная степень). Они используются с фамилией: Mr Brown.\nПредставление себя: Hi, I'm Lera. / My name is Lera. / Let me introduce myself. I'm Lera.\nПредставление другого: This is my friend, Dana. / Dana, this is Lera. Ответ: Nice to meet you. — Nice to meet you too.\n\n## Раздел 2. Глагол to be: полная теория\nВ русском настоящем времени глагол-связка опускается («Я студент»), в английском глагол обязателен.\nФормы: I am, you are, he is, she is, it is, we are, you are, they are.\nКраткие формы в речи: I'm /aɪm/, you're /jʊr/, he's /hiːz/, she's /ʃiːz/, it's /ɪts/, we're /wɪr/, they're /ðɛr/.\nОтрицание: I'm not; you aren't (are not); he/she/it isn't (is not); we/they aren't.\nВопрос: Am I...? Are you...? Is he/she/it...? Are we...? Are they...? Вспомогательный порядок: глагол выходит перед подлежащим. Are you from Almaty?\nКраткие ответы: Yes, I am. / No, I'm not. Yes, he is. / No, he isn't. Нельзя Yes, I'm. (краткая форма в утвердительном ответе недопустима).\nУпотребление be: имя, возраст, профессия, национальность, происхождение, состояние. I'm Lera. I'm 25. She is a teacher. We're from Kazakhstan. I'm tired.\nОсобенность: возраст передаётся через be. I'm 25 (years old). Нельзя I have 25 years.\nМестоимения: I, you, he, she, it, we, they. You — и «ты», и «вы». It — для вещей, животных и общего подлежащего (It's cold. It's 5 o'clock).\n\n## Раздел 3. Притяжательные местоимения, вопросительные слова, this/that\nmy (мой), your (твой, ваш), his (его), her (её), its (его, её; о вещи), our (наш), their (их).\nПравило: форма зависит от владельца. His name is Aidar. Her name is Lera.\nВопросительные слова: What? (что, какой), Where? (где, куда), Who? (кто), How? (как), How old? (сколько лет), How many? (сколько, исчисляемое), How much? (сколько стоит).\nПорядок: вопросительное слово + глагол + подлежащее: Where are you from? What is your name?\nthis / that / these / those: this is, that is, these are, those are. This is my friend (рядом, представление). That is my car (далеко).\nВ знакомстве чаще всего: This is my friend, Dana.\n\n## Раздел 4. Числа, возраст, телефон, алфавит\nЧисла 0–20: zero /ˈzɪroʊ/ (в телефонах часто oh), one, two, three, four, five, six, seven, eight, nine, ten, eleven, twelve, thirteen, fourteen, fifteen, sixteen, seventeen, eighteen, nineteen, twenty.\nДесятки: thirty, forty, fifty, sixty, seventy, eighty, ninety, a hundred.\nСоставные: twenty-one, thirty-four, sixty-seven. Через дефис.\nУдарение: в числах 13–19 ударение на последнем слоге (thirteen /ˌθɜːrˈtiːn/), в десятках на первом (thirty /ˈθɜːrti/). Это различение критично: 15 и 50 звучат похоже, если не слышать ударения. Фраза: fifteen /ˌfɪfˈtiːn/ и fifty /ˈfɪfti/.\nТелефонные номера читаются цифрами: 555-0198 → five five five, oh one nine eight. Двойные цифры: double five (британский вариант).\nВозраст: How old are you? — I'm twenty-five. Для вежливости: I'm in my twenties (мне двадцать с чем-то).\nАлфавит: A /eɪ/, B /biː/, C /siː/, D /diː/, E /iː/, F /ɛf/, G /dʒiː/, H /eɪtʃ/, I /aɪ/, J /dʒeɪ/, K /keɪ/, L /ɛl/, M /ɛm/, N /ɛn/, O /oʊ/, P /piː/, Q /kjuː/, R /ɑːr/, S /ɛs/, T /tiː/, U /juː/, V /viː/, W /ˈdʌbəl juː/, X /ɛks/, Y /waɪ/, Z /ziː/ (США) или /zɛd/ (Британия).\nЗапоминайте группами по гласному звуку: /eɪ/ A H J K; /iː/ B C D E G P T V Z; /ɛ/ F L M N S X; /aɪ/ I Y; /oʊ/ O; /juː/ Q U W; /ɑːr/ R.\nСпеллинг: How do you spell your name? — L-E-R-A. Для чётности: A as in Apple, B as in Boy (кодовые слова).\n\n## Раздел 5. Страны и национальности\nМодель: Where are you from? — I'm from Kazakhstan. Национальность: I'm Kazakhstani.\nСлово Kazakhstani указывает на гражданство, Kazakh на этническую принадлежность и язык. Это тонкое различие, при сомнении спросите, как человек сам себя называет.\nСуффиксы: -an (American /əˈmɛrɪkən/, Italian /ɪˈtæljən/, German /ˈdʒɜːrmən/, Russian /ˈrʌʃən/); -ish (British /ˈbrɪtɪʃ/, Turkish /ˈtɜːrkɪʃ/, Spanish /ˈspænɪʃ/); -ese (Chinese /tʃaɪˈniːz/, Japanese /ˌdʒæpəˈniːz/); -i (Kazakhstani, Pakistani); особые: French /frɛntʃ/, Dutch.\nНациональности и языки пишутся с заглавной буквы. Язык часто совпадает с прилагательным: She speaks Italian.\n\n## Раздел 6. Профессии и занятия\nВопросы: What do you do? / What's your job? / What do you do for a living?\nОтвет: I'm a teacher. / I'm an engineer. / I work as a trainer. / I'm a student.\nПрофессии: teacher /ˈtiːtʃər/, student /ˈstuːdənt/, doctor, nurse, engineer /ˌɛndʒɪˈnɪr/, manager, driver, coach /koʊtʃ/, trainer, bartender /ˈbɑːrtɛndər/, developer /dɪˈvɛləpər/, accountant /əˈkaʊntənt/, lawyer /ˈlɔːjər/.\nПредлоги: work at (место: at a bar, at a hospital), work for (организация: for a company), work in (сфера, помещение: in an office, in marketing). Различайте: I work at a gym. I work for a big company.\nАртикль с профессией обязателен: She is a doctor. He is an engineer. Без артикля нельзя (в русском его нет, отсюда ошибка).\n\n## Раздел 7. Small talk и культура общения\nSmall talk — лёгкая беседа для установления контакта. Темы: откуда вы, чем занимаетесь, погода, дорога, выходные, хобби. Избегайте в первом знакомстве: деньги, возраст (у взрослых), политика, религия.\nПриём «Ответ + деталь + встречный вопрос» (ответ, добавление, возвращение вопроса):\n— Where are you from? — I'm from Almaty. It's a beautiful city. Where are you from?\n— What do you do? — I'm a trainer. I work at a gym. And you?\nЭто превращает диалог из допроса в разговор.\nПолезные фразы для поддержки беседы: Really? That's interesting. Me too. Oh, nice! Sounds great. I see.\nЕсли не поняли: Sorry? / Pardon? / Could you repeat that, please? / Could you speak more slowly?\nКультура: рукопожатие короткое и уверенное, зрительный контакт; в США и Великобритании чаще используют имя; Mr и Ms применяют в формальной обстановке; вопрос о возрасте и доходах в знакомстве может быть неуместным.\n\n## Раздел 8. Произношение и интонация\nСлабые формы (в быстрой речи): Nice to meet you → /naɪs tə ˈmiːt ju/. Where are you from? → /wɛr ər ju frʌm/ (from слабое: /frəm/). What do you do? → /wʌt də ju duː/. How are you? → /haʊ ər ju/ или в быстрой речи /haʊr ju/. What's your name? → /wʌts jɔːr neɪm/.\nИнтонация: вопросы с вопросительным словом обычно падают к концу: What's your NAME? ↘ Общие вопросы (да/нет) обычно растут: Are you from ALmaty? ↗ Приветствие How are you? падает: How are YOU? ↘\nПеречисление: интонация растёт на каждом элементе, кроме последнего, где падает: I'm from Almaty ↗, I'm a trainer ↗ and I'm twenty-five ↘.\nРитм: хлопайте на ударных слогах и проговаривайте: NICE to MEET you.\nФонетический фокус урока (повторять ежедневно 3 минуты): /w/ в where, what, we; /ð/ в they, the; /θ/ в thanks; шва в слабых формах.\n\n## Раздел 9. Практика 1. Глагол to be\nВставьте am, is или are: 1) I ___ from Kazakhstan. 2) She ___ a teacher. 3) We ___ friends. 4) They ___ not at home. 5) ___ you a student? 6) He ___ not my brother. 7) It ___ a nice day. 8) My parents ___ doctors. 9) ___ she from Italy? 10) I ___ not tired.\n\n## Раздел 10. Практика 2. Исправьте ошибки\n1) I from Almaty. 2) I have 25 years. 3) I am agree. 4) She are my friend. 5) Yes, I'm. 6) He no is a student. 7) Where you are from? 8) My name are Lera.\n\n## Раздел 11. Практика 3. Вопросы к ответам\nСоставьте вопрос: 1) ___? I'm from Almaty. 2) ___? My name is Lera. 3) ___? I'm twenty-five. 4) ___? I'm a student. 5) ___? L-E-R-A. 6) ___? He is my brother.\n\n## Раздел 12. Практика 4. Числа\nЗапишите словами: 13, 30, 15, 50, 19, 90, 24, 67. Прочитайте номер 555-0198. Объясните разницу в ударении: fourteen и forty.\n\n## Раздел 13. Практика 5. Национальности\nОбразуйте национальность: Italy, Russia, Turkey, Japan, Germany, Spain, the USA, Kazakhstan, France, Britain, China.\n\n## Раздел 14. Практика 6. Диалоги\nДополните диалог своими ответами и разыграйте с партнёром:\nA: Hello! I'm ___. What's your name? B: ___.\nA: Nice to meet you. Where are you from? B: ___. And you?\nA: ___. What do you do? B: ___. And you?\nA: ___. How old are you? B: ___.\nЗатем придумайте диалог с формальным представлением (Good morning, Mr / Ms ___).\n\n## Раздел 15. Практика 7. Перевод\n1) Меня зовут Лера. 2) Мне двадцать пять лет. 3) Я из Алматы. 4) Он не студент. 5) Вы из Италии? 6) Это мой друг Айдар. 7) Приятно познакомиться. 8) Чем вы занимаетесь? 9) Повторите, пожалуйста. 10) Как пишется ваше имя?\n\n## Раздел 16. Практика 8. Чтение, диктовка, говорение, письмо\nЧтение. Прочитайте текст и ответьте на вопросы.\nHello! I'm Samal. I'm twenty-eight and I'm from Shymkent. I'm a nurse. My friend Arman is from Almaty. He's a driver. We aren't colleagues, we're neighbours. Our English teacher is Mr Brown. He's British, from Manchester.\nВопросы: 1) How old is Samal? 2) Where is she from? 3) What does Samal do? 4) Is Arman from Shymkent? 5) What is his job? 6) Are they colleagues? 7) Who is Mr Brown? 8) Where is he from?\nДиктовка (5 предложений): My name is Dana. I'm from Almaty. Are you a student? She isn't my sister. Nice to meet you too.\nГоворение (запись по 3–5 минут):\n1) Представьтесь формально и неформально.\n2) Представьте друга третьему человеку.\n3) Small talk 3 минуты с партнёром по приёму «ответ + деталь + вопрос».\n4) Назовите по буквам своё имя, фамилию, город и номер телефона.\n5) Разыграйте знакомство на работе.\nПисьмо. Напишите текст My introduction на 80–100 слов. Чек-лист: имя, возраст, город, профессия, 2 факта о себе, правильные be и артикли с профессией, нет типичных ошибок из раздела 18. Покажите текст партнёру и разберите ошибки.\n\n## Раздел 17. Ключи\nПрактика 1: am, is, are, are, Are, is, is, are, Is, am.\nПрактика 2: 1) I'm from Almaty. 2) I'm 25. 3) I agree. 4) She is my friend. 5) Yes, I am. 6) He isn't a student. 7) Where are you from? 8) My name is Lera.\nПрактика 3: 1) Where are you from? 2) What's your name? 3) How old are you? 4) What do you do? 5) How do you spell your name? 6) Who is he?\nПрактика 4: thirteen, thirty, fifteen, fifty, nineteen, ninety, twenty-four, sixty-seven; five five five, oh one nine eight. Fourteen /ˌfɔːrˈtiːn/ — ударение на втором слоге, forty /ˈfɔːrti/ — на первом.\nПрактика 5: Italian, Russian, Turkish, Japanese, German, Spanish, American, Kazakhstani, French, British, Chinese.\nПрактика 7: 1) My name is Lera. / I'm Lera. 2) I'm twenty-five (years old). 3) I'm from Almaty. 4) He isn't a student. 5) Are you from Italy? 6) This is my friend, Aidar. 7) Nice to meet you. 8) What do you do? 9) Could you repeat that, please? 10) How do you spell your name?\nПрактика 8 (чтение): 1) She is twenty-eight. 2) She is from Shymkent. 3) She is a nurse. 4) No, he is from Almaty. 5) He is a driver. 6) No, they are neighbours. 7) Their English teacher. 8) He is British, from Manchester.\n\n## Раздел 18. Таблица типичных ошибок\n- Опущение be: I from Almaty → I'm from Almaty.\n- Возраст через have: I have 25 years → I'm 25.\n- Be вместе с глаголом: I am agree → I agree.\n- Согласование: She are → She is.\n- Краткая форма в утверждении: Yes, I'm → Yes, I am.\n- Порядок слов в вопросе: Where you are from? → Where are you from?\n- Без артикля: I'm teacher → I'm a teacher.\n- Путаница his и her: Lera is a student. His name is Lera → Her name is Lera.\nВедите личный список ошибок и перечитывайте раз в неделю.\n\n## Раздел 19. Итоговый тест (15 баллов)\n1) She ___ (be) from Italy. 2) ___ you a student? 3) They ___ (not be) at home. 4) I ___ (be) 25. 5) Where ___ you from? 6) ___ is your name? 7) Is he a teacher? — Yes, ___. 8) Напишите словами число 40. 9) Национальность человека из Японии: ___. 10) Как поздороваться в 8 вечера? 11) Исправьте: I have 20 years. 12) Как читается буква W? 13) Ответ на How do you do? 14) How old ___ your brother? 15) She is ___ doctor. (a или an)\nОтветы: 1) is 2) Are 3) aren't 4) am 5) are 6) What 7) he is 8) forty 9) Japanese 10) Good evening 11) I'm 20 (years old) 12) /ˈdʌbəl juː/ 13) How do you do? 14) is 15) a.\nОценка: 13–15 — отлично, переходите к уроку 2; 10–12 — хорошо, повторите слабые разделы; меньше 10 — вернитесь к теории и практике, повторите две недели.\n\n## План на 4 недели\nНеделя 1: регистры, приветствия, прощания, представление (раздел 1), to be (раздел 2). Практика 1, 2. Ежедневно 10 минут карточек.\nНеделя 2: притяжательные, вопросительные, this/that (раздел 3), числа и алфавит (раздел 4). Практика 3, 4, диктовка.\nНеделя 3: страны и национальности (раздел 5), профессии (раздел 6), small talk (раздел 7), произношение (раздел 8). Практика 5, 6, говорение 1–3.\nНеделя 4: перевод (практика 7), чтение, письмо, говорение 4–5, итоговый тест, разбор ошибок.\n\n## Что стоит сверить в книгах\nRaymond Murphy, «English Grammar in Use» (to be, вопросы, числа); Michael Swan, «Practical English Usage»; Cambridge Dictionary и Oxford Learner's Dictionaries (произношение и примеры). Для фонетики: Peter Roach, «English Phonetics and Phonology».\nВажное замечание: упражнения и ключи составлены для самопроверки. Для оценки произношения и письма нужна обратная связь от человека, хорошо владеющего английским.\n", "w": [["hello", "привет", "/həˈloʊ/"], ["goodbye", "до свидания", "/ɡʊdˈbaɪ/"], ["name", "имя", "/neɪm/"], ["friend", "друг, подруга", "/frɛnd/"], ["from", "из, от", "/frʌm/"], ["where", "где, куда", "/wɛr/"], ["fine", "хорошо, в порядке", "/faɪn/"], ["welcome", "добро пожаловать", "/ˈwɛlkəm/"], ["introduce", "представлять", "/ˌɪntrəˈduːs/"], ["spell", "писать по буквам", "/spɛl/"], ["nationality", "национальность", "/ˌnæʃəˈnæləti/"], ["country", "страна", "/ˈkʌntri/"], ["age", "возраст", "/eɪdʒ/"], ["old", "старый", "/oʊld/"], ["student", "студент", "/ˈstuːdənt/"], ["teacher", "учитель", "/ˈtiːtʃər/"], ["pleased", "рад", "/pliːzd/"], ["morning", "утро", "/ˈmɔːrnɪŋ/"], ["evening", "вечер", "/ˈiːvnɪŋ/"], ["colleague", "коллега", "/ˈkɑːliːɡ/"]]}, {"t": "УРОК 2. Я И МОЯ СЕМЬЯ (РАСШИРЕННЫЙ КУРС)\nОбъём: 4 недели, 5–6 дней в неделю по 45–60 минут (около 20–25 часов). Уровень: A1 → A2.\nУчебный язык: объяснения по-русски, примеры по-английски.\n\n## Как устроен урок\nУрок состоит из трёх частей: теория (разделы 1–8), практика (разделы 9–16) и контроль (разделы 17–19). Сначала прочитайте теорию целиком один раз без заучивания, потом работайте с практикой и возвращайтесь к теории по мере необходимости. Это нормальный путь: так устроено усвоение грамматики, когда правило становится понятным только после нескольких применений.\n\n## Раздел 0. Научная основа метода\nНесколько принципов из прикладной лингвистики и когнитивной психологии определяют порядок работы:\n1. Входной материал (input). Язык усваивается, когда вы много слышите и читаете понятного. Поэтому в уроке есть тексты, диалоги и диктовка.\n2. Выходная речь (output). Исследовательница Мерилл Суэйн показала, что когда вы говорите и пишете, вы замечаете собственные пробелы. Поэтому говорение и письмо обязательны.\n3. Активное вспоминание (retrieval practice). Вспоминать полезнее, чем перечитывать.\n4. Интервальные повторения (spaced practice). Повторять лучше через разные промежутки, чем одним заходом.\n5. Обратная связь. Ошибки нужно разбирать, а не просто исправлять. Поэтому в уроке есть таблица ошибок и ключи.\nВывод: меньше пассивного чтения, больше работы руками и голосом.\n\n## Раздел 1. Лексика: семья и родственные связи\nЯдро: family /ˈfæmli/, parents /ˈpɛrənts/, mother (US mom, UK mum), father (dad), brother, sister, sibling /ˈsɪblɪŋ/ (брат или сестра), son, daughter /ˈdɔːtər/, child (мн. children), husband /ˈhʌzbənd/, wife /waɪf/, only child (единственный ребёнок), twins /twɪnz/.\nСтаршее и младшее поколение: grandmother (grandma), grandfather (grandpa), grandparents, grandson, granddaughter, grandchildren.\nРасширенная семья: aunt /ænt/ (UK /ɑːnt/), uncle /ˈʌŋkəl/, cousin /ˈkʌzən/, nephew /ˈnɛfjuː/, niece /niːs/, relatives /ˈrɛlətɪvz/ (родственники).\nРодственники по браку (in-laws): mother-in-law, father-in-law, brother-in-law, sister-in-law, son-in-law, daughter-in-law.\nСводные и единокровные: stepfather, stepmother, stepbrother, stepsister; half-brother, half-sister (общий один родитель).\nОтношения: partner, fiancé /ˌfiːɑːnˈseɪ/ (жених), fiancée (невеста; произносится так же), boyfriend, girlfriend, ex (бывший), spouse (супруг, супруга; официально).\nНюансы: слово cousin не указывает пол; в США family чаще воспринимается как нуклеарная семья (родители и дети), в британской речи часто шире. Слово relatives означает всех родственников, а parents означает только мать и отца, в отличие от русского «родители» с оттенками. Не путайте parents (родители) и relatives (родственники): оба слова легко спутать из-за схожести написания и перевода.\n\n## Раздел 2. Описание людей: внешность и характер\nВнешность: tall, short, medium height; slim (стройный), thin (худой, часто негативно), athletic, heavy, overweight (осторожно, может быть грубо); волосы: short / long, straight (прямые), wavy (волнистые), curly (кудрявые), dark, fair (светлые, UK), blond(e), red, grey, bald (лысый); other: beard /bɪrd/, moustache /ˈmʌstæʃ/, glasses, freckles.\nВозраст: He is in his twenties / thirties; middle-aged (средних лет); elderly (пожилой). Слово old в отношении человека может звучать грубо, лучше elderly.\nХарактер: kind, friendly, funny, shy, quiet, outgoing (общительный), generous /ˈdʒɛnərəs/, strict, patient, hard-working, lazy, honest /ˈɑːnɪst/ (h не произносится), polite, stubborn (упрямый).\nСтруктуры:\n- He is tall. He has short dark hair. (Здесь have/has без got в американской норме.)\n- She looks like her mother. (внешне похожа)\n- He takes after his father. (характером похож, унаследовал)\n- What is he like? = каков он по характеру? What does he look like? = как он выглядит? Это пара, которую русскоговорящие часто путают, потому что по-русски один вопрос.\nПорядок прилагательных (для справки): мнение, размер, возраст, цвет, происхождение, материал: a nice big old brown wooden table. Для описания человека достаточно: a tall young man, a kind old woman.\n\n## Раздел 3. Глагол have и конструкция have got\nЗначение: обладание, родственные связи, характеристики. I have two brothers. She has long hair.\nАмериканский вариант: I have, you have, he has; отрицание I don't have, вопрос Do you have...?\nБританский вариант: have got: I've got two brothers. He's got blue eyes. Отрицание: I haven't got; вопрос: Have you got...?\nСмысл одинаков. Для разговорной речи вне Великобритании выбирайте have.\nТипичные ошибки русскоговорящих:\n- У меня есть брат → At me is a brother ✗; I have a brother ✓ (в английском нужен субъект-обладатель и глагол, оборот «у меня» невозможен).\n- She have two sisters ✗ → She has two sisters ✓.\n- He hasn't brothers ✗ → He doesn't have any brothers / He hasn't got any brothers ✓ (после отрицания обычно any).\n- My sister has 25 years ✗ → My sister is 25 ✓ (возраст через be).\n\n## Раздел 4. Существительные: множественное число\nПравила:\n- Большинство: +s: sister → sisters.\n- После s, sh, ch, x, z и часто o: +es: box → boxes, watch → watches, tomato → tomatoes.\n- Согласная + y → ies: family → families, baby → babies. Гласная + y → ys: day → days.\n- f/fe → ves: wife → wives, leaf → leaves, knife → knives.\nНеправильные: man → men, woman /ˈwʊmən/ → women /ˈwɪmɪn/ (произношение разное!), child → children, person → people, foot → feet, tooth → teeth, mouse → mice.\nСложные слова с in-law: множественное число у главного слова: brothers-in-law.\nНулевое множественное: sheep, fish (в обычном значении), deer.\nПроизношение окончания -s/-es:\n- /s/ после глухих: books /bʊks/, parents /ˈpɛrənts/.\n- /z/ после звонких и гласных: brothers /ˈbrʌðərz/, days /deɪz/.\n- /ɪz/ после шипящих и свистящих: watches /ˈwɑːtʃɪz/, boxes /ˈbɑːksɪz/, nieces /ˈniːsɪz/.\nЭто же правило действует для 3 лица глагола и для 's.\n\n## Раздел 5. Притяжательный падеж ('s)\nФорма: существительное + 's: my mother's name. Для множественного числа на -s: апостроф после s: my parents' house. Для неправильного множественного числа: the children's toys.\nКогда использовать: для людей и животных. Для вещей чаще используют of: the door of the room, the end of the story.\nВопрос Whose? (чей): Whose bag is this? It's Lera's. (Lera's = Lera's bag.)\nТипичные ошибки: the car of my father (звучит неестественно) → my father's car; my parents's house ✗ → my parents' house ✓.\nНе путайте 's притяжательное и 's как сокращение от is/has: Lera's tall (Lera is tall), Lera's got a car (Lera has got a car), Lera's car (машина Леры). Определяйте по контексту.\n\n## Раздел 6. Артикли\nРусский язык артиклей не имеет, поэтому это самая устойчивая трудность.\na / an — неопределённый, для неизвестного, одного из многих, при первом упоминании: I have a sister.\nthe — определённый, для известного собеседнику, единственного в контексте или уже упомянутого: The sister is a doctor.\nВыбор a или an определяется ЗВУКОМ, а не буквой: an uncle /ʌ/, an hour /aʊər/ (h не произносится), an honest man; но a university /juː/, a one-hour lesson.\nНулевой артикль: с множественным числом и неисчисляемыми в общем значении (I like children), с названиями приёмов пищи (have dinner), с именами (Lera), с языками (speak English).\nthe: с уникальными объектами (the sun, the moon), с музыкальными инструментами (play the guitar), с профессиями-обобщениями в научных текстах.\nС профессиями: She is a doctor (a). He is an engineer (an).\nПрактическое правило для новичков: если вы говорите о человеке или предмете впервые, ставьте a/an; если уже говорили, ставьте the.\n\n## Раздел 7. Present Simple: теория\nНазначение: привычки, регулярные действия, факты, состояния, расписания. My mother works at a school. Water boils at 100 degrees.\nФорма утверждения: подлежащее + глагол в базовой форме; с he/she/it добавляется -s/-es.\nПравописание третьего лица:\n- +s: work → works, play → plays.\n- +es после s, sh, ch, x, z, o: watch → watches, wash → washes, go → goes, do → does.\n- согласная + y → ies: study → studies, try → tries.\n- have → has /hæz/.\nОтрицание: don't (do not) + базовая форма; doesn't (does not) + базовая форма. She doesn't work on Sundays. (Не doesn't works.)\nВопрос: Do + подлежащее + базовая форма? Does + he/she/it + базовая форма? Does she work? Краткие ответы: Yes, she does. No, she doesn't.\nНаречия частоты: always, usually, often, sometimes, rarely, never. Стоят перед основным глаголом и после be: I usually get up at seven. He is always late.\nВремя: every day, on Mondays, twice a week, in the morning.\nТипичные ошибки: He work ✗ → He works ✓; Does he works? ✗ → Does he work? ✓; She don't like ✗ → She doesn't like ✓; I am working every day ✗ → I work every day ✓ (постоянное, регулярное — Present Simple).\n\n## Раздел 8. Произношение и ритм в теме «Семья»\nУдарение: ˈfamily, ˈparents, ˈsibling, ˈgrandfather, reˈlative (в существительном relatives: ˈrɛlətɪv, ударение на первом слоге), ˈnephew, ˈcousin.\nНемые и необычные: daughter /ˈdɔːtər/ (gh не читается), grandfather /ˈɡrænfɑːðər/ (d часто не слышен в быстрой речи), honest /ˈɑːnɪst/, husband /ˈhʌzbənd/ (s как z).\nСлабые формы в предложениях: My mother is a teacher → /maɪ ˈmʌðər əz ə ˈtiːtʃər/. Do you have any brothers? → /dʒə hæv ɛni ˈbrʌðərz/.\nИнтонация: перечисление членов семьи идёт с подъёмом на каждом элементе, кроме последнего, где тон падает: I have a mother ↗, a father ↗, two brothers ↗ and a sister ↘.\nУпражнение по ритму: хлопайте на ударных слогах и проговаривайте: MY MOther TEACHES ENGlish AT a UniVERsity.\n\n## Раздел 9. Практика 1. Множественное число\nОбразуйте множественное: 1) box 2) baby 3) wife 4) child 5) man 6) day 7) person 8) brother-in-law 9) tooth 10) family.\n\n## Раздел 10. Практика 2. Третье лицо и произношение\nНапишите форму he/she/it и определите окончание: /s/, /z/ или /ɪz/. 1) watch 2) live 3) help 4) go 5) study 6) play 7) teach 8) have 9) work 10) wash.\n\n## Раздел 11. Практика 3. Притяжательный падеж\nПерепишите, используя 's или ': 1) the car of my father 2) the toys of the children 3) the house of my parents 4) the bag of Lera 5) the names of my sisters 6) the phone of my brother 7) the office of the doctor.\n\n## Раздел 12. Практика 4. Исправьте ошибки\n1) At me is a brother. 2) She have two sisters. 3) Have you a car? 4) He hasn't brothers. 5) My sister has got 25 years. 6) They has a big family. 7) Do she have a dog? 8) I am working every day.\n\n## Раздел 13. Практика 5. Преобразование\nСделайте отрицание и вопрос: 1) He works in Almaty. 2) They live with their parents. 3) She likes coffee. 4) My mother teaches English. Затем ответьте кратко: Does your mother work? Do you have brothers?\n\n## Раздел 14. Практика 6. Артикли\nВставьте a, an, the или поставьте прочерк (—): 1) I have ___ older brother. 2) ___ brother lives in Astana. 3) She is ___ doctor. 4) He is ___ honest man. 5) My mother is ___ teacher at ___ university. 6) We have ___ dinner at seven. 7) ___ sun is hot. 8) He plays ___ guitar.\n\n## Раздел 15. Практика 7. Перевод\n1) У меня две сестры. 2) Моего отца зовут Айдар. 3) Моя мама работает учителем. 4) Она похожа на свою бабушку. 5) Каков он по характеру? 6) Мои родители живут в Алматы. 7) Он не любит рано вставать. 8) Вы часто видитесь с кузенами? 9) Сколько лет вашему брату? 10) Это машина Леры.\n\n## Раздел 16. Практика 8. Чтение, диктовка, говорение, письмо\nЧтение. Прочитайте текст и ответьте на вопросы.\nMy name is Dana. I'm twenty-six and I live in Almaty with my parents and my younger brother. My father is a doctor. He works at a hospital and he often works at night. My mother is a teacher. She teaches English at a university. My brother, Timur, is nineteen. He is a student. He doesn't like mornings, so he usually wakes up late. We have a dog. His name is Max. My grandparents live in a village near the city. We visit them every weekend. My grandmother cooks delicious food and my grandfather tells funny stories.\nВопросы: 1) How old is Dana? 2) Who does she live with? 3) What does her father do? 4) Does her mother teach Russian? 5) Why does Timur wake up late? 6) What is the dog's name? 7) How often do they visit their grandparents? 8) Who tells funny stories?\nДиктовка (5 предложений, слушать по диктору или читать вслух партнёру, писать по памяти): My cousin lives in Astana. She doesn't work on Sundays. Does your brother play the guitar? My parents' house is near the park. He looks like his father but he takes after his mother.\nГоворение. Задания (по 5–10 минут каждое, с записью):\n1) Расскажите о своей семье, 8–10 предложений, используя have, has и 's.\n2) Опишите внешность и характер одного человека из семьи, 6–8 предложений.\n3) Задайте партнёру 8 вопросов о его семье и ответьте на 8 его вопросов.\n4) Опишите обычный день члена семьи в Present Simple, 8 предложений.\n5) Сыграйте диалог: вы знакомитесь с новым коллегой и говорите о семьях.\nПисьмо. Напишите текст My family на 120–150 слов. Чек-лист: названо не менее 4 членов семьи; есть не менее 3 описаний внешности или характера; 6 примеров Present Simple; 3 примера притяжательного 's; правильные артикли; проверены окончания -s у глаголов. Покажите текст партнёру или преподавателю и разберите ошибки.\n\n## Раздел 17. Ключи к практике\nПрактика 1: boxes, babies, wives, children, men, days, people, brothers-in-law, teeth, families.\nПрактика 2: watches /ɪz/, lives /z/, helps /s/, goes /z/, studies /z/, plays /z/, teaches /ɪz/, has /z/, works /s/, washes /ɪz/.\nПрактика 3: my father's car; the children's toys; my parents' house; Lera's bag; my sisters' names; my brother's phone; the doctor's office.\nПрактика 4: 1) I have a brother. 2) She has two sisters. 3) Do you have a car? / Have you got a car? 4) He doesn't have any brothers. / He hasn't got any brothers. 5) My sister is 25. 6) They have a big family. 7) Does she have a dog? 8) I work every day.\nПрактика 5: 1) He doesn't work in Almaty. Does he work in Almaty? 2) They don't live with their parents. Do they live with their parents? 3) She doesn't like coffee. Does she like coffee? 4) My mother doesn't teach English. Does my mother teach English?\nПрактика 6: 1) an; 2) The; 3) a; 4) an; 5) a, a; 6) —; 7) The; 8) the.\nПрактика 7: 1) I have two sisters. / I've got two sisters. 2) My father's name is Aidar. 3) My mother works as a teacher. / My mother is a teacher. 4) She looks like her grandmother. 5) What is he like? 6) My parents live in Almaty. 7) He doesn't like getting up early. 8) Do you often see your cousins? 9) How old is your brother? 10) It's Lera's car.\nПрактика 8 (чтение): 1) She is twenty-six. 2) With her parents and her younger brother. 3) He is a doctor. 4) No, she teaches English. 5) Because he doesn't like mornings. 6) Max. 7) Every weekend. 8) Her grandfather.\n\n## Раздел 18. Таблица типичных ошибок\n- Опущение be: I from Almaty → I'm from Almaty.\n- Have вместо be для возраста: I have 25 years → I'm 25.\n- Забытое -s: He work → He works.\n- Лишнее -s после does: Does he works → Does he work.\n- Отсутствие артикля: I have brother → I have a brother.\n- Of вместо 's для людей: the name of my mother → my mother's name.\n- Неверный выбор вопроса: How is he? (как дела) вместо What is he like? (каков он).\nВедите личный список ошибок и перечитывайте его раз в неделю.\n\n## Раздел 19. Итоговый тест (15 баллов)\n1) My sister ___ (live) in Astana. 2) ___ your brothers work? 3) She ___ (not have) any children. 4) This is my ___ (parents) house. 5) He ___ (be) tall. 6) What does he ___ like? (look или be) 7) I'm ___ only child. 8) Two ___ (child). 9) He ___ (teach) at a school. 10) ___ you got a cousin? 11) My grandfather ___ (go) to the park every day. 12) They ___ (not like) coffee. 13) How old ___ your sister? 14) I usually ___ (get up) at seven. 15) She ___ (look) like her father.\nОтветы: 1) lives 2) Do 3) doesn't have 4) parents' 5) is 6) look 7) an 8) children 9) teaches 10) Have 11) goes 12) don't like 13) is 14) get up 15) looks.\nОценка: 13–15 — отлично, переходите к уроку 3. 10–12 — хорошо, повторите слабые разделы и сдайте тест снова. Меньше 10 — вернитесь к теории и практике, повторите две недели.\n\n## План на 4 недели\nНеделя 1: лексика семьи (раздел 1), описание людей (раздел 2), have/have got (раздел 3). Практика 4 и 7 по этим темам. Ежедневно: 10 минут карточек.\nНеделя 2: множественное число (раздел 4), притяжательный падеж (раздел 5), артикли (раздел 6). Практика 1, 3, 6. Диктовка.\nНеделя 3: Present Simple (раздел 7), произношение (раздел 8). Практика 2, 5, 12. Говорение 1, 2, 4. Запись и самопроверка.\nНеделя 4: чтение и перевод (практика 7 и 8), письмо, говорение 3 и 5 с партнёром, итоговый тест. Разбор ошибок по таблице.\n\n## Что стоит сверить в книгах\nRaymond Murphy, «English Grammar in Use» (Present Simple, артикли, притяжательный падеж); Michael Swan, «Practical English Usage» (справочник по тонкостям); Cambridge Dictionary и Oxford Learner's Dictionaries (произношение и примеры). Для фонетики: Peter Roach, «English Phonetics and Phonology».\nВажное замечание: упражнения и ключи в этом уроке составлены для самопроверки. Для настоящей оценки произношения и письма нужна обратная связь от человека, который хорошо владеет английским.\n", "w": [["sibling", "брат или сестра", "/ˈsɪblɪŋ/"], ["parents", "родители", "/ˈpɛrənts/"], ["relatives", "родственники", "/ˈrɛlətɪvz/"], ["cousin", "двоюродный брат/сестра", "/ˈkʌzən/"], ["nephew", "племянник", "/ˈnɛfjuː/"], ["niece", "племянница", "/niːs/"], ["uncle", "дядя", "/ˈʌŋkəl/"], ["aunt", "тётя", "/ænt/"], ["husband", "муж", "/ˈhʌzbənd/"], ["wife", "жена", "/waɪf/"], ["daughter", "дочь", "/ˈdɔːtər/"], ["grandfather", "дедушка", "/ˈɡrænfɑːðər/"], ["grandmother", "бабушка", "/ˈɡrænmʌðər/"], ["twins", "близнецы", "/twɪnz/"], ["tall", "высокий", "/tɔːl/"], ["kind", "добрый", "/kaɪnd/"], ["shy", "застенчивый", "/ʃaɪ/"], ["strict", "строгий", "/strɪkt/"], ["generous", "щедрый", "/ˈdʒɛnərəs/"], ["honest", "честный", "/ˈɑːnɪst/"]]}, {"t": "УРОК 3. ЕДА И ЗАКАЗ В КАФЕ (РАСШИРЕННЫЙ КУРС)\nОбъём: 4 недели, 5–6 дней в неделю по 45–60 минут (около 20–25 часов). Уровень: A1 → A2.\nУчебный язык: объяснения по-русски, примеры по-английски. Основной вариант: американский, британские отличия отмечены.\n\n## Как устроен урок\nТеория (разделы 1–8), практика (разделы 9–16), контроль (разделы 17–19). Прочитайте теорию целиком без заучивания, затем работайте с практикой и возвращайтесь к теории по мере необходимости. Цель урока: самостоятельно сделать заказ, задать вопросы по меню, оплатить счёт и поддержать разговор за столом.\n\n## Раздел 0. Научная основа метода\n1. Ситуативное обучение: язык лучше всего усваивается в узнаваемых ситуациях. Кафе даёт повторяющийся сценарий (встреча, меню, заказ, оплата), который можно отрабатывать как ролевую игру.\n2. Готовые блоки: в бытовой речи много устойчивых фраз (I'd like..., Could I have...?). Их нужно знать целиком.\n3. Выходная речь: говорение и письмо заставляют замечать пробелы (идея Мерилл Суэйн). Поэтому в уроке много ролевых заданий.\n4. Интервальные повторения: возвращайтесь к лексике через 1, 3, 7, 14 дней (вкладка «Карточки»).\n5. Обратная связь: ошибки разбираются в таблице и по ключам.\n\n## Раздел 1. Лексика: еда, напитки, заведения\nПриёмы пищи: breakfast /ˈbrɛkfəst/, lunch /lʌntʃ/, dinner /ˈdɪnər/, supper (лёгкий ужин; в британской речи), snack /snæk/, brunch (поздний завтрак).\nЗаведения: cafe, restaurant, fast-food place, bar, canteen (столовая), food court.\nЛюди: waiter /ˈweɪtər/ (официант), waitress, server (США, нейтрально), chef /ʃɛf/, customer, guest.\nСтруктура меню: starter (UK) / appetizer (US) — закуска; main course (UK) / entrée (US: основное блюдо; во французском значении закуска, поэтому не путайте); side dish — гарнир; dessert /dɪˈzɜːrt/ — десерт; drinks — напитки; special — блюдо дня; soup of the day — суп дня.\nБлюда и продукты: soup, salad, sandwich, burger, pizza, pasta, rice, chicken, beef, fish, vegetables /ˈvɛdʒtəbəlz/, fruit, bread, cheese, egg, butter, sugar, salt, pepper.\nНапитки: water (still / sparkling), tea, coffee, juice, milk, soda (US) / fizzy drink (UK), beer, wine.\nВкусы и качества: sweet, sour, salty, bitter, spicy /ˈspaɪsi/ (острый), mild (нежный, не острый), fresh, hot, cold, delicious /dɪˈlɪʃəs/, tasty.\nДиеты: vegetarian /ˌvɛdʒəˈtɛriən/, vegan /ˈviːɡən/, gluten-free, halal /həˈlɑːl/, lactose-free. Аллергия: I'm allergic to nuts /əˈlɜːrdʒɪk/.\nСервис и оплата: table for two, reservation, menu /ˈmɛnjuː/, order, bill (UK) / check (US), tip, service charge, to go (US) / takeaway (UK), change (сдача), receipt /rɪˈsiːt/, card, cash.\n\n## Раздел 2. Исчисляемые и неисчисляемые существительные\nИсчисляемые: можно посчитать, есть множественное число: an apple, two apples; a sandwich, three sandwiches.\nНеисчисляемые: нельзя посчитать, нет множественного числа, не употребляется с a/an: water, rice, bread, milk, soup, cheese, sugar, salt. Нельзя two breads, two waters (в меню допустимо в значении порций: two waters, please).\nМногие продукты сочетаются с мерами: a cup of tea, a glass of water, a bottle of water, a slice of pizza, a piece of cake, a bowl of soup, a plate of rice.\nСлова some / any / a lot of:\n- some: в утверждениях и предложениях (Would you like some coffee?).\n- any: в отрицаниях и вопросах (I don't have any sugar. Do you have any tea?).\n- a lot of: много (a lot of rice).\nmuch / many:\n- many — с исчисляемыми (How many eggs?), much — с неисчисляемыми (How much sugar?).\n- в утверждении: a lot of, а не much (I eat a lot of rice).\nОсобенность: coffee, tea, juice могут быть и неисчисляемыми (I like coffee), и исчисляемыми в значении порции (Two coffees, please).\nРусскоговорящие часто ошибаются: a bread ✗ → a piece of bread / some bread ✓; much apples ✗ → many apples ✓.\n\n## Раздел 3. Вежливые просьбы и заказ\nI want... звучит слишком резко, как требование. В кафе используют:\n- I'd like... /aɪd laɪk/ (я бы хотел): I'd like a coffee, please.\n- Could I have...? (можно мне...?): Could I have the menu, please?\n- Can I have...? (менее формально, но допустимо).\n- I'll have... (я возьму): I'll have the chicken salad.\nКлючевые слова вежливости: please, thank you, excuse me, sorry. Интонация и мягкость важнее самой формы.\nПредложения со стороны персонала: Are you ready to order? Would you like something to drink? Anything else? Still or sparkling? For here or to go? (в США).\nМодальный would: Would you like tea or coffee? Would you like some more?\n\n## Раздел 4. Диалог в кафе: пошаговая схема\n1) Встреча. Waiter: Hello. Table for how many? You: Table for two, please.\n2) Меню. Waiter: Here's the menu. Can I get you something to drink? You: I'd like a tea, please.\n3) Вопросы по меню. You: What do you recommend? Is it spicy? Does it come with fries? Is there any meat in it?\n4) Заказ. You: I'll have the chicken salad, please.\n5) Уточнение. Waiter: Anything else? You: No, that's all, thank you.\n6) Во время еды. Waiter: Is everything okay? You: Yes, it's delicious, thank you.\n7) Оплата. You: Could we have the bill, please? Can I pay by card? Keep the change.\n8) Прощание. You: Thank you, have a nice day.\nТипичные вопросы: Is it spicy? (Это острое?) Does it come with...? (К этому подаётся...?) What's in it? (Что в составе?) How long will it take? (Сколько ждать?) Can I have it without onions? (Можно без лука?) Does this contain nuts? (Здесь есть орехи?)\nБезопасность: если у вас есть аллергия или диета, говорите об этом сразу и чётко: I'm allergic to nuts. I can't eat gluten. Is there any ... in it?\nТелефонное бронирование: I'd like to book a table for four at 7 p.m. tonight. Under the name Lera. Could I change my reservation to 8?\n\n## Раздел 5. Предпочтения и глаголы\nlike (нравится), love (очень нравится), enjoy (получать удовольствие), prefer (предпочитать), hate (ненавидеть), don't mind (не против).\nСтруктуры: I like pizza. I prefer tea to coffee. I'd rather have tea. (Я бы предпочёл чай.) I love spicy food. I can't stand fish. (терпеть не могу)\nPresent Simple для вкусов: She likes coffee. He doesn't like cheese. Do you like spicy food? (не забудьте -s и do/does, см. урок 2.)\nСравнения: Tea is cheaper than coffee. This soup is the best.\n\n## Раздел 6. Счёт, оплата, чаевые\nПросьба о счёте: Could I have the bill, please? (UK) / Could I get the check, please? (US).\nВопросы: Can I pay by card? Do you take cards? Is service included? Can we split the bill? (разделить счёт)\nЧаевые: в США они обычно ожидаются (ориентир 15–20 процентов от суммы, зависит от места). В Великобритании часто в счёт уже включена плата за обслуживание (service charge); проверьте чек. Правила различаются по странам и заведениям, при сомнении спросите: Is service included?\nФразы: Keep the change. (Сдачи не надо.) That's for you. Thanks, it was great.\n\n## Раздел 7. Культурные заметки\n- В США официант подходит сам, чтобы принять заказ и вскоре спросить, всё ли в порядке. Ждать «счёта по требованию» нужно, но принято, чтобы официант оставлял его без запроса.\n- В Великобритании заказ часто делают у стойки в пабах. Спросите, как принято в заведении.\n- Вопрос Is everything okay? — вежливость, а не повод для длинного разговора. Нормальный ответ: Yes, thanks.\n- Small talk за столом: How is your food? Have you been here before? Это поддерживает контакт.\n\n## Раздел 8. Произношение и интонация\nСлова, где русскоговорящие ошибаются:\n- menu /ˈmɛnjuː/ (первый слог ударный), salad /ˈsæləd/, vegetable /ˈvɛdʒtəbəl/ (три слога), chocolate /ˈtʃɔːklət/, sandwich /ˈsænwɪtʃ/ (d почти не слышен), coffee /ˈkɔːfi/, water /ˈwɔːtər/ (в американском t часто как d), tomato /təˈmeɪtoʊ/ (США) / /təˈmɑːtəʊ/ (Британия), dessert /dɪˈzɜːrt/ (ударение на втором слоге; desert /ˈdɛzərt/ пустыня), recommend /ˌrɛkəˈmɛnd/.\nСлабые формы: I'd like → /aɪd laɪk/; Could I have → /kʊd aɪ hæv/ или в быстрой речи /ˈkʊdaɪ hæv/; Would you like → /ˈwʊdʒə laɪk/; Can I have → /kənaɪ hæv/.\nИнтонация: просьбы и вопросы да/нет с подъёмом в конце: Could I have the menu, please? ↗ Выбор из двух: Would you like TEA ↗ or COFFEE? ↘ Утверждения с падением: I'll have the chicken. ↘\nПрактика: проговаривайте ключевые фразы вслух, хлопая на ударных слогах: I'D like a COFfee, PLEASE.\n\n## Раздел 9. Практика 1. Исчисляемые и неисчисляемые\nОпределите, какие слова исчисляемые (C), а какие неисчисляемые (U): apple, water, rice, egg, bread, sandwich, milk, tomato, soup, cheese.\n\n## Раздел 10. Практика 2. Меры, some/any, much/many\n1) a ___ of water (стакан) 2) a ___ of cake (кусок) 3) a ___ of soup (миска) 4) a ___ of tea (чашка) 5) a ___ of pizza (ломтик) 6) a ___ of water (бутылка).\nВставьте some, any, much, many: 1) How ___ sugar? 2) How ___ eggs? 3) I don't have ___ time. 4) There are ___ apples. 5) There isn't ___ milk. 6) Would you like ___ coffee?\n\n## Раздел 11. Практика 3. Вежливые формы\nПерепишите вежливо: 1) I want a table for two. 2) Give me the bill. 3) I want chicken. 4) Where is the toilet?\n\n## Раздел 12. Практика 4. Порядок диалога\nРасставьте реплики по порядку:\na) Anything else? b) Table for two, please. c) Here's the menu. d) I'll have the chicken salad, please. e) No, that's all. Thank you. f) Hello. Table for how many? g) Could we have the bill, please?\n\n## Раздел 13. Практика 5. Вопросы и ответы\nПодберите ответ к вопросу: 1) Is it spicy? 2) Does it come with fries? 3) What do you recommend? 4) Is there any meat in it? 5) How long will it take?\nОтветы: a) Yes, with fries or salad. b) No, it's mild. c) The fish is very good today. d) No, it's vegetarian. e) About fifteen minutes.\n\n## Раздел 14. Практика 6. Перевод\n1) Мне, пожалуйста, чай с лимоном. 2) Столик на двоих, пожалуйста. 3) Что вы порекомендуете? 4) У меня аллергия на орехи. 5) Можно счёт, пожалуйста? 6) Я возьму курицу. 7) Это острое? 8) Можно оплатить картой? 9) С собой, пожалуйста. 10) Сдачи не надо.\n\n## Раздел 15. Практика 7. Чтение, диктовка, говорение, письмо\nЧтение. Прочитайте меню и ответьте.\nGreen Cafe. Soup of the day $5. Chicken salad $9. Pasta with tomato sauce (vegetarian) $8. Fish and chips $11. Coffee $3. Tea $2.50. Orange juice $4. Special: lunch deal (main course + drink) $10.\nВопросы: 1) Which dish is vegetarian? 2) How much is fish and chips? 3) What costs $2.50? 4) What is in the lunch deal? 5) How much do you pay for pasta and orange juice with the lunch deal? 6) How much do you save?\nДиктовка: I'd like a coffee, please. Could we have the menu? Is it spicy? I'm allergic to nuts. Could I have the bill, please?\nГоворение (запись по 3–5 минут):\n1) Разыграйте полный диалог в кафе с партнёром (раздел 4), меняйтесь ролями.\n2) Забронируйте столик по телефону.\n3) Закажите для двоих, обсудив предпочтения (I prefer..., I'd rather...).\n4) Опишите любимую еду, 8 предложений.\n5) Разыграйте ситуацию с аллергией и вопросами о составе блюда.\nПисьмо. Напишите отзыв о кафе (review) на 80–100 слов или сообщение с бронью стола. Чек-лист: названо место, блюда, 2 оценки (delicious, a bit expensive), правильные a/an, some/any, much/many, нет типичных ошибок раздела 17.\n\n## Раздел 16. Ключи\nПрактика 1: C: apple, egg, sandwich, tomato. U: water, rice, bread, milk, soup, cheese.\nПрактика 2: 1) glass 2) piece 3) bowl 4) cup 5) slice 6) bottle. much, many, any, some (в утверждении There are some apples), any, some.\nПрактика 3: 1) I'd like a table for two, please. / Could we have a table for two? 2) Could I have the bill, please? 3) I'll have the chicken, please. 4) Excuse me, where is the restroom? (США) / toilet (Британия).\nПрактика 4: f, b, c, d, a, e, g.\nПрактика 5: 1-b, 2-a, 3-c, 4-d, 5-e.\nПрактика 6: 1) I'd like tea with lemon, please. 2) A table for two, please. 3) What do you recommend? 4) I'm allergic to nuts. 5) Could I have the bill, please? 6) I'll have the chicken. 7) Is it spicy? 8) Can I pay by card? 9) To go, please. / Takeaway, please. 10) Keep the change.\nПрактика 7 (чтение): 1) Pasta with tomato sauce. 2) $11. 3) Tea. 4) A main course and a drink. 5) $10. 6) $2 (8 + 4 = 12 без акции).\n\n## Раздел 17. Таблица типичных ошибок\n- Слишком прямо: I want coffee → I'd like a coffee, please.\n- Неисчисляемое во множественном числе: breads → some bread / pieces of bread.\n- much/many: much apples → many apples.\n- Артикль: I'd like coffee (допустимо в общем смысле, но порция: a coffee).\n- bill / check: bill (Британия), check (США).\n- Опущение be: It spicy? → Is it spicy?\n- Give me ✗ (звучит как приказ) → Could I have...?\n- Забытое -s: She like → She likes.\nВедите список ошибок и перечитывайте раз в неделю.\n\n## Раздел 18. Самооценка\nПо 2 балла: □ я делаю заказ вежливо, не звучу как приказ □ я различаю исчисляемые и неисчисляемые □ я задаю вопросы по меню □ я могу оплатить счёт и спросить про чаевые □ я говорю об аллергии и диете □ я произношу ключевые фразы естественно.\nРезультат: 10–12 баллов — переходите к уроку 4; 6–9 — повторите слабые разделы; меньше 6 — повторите неделю.\n\n## Раздел 19. Итоговый тест (15 баллов)\n1) Вежливо закажите кофе. 2) a ___ of water (glass/bottle). 3) How ___ sugar? 4) How ___ eggs? 5) Do you have ___ tea? (some/any) 6) Как попросить счёт в США? 7) Как спросить, острое ли блюдо? 8) I'll have the chicken означает... 9) Как сказать «у меня аллергия на орехи»? 10) Как спросить, включены ли чаевые? 11) Что значит to go? 12) Какое слово пишется как desert, но означает десерт? (dessert или desert) 13) ___ you like tea or coffee? (Would/Do) 14) Исправьте: I want a coffee. 15) Исправьте: two breads.\nОтветы: 1) I'd like a coffee, please. 2) glass или bottle 3) much 4) many 5) any 6) Could I get the check, please? 7) Is it spicy? 8) Я возьму курицу. 9) I'm allergic to nuts. 10) Is service included? 11) с собой 12) dessert 13) Would 14) I'd like a coffee, please. 15) two pieces of bread / some bread.\nОценка: 13–15 — отлично, переходите к уроку 4; 10–12 — хорошо, повторите слабые разделы; меньше 10 — вернитесь к теории и практике.\n\n## План на 4 недели\nНеделя 1: лексика еды и меню (раздел 1), исчисляемые и неисчисляемые (раздел 2). Практика 1, 2.\nНеделя 2: вежливые просьбы (раздел 3), диалог в кафе (раздел 4), предпочтения (раздел 5). Практика 3, 4, 5. Говорение 1–2.\nНеделя 3: счёт и чаевые (раздел 6), культура (раздел 7), произношение (раздел 8). Практика 6, диктовка. Говорение 3–5.\nНеделя 4: чтение меню, письмо, итоговая ролевая игра, самооценка, тест, разбор ошибок.\n\n## Что стоит сверить в книгах\nRaymond Murphy, «English Grammar in Use» (исчисляемые и неисчисляемые, some/any, much/many); Michael Swan, «Practical English Usage»; Cambridge Dictionary и Oxford Learner's Dictionaries (произношение и примеры).\nВажное замечание: упражнения и ключи составлены для самопроверки. Правила чаевых и сервиса различаются по странам и заведениям, уточняйте на месте. Для оценки произношения нужна обратная связь от человека, хорошо владеющего языком.\n", "w": [["menu", "меню", "/ˈmɛnjuː/"], ["waiter", "официант", "/ˈweɪtər/"], ["bill", "счёт", "/bɪl/"], ["tip", "чаевые", "/tɪp/"], ["order", "заказ, заказывать", "/ˈɔːrdər/"], ["dish", "блюдо", "/dɪʃ/"], ["spicy", "острый", "/ˈspaɪsi/"], ["sweet", "сладкий", "/swiːt/"], ["delicious", "очень вкусный", "/dɪˈlɪʃəs/"], ["breakfast", "завтрак", "/ˈbrɛkfəst/"], ["lunch", "обед", "/lʌntʃ/"], ["dinner", "ужин", "/ˈdɪnər/"], ["dessert", "десерт", "/dɪˈzɜːrt/"], ["vegetarian", "вегетарианский", "/ˌvɛdʒəˈtɛriən/"], ["allergic", "аллергичный", "/əˈlɜːrdʒɪk/"], ["recommend", "рекомендовать", "/ˌrɛkəˈmɛnd/"], ["table", "стол, столик", "/ˈteɪbəl/"], ["soup", "суп", "/suːp/"], ["chicken", "курица", "/ˈtʃɪkən/"], ["takeaway", "еда с собой", "/ˈteɪkəweɪ/"]]}]};

let NETRAF=0;
function edgesFor(k){const m=METHODS[k],n=m.s.length,c=(D.links||{})[k];if(Array.isArray(c)&&c.length)return c;const E=[];for(let i=0;i<n-1;i++){E.push([i,i+1]);if(i%3===0&&i+3<n)E.push([i,i+3]);if(i%4===1&&i+2<n)E.push([i,i+2])}return E}
function net(){cancelAnimationFrame(NETRAF);const p=D.plan,k=p.m,m=METHODS[k],n=m.s.length,E=edgesFor(k),done=new Set(p.done);
const pre=i=>E.filter(e=>e[1]===i).map(e=>e[0]);
const nxt=new Set();for(let i=0;i<n;i++)if(!done.has(i)&&pre(i).every(j=>done.has(j)))nxt.add(i);
$("#v").innerHTML=`<div class="card"><h2>Нейронные связи: ${esc(m.n)}</h2><canvas id="cv" style="width:100%;height:60vh;border-radius:10px;background:#0b1020;touch-action:none;display:block"></canvas><p class="m"><span style="color:#ffcf40">●</span> пройдено &nbsp;<span style="color:#7fd1ff">●</span> можно изучать сейчас &nbsp;<span style="color:#5b6b8c">●</span> пока закрыто. Вращайте пальцем, нажмите на точку, чтобы увидеть тему.</p><div id="ni" class="m"></div><div class="row"><button class="g" id="nb">Построить связи с помощью ИИ</button></div></div>`;
const P=[];for(let i=0;i<n;i++){const a=i*.9,r=1+.3*((i%3)-1),y=n>1?(i/(n-1)-.5)*2.4:0;P.push([Math.cos(a)*r,y,Math.sin(a)*r])}
let ry=0,rx=.35,drag=null,sel=-1;const cv=$("#cv"),ctx=cv.getContext("2d");
const fit=()=>{const d=devicePixelRatio||1;cv.width=cv.clientWidth*d;cv.height=cv.clientHeight*d;ctx.setTransform(d,0,0,d,0,0)};fit();
const proj=q=>{const[x,y,z]=q,cy=Math.cos(ry),sy=Math.sin(ry),x1=x*cy+z*sy,z1=-x*sy+z*cy,cx=Math.cos(rx),sx=Math.sin(rx),y2=y*cx-z1*sx,z2=y*sx+z1*cx,W=cv.clientWidth,H=cv.clientHeight,s=Math.min(W,H)*.68/(3-z2);return[W/2+x1*s,H/2+y2*s,z2]};
const draw=t=>{if(!cv.isConnected)return;const W=cv.clientWidth,H=cv.clientHeight;ctx.clearRect(0,0,W,H);if(!drag)ry+=.004;const Q=P.map(proj);
ctx.lineWidth=1.2;E.forEach(([a,b])=>{if(!Q[a]||!Q[b])return;const lit=done.has(a)&&done.has(b);ctx.strokeStyle=lit?"rgba(255,207,64,.85)":done.has(a)?"rgba(127,209,255,.55)":"rgba(91,107,140,.35)";ctx.shadowColor=lit?"#ffcf40":"transparent";ctx.shadowBlur=lit?8:0;ctx.beginPath();ctx.moveTo(Q[a][0],Q[a][1]);ctx.lineTo(Q[b][0],Q[b][1]);ctx.stroke()});ctx.shadowBlur=0;
[...Q.keys()].sort((a,b)=>Q[a][2]-Q[b][2]).forEach(i=>{const[x,y,z]=Q[i],d=done.has(i),nx=nxt.has(i),c=d?"#ffcf40":nx?"#7fd1ff":"#5b6b8c",r=(d?7+1.5*Math.sin(t/300+i):nx?6:4.5)*(1+z*.15);ctx.fillStyle=c;ctx.shadowColor=c;ctx.shadowBlur=d?22:nx?14:0;ctx.beginPath();ctx.arc(x,y,Math.max(2,r),0,7);ctx.fill();ctx.shadowBlur=0;if(i===sel){ctx.strokeStyle="#fff";ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,r+5,0,7);ctx.stroke();ctx.lineWidth=1.2}ctx.fillStyle="rgba(255,255,255,.75)";ctx.font="11px system-ui";ctx.fillText(i+1,x+r+3,y+4)});
NETRAF=requestAnimationFrame(draw)};NETRAF=requestAnimationFrame(draw);
cv.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,m:false};cv.setPointerCapture(e.pointerId)};
cv.onpointermove=e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>3)drag.m=true;ry+=dx*.01;rx=Math.max(-1.2,Math.min(1.2,rx+dy*.01));drag.x=e.clientX;drag.y=e.clientY};
cv.onpointerup=e=>{if(drag&&!drag.m){const r=cv.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top;let b=-1,bd=1600;P.map(proj).forEach((q,i)=>{const d=(q[0]-px)**2+(q[1]-py)**2;if(d<bd){bd=d;b=i}});sel=b;
$("#ni").innerHTML=b<0?"":`<b>${b+1}. ${esc(m.s[b])}</b><br>${done.has(b)?"Пройдено.":nxt.has(b)?"Можно изучать сейчас.":"Сначала пройдите: "+pre(b).filter(j=>!done.has(j)).map(j=>j+1).join(", ")}${E.some(e=>e[0]===b)?"<br>Ведёт к: "+E.filter(e=>e[0]===b).map(e=>e[1]+1).join(", "):""}`}drag=null};

let cells="";for(let i=0;i<off;i++)cells+="<div></div>";
for(let d=1;d<=days;d++){const k=key(d),s=T[k]||0,g=(G[k]||[]).length,a=Math.min(1,s/3600);cells+=`<button class="g" data-k="${k}" style="padding:4px;min-height:54px;font-size:12px;${s?`background:rgba(79,195,161,${.15+a*.55})`:""}${k===ld()?";outline:2px solid var(--a)":""}"><b>${d}</b><br>${s?fm(s):""}${g?`<br>●${g}`:""}</button>`}
