рит слишком быстро: I'm sorry, my English isn't very good. Could you speak more slowly, please?\nЕсли что-то пошло не по плану: I'm afraid there's a problem. / Could you help me with this?\nГлавное: не замолкайте. Любая стратегия лучше молчания.\n\n## Раздел 8. Произношение и ритм в бытовых диалогах\nСлабые формы: Could I → /ˈkʊdaɪ/; Do you have → /dʒə hæv/; Would you like → /ˈwʊdʒə laɪk/; I'd like → /aɪd laɪk/.\nЧисла и телефоны: читайте цифрами, делая паузу после каждой группы: five five five / oh one four seven. Ударение в 13–19 на последнем слоге.\nАдреса: twenty-four Park Road (ударение на Park и на Road; в слове Park Road ударение на Park).\nИнтонация в подтверждении: подъём: So that's Tuesday at three? ↗\nИнтонация благодарности и вежливости: Thank you ↘ very ↗ much ↘.\nТемп: на телефоне говорите чуть медленнее, чётче.\n\n## Раздел 9. Практика 1. Сценарии\nЗаполните шаги сценария своими фразами: 1) в магазине (приветствие, нужная вещь, размер, примерка, цена, оплата); 2) в такси (адрес, время, стоимость, остановка); 3) в отеле (бронь, паспорт, время завтрака, номер); 4) по телефону (приветствие, цель, имя, детали, подтверждение, прощание).\n\n## Раздел 10. Практика 2. Вежливые просьбы\nПерепишите вежливо: 1) Give me the menu. 2) Tell me the price. 3) I want to check in. 4) Take me to the airport. 5) Repeat that.\n\n## Раздел 11. Практика 3. Телефонный разговор\nРасставьте реплики по порядку: a) Could I have your phone number? b) Good morning, Green Clinic, Anna speaking. c) It's 555 0147. d) Hello, I'd like to make an appointment. e) May I have your name? f) So that's Tuesday at three, right? g) Yes, that's correct. Thank you. Goodbye. h) It's Dana Nurova.\nПродиктуйте по буквам: Nurova, Sarsenov, Almaty.\n\n## Раздел 12. Практика 4. Стратегии\nЧто сказать, если: 1) вы не расслышали номер комнаты; 2) вы не знаете слово «towel» и нужно полотенце; 3) собеседник говорит слишком быстро; 4) в номере не работает кондиционер; 5) вам нужно подтвердить время.\n\n## Раздел 13. Практика 5. Ролевые игры\nКаждая ролевая игра 3–5 минут с записью. Партнёры меняются ролями.\n1) Магазин: клиент хочет обменять вещь не того размера.\n2) Такси: клиент опаздывает в аэропорт, водитель не знает адрес.\n3) Отель: клиент приехал позже, номер занят, нужно решить проблему.\n4) Телефон: запись к врачу, имя сложное, нужно продиктовать по буквам.\n5) Отель: жалоба на шум.\n6) Магазин: клиент ищет подарок и просит совета.\n7) Телефон: переспрос, плохая связь.\n8) Такси: общение по пути (small talk).\nДавление: партнёр в середине диалога вводит проблему (нет мест, время изменилось, не расслышал имя). Вы продолжаете без перехода на русский.\n\n## Раздел 14. Практика 6. Чтение, диктовка, говорение, письмо\nЧтение. Прочитайте диалог и ответьте.\nReceptionist: Good evening. Can I help you? Guest: Yes, I have a reservation. My name is Nurov. Receptionist: Nurov, N-U-R-O-V? Guest: Yes, that's right. Receptionist: A single room for two nights. Breakfast is from seven to ten. Your room is 312. Guest: Thank you. What time is check-out? Receptionist: At eleven o'clock.\nВопросы: 1) What is the guest's surname? 2) What type of room is it? 3) How many nights? 4) When is breakfast? 5) What is the room number? 6) When is check-out?\nДиктовка: Could I have your phone number, please? I have a reservation under the name Nurov. Could you take me to the airport? Hold on, please. Let me confirm the time.\nПисьмо. Напишите электронное письмо в отель с просьбой о бронировании на 80–100 слов: даты, тип номера, количество гостей, просьба подтвердить, ваши контактные данные. Чек-лист: вежливое обращение, чёткая просьба, детали, благодарность, формула окончания (Kind regards).\n\n## Раздел 15. Практика 7. Диалог без подготовки\nПартнёр открывает 3 случайные карточки с ситуациями и по таймеру 2 минуты просит вас вести диалог. Цель: отвечать без пауз дольше 3 секунд. Затем разбор записи.\n\n## Раздел 16. Ключи\nПрактика 2: 1) Could I have the menu, please? 2) Could you tell me the price, please? 3) I'd like to check in, please. 4) Could you take me to the airport, please? 5) Could you repeat that, please?\nПрактика 3: b, d, e, h, a, c, f, g.\nПрактика 4: 1) Sorry, could you repeat the room number? 2) It's something you use after a shower. / Could I have another one of these? 3) Could you speak more slowly, please? 4) Excuse me, there's a problem with the air conditioner. It doesn't work. 5) Let me confirm: Tuesday at three, right?\nПрактика 6 (чтение): 1) Nurov. 2) A single room. 3) Two nights. 4) From seven to ten. 5) 312. 6) At eleven o'clock.\n\n## Раздел 17. Таблица типичных ошибок\n- Слишком прямые просьбы: Give me → Could I have...?\n- Забытое please.\n- Порядок слов в вопросах: Where is the elevator? (прямой вопрос) → Could you tell me where the elevator is? (непрямой).\n- Пропуск артикля: I have reservation → I have a reservation.\n- Путаница в числах: fifteen и fifty.\n- Не переспрашивают: нужно переспрашивать, а не кивать.\n- Прямой перевод: I'm agree → I agree.\n- Слишком короткие ответы: Yes. No. → Yes, of course. / No, thank you.\nВедите личный список ошибок.\n\n## Раздел 18. Самооценка\nПо 2 балла: □ я использую вежливые формы □ я знаю шаги сценариев □ я могу вести телефонный разговор □ я использую стратегии, когда не понял □ я произношу цифры и имена по буквам □ я не молчу в сложной ситуации.\nРезультат: 10–12 баллов — переходите к уроку 7; 6–9 — повторите слабые разделы; меньше 6 — повторите неделю.\n\n## Раздел 19. Итоговый тест (15 баллов)\n1) Вежливая просьба о меню. 2) Как попросить повторить? 3) Как сказать «Мне нужно зарегистрироваться»? 4) Как спросить стоимость такси? 5) Как попросить остановить здесь? 6) Как представиться по телефону? 7) Что значит Hold on? 8) Как подтвердить время? 9) Что делать, если не знаете слово? 10) Как попросить продиктовать по буквам? 11) Как читается 555 0147? 12) Как сказать «в номере проблема»? 13) Ответ на Thank you. 14) Что значит Can I take a message? 15) Три части диалога.\nОтветы: 1) Could I have the menu, please? 2) Could you repeat that, please? 3) I'd like to check in, please. 4) How much will it cost? 5) Could you stop here, please? 6) Good morning, ... speaking. 7) подождите 8) So that's ... at ... , right? 9) описать: It's something you use for... 10) How do you spell that? 11) five five five, oh one four seven 12) There's a problem with my room. 13) You're welcome. / No problem. 14) Могу передать сообщение? 15) открытие, основная часть, закрытие.\nОценка: 13–15 — отлично; 10–12 — хорошо, повторите слабые разделы; меньше 10 — вернитесь к теории и практике.\n\n## Раздел 20. План на 4 недели\nНеделя 1: структура диалога, вежливость (разделы 1–2), магазин (раздел 3). Практика 1, 2. Ролевые игры 1, 6.\nНеделя 2: такси (раздел 4), отель (раздел 5). Практика 4. Ролевые игры 2, 3, 5, 8.\nНеделя 3: телефон (раздел 6), стратегии (раздел 7), произношение (раздел 8). Практика 3. Ролевые игры 4, 7.\nНеделя 4: диалоги без подготовки (практика 7), письмо, итоговая запись, самооценка, тест. Сравнение с записью первой недели.\n\n## Что стоит сверить в книгах\nMichael Swan, «Practical English Usage» (вежливые формулы, вопросы); «Collins COBUILD English Usage»; Cambridge Dictionary и Oxford Learner's Dictionaries (произношение и примеры). Для фонетики: Peter Roach, «English Phonetics and Phonology».\nВажное замечание: диалоги в уроке учебные. В реальной жизни ответы бывают быстрее и нестандартнее, поэтому тренируйтесь с партнёром и записывайте себя.\n", "w": [["receptionist", "администратор", "/rɪˈsɛpʃənɪst/"], ["reception", "стойка регистрации", "/rɪˈsɛpʃən/"], ["booking", "бронирование", "/ˈbʊkɪŋ/"], ["appointment", "назначенная встреча, запись", "/əˈpɔɪntmənt/"], ["message", "сообщение", "/ˈmɛsɪdʒ/"], ["voicemail", "голосовая почта", "/ˈvɔɪsmeɪl/"], ["confirm", "подтверждать", "/kənˈfɜːrm/"], ["available", "доступный", "/əˈveɪləbəl/"], ["complaint", "жалоба", "/kəmˈpleɪnt/"], ["apologize", "извиняться", "/əˈpɑːlədʒaɪz/"], ["instruction", "инструкция", "/ɪnˈstrʌkʃən/"], ["clarify", "уточнять", "/ˈklærəfaɪ/"], ["paraphrase", "перефразировать", "/ˈpærəfreɪz/"], ["polite", "вежливый", "/pəˈlaɪt/"], ["request", "просьба", "/rɪˈkwɛst/"], ["refuse", "отказывать", "/rɪˈfjuːz/"], ["hold", "держать, ждать на линии", "/hoʊld/"], ["extension", "добавочный номер", "/ɪkˈstɛnʃən/"], ["elevator", "лифт (США)", "/ˈɛləveɪtər/"], ["towel", "полотенце", "/ˈtaʊəl/"]]}, {"t": "УРОК 7. АКЦЕНТ: РИТМ, УДАРЕНИЕ, РЕДУКЦИЯ ГЛАСНЫХ (РАСШИРЕННЫЙ КУРС)\nОбъём: 4 недели, 5–6 дней в неделю по 45–60 минут (около 20–25 часов). Уровень: B1.\nЭталон: американский английский (General American), британские отличия отмечены.\nКурс «Школа разведчика» является учебной реконструкцией по открытым описаниям.\n\n## Как устроен урок\nТеория (разделы 1–9), практика (разделы 10–17), контроль (разделы 18–20). Сначала прочитайте теорию целиком, затем работайте с практикой. Цель: перейти от правильных отдельных звуков к естественной речи с английским ритмом, ударением и интонацией, и понимать, чего реально можно добиться.\n\n## Раздел 0. Научная основа метода\n1. Просодия важнее отдельных звуков для понятности. Ударение, ритм и интонация определяют, как слушатель сегментирует речь и понимает смысл. Исследователи произношения (в частности, работы по английскому как языку международного общения) подчёркивают роль ударения и ядерного ударения для понятности.\n2. Ударный ритм (stress-timing). В английском интервалы между ударными слогами относительно равны, а безударные слоги сжимаются. В русском слоги более равномерны по длительности.\n3. Редукция гласных. Безударные гласные ослабляются до шва /ə/ или /ɪ/. Это главный механизм ритма.\n4. Автоматизация. Просодия усваивается через многократное осмысленное повторение и копирование (урок 4, шэдоуинг).\n5. Реалистичная цель. Многие исследователи говорят о «комфортной понятности» (comfortable intelligibility): речь легко понимают без усилий. Полное совпадение с акцентом носителя достигается редко и требует многолетней практики. Цель курса — чёткая, ритмичная, естественная речь с выбранным эталоном.\n\n## Раздел 1. Слоговая структура и ударение в слове\nСлово состоит из слогов. В каждом слове с двумя и более слогами один слог несёт главное ударение: он длиннее, громче, чуть выше по тону и с чёткой гласной. Остальные слоги ослаблены.\nУдарение нужно знать для каждого слова, потому что оно не обозначается на письме. Но есть закономерности.\nОсновные правила:\n- Двусложные существительные и прилагательные: чаще первый слог: TAble, HAPpy, DOCtor.\n- Двусложные глаголы: чаще второй слог: reLAX, beGIN, deCIDE.\n- Пары существительное/глагол: существительное с ударением на первом слоге, глагол на втором: REcord / reCORD, PREsent / preSENT, OBject / obJECT, INcrease / inCREASE, CONtrast / conTRAST, PROduce / proDUCE, PERmit / perMIT.\n- Суффиксы, перед которыми ударение: -tion / -sion (eduCAtion, deCIsion), -ic (ecoNOMic), -ical (poLITical), -ity (caPAcity), -graphy (phoTOGraphy), -logy (bioLOGy).\n- Слова на -ate с тремя и более слогами: ударение обычно на третьем слоге с конца: COMmunicate, CELebrate.\n- Слова на -ee, -eer, -ese, -ique: ударение на этом суффиксе: employEE, engiNEER, ChiNESE, techNIQUE.\n- Приставки (un-, re-, dis-, mis-, pre-) обычно безударные: unHAPpy, reTURN.\n- Сложные существительные: ударение на первом элементе: GREENhouse (теплица), BLACKbird (дрозд). Сравните с сочетанием прилагательного и существительного: green HOUSE (дом зелёного цвета), black BIRD (чёрная птица).\nИсключения существуют. Если сомневаетесь, проверяйте в словаре с аудио (Cambridge, Merriam-Webster).\nУдарение в одном слове может менять часть речи и смысл: REcord и reCORD.\nВажно: в слове должно быть одно главное ударение. Не ударяйте каждый слог, как в русском слитном произнесении.\n\n## Раздел 2. Ослабление гласных и шва\nШва /ə/ — самый частый звук английского. Он стоит в безударном слоге: about /əˈbaʊt/, banana /bəˈnænə/, family /ˈfæməli/ (часто /ˈfæmli/), comfortable /ˈkʌmftərbəl/ (чаще 3 слога), chocolate /ˈtʃɔːklət/, support /səˈpɔːrt/, teacher /ˈtiːtʃər/.\nОкончания, где обычно шва или ослабленный гласный: -er /ər/ (США), -or /ər/, -ar /ər/, -tion /ʃən/, -sion /ʒən/, -ous /əs/, -ate (в прилагательных и существительных) /ət/, -ment /mənt/, -ing /ɪŋ/, -ly /li/.\nПравило: если вы произносите безударный гласный чётко (как в русском «о» или «а»), вы теряете ритм и звучите по-русски.\nУпражнение: произносите слово, преувеличенно удлиняя ударный слог и «проглатывая» остальные: baNAna → b'NAN'. Затем возвращайте естественную длительность.\n\n## Раздел 3. Слабые и сильные формы служебных слов\nСлужебные слова в потоке речи слабые: a /ə/, the /ðə/, to /tə/, of /əv/, and /ən/, for /fər/, at /ət/, can /kən/, was /wəz/, were /wər/, have /əv/ (после местоимения) или /həv/, has /əz/, do /də/, does /dəz/, him /ɪm/, her /ər/, them /ðəm/ или /əm/, some /səm/, that (союз) /ðət/, there (в there is) /ðər/.\nСильные формы используются при ударении, в конце фразы, при контрасте и при цитировании: Yes, I can /kæn/. What are you looking at? /æt/. I said TO the shop, not FROM the shop.\nПример: I can go to the shop and buy some bread for her → /aɪ kən ˈɡoʊ tə ðə ˈʃɑːp ən ˈbaɪ səm ˈbrɛd fər ər/.\nНе заменяйте слабые формы сильными в середине фразы. Это делает речь слишком «книжной».\n\n## Раздел 4. Ударение во фразе и ритм\nВо фразе ударяются содержательные слова (существительные, глаголы, прилагательные, наречия, вопросительные слова, указательные), особенно несущие новую информацию. Служебные слова ослабляются.\nПример: The CATS are CHASing the MICE. Три ударения.\nРитм (stress-timing): время между ударными слогами примерно одинаково независимо от числа безударных между ними.\n- CATS chase MICE.\n- The CATS chase the MICE.\n- The CATS are CHASing the MICE.\nВсе три фразы произносятся за сходное время, так как в каждой по три ударения. Чем больше безударных слогов, тем быстрее и слабее они произносятся.\nКонтрастное ударение: ударение смещается, чтобы выделить нужное слово. I didn't say SHE stole my money (говорил кто-то другой). I didn't say she STOLE my money (возможно, одолжила). I didn't say she stole MY money (чьи-то другие деньги).\nЭто основной инструмент смысловой интонации в английском.\n\n## Раздел 5. Интонация: ядро и мелодия\nИнтонация — изменение высоты тона. Основная единица — смысловая группа (thought group). В каждой группе есть ядро (nucleus): последний ударный слог, на котором тон падает или растёт.\nОсновные мелодии:\n- Падение (↘): утверждения, вопросы с wh-словом, команды, законченность. Where do you LIVE? ↘\n- Подъём (↗): вопросы да/нет, переспрос, незавершённость. Do you like TEA? ↗\n- Падение-подъём: сомнение, оговорка, сдержанное согласие. I LIKE it, ↘↗ but...\n- Подъём-падение: сильное эмоциональное выделение: Oh, REALly? (удивление, восхищение).\n- Перечисление: подъём на каждом элементе, падение на последнем.\nРазделительные вопросы (tag questions): падение, если вы уверены и ждёте подтверждения (It's cold, isn't it? ↘), подъём, если действительно спрашиваете (You're coming, aren't you? ↗).\nДиапазон голоса: широкий диапазон звучит вежливо и заинтересованно, узкий и ровный воспринимается как скука или грубость. Английская речь обычно использует заметно более широкий диапазон, чем русская.\nЗамечание: восходящая интонация в утверждениях (uptalk) встречается в живой речи некоторых групп, но не рекомендуется как норма для начинающих.\n\n## Раздел 6. Различия американского и британского акцентов\nВыберите один эталон и придерживайтесь его, смешение звучит неестественно.\nАмериканский (General American):\n- Произносится r во всех позициях: car /kɑːr/.\n- Быстрое t между гласными: water /ˈwɔːɾər/, better /ˈbɛɾər/.\n- Гласный /æ/ в словах dance, bath: /dæns/, /bæθ/.\n- Слияние cot и caught в большинстве вариантов.\n- can't /kænt/.\nБританский (RP):\n- Не произносится r в конце слова или перед согласным, если нет гласного: car /kɑː/ (но в связке: car engine /kɑːr ˈɛndʒɪn/).\n- Гласный /ɑː/ в dance, bath: /dɑːns/, /bɑːθ/.\n- /ɒ/ в lot /lɒt/ (в США /lɑːt/).\n- Дифтонг /əʊ/ в go.\n- Во многих британских вариантах t заменяется гортанной смычкой: water /ˈwɔːʔə/.\n- Соединительное r: law and order /ˌlɔːr ən ˈɔːdə/.\nРегиональные акценты внутри каждой страны сильно различаются. Эталон — условный ориентир.\n\n## Раздел 7. Как слышать и тренировать просодию\n1) Слушайте, а не читайте: просодию нельзя понять только по тексту.\n2) Размечайте текст: ударные слова (заглавные), смысловые группы (/), мелодию (↗ ↘).\n3) Хлопайте или стучите по ударным слогам.\n4) Мычите мелодию (hum) без слов, чтобы услышать контур.\n5) Преувеличивайте на этапе тренировки: удлиняйте ударные, сильно сокращайте безударные, расширяйте диапазон. Потом возвращайтесь к естественному уровню.\n6) Записывайте себя и сравнивайте с диктором (протокол урока 4).\n7) Тренируйтесь в замедленном темпе, затем в естественном.\n\n## Раздел 8. Типичные ошибки русскоговорящих\n- Все слоги ударные, нет редукции: речь звучит «рублено».\n- Безударные гласные произносятся чётко: banana как «банана».\n- Сильные формы служебных слов в середине фразы.\n- Ударение в слове поставлено по русской привычке: ПОлиция вместо poLICE.\n- Ровная интонация без падений и подъёмов.\n- Ударение на каждом слове, нет выделения новой информации.\n- Паузы внутри смысловой группы.\n- Слишком быстрая речь вместо ясной.\n\n## Раздел 9. Реалистичная цель и измерение прогресса\nЧто можно измерить:\n1) Понятность: понимают ли вас без переспроса.\n2) Ритм: совпадают ли ударные слоги по времени с диктором.\n3) Ударение в словах: доля слов с верным ударением.\n4) Редукция: доля слабых форм там, где они нужны.\n5) Интонация: совпадение мелодии.\nПрогресс оценивайте по записям раз в 2 недели. Не ждите полного исчезновения акцента: цель — понятная, комфортная, естественная речь.\n\n## Раздел 10. Практика 1. Ударение в словах\nОтметьте ударный слог (заглавными): photograph, photographer, photographic, education, economy, economic, important, banana, computer, information, difficult, interesting.\n\n## Раздел 11. Практика 2. Пары существительное и глагол\nПроизнесите и отметьте ударение: I want to record a record. I object to this object. The present is a present. They increase the increase. Объясните, где существительное, где глагол.\n\n## Раздел 12. Практика 3. Ударение во фразе\nПодчеркните ударные (содержательные) слова: 1) She bought a new car yesterday. 2) My brother is working at the bank. 3) Can you tell me where the station is? 4) They didn't want to go to the party. 5) I'd like two coffees and a piece of cake.\n\n## Раздел 13. Практика 4. Слабые формы\nЗапишите приблизительную транскрипцию слабых форм: I can go to the shop and buy some bread for her.\n\n## Раздел 14. Практика 5. Контрастное ударение\nПроизнесите фразу I didn't say she stole my money семь раз, каждый раз ударяя другое слово. Объясните, как меняется смысл.\n\n## Раздел 15. Практика 6. Интонация\nОтметьте мелодию (↗, ↘ или падение-подъём): 1) Where do you work? 2) Do you like coffee? 3) I like tea, coffee, and juice. 4) It's cold, isn't it? (уверены) 5) You're coming, aren't you? (спрашиваете) 6) I like it, but it's expensive.\n\n## Раздел 16. Практика 7. Ритм по ударным\nПроговорите, хлопая на ударные, чтобы время между хлопками было равным: 1) CATS chase MICE. 2) The CATS chase the MICE. 3) The CATS are CHASing the MICE. 4) The CATS have been CHASing the MICE. Подсчитайте число ударных в каждой фразе.\n\n## Раздел 17. Практика 8. Отрывки и запись\nОтрывок A (размечен):\nMy /BROTHer/ works at a /SMALL OFfice/ near the /STAtion./ Every /MORNing,/ he /TAKES/ the /BUS,/ /READS/ the /NEWSpaper,/ and /DRINKS/ a /CUP/ of /COFfee./\nОтрывок B (размечен):\nIf you /WANT/ to /SOUND/ more /NATural,/ you /NEED/ to /LISTen/ to the /RHYTHM,/ not just the /WORDS./ The /STRESSED/ syllables are /LONG/ and /CLEAR,/ and the /OTHers/ are /SHORT/ and /WEAK./\nДля каждого отрывка: прослушайте образец (диктор-эталон), прочитайте вслух с преувеличением ударных, запишите, сравните, заполните журнал (ритм, ударение, редукция, мелодия, темп).\nГоворение и письмо: опишите на 80–100 слов, какой акцент вы выбираете как эталон, почему, что вам даётся лучше и что хуже.\n\n## Раздел 18. Ключи\nПрактика 1: PHOtograph, phoTOGrapher, photoGRAPHic, eduCAtion, eCOnomy, econOMic, imPORtant, baNAna, comPUter, inforMAtion, DIFficult, INteresting (также INtresting).\nПрактика 2: I want to reCORD (глагол) a REcord (сущ.). I obJECT (глагол) to this OBject (сущ.). The PREsent (сущ.) is a PREsent (сущ.) / to preSENT (глагол). They inCREASE (глагол) the INcrease (сущ.).\nПрактика 3: 1) bought, new, car, yesterday 2) brother, working, bank 3) tell, where, station 4) didn't want, go, party 5) like, two, coffees, piece, cake.\nПрактика 4: /aɪ kən ˈɡoʊ tə ðə ˈʃɑːp ən ˈbaɪ səm ˈbrɛd fər ər/.\nПрактика 5: I (кто-то другой), didn't (отрицание), say (возможно, написал), she (другой человек), stole (возможно, одолжила), my (чьи-то другие деньги), money (что-то другое).\nПрактика 6: 1) ↘ 2) ↗ 3) ↗ ↗ ↘ 4) ↘ 5) ↗ 6) like it ↘↗, but it's expensive ↘.\nПрактика 7: В каждой фразе три ударения (в четвёртой также три: CATS, CHASing, MICE).\n\n## Раздел 19. Самооценка\nПо 2 балла: □ я знаю правила ударения в слове □ я использую шва и ослабляю безударные гласные □ я использую слабые формы □ я ставлю ударение во фразе на содержательные слова □ я использую основные мелодии □ мой ритм стал ближе к эталону.\nРезультат: 10–12 баллов — переходите к уроку 8; 6–9 — повторите слабые разделы; меньше 6 — повторите неделю.\n\n## Раздел 20. Итоговый тест (15 баллов)\n1) Как ставится ударение в паре record? 2) Где ударение в education? 3) Какой звук самый частый в английском? 4) Слабая форма слова and. 5) Слабая форма слова to. 6) Какие слова ударяются во фразе? 7) Что такое stress-timing? 8) Интонация вопроса с wh-словом. 9) Интонация общего вопроса. 10) Чем green HOUSE отличается от GREENhouse? 11) Что такое ядро (nucleus)? 12) Различие американского и британского r в слове car. 13) Что такое контрастное ударение? 14) Что значит комфортная понятность? 15) Назовите три типичные ошибки русскоговорящих в ритме.\nОтветы: 1) REcord (сущ.), reCORD (глагол) 2) eduCAtion 3) шва /ə/ 4) /ən/ 5) /tə/ 6) содержательные: существительные, глаголы, прилагательные, наречия 7) интервалы между ударными слогами примерно равны 8) падение ↘ 9) подъём ↗ 10) green HOUSE — дом зелёного цвета; GREENhouse — теплица 11) последний ударный слог в смысловой группе, на котором меняется тон 12) в американском r произносится, в британском (RP) конечное r без последующего гласного не произносится 13) смещение ударения для выделения слова и изменения смысла 14) речь понятна слушателю без усилий 15) все слоги ударные, нет шва, сильные формы служебных слов.\nОценка: 13–15 — отлично; 10–12 — хорошо, повторите слабые разделы; меньше 10 — вернитесь к теории и практике.\n\n## План на 4 недели\nНеделя 1: ударение в слове (раздел 1), шва (раздел 2). Практика 1, 2. Ежедневно 10 минут разминки на ударение.\nНеделя 2: слабые формы (раздел 3), ударение во фразе и ритм (раздел 4). Практика 3, 4, 7. Шэдоуинг по 10 минут.\nНеделя 3: интонация (раздел 5), контрастное ударение, различия акцентов (раздел 6). Практика 5, 6. Размеченные отрывки.\nНеделя 4: измерение прогресса (раздел 9), отрывки A и B, итоговая запись, самооценка и тест. Сравнение с записью первой недели.\n\n## Что стоит сверить в книгах\nPeter Roach, «English Phonetics and Phonology» (ритм, ударение, интонация); Judy Gilbert, «Clear Speech»; Mark Hancock, «English Pronunciation in Use»; Cambridge Dictionary и Merriam-Webster (аудио, ударение, транскрипция). О понятности и приоритетах: работы Jennifer Jenkins по английскому как lingua franca.\nВажное замечание: ударение и интонация сильно зависят от региона и контекста, а правила имеют исключения. Для оценки произношения нужна обратная связь от человека, хорошо владеющего языком.\n", "w": [["reduction", "редукция, ослабление", "/rɪˈdʌkʃən/"], ["nucleus", "ядро (в интонации)", "/ˈnuːkliəs/"], ["compound", "сложное слово", "/ˈkɑːmpaʊnd/"], ["suffix", "суффикс", "/ˈsʌfɪks/"], ["prefix", "приставка", "/ˈpriːfɪks/"], ["rhotic", "ротический (с произносимым r)", "/ˈroʊtɪk/"], ["glottal", "гортанный", "/ˈɡlɑːtəl/"], ["dialect", "диалект", "/ˈdaɪəlɛkt/"], ["consonant", "согласный", "/ˈkɑːnsənənt/"], ["intelligibility", "понятность", "/ɪnˌtɛlɪdʒəˈbɪləti/"], ["native", "родной, носитель", "/ˈneɪtɪv/"], ["tempo", "темп", "/ˈtɛmpoʊ/"], ["beat", "ударный такт", "/biːt/"], ["stressed", "ударный", "/strɛst/"], ["unstressed", "безударный", "/ʌnˈstrɛst/"], ["emphasize", "выделять", "/ˈɛmfəsaɪz/"], ["pattern", "образец, модель", "/ˈpætərn/"], ["variation", "вариант, вариация", "/ˌvɛriˈeɪʃən/"], ["standard", "стандарт", "/ˈstændərd/"], ["syllable", "слог", "/ˈsɪləbəl/"]]}, {"t": "УРОК 8. ЧТЕНИЕ НОВОСТЕЙ: ВЫДЕЛИТЬ 20 СЛОВ И ПЕРЕСКАЗАТЬ (РАСШИРЕННЫЙ КУРС)\nОбъём: 4 недели, 5–6 дней в неделю по 45–60 минут (около 20–25 часов). Уровень: B1.\nЭталон: американский английский, британские отличия отмечены.\nКурс «Школа разведчика» является учебной реконструкцией по открытым описаниям.\n\n## Как устроен урок\nТеория (разделы 1–8), практика (разделы 9–17), контроль (разделы 18–20). Сначала прочитайте теорию целиком, затем работайте с практикой. Цель: читать короткие новости на английском, понимать структуру и язык новостей, пополнять словарь через чтение и пересказывать прочитанное своими словами.\nТексты в уроке учебные и вымышленные: события, имена и города придуманы для тренировки. Мы не обсуждаем политику и не оцениваем реальные события.\n\n## Раздел 0. Научная основа метода\n1. Чтение как источник слов. Значительная часть словаря усваивается через чтение (случайное, или инцидентное, усвоение). Для комфортного понимания текста важно знать подавляющее большинство слов в нём. Исследователи (в частности, Пол Нейшн и Бати Лаофер) называют ориентиры порядка 95–98 процентов знакомых слов, но точные цифры зависят от текста и читателя.\n2. Интенсивное и экстенсивное чтение. Интенсивное: короткий текст читается внимательно, с разбором слов и конструкций. Экстенсивное: много лёгкого материала для удовольствия и беглости. Курс использует интенсивное чтение новостей.\n3. Вывод важнее вставки. Пересказ (output) закрепляет слова лучше, чем пассивное чтение. Исследовательница Мерилл Суэйн показала, что говорение выявляет пробелы.\n4. Структура помогает понимать. Новости строятся по предсказуемой схеме. Зная её, вы быстрее находите главное.\n5. Отбор слов. Не все незнакомые слова нужно учить. Выбирайте частотные и полезные.\n6. Интервальные повторения: возвращайтесь к словам и текстам через 1, 3, 7, 14 дней.\n\n## Раздел 1. Структура новости\nКлассическая модель — «перевёрнутая пирамида»: самое важное в начале, детали дальше.\n1) Заголовок (headline): кратко и ярко.\n2) Лид (lead): первое предложение или абзац, отвечающий на вопросы Who? What? When? Where? Why? How? (5W1H).\n3) Основная часть: факты по убыванию важности.\n4) Цитаты и ссылки на источники.\n5) Фон и контекст.\n6) Заключение: что будет дальше.\nЧитая новость, сначала ищите в лиде ответы на 5W1H. Это даёт тему и главное.\n\n## Раздел 2. Язык заголовков (headlinese)\nЗаголовки используют особый стиль:\n- Настоящее время для недавнего прошлого: Mayor Opens New Park (Мэр открыл новый парк).\n- Инфинитив для будущего: City to build new bridge (Город построит новый мост).\n- Пропуск артиклей и вспомогательных глаголов: Storm hits coast (Шторм обрушился на побережье).\n- Короткие слова: cut (сократить), probe (расследование), bid (попытка), boost (рост), hit (удар), rise (рост).\n- Заглавные буквы в каждом слове (в американском стиле) или только в первом слове (чаще в британском).\n- Игра слов и намёки.\nЧтобы понять заголовок, восстановите полное предложение: Scientists find new species → Scientists have found a new species.\n\n## Раздел 3. Язык новостей: основные средства\nГлаголы сообщения: say, announce, confirm, deny, claim, warn, report, suggest, reveal, state, add, explain.\nРазница оттенков: say (нейтрально), announce (официально объявить), confirm (подтвердить), deny (отрицать), claim (утверждать, часто без доказательств), warn (предупредить).\nСсылка на источник: according to the report, the report says, officials said, sources said.\nОсторожные формулировки (hedging): reportedly, allegedly, is said to, is expected to, may, might, could, appears to.\nPresent Perfect для свежих новостей: The government has announced new rules. Past Simple для деталей: The announcement came on Monday.\nСтрадательный залог: The bridge was closed on Friday. A man has been arrested. The case is being investigated.\nКосвенная речь:\n- He said: «We will open the road next month.» → He said (that) they would open the road the following month.\nСдвиг времён: will → would, is → was, present simple → past simple, present perfect → past perfect. Обстоятельства: today → that day, tomorrow → the next day / the following day, next month → the following month, now → then.\nЧисла и тенденции: rise / increase / grow (расти), fall / drop / decrease (падать), double (удвоиться), halve (сократиться вдвое). rise by 5% (выросло на 5 процентов), rise to 5% (достигло 5 процентов). About, around, nearly, more than, up to.\nВремя: on Monday, last week, earlier this month, in recent years, since 2020.\nПредсказания: is expected to, is likely to, plans to, will probably.\n\n## Раздел 4. Стратегии чтения в слоях\nСлой 1. Предсказание: прочитайте заголовок и подумайте, о чём текст и какие слова там будут.\nСлой 2. Беглое чтение (skimming): за 1–2 минуты прочитайте лид и первое предложение каждого абзаца. Цель: тема и главное.\nСлой 3. Поиск деталей (scanning): ищите числа, имена, даты по вопросам.\nСлой 4. Внимательное чтение: читайте по абзацам, отмечайте незнакомые слова карандашом или цветом.\nСлой 5. Догадка по контексту (раздел 5).\nСлой 6. Отбор 20 слов (раздел 6).\nСлой 7. Пересказ (раздел 7).\nСлой 8. Вывод: ваше мнение или вопрос по тексту.\nНе пользуйтесь словарём в слоях 1–4, если слово не мешает пониманию общего смысла.\n\n## Раздел 5. Как догадываться о значении слова\nПодсказки внутри слова:\n- Приставки: un- (не), re- (снова), dis- (против), pre- (до), mis- (ошибочно).\n- Суффиксы: -er/-or (деятель), -tion (процесс, результат), -able (возможный), -less (без), -ful (полный).\n- Корни: если слово похоже на русское или международное (economy, policy, technology).\nПодсказки контекста:\n- Определение: A decade, which is a period of ten years...\n- Пример: Many reptiles, such as snakes and lizards...\n- Контраст: Unlike his cautious brother, he was reckless.\n- Причина и следствие: The road was closed because of flooding.\nЛожные друзья переводчика (слова, похожие на русские, но с другим значением): actual (фактический, а не «актуальный»), magazine (журнал, а не «магазин»), fabric (ткань, а не «фабрика»), intelligent (умный), decade (десятилетие), sympathetic (сочувствующий). Проверяйте контекст.\nЕсли слово не поддаётся догадке и мешает пониманию, проверьте в словаре с примером предложения и аудио.\n\n## Раздел 6. Как выбрать 20 слов\nКритерии отбора:\n1) частотное и полезное (встретится снова);\n2) связано с темой (общая лексика новостей: report, announce, increase, decision);\n3) встретилось более одного раза;\n4) вы можете использовать его сами;\n5) не имена собственные и не узкие термины (если не нужны).\nФормат записи слова:\n- слово и часть речи;\n- предложение из текста (контекст);\n- 2–3 устойчивых сочетания (collocations);\n- перевод (по необходимости);\n- произношение (транскрипция и аудио).\nМетод: выберите 20, из них 10 ключевых вы будете использовать в пересказе. Добавьте слова в «Мои слова» и повторяйте по карточкам.\n\n## Раздел 7. Как пересказывать\nРамка 5W1H: кто, что, когда, где, почему, как.\nШаги:\n1) Закройте текст и запишите ключевые слова (6–10).\n2) Составьте 4–6 предложений своими словами.\n3) Используйте синонимы и перестройте предложения, не копируйте.\n4) Используйте глаголы сообщения: said, announced, reported.\n5) Соблюдайте время: события в Past Simple или Present Perfect.\n6) Добавьте связки: first, then, however, as a result.\n7) Проверьте объём: 5–6 предложений, 30–60 секунд.\nОбразец пересказа новости (о лягушке, из практики): Scientists have discovered a new species of tiny frog in a rainforest. The frog is two centimetres long and lives near rivers. The team found about 40 frogs and believes the species is rare, so they plan to return next year to study it.\nЗатем добавьте вывод: I think the discovery is important because...\n\n## Раздел 8. Чтение вслух и произношение\nНовости читают с чёткой артикуляцией и средним темпом, 130–160 слов в минуту.\nЧисла: 2.5 million → two point five million; 15% → fifteen percent (US) / per cent (UK); 3/4 → three quarters; 1,200 → one thousand two hundred (and); 2026 → twenty twenty-six.\nСокращения: UN /ˌjuː ˈɛn/, NASA /ˈnæsə/, CEO /ˌsiː iː ˈoʊ/.\nСлова: government /ˈɡʌvərnmənt/, announce /əˈnaʊns/, decision /dɪˈsɪʒən/, expected /ɪkˈspɛktɪd/, increase (сущ.) /ˈɪnkriːs/, increase (глагол) /ɪnˈkriːs/, percent /pərˈsɛnt/, million /ˈmɪljən/, species /ˈspiːʃiːz/.\nИнтонация: падение в конце утверждения, подъём в перечислении. Делите текст на смысловые группы и избегайте пауз внутри группы. Используйте приёмы шэдоуинга (урок 4): прослушайте новостной ролик для изучающих язык и повторите.\n\n## Раздел 9. Практика 1. Заголовки\nВосстановите полные предложения: 1) City to build new bridge. 2) Scientists find new species. 3) Storm hits coast. 4) Team wins cup. 5) Prices rise by 5%.\n\n## Раздел 10. Практика 2. 5W1H\nПрочитайте текст A и ответьте.\nТекст A (A2, вымышленная новость): New Library Opens in Green Valley\nA new library opened on Monday in the town of Green Valley. The building has three floors and more than 20,000 books. The mayor, Anna Brown, said the library will be open every day from 9 a.m. to 8 p.m. «Everyone is welcome,» she said. The library also has a free internet room and a children's corner. More than 300 people visited on the first day. The town plans to organize reading events every weekend.\nВопросы: 1) What opened? 2) When? 3) Where? 4) How many floors has the building? 5) Who is the mayor? 6) What are the opening hours? 7) How many people visited on the first day? 8) What does the town plan?\n\n## Раздел 11. Практика 3. Косвенная речь\nПерескажите: 1) The minister said: «We will open the road next month.» 2) She said: «I am working on a new project.» 3) The manager said: «We have finished the report.» 4) He said: «I don't know the answer.»\n\n## Раздел 12. Практика 4. Числа и тенденции\nПрочитайте вслух и запишите словами: 2.5 million, 15%, 3/4, 1,200, 2026. Объясните разницу: Sales rose by 10% и Sales rose to 10%.\n\n## Раздел 13. Практика 5. Отбор слов\nПрочитайте текст B и выберите 20 слов по критериям раздела 6.\nТекст B (B1, вымышленная новость): Scientists Discover New Frog Species\nA team of scientists has discovered a new species of frog in a rainforest, according to a report published on Tuesday. The frog, which is only two centimetres long, lives near rivers and is active at night. «It is a very small animal, but an important discovery,» said Dr Mark Evans, the leader of the team. The researchers found about 40 frogs during a three-week expedition. They believe the species is rare and may be in danger because forests in the region are shrinking. The team plans to return next year to study the frog's behavior and protect its habitat.\nЗапишите слова в формате из раздела 6.\n\n## Раздел 14. Практика 6. Пересказ\nПерескажите текст B за 30–60 секунд, пользуясь рамкой 5W1H, затем запишите. Сравните с образцом из раздела 7.\n\n## Раздел 15. Практика 7. Догадка по контексту\nУгадайте значение выделенных слов: 1) A decade is a period of ten years. 2) Many reptiles, such as snakes and lizards, live in warm places. 3) Unlike his cautious brother, he was reckless. 4) The road was closed because of flooding.\n\n## Раздел 16. Практика 8. Чтение вслух, пересказ и письмо\nТекст C (B1+, вымышленная новость): City Introduces Free Public Transport on Weekends\nThe city council announced on Friday that public transport will be free on weekends from March. The decision, which follows a six-month trial, is expected to reduce traffic by up to 10 per cent, according to a report. Critics say the plan could cost the city around two million dollars a year, while supporters argue it will help people save money and reduce pollution. The council said it will review the results after one year. «We want to make the city easier to live in,» said councillor Laura Smith.\nЗадания: 1) Прочитайте вслух, делите на смысловые группы. 2) Определите 5W1H. 3) Выберите 20 слов. 4) Составьте пересказ на 5–6 предложений. 5) Запишите себя. 6) Напишите письменный пересказ на 80–100 слов и добавьте один вывод: your opinion.\nДиктовка: The mayor said the library will be open every day. According to the report, prices rose by five percent. A team of scientists has discovered a new species. The council will review the results after one year.\n\n## Раздел 17. Ключи\nПрактика 1: 1) The city is going to build a new bridge. 2) Scientists have found a new species. 3) A storm has hit the coast. 4) The team has won the cup. 5) Prices have risen by 5 percent.\nПрактика 2: 1) A new library. 2) On Monday. 3) In the town of Green Valley. 4) Three. 5) Anna Brown. 6) From 9 a.m. to 8 p.m. every day. 7) More than 300. 8) To organize reading events every weekend.\nПрактика 3: 1) The minister said they would open the road the following month. 2) She said she was working on a new project. 3) The manager said they had finished the report. 4) He said he didn't know the answer.\nПрактика 4: two point five million; fifteen percent; three quarters; one thousand two hundred (and); twenty twenty-six. rose by 10% — выросло на 10 процентов; rose to 10% — выросло и достигло 10 процентов.\nПрактика 5 (образец отбора): species, discover, rainforest, report, publish, leader, expedition, rare, danger, shrink, habitat, protect, behavior, believe, researcher, region, active, according to, team, plan.\nПрактика 7: 1) десятилетие 2) пресмыкающиеся 3) безрассудный (в контрасте с осторожным) 4) наводнение.\n\n## Раздел 18. Самооценка\nПо 2 балла: □ я нахожу ответы на 5W1H в лиде □ я понимаю заголовки □ я использую стратегии чтения в слоях □ я отбираю слова по критериям □ я пересказываю своими словами □ я читаю вслух с правильными паузами и числами.\nРезультат: 10–12 баллов — переходите к уроку 9; 6–9 — повторите слабые разделы; меньше 6 — повторите неделю.\n\n## Раздел 19. Итоговый тест (15 баллов)\n1) Что значит 5W1H? 2) Что такое перевёрнутая пирамида? 3) Заголовок Storm hits coast: время глагола. 4) Что значит City to build bridge? 5) Чем claim отличается от say? 6) Что значит according to? 7) Перескажите косвенной речью: He said: «I will come tomorrow.» 8) Как читается 2.5 million? 9) Чем rose by 5% отличается от rose to 5%? 10) Что такое hedging? 11) Ложный друг: magazine. 12) Критерий отбора слов (назовите два). 13) Что включает запись слова (три элемента)? 14) Какое слой чтения идёт первым? 15) Сколько предложений в пересказе?\nОтветы: 1) Who, What, When, Where, Why, How 2) самое важное в начале, детали дальше 3) Present Simple, значит недавнее прошлое 4) город построит мост (будущее) 5) claim — утверждает, часто без доказательств, say — нейтрально 6) согласно, по данным 7) He said he would come the next day. 8) two point five million 9) на 5 процентов, и достигло 5 процентов 10) осторожные формулировки (reportedly, is said to, may) 11) журнал, а не «магазин» 12) частотное, связано с темой, встретилось несколько раз, можете использовать 13) слово, контекст, сочетания, произношение 14) предсказание по заголовку 15) 4–6.\nОценка: 13–15 — отлично; 10–12 — хорошо, повторите слабые разделы; меньше 10 — вернитесь к теории и практике.\n\n## Раздел 20. План на 4 недели\nНеделя 1: структура новости (раздел 1), заголовки (раздел 2), стратегии чтения (раздел 4). Практика 1, 2. Текст A.\nНеделя 2: язык новостей (раздел 3), догадка по контексту (раздел 5), отбор слов (раздел 6). Практика 3, 4, 5, 7. Текст B.\nНеделя 3: пересказ (раздел 7), чтение вслух (раздел 8). Практика 6. Текст C. Диктовка.\nНеделя 4: свой материал (новость для изучающих язык), полный протокол: слои, 20 слов, пересказ, запись. Самооценка и тест.\n\n## Что стоит сверить в книгах\nI. S. P. Nation, «Learning Vocabulary in Another Language»; Cambridge Dictionary и Oxford Learner's Dictionaries (определения, примеры, аудио); Raymond Murphy, «English Grammar in Use» (косвенная речь, страдательный залог). Для чтения новостей на нужном уровне: ресурсы для изучающих язык вроде VOA Learning English и BBC Learning English (доступность и условия могут меняться).\nВажное замечание: упражнения и ключи составлены для самопроверки. Тексты в уроке вымышленные и учебные, реальные новости требуют критического отношения к источникам. Для оценки произношения и пересказа нужна обратная связь от человека, хорошо владеющего языком.\n", "w": [["article", "статья", "/ˈɑːrtɪkəl/"], ["journalist", "журналист", "/ˈdʒɜːrnəlɪst/"], ["source", "источник", "/sɔːrs/"], ["report", "сообщение, отчёт", "/rɪˈpɔːrt/"], ["announce", "объявлять", "/əˈnaʊns/"], ["confirm", "подтверждать", "/kənˈfɜːrm/"], ["deny", "отрицать", "/dɪˈnaɪ/"], ["claim", "утверждать", "/kleɪm/"], ["reveal", "раскрывать", "/rɪˈviːl/"], ["expected", "ожидаемый", "/ɪkˈspɛktɪd/"], ["increase", "рост, расти", "/ɪnˈkriːs/"], ["decrease", "снижение, снижаться", "/dɪˈkriːs/"], ["double", "удвоиться", "/ˈdʌbəl/"], ["percent", "процент", "/pərˈsɛnt/"], ["million", "миллион", "/ˈmɪljən/"], ["critic", "критик", "/ˈkrɪtɪk/"], ["supporter", "сторонник", "/səˈpɔːrtər/"], ["review", "пересматривать, обзор", "/rɪˈvjuː/"], ["summary", "краткое изложение", "/ˈsʌməri/"], ["retell", "пересказывать", "/riːˈtɛl/"]]}, {"t": "УРОК 9. ИМПРОВИЗАЦИЯ ПО ЛЕГЕНДЕ: 5 МИНУТ БЕЗ ПАУЗ (РАСШИРЕННЫЙ КУРС)\nОбъём: 4 недели, 5–6 дней в неделю по 45–60 минут (около 20–25 часов). Уровень: B1.\nЭталон: американский английский, британские отличия отмечены.\nКурс «Школа разведчика» является учебной реконструкцией по открытым описаниям. «Легенда» — учебный рассказ о себе (урок 3). Используйте реальную биографию или вымышленную роль для тренировки и не вводите людей в заблуждение в жизни.\n\n## Как устроен урок\nТеория (разделы 1–8), практика (разделы 9–17), контроль (разделы 18–20). Сначала прочитайте теорию целиком, затем работайте с практикой. Цель: говорить на английском 5 минут подряд на основе легенды без долгих пауз, не переходя на русский, и вести себя спокойно, когда нужное слово вылетело из головы.\n\n## Раздел 0. Научная основа метода\n1. Беглость (fluency) и точность (accuracy) — разные качества. Исследователи речи (в частности, Питер Скехан) описывают баланс между беглостью, сложностью и точностью: нельзя полностью улучшать всё сразу, нагрузка на внимание ограничена. В этом уроке мы тренируем беглость: речь должна идти без долгих остановок, а ошибки исправим позже.\n2. Автоматизация. Беглость возникает, когда готовые блоки и грамматика вызываются без обдумывания. Для этого нужны многократные повторения материала.\n3. Повторение задачи. Исследования показывают, что многократное выполнение похожей речевой задачи повышает беглость и уверенность (идея повторения заданий).\n4. Упражнение 4/3/2 (предложено Полом Нейшном): вы говорите на одну тему 4 минуты, затем 3, затем 2 минуты разным слушателям. Сжатие времени заставляет говорить быстрее и плавнее.\n5. Стратегии коммуникации. Приёмы вроде перефразирования, заполнения пауз и поиска другого слова позволяют продолжать говорить, когда не хватает ресурсов.\n6. Обратная связь: запись и измерение скорости.\nРезультаты зависят от регулярности и материала, поэтому уроку не нужны точные числа как обещания.\n\n## Раздел 1. Беглость, точность и цель урока\nБеглость: непрерывность речи, темп, малое число и малая длина пауз.\nТочность: правильная грамматика, лексика, произношение.\nСложность: разнообразие конструкций и слов.\nПравило урока: во время импровизации не останавливайтесь на исправление. Если ошиблись, продолжайте. Ошибки вы найдёте при прослушивании записи.\nИзмеримые показатели:\n- Скорость речи: число слов в минуту (words per minute). Подсчёт: количество слов / время в минутах.\n- Самая долгая пауза: в секундах.\n- Число пауз длиннее 2 секунд.\n- Число самоисправлений.\n- Число связок и слов-заполнителей.\nЦель: к концу урока говорить 5 минут с самой долгой паузой не более 3–4 секунд и скоростью, которая у вас растёт от недели к неделе.\n\n## Раздел 2. Как не замолкать: приёмы\nЕсли слово вылетело, не молчите. Используйте:\n1) Заполнители (fillers) и вводные слова: well, you know, I mean, actually, let me see, let me think, sort of, kind of.\n2) Перефразирование (circumlocution): It's something you use for..., It's like a..., the thing that...\n3) Исправление с возвратом: What I mean is..., Let me put it another way..., or rather...\n4) Расширение: добавление детали, примера, причины, сравнения, чувства.\n5) Смена направления: Anyway, ... / By the way, ... / Speaking of that, ...\n6) Возврат к теме: Going back to what I said, ...\nПравило «не молчи»: любая фраза лучше пустой паузы. Но не злоупотребляйте um и uh.\n\n## Раздел 3. Как расширять высказывание\nИз одного предложения получается минута речи, если отвечать на вопросы-подсказки:\nWho? What? Where? When? Why? How? How often? What was it like? How did you feel?\nПример: I live in Almaty.\n+ Where in the city? I live near the mountains.\n+ Why? I like it because it's quiet and the air is fresh.\n+ How long? I've lived here since I was six.\n+ Example: On weekends I often go hiking.\n+ Feeling: I really love it.\nПять приёмов расширения (5E): Example (пример), Explain (объяснение), Emotion (чувство), Extra detail (деталь), Evaluation (оценка).\nСтруктура мини-рассказа: Тезис → Деталь → Пример → Вывод.\n\n## Раздел 4. Банк содержания по легенде\nДля 5 минут нужен запас деталей. Подготовьте по 6–8 деталей на каждый раздел легенды:\n- Рождение и семья: место, дата, родители, братья и сёстры, традиции.\n- Детство: любимые игры, места, воспоминания, друзья.\n- Школа и образование: предметы, учителя, события.\n- Работа: путь, обязанности, коллеги, проекты, трудности.\n- Город: места, транспорт, погода, любимые места.\n- Друзья и общение: как познакомились, что делаете вместе.\n- Хобби: как начали, как часто, достижения.\n- Планы и мечты: цели, поездки, чему хотите научиться.\nРекомендация: запишите детали ключевыми словами на карточках, а не целыми фразами.\n\n## Раздел 5. Каркасы фраз для быстрой речи\nНачало: Well, ... / So, ... / Let me tell you about... / Where should I start?\nПродолжение: And then... / After that... / Another thing is... / What's more, ...\nОбъяснение: The main reason is... / That's because... / The thing is...\nПример: For example, ... / For instance, ... / Take... for example.\nВоспоминание: I remember when... / When I was a kid, ... / I used to...\nМнение: I think... / In my opinion, ... / To be honest, ... / The way I see it, ...\nКонтраст: On the one hand..., on the other hand... / But / However, ... / Although...\nУсловие: It depends on... / If I had more time, I would...\nУточнение: I mean... / What I mean is... / In other words, ...\nЗакрытие: So, that's about it. / That's all I can say. / To sum up, ...\nЗаучите 20–30 каркасов, пользуйтесь ими без раздумий.\n\n## Раздел 6. Форматы тренировки\nА) Лестница времени: 30 секунд → 1 минута → 2 минуты → 3 минуты → 5 минут на ту же легенду.\nБ) 4/3/2: 4 минуты рассказываете партнёру A, затем 3 минуты партнёру B, затем 2 минуты партнёру C (или одному партнёру три раза). Содержание то же, время сокращается.\nВ) Случайные карточки: партнёр достаёт карточку с темой (My first job, My best friend, My city), вы говорите 1–2 минуты по легенде.\nГ) «Да, и...» (Yes, and...): партнёр произносит утверждение, вы подтверждаете и добавляете.\nД) Прерывания: партнёр в середине рассказа задаёт вопрос, вы отвечаете и возвращаетесь к рассказу.\nЕ) Три времени: расскажите о себе в прошлом, настоящем, будущем по минуте.\nЖ) Рассказ от третьего лица: расскажите легенду как историю о другом человеке (He was born...).\nЗ) Описание предмета: опишите любой предмет 2 минуты.\nИ) Пятиминутный сольный рассказ без подготовки: итоговое задание урока.\nПроводите тренировки в записи.\n\n## Раздел 7. Произношение и ритм в импровизации\nЗаполнители: uh /ʌ/ и um /ʌm/ допустимы, но короткие. Не растягивайте.\nИнтонация «держу слово»: перед паузой оставляйте тон ровным или слегка повышенным, чтобы собеседник понял, что вы не закончили. Падение тона сигнализирует о завершении фразы. Например: «And then, uh —» (ровно) → продолжение.\nТемп: не ускоряйтесь до потери чёткости. Лучше средний темп без остановок.\nСвязки в речи: and, but, so, because.\nСмысловые группы: делите речь на короткие группы по 3–7 слов, делая вдох на границах.\nСлабые формы и ритм (урок 7): не теряйте их под давлением.\n\n## Раздел 8. Самонаблюдение и измерение\nКак измерять:\n1) Запишите 5-минутный монолог.\n2) Отметьте время.\n3) Прослушайте, подсчитайте слова приблизительно (или используйте транскрипт, который можно получить через распознавание речи, и проверьте).\n4) Скорость = слова / минуты.\n5) Отметьте самую долгую паузу и число пауз дольше 2 секунд.\n6) Отметьте самоисправления.\n7) Запишите 3 главные ошибки для следующей работы.\nЖурнал: дата, формат, время, слова, скорость, самая долгая пауза, число пауз, 3 ошибки, что улучшить.\nОриентиры скорости вне уроков зависят от человека и уровня. Сравнивайте себя с собой от недели к неделе.\n\n## Раздел 9. Практика 1. Заполнители и связки\nПодберите функцию: 1) Well, let me think... 2) What I mean is... 3) By the way... 4) For instance... 5) So, that's about it.\nФункции: a) пример b) закрытие c) смена темы d) исправление e) начало, раздумье.\n\n## Раздел 10. Практика 2. Расширение\nРасширьте предложение I live in Almaty до 5 предложений, отвечая на вопросы Where, Why, How long, Example, Feeling. Затем расширьте предложение I work as a designer.\n\n## Раздел 11. Практика 3. Карточки тем\nГоворите по 1 минуте на каждую тему по легенде: 1) My first job. 2) My best friend. 3) My city. 4) My favorite place. 5) A typical day. 6) My family. 7) A difficult time and how I solved it. 8) My hobby. 9) My plans for next year. 10) What I like about my job. 11) A memorable trip. 12) What I would change in my life.\n\n## Раздел 12. Практика 4. 4/3/2\nВыберите тему «Моя жизнь и работа». Расскажите 4 минуты первому партнёру, 3 минуты второму, 2 минуты третьему. Запишите все три. Сравните скорость и паузы.\n\n## Раздел 13. Практика 5. «Да, и...»\nПартнёр: I like hiking. Вы: Yes, and I also love swimming. Партнёр: I live near the mountains. Вы: Yes, and the air is really fresh there. Продолжайте 3 минуты, каждый раз подтверждая и добавляя новую деталь.\n\n## Раздел 14. Практика 6. Прерывания\nПартнёр во время вашего рассказа задаёт вопросы из списка: 1) What was that like? 2) Why did you choose that? 3) How long did it take? 4) Who helped you? 5) What would you do differently? 6) Where exactly was that? 7) Can you give me an example? 8) How did you feel? 9) What happened next? 10) When was that? Вы отвечаете 1–2 предложениями и продолжаете рассказ.\n\n## Раздел 15. Практика 7. Подсчёт скорости\nРассчитайте скорость: 1) 150 слов за 2 минуты. 2) 420 слов за 4 минуты. 3) 480 слов за 5 минут. Затем рассчитайте свою скорость по записи.\n\n## Раздел 16. Практика 8. Модель, чтение, диктовка, письмо\nОбразец импровизации (вымышленный персонаж, размечен связками):\nWell, my name is Arman. I'm thirty-two, and, uh, I live in Almaty now. Let me think... I was born in Taraz, but my family moved when I was six, so I grew up here. You know, I really like this city because it's close to the mountains. Actually, that's one of the reasons I started hiking. I mean, on weekends I usually go up to the hills with friends. As for my job, I'm a web designer. I work for a small company, and, to be honest, I love it because every project is different. What else? Oh, my sister Dana, she's a teacher. We're very close. By the way, I'm learning English at the moment, because I'd like to travel more. For example, next year I'm going to visit London. That's about it, I think.\nВопросы: 1) Where was Arman born? 2) Why does he like Almaty? 3) What does he do on weekends? 4) What is his job? 5) Why does he love his job? 6) What does his sister do? 7) Why is he learning English? 8) What is he going to do next year?\nДиктовка: Well, let me think for a moment. What I mean is that I love my city. For example, I go hiking on weekends. To be honest, I enjoy my job. That's about it.\nПисьмо. Напишите на 100–120 слов о том, что было самым трудным в импровизации, какие приёмы помогли и чему вы научились.\n\n## Раздел 17. Ключи\nПрактика 1: 1-e, 2-d, 3-c, 4-a, 5-b.\nПрактика 2 (образец): I live in Almaty. I live near the mountains. I like it because it's quiet and the air is fresh. I've lived here since I was six. For example, on weekends I often go hiking. I really love it. Для I work as a designer: Where? In a small company. What do you do? I design websites. Why? I like creating things. Example: Last month I finished a big project. Feeling: I feel proud of it.\nПрактика 7: 1) 75 слов в минуту 2) 105 слов в минуту 3) 96 слов в минуту.\nЧтение: 1) In Taraz. 2) It's close to the mountains. 3) He goes hiking with friends. 4) A web designer. 5) Every project is different. 6) She is a teacher. 7) He'd like to travel more. 8) Visit London.\n\n## Раздел 18. Самооценка\nПо 2 балла: □ я говорю без пауз дольше 3–4 секунд □ я использую заполнители и связки □ я перефразирую, когда не хватает слова □ я расширяю тему примерами и деталями □ я измеряю свою скорость □ я не перехожу на русский.\nРезультат: 10–12 баллов — переходите к уроку 10; 6–9 — повторите слабые разделы; меньше 6 — повторите неделю.\n\n## Раздел 19. Итоговый тест (15 баллов)\n1) Что такое беглость? 2) Чем она отличается от точности? 3) Что делать, если забыли слово? 4) Что такое 4/3/2? 5) Что значит circumlocution? 6) Назовите три заполнителя. 7) Как оставить собеседнику сигнал, что вы не закончили? 8) Формула скорости речи. 9) Рассчитайте скорость: 300 слов за 3 минуты. 10) Что значит «Да, и»? 11) Назовите три способа расширить высказывание. 12) Что делать во время импровизации с ошибками? 13) Как называются «5E»? 14) Какая цель по паузам? 15) Что нужно для измерения прогресса?\nОтветы: 1) непрерывность речи и малое число длинных пауз 2) беглость про плавность, точность про правильность 3) перефразировать, использовать заполнитель, продолжать говорить 4) говорить 4, 3 и 2 минуты на одну тему 5) описание другими словами 6) well, you know, I mean 7) ровный или слегка повышенный тон 8) слова / минуты 9) 100 слов в минуту 10) подтверждаете и добавляете деталь 11) пример, объяснение, чувство, деталь, оценка 12) продолжать и исправить позже 13) Example, Explain, Emotion, Extra detail, Evaluation 14) самая долгая пауза не более 3–4 секунд 15) запись и подсчёт показателей.\nОценка: 13–15 — отлично; 10–12 — хорошо, повторите слабые разделы; меньше 10 — вернитесь к теории и практике.\n\n## Раздел 20. План на 4 недели\nНеделя 1: беглость и точность (раздел 1), приёмы не молчать (раздел 2), расширение (раздел 3). Практика 1, 2. Легенда на 30 секунд и 1 минуту.\nНеделя 2: банк содержания (раздел 4), каркасы фраз (раздел 5), форматы тренировки (раздел 6). Практика 3, 5. Легенда на 2–3 минуты.\nНеделя 3: 4/3/2 (практика 4), прерывания (практика 6), произношение (раздел 7). Легенда на 5 минут с партнёром.\nНеделя 4: измерение (раздел 8, практика 7), пятиминутная импровизация без подготовки, самооценка и тест. Сравнение с записью первой недели.\n\n## Что стоит сверить в книгах\nPaul Nation, «Teaching ESL/EFL Listening and Speaking» (раздел о беглости, 4/3/2); Peter Skehan, работы по беглости, сложности и точности; Martin Bygate, «Speaking»; Scott Thornbury, «How to Teach Speaking». Для словаря и фраз: Cambridge Dictionary и Oxford Learner's Dictionaries.\nВажное замечание: беглость растёт постепенно и зависит от регулярности. Для оценки речи нужна обратная связь от человека, хорошо владеющего языком.\n", "w": [["improvise", "импровизировать", "/ˈɪmprəvaɪz/"], ["hesitate", "колебаться, запинаться", "/ˈhɛzɪteɪt/"], ["filler", "слово-заполнитель", "/ˈfɪlər/"], ["rephrase", "перефразировать", "/riːˈfreɪz/"], ["elaborate", "развивать, уточнять", "/ɪˈlæbəreɪt/"], ["spontaneous", "спонтанный", "/spɑːnˈteɪniəs/"], ["unrehearsed", "без репетиции", "/ˌʌnrɪˈhɜːrst/"], ["interrupt", "прерывать", "/ˌɪntəˈrʌpt/"], ["timer", "таймер", "/ˈtaɪmər/"], ["topic", "тема", "/ˈtɑːpɪk/"], ["example", "пример", "/ɪɡˈzæmpəl/"], ["however", "однако", "/haʊˈɛvər/"], ["anyway", "в любом случае", "/ˈɛniweɪ/"], ["besides", "кроме того", "/bɪˈsaɪdz/"], ["moreover", "более того", "/mɔːrˈoʊvər/"], ["circumlocution", "описание другими словами", "/ˌsɜːrkəmloʊˈkjuːʃən/"], ["continuous", "непрерывный", "/kənˈtɪnjuəs/"], ["speed", "скорость", "/spiːd/"], ["measure", "измерять", "/ˈmɛʒər/"], ["confident", "уверенный", "/ˈkɑːnfɪdənt/"]]}, {"t": "УРОК 10. ДОПРОС: ОТВЕТЫ НА НЕОЖИДАННЫЕ ВОПРОСЫ (РАСШИРЕННЫЙ КУРС)\nОбъём: 4 недели, 5–6 дней в неделю по 45–60 минут (около 20–25 часов). Уровень: B1.\nЭталон: американский английский, британские отличия отмечены.\nКурс «Школа разведчика» является учебной реконструкцией по открытым описаниям. «Допрос» здесь — учебная ролевая игра: партнёр быстро и неожиданно задаёт вопросы, вы отвечаете по своей «легенде» (урок 3). Это тренировка беглости и самообладания.\n\nЭтическая рамка: упражнения используют вымышленную или учебную роль только для речевой тренировки. В реальной жизни, особенно с официальными лицами (пограничниками, работодателями, врачами, полицией), говорите правду. Если не помните или не хотите отвечать, говорите об этом прямо и вежливо (раздел 3).\n\n## Как устроен урок\nТеория (разделы 1–8), практика (разделы 9–17), контроль (разделы 18–20). Сначала прочитайте теорию целиком, затем работайте с практикой. Цель: быстро понимать вопросы разных типов, отвечать коротко и связно, сохранять согласованность деталей, выигрывать время, когда нужно подумать, и спокойно просить уточнить или повторить.\n\n## Раздел 0. Научная основа метода\n1. Вспоминание под давлением. Умение быстро извлекать информацию из памяти развивается при тренировке в условиях ограничения времени. Исследователи памяти говорят об эффекте тренировки вспоминания: чем чаще вы вспоминаете, тем легче доступ.\n2. Нагрузка и качество. Психология производительности (закон Йеркса — Додсона в упрощённой формулировке) описывает: умеренное напряжение помогает, сильное мешает. Поэтому важно привыкнуть к умеренному давлению в тренировках, а затем постепенно его повышать.\n3. Прагматика. Правильный ответ — не только грамматика, но и уместность: прямота, вежливость, объём. Ответ, который слишком короткий или слишком длинный, воспринимается плохо.\n4. Стратегии коммуникации. Уточнение, повтор вопроса, выигрыш времени, перефразирование помогают сохранять контроль в разговоре.\n5. Согласованность (consistency). Рассказ должен быть связным. Для этого полезны опорные факты (раздел 4).\n6. Обратная связь: запись, разбор и перекрёстная проверка партнёром.\n\n## Раздел 1. Типы вопросов\nУмение быстро определять тип вопроса определяет форму ответа.\n1) Общие (yes/no): Do you live in Almaty? — Ответ: Yes, I do. / No, I don't. Затем деталь.\n2) Специальные (wh-): Where do you work? What do you do? When did you graduate? Why did you choose that? How long have you lived here?\n3) Альтернативные: Do you prefer tea or coffee? Is it a full-time or a part-time job?\n4) Разделительные (tag): You live in Almaty, don't you? You didn't study law, did you? Падение тона: ожидается подтверждение, подъём: действительный вопрос.\n5) Уточняющие и зондирующие (probing): What do you mean exactly? Can you be more specific? Why is that?\n6) Гипотетические: What would you do if you lost your passport?\n7) Скоростные серии (rapid-fire): быстрые вопросы подряд, без пауз.\n8) Проверочные на согласованность: Earlier you said... How is that possible? (проверка противоречия)\n9) Вопросы о времени и числах: When exactly? How many years? What year was that?\n10) Закрытые и лидирующие (leading): You enjoy your job, don't you? Вопрос подталкивает к ответу.\nСовет: слушайте первые слова вопроса (Do/Did/Where/Why/How long), они определяют тип.\n\n## Раздел 2. Структура ответа: метод ADD\nADD: Answer → Detail → Direct back (или Done).\n1) Answer (ответ): прямой ответ в первой фразе. Yes, I do. / I work for a small design company.\n2) Detail (деталь): одно уточнение или пример. I design websites for clients.\n3) Direct back (возврат или завершение): остановитесь или верните вопрос. And you? / That's about it.\nДлина ответа: 1–3 предложения. Слишком короткий ответ (Yes.) звучит холодно, слишком длинный открывает лишние вопросы.\nПримеры:\n- Where do you work? — I work for a small design company. I've been there since 2018.\n- Do you enjoy it? — Yes, very much. Every project is different.\nИзбегайте: бессвязных объяснений, лишних деталей, повторов, ответов не на тот вопрос.\n\n## Раздел 3. Как выиграть время, переспросить, честно сказать «не знаю»\nВыигрыш времени:\n- That's a good question.\n- Let me think for a moment.\n- Let me see...\n- If I remember correctly, ...\n- Let me think back...\n- Well, ...\nПросьба повторить или уточнить:\n- Sorry, could you repeat the question?\n- Pardon?\n- Do you mean...?\n- Which one do you mean?\n- Could you be more specific?\n- Could you say that more slowly?\nЧестные ограничения:\n- I don't remember exactly, but I think it was around...\n- I'm not sure, but I believe...\n- I don't know. (Не знаю.)\n- I'd prefer not to answer that. (Предпочёл бы не отвечать.)\n- That's private. / I'd rather not say.\nОценки и приближения: about, around, approximately /əˈprɑːksɪmətli/, roughly, a few, nearly.\nНе придумывайте ответы на ходу в реальных ситуациях, если не знаете. Лучше сказать честно.\n\n## Раздел 4. Опорный лист и согласованность\nДля учебной легенды составьте опорный лист (fact sheet) на одну страницу: имя, дата и место рождения, семья, школа, образование, работа и годы, место жительства, увлечения, планы.\nОбразец (вымышленный персонаж Arman):\n- Born: 12 March 1994, Taraz.\n- Moved to Almaty: 2000, at age six.\n- University: economics, graduated 2016.\n- Bank: 2016–2018.\n- Web designer since 2018.\n- Sister: Dana, teacher.\n- Lives: Almaty.\n- Hobbies: hiking, football.\n- Plan: visit London next year.\nПравила согласованности:\n1) Рассчитывайте числа заранее (возраст, сколько лет работал).\n2) Используйте одни и те же формулировки для одних и тех же фактов.\n3) Если вопрос выходит за рамки листа, отвечайте осторожно, не противореча известному, или говорите, что не помните (в учебной игре можно сымпровизировать детали, но запишите их после игры в лист).\n4) Проверяйте себя перекрёстной проверкой с партнёром (раздел 6).\n\n## Раздел 5. Банк вопросов (60)\nЛичные: 1) What's your name? 2) How old are you? 3) Where were you born? 4) Where do you live now? 5) How long have you lived there? 6) Are you married? (в учебной игре по легенде) 7) Do you have any brothers or sisters?\nСемья: 8) What do your parents do? 9) Where do they live? 10) Are you close to your family? 11) Who do you spend the most time with?\nОбразование: 12) Where did you go to school? 13) What did you study? 14) Why did you choose that subject? 15) When did you graduate? 16) Which teacher do you remember best?\nРабота: 17) Where do you work? 18) How long have you worked there? 19) What do you do exactly? 20) Why did you leave your last job? 21) Who is your manager? 22) Do you like your job?\nРаспорядок: 23) What time do you get up? 24) How do you get to work? 25) What did you do yesterday? 26) What did you have for breakfast? 27) What are you doing this weekend?\nПутешествия: 28) Have you ever been abroad? 29) Where did you go last summer? 30) Why do you want to visit London? 31) How long are you planning to stay?\nМнения: 32) What do you think about your city? 33) Which is better, living in a city or a village? 34) Why do you want to learn English?\nГипотетические: 35) What would you do if you lost your phone? 36) What would you change in your life if you could?\nВремя и числа: 37) What year was that? 38) How many years did you study? 39) How long ago did you move? 40) When exactly did you start?\nПроверка согласованности: 41) You said you graduated in 2016. How old were you then? 42) You said you lived in Taraz until you were six. Why did your family move? 43) Earlier you said you work for a small company. How many people work there? 44) You said you like hiking. How often do you go?\nЛовушки: 45) So you're thirty-one, right? (на самом деле 32) 46) You didn't like your job at the bank, did you? 47) You told me you were born in Almaty, didn't you? (на самом деле Taraz) 48) That doesn't sound right. Can you explain?\nУточнения: 49) What do you mean? 50) Can you be more specific? 51) Why exactly?\nПовторы (тот же вопрос иначе): 52) How long have you been a designer? (позже) Since when are you a designer? 53) Where do you live? (позже) Which city do you live in?\nЗакрывающие: 54) Is there anything you'd like to add? 55) Do you have any questions for me? 56) Is that everything? 57) Thank you for your time.\nСвободные: 58) Tell me something interesting about yourself. 59) What are you proud of? 60) What's your biggest challenge at the moment?\n\n## Раздел 6. Форматы тренировки\nА) Скоростная серия: партнёр задаёт 15 вопросов за 60 секунд, вы отвечаете одним предложением.\nБ) Глубокое погружение: одна тема (например, работа), 10 подряд зондирующих вопросов.\nВ) Перекрёстная проверка: два партнёра (или один в двух сессиях) задают одни и те же факты по-разному, вы сохраняете согласованность.\nГ) Давление времени: ответ не позднее чем за 3 секунды (или признаёте, что нужно подумать).\nД) Прерывание: партнёр прерывает вопросом на середине вашего ответа.\nЕ) Ловушки: партнёр вставляет неверные факты, вы вежливо поправляете: Actually, I was born in Taraz, not Almaty.\nЖ) Письменные вопросы: подготовьте ответы на 20 вопросов письменно, затем произнесите.\nЗ) Запись и разбор: запишите 5–10 минут «допроса», найдите расхождения и паузы.\nПравила игры: общайтесь вежливо, не давите чрезмерно, меняйтесь ролями, останавливайте игру, если она вызывает дискомфорт.\n\n## Раздел 7. Язык под давлением\nКороткие ответы: Yes, I do. / No, I don't. / About six years. / Since 2018.\nВремена: Past Simple для завершённых событий (I graduated in 2016), Present Perfect для длительности (I've worked there since 2018), Present Simple для постоянного (I live in Almaty).\nЧисла и даты: произносите чётко: nineteen ninety-four, twenty sixteen, thirty-two, thirteen и thirty (урок 1).\nВежливость: Sir / Madam (в официальных ситуациях), Excuse me?, Sorry?, Thank you.\nВводные для приближения: about, around, roughly, approximately.\nВозврат к теме: Anyway, ... / As I said, ...\nИсправление себя: Actually, ... / Sorry, I mean... / Let me correct that.\nРазделительные вопросы: отвечайте на факт, не на форму: You didn't study law, did you? — No, I didn't. I studied economics. (Согласие с отрицанием: No, I didn't.)\n\n## Раздел 8. Произношение, интонация и спокойствие\nИнтонация ответа: уверенное падение в конце утверждения: I work for a small company. ↘ Падение-подъём при сомнении: I think it was in two thousand sixteen... ↘↗\nЧёткость чисел и имён: произносите по слогам при необходимости, повторяйте.\nТемп: не торопитесь. Спокойный средний темп лучше быстрого и смазанного.\nДыхание: вдох на паузах между смысловыми группами. Перед ответом сделайте короткий вдох.\nГромкость: ровная, не слишком тихая.\nЖесты и поза: спокойная.\nСлабые формы и ритм (урок 7) сохраняйте под давлением: это показатель устойчивости навыка.\n\n## Раздел 9. Практика 1. Типы вопросов\nОпределите тип: 1) Do you live in Almaty? 2) Where do you work? 3) Do you prefer tea or coffee? 4) You live in Almaty, don't you? 5) What do you mean exactly? 6) What would you do if you lost your passport? 7) Earlier you said you were born in Almaty. How is that possible? 8) How long have you worked there?\n\n## Раздел 10. Практика 2. Метод ADD\nПостройте ответ по схеме Answer → Detail → Direct back: 1) Where do you work? 2) Do you like your job? 3) Where did you go to school? 4) What do you do in your free time? 5) Why are you learning English?\n\n## Раздел 11. Практика 3. Выигрыш времени\nПодберите функцию: 1) Let me think for a moment. 2) Do you mean the first or the second job? 3) I'm not sure, but I think it was around 2016. 4) I'd prefer not to answer that. 5) Could you repeat the question?\nФункции: a) уточнение b) просьба повторить c) вежливый отказ d) осторожный ответ e) выигрыш времени.\n\n## Раздел 12. Практика 4. Проверка согласованности\nИспользуя опорный лист (раздел 4), ответьте на вопросы: 1) What year were you born? 2) How old are you now (2026, после 12 марта)? 3) How old were you when you moved to Almaty? 4) When did you graduate? 5) How old were you when you graduated? 6) How long did you work at the bank? 7) How long have you been a web designer (2026)? 8) What does your sister do?\n\n## Раздел 13. Практика 5. Уточнения и вежливый отказ\nСоставьте вежливые фразы: 1) вы не расслышали вопрос; 2) вы не поняли слово; 3) вы не помните точную дату; 4) вы не хотите отвечать на личный вопрос; 5) вас поймали на неверном факте (ловушка).\n\n## Раздел 14. Практика 6. Ролевые ситуации\nРазыграйте по 5 минут с записью:\n1) Пограничный контроль: What's the purpose of your visit? How long will you stay? Where will you stay?\n2) Собеседование при приёме на работу: Tell me about yourself. Why this job? What are your strengths?\n3) Новый сосед: знакомство, вопросы о работе и семье.\n4) Администратор отеля: Is everything okay with the room? How long are you staying?\n5) Анкета в клинике: вопросы о самочувствии и истории.\n6) Агент по аренде жилья: Do you work? How long have you been in the city?\n7) Знакомство в самолёте: small talk с соседом.\n8) Скоростные вопросы по легенде (раздел 5).\nПартнёр импровизирует, добавляет проверочные вопросы.\n\n## Раздел 15. Практика 7. Чтение, диктовка, говорение, письмо\nОбразец диалога (вымышленный):\nInterviewer: Where do you work? — Candidate: I work for a small design company. — Interviewer: How long have you worked there? — Candidate: For about six years, since 2020. — Interviewer: What do you do there? — Candidate: I design websites for clients. — Interviewer: Do you enjoy it? — Candidate: Yes, very much. Every project is different.\nВопросы: 1) What does the candidate do? 2) How long has the candidate worked there? 3) Which year did the candidate start? 4) Why does the candidate enjoy the job? 5) Which answer is the most detailed? Какие ответы построены по ADD?\nДиктовка: That's a good question. Let me think for a moment. I don't remember exactly, but I think it was around 2016. Could you repeat the question, please? I'd prefer not to answer that.\nГоворение: проведите 10-минутную сессию с партнёром: 3 минуты скоростных вопросов, 3 минуты глубокого погружения, 2 минуты ловушек, 2 минуты закрытия. Запишите.\nПисьмо: составьте свой опорный лист на одну страницу (15–20 пунктов) и 10 вопросов с ответами.\n\n## Раздел 16. Ключи\nПрактика 1: 1) общий 2) специальный 3) альтернативный 4) разделительный 5) уточняющий 6) гипотетический 7) проверка согласованности 8) специальный (о длительности).\nПрактика 2 (образцы): 1) I work for a small design company. I've been there since 2018. 2) Yes, very much. Every project is different. 3) I went to school in Almaty. It was a big school near my house. 4) I like hiking and playing football. I go every weekend. 5) Because I'd like to travel and talk to people from other countries.\nПрактика 3: 1-e, 2-a, 3-d, 4-c, 5-b.\nПрактика 4: 1) 1994. 2) 32. 3) Six. 4) 2016. 5) 22. 6) Two years. 7) About eight years (since 2018). 8) She is a teacher.\nПрактика 5 (образцы): 1) Sorry, could you repeat the question? 2) Sorry, what does that word mean? 3) I don't remember exactly, but I think it was around 2016. 4) I'd prefer not to answer that. 5) Actually, I was born in Taraz, not Almaty.\nПрактика 7 (чтение): 1) He designs websites. 2) For about six years. 3) 2020. 4) Because every project is different. 5) Ответы по ADD: первый и последний (ответ, деталь).\n\n## Раздел 17. Таблица типичных ошибок\n- Слишком короткие ответы: Yes. → Yes, I do. I live near the mountains.\n- Слишком длинные ответы: не раскрывайте лишнее.\n- Путаница чисел: thirteen и thirty.\n- Согласование: She don't → She doesn't.\n- Время: I worked there since 2018 → I've worked there since 2018.\n- Неудачный выигрыш времени: долгое молчание (лучше фраза).\n- Непонимание разделительных вопросов: ответ на форму, а не на факт.\n- Страх переспросить: лучше переспросить, чем ответить невпопад.\nВедите личный список ошибок.\n\n## Раздел 18. Самооценка\nПо 2 балла: □ я определяю тип вопроса □ я отвечаю по схеме ADD □ я выигрываю время и переспрашиваю □ я сохраняю согласованность □ я честно говорю «не помню» или «предпочёл бы не отвечать» □ я говорю спокойно и чётко.\nРезультат: 10–12 баллов — переходите к уроку 11; 6–9 — повторите слабые разделы; меньше 6 — повторите неделю.\n\n## Раздел 19. Итоговый тест (15 баллов)\n1) Что значит ADD? 2) Как определить тип вопроса? 3) Как выиграть время? 4) Как попросить повторить? 5) Как честно сказать, что не помнишь? 6) Как отказаться отвечать вежливо? 7) Что такое опорный лист? 8) Какой тип вопроса You live in Almaty, don't you? 9) Что значит probing? 10) Как отреагировать на неверный факт? 11) Как называется вопрос, подталкивающий к ответу? 12) Что такое rapid-fire? 13) Как ответить на You didn't study law, did you? (изучали экономику) 14) Зачем перекрёстная проверка? 15) Какая этическая рамка у урока?\nОтветы: 1) Answer, Detail, Direct back 2) по первым словам вопроса 3) That's a good question. Let me think. 4) Could you repeat the question, please? 5) I don't remember exactly, but I think... 6) I'd prefer not to answer that. 7) краткий лист фактов для согласованности 8) разделительный 9) зондирующий, уточняющий 10) Actually, I was born in Taraz, not Almaty. 11) leading question 12) быстрая серия вопросов подряд 13) No, I didn't. I studied economics. 14) проверить согласованность 15) упражнение для тренировки, в реальной жизни нужно говорить правду.\nОценка: 13–15 — отлично; 10–12 — хорошо, повторите слабые разделы; меньше 10 — вернитесь к теории и практике.\n\n## Раздел 20. План на 4 недели\nНеделя 1: типы вопросов (раздел 1), ADD (раздел 2), выигрыш времени (раздел 3). Практика 1, 2, 3. Ответы на 20 вопросов письменно.\nНеделя 2: опорный лист и согласованность (раздел 4), банк вопросов (раздел 5). Практика 4. Скоростные серии.\nНеделя 3: форматы тренировки (раздел 6), язык под давлением (раздел 7). Практика 5, 6. Ловушки и прерывания.\nНеделя 4: произношение и спокойствие (раздел 8), итоговая сессия 10 минут, самооценка, тест. Сравнение с записью первой недели.\n\n## Что стоит сверить в книгах\nPaul Nation, «Teaching ESL/EFL Listening and Speaking»; Martin Bygate, «Speaking»; Michael Swan, «Practical English Usage» (разделительные вопросы, вежливые формулы); Cambridge Dictionary и Oxford Learner's Dictionaries.\nВажное замечание: упражнения построены на вымышленном персонаже и учебной игре. В реальной жизни не вводите других в заблуждение, особенно официальных лиц. Для оценки речи нужна обратная связь от человека, хорошо владеющего языком.\n", "w": [["interrogation", "допрос", "/ɪnˌtɛrəˈɡeɪʃən/"], ["probe", "выяснять, зондировать", "/proʊb/"], ["consistent", "последовательный", "/kənˈsɪstənt/"], ["contradict", "противоречить", "/ˌkɑːntrəˈdɪkt/"], ["recall", "вспоминать", "/rɪˈkɔːl/"], ["accurate", "точный", "/ˈækjərət/"], ["estimate", "оценивать", "/ˈɛstɪmət/"], ["approximately", "приблизительно", "/əˈprɑːksɪmətli/"], ["precisely", "точно", "/prɪˈsaɪsli/"], ["evidence", "доказательство", "/ˈɛvɪdəns/"], ["reliable", "надёжный", "/rɪˈlaɪəbəl/"], ["pressure", "давление", "/ˈprɛʃər/"], ["calm", "спокойный", "/kɑːm/"], ["private", "личный", "/ˈpraɪvɪt/"], ["timeline", "хронология", "/ˈtaɪmlaɪn/"], ["trap", "ловушка", "/træp/"], ["clarification", "уточнение", "/ˌklærəfɪˈkeɪʃən/"], ["respond", "отвечать", "/rɪˈspɑːnd/"], ["challenge", "вызов", "/ˈtʃælɪndʒ/"], ["fact", "факт", "/fækt/"]]}, {"t": "УРОК 11. ИДИОМЫ И СЛЕНГ ВЫБРАННОГО ДИАЛЕКТА (РАСШИРЕННЫЙ КУРС)\nОбъём: 4 недели, 5–6 дней в неделю по 45–60 минут (около 20–25 часов). Уровень: B1 → B2.\nЭталон: американский английский, британские и австралийские отличия отмечены.\nКурс «Школа разведчика» является учебной реконструкцией по открытым описаниям.\n\n## Как устроен урок\nТеория (разделы 1–9), практика (разделы 10–17), контроль (разделы 18–20). Сначала прочитайте теорию целиком, затем работайте с практикой. Цель: понимать идиомы и разговорную речь, уместно использовать их в нужном регистре и выбранном диалекте, не превращая речь в набор заученных фраз.\n\n## Раздел 0. Научная основа метода\n1. Готовые блоки. Значительная часть живой речи состоит из устойчивых сочетаний (formulaic language). Исследователи (в частности, Элисон Рэй) показывают, что такие блоки обрабатываются как единое целое и ускоряют речь. Идиомы — одна из групп блоков.\n2. Понимание важнее употребления. Многие идиомы вы будете чаще слышать, чем использовать. Сначала нужно научиться их понимать, затем использовать самые частотные и безопасные.\n3. Образность помогает. Запоминание образа (a piece of cake — кусок торта, значит, просто) связывает буквальное и переносное значения.\n4. Регистр и уместность. Слово или идиома могут быть правильными, но неуместными в ситуации. Нужно чувствовать формальность.\n5. Динамика сленга. Сленг быстро меняется и зависит от возраста, региона и группы. Поэтому его знание быстро устаревает. Основной упор в уроке — на устойчивые идиомы и нейтральные разговорные слова.\n6. Интервальные повторения: возвращайтесь к идиомам через 1, 3, 7, 14 дней (вкладка «Карточки»).\n\n## Раздел 1. Основные понятия\nИдиома (idiom): устойчивое сочетание, значение которого нельзя вывести из значений слов. It's raining cats and dogs (льёт как из ведра).\nФразовый глагол (phrasal verb): глагол и частица со своим значением. Give up (сдаться), look after (заботиться).\nКоллокация: привычное сочетание слов. Make a decision, heavy rain.\nПословица (proverb): краткое народное изречение. Practice makes perfect.\nРазговорная лексика (colloquialism): слова и обороты неформальной речи. Gonna, wanna, kids.\nСленг (slang): очень неформальная лексика, часто зависящая от группы и времени.\nЭвфемизм: смягчающее выражение. Pass away вместо die.\nКлише: избитая фраза. At the end of the day.\nШкала регистров: формальный → нейтральный → неформальный → сленг. Не употребляйте сленг в официальной речи и письме.\nДиалект и акцент: акцент — произношение, диалект — произношение, лексика и грамматика региона. Стандартные варианты: General American, British Standard (RP), Australian.\n\n## Раздел 2. Идиомы по темам: значения и примеры\nЛёгкое и трудное:\n- a piece of cake — проще простого: The test was a piece of cake.\n- a walk in the park — легко: The project wasn't a walk in the park (было нелегко).\n- a tough nut to crack — крепкий орешек: This problem is a tough nut to crack.\nВремя:\n- once in a blue moon — очень редко: I see him once in a blue moon.\n- around the clock — круглосуточно: They work around the clock.\n- at the eleventh hour — в последний момент: We finished at the eleventh hour.\n- in the nick of time — в самый последний момент (успел): We arrived in the nick of time.\nЭмоции и самочувствие:\n- over the moon — на седьмом небе: She was over the moon.\n- on cloud nine — на седьмом небе: He's on cloud nine.\n- feel blue — грустить: I feel blue today.\n- under the weather — неважно себя чувствовать: I'm a
