ат."};

if(error){$("#v").innerHTML='<div class="card bad">Не удалось загрузить: '+esc(error.message)+'</div>';return}

let NETRAF=0;
function edgesFor(k){const m=METHODS[k],n=m.s.length,c=(D.links||{})[k];if(Array.isArray(c)&&c.length)return c;const E=[];for(let i=0;i<n-1;i++){E.push([i,i+1]);if(i%3===0&&i+3<n)E.push([i,i+3]);if(i%4===1&&i+2<n)E.push([i,i+2])}return E}
function net(){cancelAnimationFrame(NETRAF);const p=D.plan,k=p.m,m=METHODS[k],n=m.s.length,E=edgesFor(k),done=new Set(p.done);
const pre=i=>E.filter(e=>e[1]===i).map(e=>e[0]);
const nxt=new Set();for(let i=0;i<n;i++)if(!done.has(i)&&pre(i).every(j=>done.has(j)))nxt.add(i);
$("#v").innerHTML=`<div class="card"><h2>Нейронные связи: ${esc(m.n)}</h2><canvas id="cv" style="width:100%;height:60vh;border-radius:10px;background:#0b1020;touch-action:none;display:block"></canvas><p class="m"><span style="color:#ffcf40">●</span> пройдено &nbsp;<span style="color:#7fd1ff">●</span> можно изучать сейчас &nbsp;<span style="color:#5b6b8c">●</span> пока закрыто. Вращайте пальцем, нажмите на точку, чтобы увидеть тему.</p><div id="ni" class="m"></div><div class="row"><button class="g" id="nb">Построить связи с помощью ИИ</button></div></div>`;
const P=[];for(let i=0;i<n;i++){const a=i*.9,r=1+.3*((i%3)-1),y=n>1?(i/(n-1)-.5)*2.4:0;P.push([Math.cos(a)*r,y,Math.sin(a)*r])}
let ry=0,rx=.35,drag=null,sel=-1;const cv=$("#cv"),ctx=cv.getContext("2d");
const fit=()=>{const d=devicePixelRatio||1;cv.width=cv.clientWidth*d;cv.height=cv.clientHeight*d;ctx.setTransform(d,0,0,d,0,0)};fit();
const proj=q=>{const[x,y,z]=q,cy=Math.cos(ry),sy=Math.sin(ry),x1=x*cy+z*sy,z1=-x*sy+z*cy,cx=Math.cos(rx),sx=Math.sin(rx),y2=y*cx-z1*sx,z2=y*sx+z1*cx,W=cv.clientWidth,H=cv.clientHeight,s=Math.min(W,H)*.68/(3-z2);return[W/2+x1*s,H/2+y2*s,z2]};
const draw=t=>{if(!cv.isConnected)return;const W=cv.clientWidth,H=cv.clientHeight;ctx.clearRect(0,0,W,H);if(!drag)ry+=.004;const Q=P.map(proj);
ctx.lineWidth=1.2;E.forEach(([a,b])=>{if(!Q[a]||!Q[b])return;const lit=done.has(a)&&done.has(b);ctx.strokeStyle=lit?"rgba(255,207,64,.85)":done.has(a)?"rgba(127,209,255,.55)":"rgba(91,107,140,.35)";ctx.shadowColor=lit?"#ffcf40":"transparent";ctx.shadowBlur=lit?8:0;ctx.beginPath();ctx.moveTo(Q[a][0],Q[a][1]);ctx.lineTo(Q[b][0],Q[b][1]);ctx.stroke()});ctx.shadowBlur=0;
[...Q.keys()].sort((a,b)=>Q[a][2]-Q[b][2]).forEach(i=>{const[x,y,z]=Q[i],d=done.has(i),nx=nxt.has(i),c=d?"#ffcf40":nx?"#7fd1ff":"#5b6b8c",r=(d?7+1.5*Math.sin(t/300+i):nx?6:4.5)*(1+z*.15);ctx.fillStyle=c;ctx.shadowColor=c;ctx.shadowBlur=d?22:nx?14:0;ctx.beginPath();ctx.arc(x,y,Math.max(2,r),0,7);ctx.fill();ctx.shadowBlur=0;if(i===sel){ctx.strokeStyle="#fff";ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,r+5,0,7);ctx.stroke();ctx.lineWidth=1.2}ctx.fillStyle="rgba(255,255,255,.75)";ctx.font="11px system-ui";ctx.fillText(i+1,x+r+3,y+4)});
NETRAF=requestAnimationFrame(draw)};NETRAF=requestAnimationFrame(draw);
cv.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,m:false};cv.setPointerCapture(e.pointerId)};
cv.onpointermove=e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>3)drag.m=true;ry+=dx*.01;rx=Math.max(-1.2,Math.min(1.2,rx+dy*.01));drag.x=e.clientX;drag.y=e.clientY};
cv.onpointerup=e=>{if(drag&&!drag.m){const r=cv.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top;let b=-1,bd=1600;P.map(proj).forEach((q,i)=>{const d=(q[0]-px)**2+(q[1]-py)**2;if(d<bd){bd=d;b=i}});sel=b;
$("#ni").innerHTML=b<0?"":`<b>${b+1}. ${esc(m.s[b])}</b><br>${done.has(b)?"Пройдено.":nxt.has(b)?"Можно изучать сейчас.":"Сначала пройдите: "+pre(b).filter(j=>!done.has(j)).map(j=>j+1).join(", ")}${E.some(e=>e[0]===b)?"<br>Ведёт к: "+E.filter(e=>e[0]===b).map(e=>e[1]+1).join(", "):""}`}drag=null};
cv.onpointercancel=()=>{drag=null};
$("#nb").onclick=async()=>{const b=$("#nb");b.textContent="Строю...";try{const r=await ai(`Курс английского «${m.n}». Шаги нумерованы с 0 до ${n-1}:\n${m.s.map((x,i)=>i+": "+x).join("\n")}\nПострой граф зависимостей: что от чего зависит и что к чему ведёт. Верни только JSON-массив пар [от,к], где от<к, примерно от ${Math.round(n*1.5)} до ${n*2} пар; у каждого шага кроме 0 должна быть хотя бы одна входящая связь.`,true);if(!Array.isArray(r))throw new Error("ИИ вернул неверный ответ");const ok=r.filter(e=>Array.isArray(e)&&Number.isInteger(e[0])&&Number.isInteger(e[1])&&e[0]<e[1]&&e[0]>=0&&e[1]<n);if(!ok.length)throw new Error("связи не получены");D.links=D.links||{};D.links[k]=ok;sv();net()}catch(e){b.textContent="Ошибка: "+e.message}}}
