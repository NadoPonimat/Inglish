y're/Their). 11) Вставьте: ___ raining (Its/It's). 12) Что такое bottom-up? 13) Что такое top-down? 14) Что делать, если не расслышали слово? 15) Назовите три типа ошибок при диктовке.\nОтветы: 1) метод Рут Вайнрайб: слушать, записывать ключевые слова и восстанавливать текст в паре 2) слабые слова (to, of, a, the) 3) hear 4) 3 5) целиком, чтобы понять тему 6) границами слов, они звучат почти одинаково 7) по ударению: fifteen на последнем слоге, fifty на первом 8) тип ошибок, число, самые частые 9) right 10) They're 11) It's 12) расшифровка звуков и слов 13) использование контекста и знаний 14) поставить метку и идти дальше 15) звуковая путаница, границы слов, слабые слова.\nОценка: 13–15 — отлично; 10–12 — хорошо, повторите слабые разделы; меньше 10 — вернитесь к теории и практике.\n\n## Раздел 20. План на 4 недели\nНеделя 1: теория (разделы 1–4), омофоны (практика 1), границы слов (практика 2), диктовка текста 1.\nНеделя 2: слабые формы и связная речь, разбор ошибок (практика 3), диктовка текста 2, диктовка с пропусками.\nНеделя 3: числа, даты, имена (раздел 6, практика 7), текст 3, диктоглосс (практика 5).\nНеделя 4: свой материал (подкаст или диалог), взаимодиктовка с партнёром, итоговая диктовка, самооценка и тест. Сравнение с журналом первой недели.\n\n## Что стоит сверить в книгах\nДля диктоглосса: Ruth Wajnryb, «Grammar Dictation» (Oxford University Press); о слушании в изучении языков: Michael Rost, «Teaching and Researching Listening»; о звуках и связной речи: Peter Roach, «English Phonetics and Phonology»; Judy Gilbert, «Clear Speech»; Cambridge Dictionary и Merriam-Webster для орфографии и произношения.\nВажное замечание: диктовка развивает слух и орфографию, но не заменяет обратную связь от человека. Если есть возможность, раз в неделю показывайте результаты преподавателю или носителю.\n", "w": [["dictation", "диктовка", "/dɪkˈteɪʃən/"], ["transcript", "расшифровка, текст", "/ˈtrænskrɪpt/"], ["spelling", "орфография", "/ˈspɛlɪŋ/"], ["homophone", "омофон", "/ˈhɑːməfoʊn/"], ["gap", "пропуск", "/ɡæp/"], ["gist", "суть", "/dʒɪst/"], ["detail", "деталь", "/ˈdiːteɪl/"], ["predict", "предсказывать", "/prɪˈdɪkt/"], ["context", "контекст", "/ˈkɑːntɛkst/"], ["boundary", "граница", "/ˈbaʊndri/"], ["punctuation", "пунктуация", "/ˌpʌŋktʃuˈeɪʃən/"], ["capital", "заглавная буква", "/ˈkæpɪtəl/"], ["error", "ошибка", "/ˈɛrər/"], ["loop", "повтор, петля", "/luːp/"], ["note", "заметка", "/noʊt/"], ["recognize", "распознавать", "/ˈrɛkəɡnaɪz/"], ["decode", "расшифровывать", "/diːˈkoʊd/"], ["segment", "сегмент", "/ˈsɛɡmənt/"], ["receive", "получать", "/rɪˈsiːv/"], ["separate", "отдельный", "/ˈsɛpərət/"]]}, {"t": "УРОК 6. БЫТОВЫЕ ДИАЛОГИ: МАГАЗИН, ТАКСИ, ОТЕЛЬ, ЗВОНОК (РАСШИРЕННЫЙ КУРС)\nОбъём: 4 недели, 5–6 дней в неделю по 45–60 минут (около 20–25 часов). Уровень: A2 → B1.\nЭталон: американский английский, британские отличия отмечены.\nКурс «Школа разведчика» является учебной реконструкцией по открытым описаниям.\n\n## Как устроен урок\nТеория (разделы 1–8), практика (разделы 9–17), контроль (разделы 18–20). Сначала прочитайте теорию целиком, затем работайте с практикой. Цель: уверенно проходить типовые ситуации (магазин, такси, отель, телефонный звонок) в нужном регистре и не терять нить, если собеседник говорит быстро или что-то идёт не по сценарию.\n\n## Раздел 0. Научная основа метода\n1. Сценарии (scripts). В когнитивной науке (Шенк и Абельсон) повседневные ситуации описывают как сценарии: последовательность типовых шагов. У нас есть сценарий кафе, отеля, такси. Освоив шаги, вы тратите меньше усилий на подбор фраз.\n2. Формулы и блоки. Разговорная речь состоит из готовых блоков. Их знание ускоряет речь и снижает ошибки.\n3. Прагматика. Правильная грамматика не гарантирует уместность. Важны вежливость, регистр и интонация.\n4. Стратегии коммуникации. Исследования стратегий в изучении языков описывают приёмы: переспросить, перефразировать, описать слово, подтвердить понятое. Они помогают, когда не хватает слов.\n5. Давление и автоматизация. Тренировка в темпе и с неожиданными поворотами формирует уверенность. Это связано с основной идеей курса: говорить автоматически.\n6. Обратная связь: запись, разбор, партнёр.\n\n## Раздел 1. Структура диалога и типовые шаги\nЛюбое бытовое взаимодействие имеет открытие, основную часть и закрытие.\nОткрытие: приветствие, обращение. Hello. Excuse me. Good evening.\nОсновная часть: просьба, уточнение, ответ, решение.\nЗакрытие: благодарность и прощание. Thank you very much. Have a nice day.\nСмежные пары: вопрос → ответ, просьба → согласие или отказ, благодарность → ответ, предложение → принятие или отклонение. Если вы слышите первую часть, готовьте вторую.\nТипичные ответы:\n- Thank you. → You're welcome. / No problem. / Not at all.\n- Sorry. → That's okay. / No worries.\n- Could you help me? → Of course. / Sure. / I'm afraid I can't.\n\n## Раздел 2. Вежливость и регистр\nЧем выше степень вежливости, тем больше смягчителей и косвенности.\n- Прямо: Give me the menu. (грубо)\n- Нейтрально: Can I have the menu?\n- Вежливо: Could I have the menu, please?\n- Очень вежливо: Would it be possible to have the menu, please? / I was wondering if I could have the menu.\nСмягчители: please, if you don't mind, I'm afraid, sorry to bother you, by the way.\nОтказ или проблема: I'm afraid there's a problem. I'm sorry, but we don't have that.\nПросьба повторить: Sorry? / Pardon? / Could you repeat that, please? / Could you say that more slowly?\nБлагодарность: Thank you. Thanks a lot. I really appreciate it.\nИнтонация и вежливость: широкий диапазон голоса звучит вежливо, ровный низкий тон может звучать грубо. Улыбка слышна в голосе.\n\n## Раздел 3. Магазин и покупка\nМодельный диалог:\nShop assistant: Hello, can I help you? — You: Yes, please. I'm looking for a jacket. — Assistant: What size are you? — You: Medium. Do you have this one in blue? — Assistant: Let me check. Yes, here you are. — You: Can I try it on? — Assistant: Of course. The fitting room is over there. — You: It fits well. How much is it? — Assistant: It's sixty dollars. — You: Is there a discount? — Assistant: It's thirty percent off today, so forty-two dollars. — You: Great, I'll take it. Can I pay by card? — Assistant: Sure. Would you like a bag? — You: Yes, please. Thank you.\nКлючевые фразы: I'm looking for..., Do you have this in...?, Can I try this on?, How much is it?, Is there a discount?, I'll take it., Can I pay by card?\n\n## Раздел 4. Такси\nМодельный диалог:\nYou: Hi, could you take me to the airport, please? — Driver: Sure. Which terminal? — You: Terminal 2. How long will it take? — Driver: About twenty-five minutes, depending on traffic. — You: How much will it cost? — Driver: Around thirty dollars. — You: That's fine. Could you put my bag in the trunk? (US) / boot (UK) — Driver: Of course. — You: Could you stop here, please? — Driver: Here you are. — You: Thank you. Keep the change.\nПолезные фразы: Could you take me to...? Could you drop me off here? Could you turn on the air conditioning? Could you wait for me? I'm in a hurry. Which route do you prefer? (Какой маршрут вы предпочитаете?)\nАдрес: 24 Park Road → twenty-four Park Road. Если не поняли адрес, попросите повторить: Could you spell the street name?\n\n## Раздел 5. Отель\nМодельный диалог (регистрация):\nReceptionist: Good evening. How can I help you? — You: Hello, I have a reservation under the name Nurov. — Receptionist: Let me check. Yes, a double room for three nights. Could I see your passport, please? — You: Sure. Here you are. — Receptionist: Thank you. Breakfast is from seven to ten in the restaurant. Here's your key card. Your room is 405, on the fourth floor. — You: Thank you. Is there Wi-Fi? — Receptionist: Yes, the password is on the card. — You: What time is check-out? — Receptionist: Eleven o'clock.\nПроблема в номере:\nYou: Excuse me, there's a problem with my room. The air conditioner doesn't work. — Receptionist: I'm very sorry about that. I'll send someone right away. — You: Thank you. Could I move to another room? — Receptionist: Let me check what's available.\nФразы: I'd like to check in / check out. Is breakfast included? Could I have a late check-out? Could I have an extra towel? Where is the elevator (US) / lift (UK)? The room is too noisy. I'd like to speak to the manager.\n\n## Раздел 6. Телефонный звонок\nТелефонный разговор требует особых навыков: нет мимики, плохо слышно, нужно уточнять детали.\nСтруктура:\n1) Приветствие и представление: Good morning, Green Clinic, Anna speaking. How can I help you?\n2) Цель звонка: Hello, I'd like to make an appointment. / I'm calling about my reservation.\n3) Идентификация: May I have your name, please? — It's Dana Nurova. — How do you spell your surname? — N-U-R-O-V-A.\n4) Детали: Could I have your phone number? — It's 555 0147.\n5) Подтверждение: So that's Tuesday at three o'clock, right? — Yes, that's correct.\n6) Закрытие: Thank you very much. Goodbye.\nФразы для звонков:\n- Could I speak to Mr Brown, please?\n- Who's calling, please? / This is Dana Nurova.\n- Hold on, please. / Hold the line. / One moment, please.\n- I'll put you through. (Соединяю.)\n- He's not available right now. Can I take a message?\n- Could you ask him to call me back?\n- I'll call back later.\n- Sorry, the line is bad. Could you repeat that?\n- Let me confirm: ...\nГолосовое сообщение (voicemail): Hello, this is Dana Nurova calling for Mr Brown. It's about the appointment on Tuesday. Please call me back at 555 0147. Thank you. Goodbye.\nПодтверждение деталей: читайте числа и имена, затем повторяйте: So that's five five five, oh one four seven?\n\n## Раздел 7. Стратегии, когда что-то не так\nЕсли вы не поняли: Sorry, could you say that again? / Could you speak a bit more slowly?\nЕсли не знаете слово: описывайте. It's something you use for... / It's like a... / The thing you put on a bed.\nЕсли нужно время: Let me think. / Just a moment, please.\nПодтверждение: So you mean...? / Do you mean...?\nЕсли собеседник говорит слишком быстро: I'm sorry, my English isn't very good. Could you speak more slowly, please?\nЕсли что-то пошло не по плану: I'm afraid there's a problem. / Could you help me with this?\nГлавное: не замолкайте. Любая стратегия лучше молчания.\n\n## Раздел 8. Произношение и ритм в бытовых диалогах\nСлабые формы: Could I → /ˈkʊdaɪ/; Do you have → /dʒə hæv/; Would you like → /ˈwʊdʒə laɪk/; I'd like → /aɪd laɪk/.\nЧисла и телефоны: читайте цифрами, делая паузу после каждой группы: five five five / oh one four seven. Ударение в 13–19 на последнем слоге.\nАдреса: twenty-four Park Road (ударение на Park и на Road; в слове Park Road ударение на Park).\nИнтонация в подтверждении: подъём: So that's Tuesday at three? ↗\nИнтонация благодарности и вежливости: Thank you ↘ very ↗ much ↘.\nТемп: на телефоне говорите чуть медленнее, чётче.\n\n## Раздел 9. Практика 1. Сценарии\nЗаполните шаги сценария своими фразами: 1) в магазине (приветствие, нужная вещь, размер, примерка, цена, оплата); 2) в такси (адрес, время, стоимость, остановка); 3) в отеле (бронь, паспорт, время завтрака, номер); 4) по телефону (приветствие, цель, имя, детали, подтверждение, прощание).\n\n## Раздел 10. Практика 2. Вежливые просьбы\nПерепишите вежливо: 1) Give me the menu. 2) Tell me the price. 3) I want to check in. 4) Take me to the airport. 5) Repeat that.\n\n## Раздел 11. Практика 3. Телефонный разговор\nРасставьте реплики по порядку: a) Could I have your phone number? b) Good morning, Green Clinic, Anna speaking. c) It's 555 0147. d) Hello, I'd like to make an appointment. e) May I have your name? f) So that's Tuesday at three, right? g) Yes, that's correct. Thank you. Goodbye. h) It's Dana Nurova.\nПродиктуйте по буквам: Nurova, Sarsenov, Almaty.\n\n## Раздел 12. Практика 4. Стратегии\nЧто сказать, если: 1) вы не расслышали номер комнаты; 2) вы не знаете слово «towel» и нужно полотенце; 3) собеседник говорит слишком быстро; 4) в номере не работает кондиционер; 5) вам нужно подтвердить время.\n\n## Раздел 13. Практика 5. Ролевые игры\nКаждая ролевая игра 3–5 минут с записью. Партнёры меняются ролями.\n1) Магазин: клиент хочет обменять вещь не того размера.\n2) Такси: клиент опаздывает в аэропорт, водитель не знает адрес.\n3) Отель: клиент приехал позже, номер занят, нужно решить проблему.\n4) Телефон: запись к врачу, имя сложное, нужно продиктовать по буквам.\n5) Отель: жалоба на шум.\n6) Магазин: клиент ищет подарок и просит совета.\n7) Телефон: переспрос, плохая связь.\n8) Такси: общение по пути (small talk).\nДавление: партнёр в середине диалога вводит проблему (нет мест, время изменилось, не расслышал имя). Вы продолжаете без перехода на русский.\n\n## Раздел 14. Практика 6. Чтение, диктовка, говорение, письмо\nЧтение. Прочитайте диалог и ответьте.\nReceptionist: Good evening. Can I help you? Guest: Yes, I have a reservation. My name is Nurov. Receptionist: Nurov, N-U-R-O-V? Guest: Yes, that's right. Receptionist: A single room for two nights. Breakfast is from seven to ten. Your room is 312. Guest: Thank you. What time is check-out? Receptionist: At eleven o'clock.\nВопросы: 1) What is the guest's surname? 2) What type of room is it? 3) How many nights? 4) When is breakfast? 5) What is the room number? 6) When is check-out?\nДиктовка: Could I have your phone number, please? I have a reservation under the name Nurov. Could you take me to the airport? Hold on, please. Let me confirm the time.\nПисьмо. Напишите электронное письмо в отель с просьбой о бронировании на 80–100 слов: даты, тип номера, количество гостей, просьба подтвердить, ваши контактные данные. Чек-лист: вежливое обращение, чёткая просьба, детали, благодарность, формула окончания (Kind regards).\n\n## Раздел 15. Практика 7. Диалог без подготовки\nПартнёр открывает 3 случайные карточки с ситуациями и по таймеру 2 минуты просит вас вести диалог. Цель: отвечать без пауз дольше 3 секунд. Затем разбор записи.\n\n## Раздел 16. Ключи\nПрактика 2: 1) Could I have the menu, please? 2) Could you tell me the price, please? 3) I'd like to check in, please. 4) Could you take me to the airport, please? 5) Could you repeat that, please?\nПрактика 3: b, d, e, h, a, c, f, g.\nПрактика 4: 1) Sorry, could you repeat the room number? 2) It's something you use after a shower. / Could I have another one of these? 3) Could you speak more slowly, please? 4) Excuse me, there's a problem with the air conditioner. It doesn't work. 5) Let me confirm: Tuesday at three, right?\nПрактика 6 (чтение): 1) Nurov. 2) A single room. 3) Two nights. 4) From seven to ten. 5) 312. 6) At eleven o'clock.\n\n## Раздел 17. Таблица типичных ошибок\n- Слишком прямые просьбы: Give me → Could I have...?\n- Забытое please.\n- Порядок слов в вопросах: Where is the elevator? (прямой вопрос) → Could you tell me where the elevator is? (непрямой).\n- Пропуск артикля: I have reservation → I have a reservation.\n- Путаница в числах: fifteen и fifty.\n- Не переспрашивают: нужно переспрашивать, а не кивать.\n- Прямой перевод: I'm agree → I agree.\n- Слишком короткие ответы: Yes. No. → Yes, of course. / No, thank you.\nВедите личный список ошибок.\n\n## Раздел 18. Самооценка\nПо 2 балла: □ я использую вежливые формы □ я знаю шаги сценариев □ я могу вести телефонный разговор □ я использую стратегии, когда не понял □ я произношу цифры и имена по буквам □ я не молчу в сложной ситуации.\nРезультат: 10–12 баллов — переходите к уроку 7; 6–9 — повторите слабые разделы; меньше 6 — повторите неделю.\n\n## Раздел 19. Итоговый тест (15 баллов)\n1) Вежливая просьба о меню. 2) Как попросить повторить? 3) Как сказать «Мне нужно зарегистрироваться»? 4) Как спросить стоимость такси? 5) Как попросить остановить здесь? 6) Как представиться по телефону? 7) Что значит Hold on? 8) Как подтвердить время? 9) Что делать, если не знаете слово? 10) Как попросить продиктовать по буквам? 11) Как читается 555 0147? 12) Как сказать «в номере проблема»? 13) Ответ на Thank you. 14) Что значит Can I take a message? 15) Три части диалога.\nОтветы: 1) Could I have the menu, please? 2) Could you repeat that, please? 3) I'd like to check in, please. 4) How much will it cost? 5) Could you stop here, please? 6) Good morning, ... speaking. 7) подождите 8) So that's ... at ... , right? 9) описать: It's something you use for... 10) How do you spell that? 11) five five five, oh one four seven 12) There's a problem with my room. 13) You're welcome. / No problem. 14) Могу передать сообщение? 15) открытие, основная часть, закрытие.\nОценка: 13–15 — отлично; 10–12 — хорошо, повторите слабые разделы; меньше 10 — вернитесь к теории и практике.\n\n## Раздел 20. План на 4 недели\nНеделя 1: структура диалога, вежливость (разделы 1–2), магазин (раздел 3). Практика 1, 2. Ролевые игры 1, 6.\nНеделя 2: такси (раздел 4), отель (раздел 5). Практика 4. Ролевые игры 2, 3, 5, 8.\nНеделя 3: телефон (раздел 6), стратегии (раздел 7), произношение (раздел 8). Практика 3. Ролевые игры 4, 7.\nНеделя 4: диалоги без подготовки (практика 7), письмо, итоговая запись, самооценка, тест. Сравнение с записью первой недели.\n\n## Что стоит сверить в книгах\nMichael Swan, «Practical English Usage» (вежливые формулы, вопросы); «Collins COBUILD English Usage»; Cambridge Dictionary и Oxford Learner's Dictionaries (произношение и примеры). Для фонетики: Peter Roach, «English Phonetics and Phonology».\nВажное замечание: диалоги в уроке учебные. В реальной жизни ответы бывают быстрее и нестандартнее, поэтому тренируйтесь с партнёром и записывайте себя.\n", "w": [["receptionist", "администратор", "/rɪˈsɛpʃənɪst/"], ["reception", "стойка регистрации", "/rɪˈsɛpʃən/"], ["booking", "бронирование", "/ˈbʊkɪŋ/"], ["appointment", "назначенная встреча, запись", "/əˈpɔɪntmənt/"], ["message", "сообщение", "/ˈmɛsɪdʒ/"], ["voicemail", "голосовая почта", "/ˈvɔɪsmeɪl/"], ["confirm", "подтверждать", "/kənˈfɜːrm/"], ["available", "доступный", "/əˈveɪləbəl/"], ["complaint", "жалоба", "/kəmˈpleɪnt/"], ["apologize", "извиняться", "/əˈpɑːlədʒaɪz/"], ["instruction", "инструкция", "/ɪnˈstrʌkʃən/"], ["clarify", "уточнять", "/ˈklærəfaɪ/"], ["paraphrase", "перефразировать", "/ˈpærəfreɪz/"], ["polite", "вежливый", "/pəˈlaɪt/"], ["request", "просьба", "/rɪˈkwɛst/"], ["refuse", "отказывать", "/rɪˈfjuːz/"], ["hold", "держать, ждать на линии", "/hoʊld/"], ["extension", "добавочный номер", "/ɪkˈstɛnʃən/"], ["elevator", "лифт (США)", "/ˈɛləveɪtər/"], ["towel", "полотенце", "/ˈtaʊəl/"]]}, {"t": "УРОК 7. АКЦЕНТ: РИТМ, УДАРЕНИЕ, РЕДУКЦИЯ ГЛАСНЫХ (РАСШИРЕННЫЙ КУРС)\nОбъём: 4 недели, 5–6 дней в неделю по 45–60 минут (около 20–25 часов). Уровень: B1.\nЭталон: американский английский (General American), британские отличия отмечены.\nКурс «Школа разведчика» является учебной реконструкцией по открытым описаниям.\n\n## Как устроен урок\nТеория (разделы 1–9), практика (разделы 10–17), контроль (разделы 18–20). Сначала прочитайте теорию целиком, затем работайте с практикой. Цель: перейти от правильных отдельных звуков к естественной речи с английским ритмом, ударением и интонацией, и понимать, чего реально можно добиться.\n\n## Раздел 0. Научная основа метода\n1. Просодия важнее отдельных звуков для понятности. Ударение, ритм и интонация определяют, как слушатель сегментирует речь и понимает смысл. Исследователи произношения (в частности, работы по английскому как языку международного общения) подчёркивают роль ударения и ядерного ударения для понятности.\n2. Ударный ритм (stress-timing). В английском интервалы между ударными слогами относительно равны, а безударные слоги сжимаются. В русском слоги более равномерны по длительности.\n3. Редукция гласных. Безударные гласные ослабляются до шва /ə/ или /ɪ/. Это главный механизм ритма.\n4. Автоматизация. Просодия усваивается через многократное осмысленное повторение и копирование (урок 4, шэдоуинг).\n5. Реалистичная цель. Многие исследователи говорят о «комфортной понятности» (comfortable intelligibility): речь легко понимают без усилий. Полное совпадение с акцентом носителя достигается редко и требует многолетней практики. Цель курса — чёткая, ритмичная, естественная речь с выбранным эталоном.\n\n## Раздел 1. Слоговая структура и ударение в слове\nСлово состоит из слогов. В каждом слове с двумя и более слогами один слог несёт главное ударение: он длиннее, громче, чуть выше по тону и с чёткой гласной. Остальные слоги ослаблены.\nУдарение нужно знать для каждого слова, потому что оно не обозначается на письме. Но есть закономерности.\nОсновные правила:\n- Двусложные существительные и прилагательные: чаще первый слог: TAble, HAPpy, DOCtor.\n- Двусложные глаголы: чаще второй слог: reLAX, beGIN, deCIDE.\n- Пары существительное/глагол: существительное с ударением на первом слоге, глагол на втором: REcord / reCORD, PREsent / preSENT, OBject / obJECT, INcrease / inCREASE, CONtrast / conTRAST, PROduce / proDUCE, PERmit / perMIT.\n- Суффиксы, перед которыми ударение: -tion / -sion (eduCAtion, deCIsion), -ic (ecoNOMic), -ical (poLITical), -ity (caPAcity), -graphy (phoTOGraphy), -logy (bioLOGy).\n- Слова на -ate с тремя и более слогами: ударение обычно на третьем слоге с конца: COMmunicate, CELebrate.\n- Слова на -ee, -eer, -ese, -ique: ударение на этом суффиксе: employEE, engiNEER, ChiNESE, techNIQUE.\n- Приставки (un-, re-, dis-, mis-, pre-) обычно безударные: unHAPpy, reTURN.\n- Сложные существительные: ударение на первом элементе: GREENhouse (теплица), BLACKbird (дрозд). Сравните с сочетанием прилагательного и существительного: green HOUSE (дом зелёного цвета), black BIRD (чёрная птица).\nИсключения существуют. Если сомневаетесь, проверяйте в словаре с аудио (Cambridge, Merriam-Webster).\nУдарение в одном слове может менять часть речи и смысл: REcord и reCORD.\nВажно: в слове должно быть одно главное ударение. Не ударяйте каждый слог, как в русском слитном произнесении.\n\n## Раздел 2. Ослабление гласных и шва\nШва /ə/ — самый частый звук английского. Он стоит в безударном слоге: about /əˈbaʊt/, banana /bəˈnænə/, family /ˈfæməli/ (часто /ˈfæmli/), comfortable /ˈkʌmftərbəl/ (чаще 3 слога), chocolate /ˈtʃɔːklət/, support /səˈpɔːrt/, teacher /ˈtiːtʃər/.\nОкончания, где обычно шва или ослабленный гласный: -er /ər/ (США), -or /ər/, -ar /ər/, -tion /ʃən/, -sion /ʒən/, -ous /əs/, -ate (в прилагательных и существительных) /ət/, -ment /mənt/, -ing /ɪŋ/, -ly /li/.\nПравило: если вы произносите безударный гласный чётко (как в русском «о» или «а»), вы теряете ритм и звучите по-русски.\nУпражнение: произносите слово, преувеличенно удлиняя ударный слог и «проглатывая» остальные: baNAna → b'NAN'. Затем возвращайте естественную длительность.\n\n## Раздел 3. Слабые и сильные формы служебных слов\nСлужебные слова в потоке речи слабые: a /ə/, the /ðə/, to /tə/, of /əv/, and /ən/, for /fər/, at /ət/, can /kən/, was /wəz/, were /wər/, have /əv/ (после местоимения) или /həv/, has /əz/, do /də/, does /dəz/, him /ɪm/, her /ər/, them /ðəm/ или /əm/, some /səm/, that (союз) /ðət/, there (в there is) /ðər/.\nСильные формы используются при ударении, в конце фразы, при контрасте и при цитировании: Yes, I can /kæn/. What are you looking at? /æt/. I said TO the shop, not FROM the shop.\nПример: I can go to the shop and buy some bread for her → /aɪ kən ˈɡoʊ tə ðə ˈʃɑːp ən ˈbaɪ səm ˈbrɛd fər ər/.\nНе заменяйте слабые формы сильными в середине фразы. Это делает речь слишком «книжной».\n\n## Раздел 4. Ударение во фразе и ритм\nВо фразе ударяются содержательные слова (существительные, глаголы, прилагательные, наречия, вопросительные слова, указательные), особенно несущие новую информацию. Служебные слова ослабляются.\nПример: The CATS are CHASing the MICE. Три ударения.\nРитм (stress-timing): время между ударными слогами примерно одинаково независимо от числа безударных между ними.\n- CATS chase MICE.\n- The CATS chase the MICE.\n- The CATS are CHASing the MICE.\nВсе три фразы произносятся за сходное время, так как в каждой по три ударения. Чем больше безударных слогов, тем быстрее и слабее они произносятся.\nКонтрастное ударение: ударение смещается, чтобы выделить нужное слово. I didn't say SHE stole my money (говорил кто-то другой). I didn't say she STOLE my money (возможно, одолжила). I didn't say she stole MY money (чьи-то другие деньги).\nЭто основной инструмент смысловой интонации в английском.\n\n## Раздел 5. Интонация: ядро и мелодия\nИнтонация — изменение высоты тона. Основная единица — смысловая группа (thought group). В каждой группе есть ядро (nucleus): последний ударный слог, на котором тон падает или растёт.\nОсновные мелодии:\n- Падение (↘): утверждения, вопросы с wh-словом, команды, законченность. Where do you LIVE? ↘\n- Подъём (↗): вопросы да/нет, переспрос, незавершённость. Do you like TEA? ↗\n- Падение-подъём: сомнение, оговорка, сдержанное согласие. I LIKE it, ↘↗ but...\n- Подъём-падение: сильное эмоциональное выделение: Oh, REALly? (удивление, восхищение).\n- Перечисление: подъём на каждом элементе, падение на последнем.\nРазделительные вопросы (tag questions): падение, если вы уверены и ждёте подтверждения (It's cold, isn't it? ↘), подъём, если действительно спрашиваете (You're coming, aren't you? ↗).\nДиапазон голоса: широкий диапазон звучит вежливо и заинтересованно, узкий и ровный воспринимается как скука или грубость. Английская речь обычно использует заметно более широкий диапазон, чем русская.\nЗамечание: восходящая интонация в утверждениях (uptalk) встречается в живой речи некоторых групп, но не рекомендуется как норма для начинающих.\n\n## Раздел 6. Различия американского и британского акцентов\nВыберите один эталон и придерживайтесь его, смешение звучит неестественно.\nАмериканский (General American):\n- Произносится r во всех позициях: car /kɑːr/.\n- Быстрое t между гласными: water /ˈwɔːɾər/, better /ˈbɛɾər/.\n- Гласный /æ/ в словах dance, bath: /dæns/, /bæθ/.\n- Слияние cot и caught в большинстве вариантов.\n- can't /kænt/.\nБританский (RP):\n- Не произносится r в конце слова или перед согласным, если нет гласного: car /kɑː/ (но в связке: car engine /kɑːr ˈɛndʒɪn/).\n- Гласный /ɑː/ в dance, bath: /dɑːns/, /bɑːθ/.\n- /ɒ/ в lot /lɒt/ (в США /lɑːt/).\n- Дифтонг /əʊ/ в go.\n- Во многих британских вариантах t заменяется гортанной смычкой: water /ˈwɔːʔə/.\n- Соединительное r: law and order /ˌlɔːr ən ˈɔːdə/.\nРегиональные акценты внутри каждой страны сильно различаются. Эталон — условный ориентир.\n\n## Раздел 7. Как слышать и тренировать просодию\n1) Слушайте, а не читайте: просодию нельзя понять только по тексту.\n2) Размечайте текст: ударные слова (заглавные), смысловые группы (/), мелодию (↗ ↘).\n3) Хлопайте или стучите по ударным слогам.\n4) Мычите мелодию (hum) без слов, чтобы услышать контур.\n5) Преувеличивайте на этапе тренировки: удлиняйте ударные, сильно сокращайте безударные, расширяйте диапазон. Потом возвращайтесь к естественному уровню.\n6) Записывайте себя и сравнивайте с диктором (протокол урока 4).\n7) Тренируйтесь в замедленном темпе, затем в естественном.\n\n## Раздел 8. Типичные ошибки русскоговорящих\n- Все слоги ударные, нет редукции: речь звучит «рублено».\n- Безударные гласные произносятся чётко: banana как «банана».\n- Сильные формы служебных слов в середине фразы.\n- Ударение в слове поставлено по русской привычке: ПОлиция вместо poLICE.\n- Ровная интонация без падений и подъёмов.\n- Ударение на каждом слове, нет выделения новой информации.\n- Паузы внутри смысловой группы.\n- Слишком быстрая речь вместо ясной.\n\n## Раздел 9. Реалистичная цель и измерение прогресса\nЧто можно измерить:\n1) Понятность: понимают ли вас без переспроса.\n2) Ритм: совпадают ли ударные слоги по времени с диктором.\n3) Ударение в словах: доля слов с верным ударением.\n4) Редукция: доля слабых форм там, где они нужны.\n5) Интонация: совпадение мелодии.\nПрогресс оценивайте по записям раз в 2 недели. Не ждите полного исчезновения акцента: цель — понятная, комфортная, естественная речь.\n\n## Раздел 10. Практика 1. Ударение в словах\nОтметьте ударный слог (заглавными): photograph, photographer, photographic, education, economy, economic, important, banana, computer, information, difficult, interesting.\n\n## Раздел 11. Практика 2. Пары существительное и глагол\nПроизнесите и отметьте ударение: I want to record a record. I object to this object. The present is a present. They increase the increase. Объясните, где существительное, где глагол.\n\n## Раздел 12. Практика 3. Ударение во фразе\nПодчеркните ударные (содержательные) слова: 1) She bought a new car yesterday. 2) My brother is working at the bank. 3) Can you tell me where the station is? 4) They didn't want to go to the party. 5) I'd like two coffees and a piece of cake.\n\n## Раздел 13. Практика 4. Слабые формы\nЗапишите приблизительную транскрипцию слабых форм: I can go to the shop and buy some bread for her.\n\n## Раздел 14. Практика 5. Контрастное ударение\nПроизнесите фразу I didn't say she stole my money семь раз, каждый раз ударяя другое слово. Объясните, как меняется смысл.\n\n## Раздел 15. Практика 6. Интонация\nОтметьте мелодию (↗, ↘ или падение-подъём): 1) Where do you work? 2) Do you like coffee? 3) I like tea, coffee, and juice. 4) It's cold, isn't it? (уверены) 5) You're coming, aren't you? (спрашиваете) 6) I like it, but it's expensive.\n\n## Раздел 16. Практика 7. Ритм по ударным\nПроговорите, хлопая на ударные, чтобы время между хлопками было равным: 1) CATS chase MICE. 2) The CATS chase the MICE. 3) The CATS are CHASing the MICE. 4) The CATS have been CHASing the MICE. Подсчитайте число ударных в каждой фразе.\n\n## Раздел 17. Практика 8. Отрывки и запись\nОтрывок A (размечен):\nMy /BROTHer/ works at a /SMALL OFfice/ near the /STAtion./ Every /MORNing,/ he /TAKES/ the /BUS,/ /READS/ the /NEWSpaper,/ and /DRINKS/ a /CUP/ of /COFfee./\nОтрывок B (размечен):\nIf you /WANT/ to /SOUND/ more /NATural,/ you /NEED/ to /LISTen/ to the /RHYTHM,/ not just the /WORDS./ The /STRESSED/ syllables are /LONG/ and /CLEAR,/ and the /OTHers/ are /SHORT/ and /WEAK./\nДля каждого отрывка: прослушайте образец (диктор-эталон), прочитайте вслух с преувеличением ударных, запишите, сравните, заполните журнал (ритм, ударение, редукция, мелодия, темп).\nГоворение и письмо: опишите на 80–100 слов, какой акцент вы выбираете как эталон, почему, что вам даётся лучше и что хуже.\n\n## Раздел 18. Ключи\nПрактика 1: PHOtograph, phoTOGrapher, photoGRAPHic, eduCAtion, eCOnomy, econOMic, imPORtant, baNAna, comPUter, inforMAtion, DIFficult, INteresting (также INtresting).\nПрактика 2: I want to reCORD (глагол) a REcord (сущ.). I obJECT (глагол) to this OBject (сущ.). The PREsent (сущ.) is a PREsent (сущ.) / to preSENT (глагол). They inCREASE (глагол) the INcrease (сущ.).\nПрактика 3: 1) bought, new, car, yesterday 2) brother, working, bank 3) tell, where, station 4) didn't want, go, party 5) like, two, coffees, piece, cake.\nПрактика 4: /aɪ kən ˈɡoʊ tə ðə ˈʃɑːp ən ˈbaɪ səm ˈbrɛd fər ər/.\nПрактика 5: I (кто-то другой), didn't (отрицание), say (возможно, написал), she (другой человек), stole (возможно, одолжила), my (чьи-то другие деньги), money (что-то другое).\nПрактика 6: 1) ↘ 2) ↗ 3) ↗ ↗ ↘ 4) ↘ 5) ↗ 6) like it ↘↗, but it's expensive ↘.\nПрактика 7: В каждой фразе три ударения (в четвёртой также три: CATS, CHASing, MICE).\n\n## Раздел 19. Самооценка\nПо 2 балла: □ я знаю правила ударения в слове □ я использую шва и ослабляю безударные гласные □ я использую слабые формы □ я ставлю ударение во фразе на содержательные слова □ я использую основные мелодии □ мой ритм стал ближе к эталону.\nРезультат: 10–12 баллов — переходите к уроку 8; 6–9 — повторите слабые разделы; меньше 6 — повторите неделю.\n\n## Раздел 20. Итоговый тест (15 баллов)\n1) Как ставится ударение в паре record? 2) Где ударение в education? 3) Какой звук самый частый в английском? 4) Слабая форма слова and. 5) Слабая форма слова to. 6) Какие слова ударяются во фразе? 7) Что такое stress-timing? 8) Интонация вопроса с wh-словом. 9) Интонация общего вопроса. 10) Чем green HOUSE отличается от GREENhouse? 11) Что такое ядро (nucleus)? 12) Различие американского и британского r в слове car. 13) Что такое контрастное ударение? 14) Что значит комфортная понятность? 15) Назовите три типичные ошибки русскоговорящих в ритме.\nОтветы: 1) REcord (сущ.), reCORD (глагол) 2) eduCAtion 3) шва /ə/ 4) /ən/ 5) /tə/ 6) содержательные: существительные, глаголы, прилагательные, наречия 7) интервалы между ударными слогами примерно равны 8) падение ↘ 9) подъём ↗ 10) green HOUSE — дом зелёного цвета; GREENhouse — теплица 11) последний ударный слог в смысловой группе, на котором меняется тон 12) в американском r произносится, в британском (RP) конечное r без последующего гласного не произносится 13) смещение ударения для выделения слова и изменения смысла 14) речь понятна слушателю без усилий 15) все слоги ударные, нет шва, сильные формы служебных слов.\nОценка: 13–15 — отлично; 10–12 — хорошо, повторите слабые разделы; меньше 10 — вернитесь к теории и практике.\n\n## План на 4 недели\nНеделя 1: ударение в слове (раздел 1), шва (раздел 2). Практика 1, 2. Ежедневно 10 минут разминки на ударение.\nНеделя 2: слабые формы (раздел 3), ударение во фразе и ритм (раздел 4). Практика 3, 4, 7. Шэдоуинг по 10 минут.\nНеделя 3: интонация (раздел 5), контрастное ударение, различия акцентов (раздел 6). Практика 5, 6. Размеченные отрывки.\nНеделя 4: измерение прогресса (раздел 9), отрывки A и B, итоговая запись, самооценка и тест. Сравнение с записью первой недели.\n\n## Что стоит сверить в книгах\nPeter Roach, «English Phonetics and Phonology» (ритм, ударение, интонация); Judy Gilbert, «Clear Speech»; Mark Hancock, «English Pronunciation in Use»; Cambridge Dictionary и Merriam-Webster (аудио, ударение, транскрипция). О понятности и приоритетах: работы Jennifer Jenkins по английскому как lingua franca.\nВажное замечание: ударение и интонация сильно зависят от региона и контекста, а правила имеют исключения. Для оценки произношения нужна обратная связь от человека, хорошо владеющего языком.\n", "w": [["reduction", "редукция, ослабление", "/rɪˈdʌkʃən/"], ["nucleus", "ядро (в интонации)", "/ˈnuːkliəs/"], ["compound", "сложное слово", "/ˈkɑːmpaʊnd/"], ["suffix", "суффикс", "/ˈsʌfɪks/"], ["prefix", "приставка", "/ˈpriːfɪks/"], ["rhotic", "ротический (с произносимым r)", "/ˈroʊtɪk/"], ["glottal", "гортанный", "/ˈɡlɑːtəl/"], ["dialect", "диалект", "/ˈdaɪəlɛkt/"], ["consonant", "согласный", "/ˈkɑːnsənənt/"], ["intelligibility", "понятность", "/ɪnˌtɛlɪdʒəˈbɪləti/"], ["native", "родной, носитель", "/ˈneɪtɪv/"], ["tempo", "темп", "/ˈtɛmpoʊ/"], ["beat", "ударный такт", "/biːt/"], ["stressed", "ударный", "/strɛst/"], ["unstressed", "безударный", "/ʌnˈstrɛst/"], ["emphasize", "выделять", "/ˈɛmfəsaɪz/"], ["pattern", "образец, модель", "/ˈpætərn/"], ["variation", "вариант, вариация", "/ˌvɛriˈeɪʃən/"], ["standard", "стандарт", "/ˈstændərd/"], ["syllable", "слог", "/ˈsɪləbəl/"]]}, {"t": "УРОК 8. ЧТЕНИЕ НОВОСТЕЙ: ВЫДЕЛИТЬ 20 СЛОВ И ПЕРЕСКАЗАТЬ (РАСШИРЕННЫЙ КУРС)\nОбъём: 4 недели, 5–6 дней в неделю по 45–60 минут (около 20–25 часов). Уровень: B1.\nЭталон: американский английский, британские отличия отмечены.\nКурс «Школа разведчика» является учебной реконструкцией по открытым описаниям.\n\n## Как устроен урок\nТеория (разделы 1–8), практика (разделы 9–17), контроль (разделы 18–20). Сначала прочитайте теорию целиком, затем работайте с практикой. Цель: читать короткие новости на английском, понимать структуру и язык новостей, пополнять словарь через чтение и пересказывать прочитанное своими словами.\nТексты в уроке учебные и вымышленные: события, имена и города придуманы для тренировки. Мы не обсуждаем политику и не оцениваем реальные события.\n\n## Раздел 0. Научная основа метода\n1. Чтение как источник слов. Значительная часть словаря усваивается через чтение (случайное, или инцидентное, усвоение). Для комфортного понимания текста важно знать подавляющее большинство слов в нём. Исследователи (в частности, Пол Нейшн и Бати Лаофер) называют ориентиры порядка 95–98 процентов знакомых слов, но точные цифры зависят от текста и читателя.\n2. Интенсивное и экстенсивное чтение. Интенсивное: короткий текст читается внимательно, с разбором слов и конструкций. Экстенсивное: много лёгкого материала для удовольствия и беглости. Курс использует интенсивное чтение новостей.\n3. Вывод важнее вставки. Пересказ (output) закрепляет слова лучше, чем пассивное чтение. Исследовательница Мерилл Суэйн показала, что говорение выявляет пробелы.\n4. Структура помогает понимать. Новости строятся по предсказуемой схеме. Зная её, вы быстрее находите главное.\n5. Отбор слов. Не все незнакомые слова нужно учить. Выбирайте частотные и полезные.\n6. Интервальные повторения: возвращайтесь к словам и текстам через 1, 3, 7, 14 дней.\n\n## Раздел 1. Структура новости\nКлассическая модель — «перевёрнутая пирамида»: самое важное в начале, детали дальше.\n1) Заголовок (headline): кратко и ярко.\n2) Лид (lead): первое предложение или абзац, отвечающий на вопросы Who? What? When? Where? Why? How? (5W1H).\n3) Основная часть: факты по убыванию важности.\n4) Цитаты и ссылки на источники.\n5) Фон и контекст.\n6) Заключение: что будет дальше.\nЧитая новость, сначала ищите в лиде ответы на 5W1H. Это даёт тему и главное.\n\n## Раздел 2. Язык заголовков (headlinese)\nЗаголовки используют особый стиль:\n- Настоящее время для недавнего прошлого: Mayor Opens New Park (Мэр открыл новый парк).\n- Инфинитив для будущего: City to build new bridge (Город построит новый мост).\n- Пропуск артиклей и вспомогательных глаголов: Storm hits coast (Шторм обрушился на побережье).\n- Короткие слова: cut (сократить), probe (расследование), bid (попытка), boost (рост), hit (удар), rise (рост).\n- Заглавные буквы в каждом слове (в американском стиле) или только в первом слове (чаще в британском).\n- Игра слов и намёки.\nЧтобы понять заголовок, восстановите полное предложение: Scientists find new species → Scientists have found a new species.\n\n## Раздел 3. Язык новостей: основные средства\nГлаголы сообщения: say, announce, confirm, deny, claim, warn, report, suggest, reveal, state, add, explain.\nРазница оттенков: say (нейтрально), announce (официально объявить), confirm (подтвердить), deny (отрицать), claim (утверждать, часто без доказательств), warn (предупредить).\nСсылка на источник: according to the report, the report says, officials said, sources said.\nОсторожные формулировки (hedging): reportedly, allegedly, is said to, is expected to, may, might, could, appears to.\nPresent Perfect для свежих новостей: The government has announced new rules. Past Simple для деталей: The announcement came on Monday.\nСтрадательный залог: The bridge was closed on Friday. A man has been arrested. The case is being investigated.\nКосвенная речь:\n- He said: «We will open the road next month.» → He said (that) they would open the road the following month.\nСдвиг времён: will → would, is → was, present simple → past simple, present perfect → past perfect. Обстоятельства: today → that day, tomorrow → the next day / the following day, next month → the following month, now → then.\nЧисла и тенденции: rise / increase / grow (расти), fall / drop / decrease (падать), double (удвоиться), halve (сократиться вдвое). rise by 5% (выросло на 5 процентов), rise to 5% (достигло 5 процентов). About, around, nearly, more than, up to.\nВремя: on Monday, last week, earlier this month, in recent years, since 2020.\nПредсказания: is expected to, is likely to, plans to, will probably.\n\n## Раздел 4. Стратегии чтения в слоях\nСлой 1. Предсказание: прочитайте заголовок и подумайте, о чём текст и какие слова там будут.\nСлой 2. Беглое чтение (skimming): за 1–2 минуты прочитайте лид и первое предложение каждого абзаца. Цель: тема и главное.\nСлой 3. Поиск деталей (scanning): ищите числа, имена, даты по вопросам.\nСлой 4. Внимательное чтение: читайте по абзацам, отмечайте незнакомые слова карандашом или цветом.\nСлой 5. Догадка по контексту (раздел 5).\nСлой 6. Отбор 20 слов (раздел 6).\nСлой 7. Пересказ (раздел 7).\nСлой 8. Вывод: ваше мнение или вопрос по тексту.\nНе пользуйтесь словарём в слоях 1–4, если слово не мешает пониманию общего смысла.\n\n## Раздел 5. Как догадываться о значении слова\nПодсказки внутри слова:\n- Приставки: un- (не), re- (снова), dis- (против), pre- (до), mis- (ошибочно).\n- Суффиксы: -er/-or (деятель), -tion (процесс, результат), -able (возможный), -less (без), -ful (полный).\n- Корни: если слово похоже на русское или международное (economy, policy, technology).\nПодсказки контекста:\n- Определение: A decade, which is a period of ten years...\n- Пример: Many reptiles, such as snakes and lizards...\n- Контраст: Unlike his cautious brother, he was reckless.\n- Причина и следствие: The road was closed because of flooding.\nЛожные друзья переводчика (слова, похожие на русские, но с другим значением): actual (фактический, а не «актуальный»), magazine (журнал, а не «магазин»), fabric (ткань, а не «фабрика»), intelligent (умный), decade (десятилетие), sympathetic (сочувствующий). Проверяйте контекст.\nЕсли слово не поддаётся догадке и мешает пониманию, проверьте в словаре с примером предложения и аудио.\n\n## Раздел 6. Как выбрать 20 слов\nКритерии отбора:\n1) частотное и полезное (встретится снова);\n2) связано с темой (общая лексика новостей: report, announce, increase, decision);\n3) встретилось более одного раза;\n4) вы можете использовать его сами;\n5) не имена собственные и не узкие термины (если не нужны).\nФормат записи слова:\n- слово и часть речи;\n- предложение из текста (контекст);\n- 2–3 устойчивых сочетания (collocations);\n- перевод (по необходимости);\n- произношение (транскрипция и аудио).\nМетод: выберите 20, из них 10 ключевых вы будете использовать в пересказе. Добавьте слова в «Мои слова» и повторяйте по карточкам.\n\n## Раздел 7. Как пересказывать\nРамка 5W1H: кто, что, когда, где, почему, как.\nШаги:\n1) Закройте текст и запишите ключевые слова (6–10).\n2) Составьте 4–6 предложений своими словами.\n3) Используйте синонимы и перестройте предложения, не копируйте.\n4) Используйте глаголы сообщения: said, announced, reported.\n5) Соблюдайте время: события в Past Simple или Present Perfect.\n6) Добавьте связки: first, then, however, as a result.\n7) Проверьте объём: 5–6 предложений, 30–60 секунд.\nОбразец пересказа новости (о лягушке, из практики): Scientists have discovered a new species of tiny frog in a rainforest. The frog is two centimetres long and lives near rivers. The team found about 40 frogs and believes the species is rare, so they plan to return next year to study it.\nЗатем добавьте вывод: I think the discovery is important because...\n\n## Раздел 8. Чтение вслух и произношение\nНовости читают с чёткой артикуляцией и средним темпом, 130–160 слов в минуту.\nЧисла: 2.5 million → two point five million; 15% → fifteen percent (US) / per cent (UK); 3/4 → three quarters; 1,200 → one thousand two hundred (and); 2026 → twenty twenty-six.\nСокращения: UN /ˌjuː ˈɛn/, NASA /ˈnæsə/, CEO /ˌsiː iː ˈoʊ/.\nСлова: government /ˈɡʌvərnmənt/, announce /əˈnaʊns/, decision /dɪˈsɪʒən/, expected /ɪkˈspɛktɪd/, increase (сущ.) /ˈɪnkriːs/, increase (глагол) /ɪnˈkriːs/, percent /pərˈsɛnt/, million /ˈmɪljən/, species /ˈspiːʃiːz/.\nИнтонация: падение в конце утверждения, подъём в перечислении. Делите текст на смысловые группы и избегайте пауз внутри группы. Используйте приёмы шэдоуинга (урок 4): прослушайте новостной ролик для изучающих язык и повторите.\n\n## Раздел 9. Практика 1. Заголовки\nВосстановите полные предложения: 1) City to build new bridge. 2) Scientists find new species. 3) Storm hits coast. 4) Team wins cup. 5) Prices rise by 5%.\n\n## Раздел 10. Практика 2. 5W1H\nПрочитайте текст A и ответьте.\nТекст A (A2, вымышленная новость): New Library Opens in Green Valley\nA new library opened on Monday in the town of Green Valley. The building has three floors and more than 20,000 books. The mayor, Anna Brown, said the library will be open every day from 9 a.m. to 8 p.m. «Everyone is welcome,» she said. The library also has a free internet room and a children's corner. More than 300 people visited on the first day. The town plans to organize reading events every weekend.\nВопросы: 1) What opened? 2) When? 3) Where? 4) How many floors has the building? 5) Who is the mayor? 6) What are the opening hours? 7) How many people visited on the first day? 8) What does the town plan?\n\n## Раздел 11. Практика 3. Косвенная речь\nПерескажите: 1) The minister said: «We will open the road next month.» 2) She said: «I am working on a new project.» 3) The manager said: «We have finished the report.» 4) He said: «I don't know the answer.»\n\n## Раздел 12. Практика 4. Числа и тенденции\nПрочитайте вслух и запишите словами: 2.5 million, 15%, 3/4, 1,200, 2026. Объясните разницу: Sales rose by 10% и Sales rose to 10%.\n\n## Раздел 13. Практика 5. Отбор слов\nПрочитайте текст B и выберите 20 слов по критериям раздела 6.\nТекст B (B1, вымышленная новость): Scientists Discover New Frog Species\nA team of scientists has discovered a new species of frog in a rainforest, according to a report published on Tuesday. The frog, which is only two centimetres long, lives near rivers and is active at night. «It is a very small animal, but an important discovery,» said Dr Mark Evans, the leader of the team. The researchers found about 40 frogs during a three-week expedition. They believe the species is rare and may be in danger because forests in the region are shrinking. The team plans to return next year to study the frog's behavior and protect its habitat.\nЗапишите слова в формате из раздела 6.\n\n## Раздел 14. Практика 6. Пересказ\nПерескажите текст B за 30–60 секунд, пользуясь рамкой 5W1H, затем запишите. Сравните с образцом из раздела 7.\n\n## Раздел 15. Практика 7. Догадка по контексту\nУгадайте значение выделенных слов: 1) A decade is a period of ten years. 2) Many reptiles, such as snakes and lizards, live in warm places. 3) Unlike his cautious brother, he was reckless. 4) The road was closed because of flooding.\n\n## Раздел 16. Практика 8. Чтение вслух, пересказ и письмо\nТекст C (B1+, вымышленная новость): City Introduces Free Public Transport on Weekends\nThe city council announced on Friday that public transport will be free on weekends from March. The decision, which follows a six-month trial, is expected to reduce traffic by up to 10 per cent, according to a report. Critics say the plan could cost the city around two million dollars a year, while supporters argue it will help people save money and reduce pollution. The council said it will review the results after one year. «We want to make the city easier to live in,» said councillor Laura Smith.\nЗадания: 1) Прочитайте вслух, делите на смысловые группы. 2) Определите 5W1H. 3) Выберите 20 слов. 4) Составьте пересказ на 5–6 предложений. 5) Запишите себя. 6) Напишите письменный пересказ на 80–100 слов и добавьте один вывод: your opinion.\nДиктовка: The mayor said the library will be open every day. According to the report, prices rose by five percent. A team of scientists has discovered a new species. The council will review the results after one year.\n\n## Раздел 17. Ключи\nПрактика 1: 1) The city is going to build a new bridge. 2) Scientists have found a new species. 3) A storm has hit the coast. 4) The team has won the cup. 5) Prices have risen by 5 percent.\nПрактика 2: 1) A new library. 2) On Monday. 3) In the town of Green Valley. 4) Three. 5) Anna Brown. 6) From 9 a.m. to 8 p.m. every day. 7) More than 300. 8) To organize reading events every weekend.\nПрактика 3: 1) The minister said they would open the road the following month. 2) She said she was working on a new project. 3) The manager said they had finished the report. 4) He said he didn't know the answer.\nПрактика 4: two point five million; fifteen percent; three quarters; one thousand two hundred (and); twenty twenty-six. rose by 10% — выросло на 10 процентов; rose to 10% — выросло и достигло 10 процентов.\nПрактика 5 (образец отбора): species, discover, rainforest, report, publish, leader, expedition, rare, danger, shrink, habitat, protect, behavior, believe, researcher, region, active, according to, team, plan.\nПрактика 7: 1) десятилетие 2) пресмыкающиеся 3) безрассудный (в контрасте с осторожным) 4) наводнение.\n\n## Раздел 18. Самооценка\nПо 2 балла: □ я нахожу ответы на 5W1H в лиде □ я понимаю заголовки □ я использую стратегии чтения в слоях □ я отбираю слова по критериям □ я пересказываю своими словами □ я читаю вслух с правильными паузами и числами.\nРезультат: 10–12 баллов — переходите к уроку 9; 6–9 — повторите слабые разделы; меньше 6 — повторите неделю.\n\n## Раздел 19. Итоговый тест (15 баллов)\n1) Что значит 5W1H? 2) Что такое перевёрнутая пирамида? 3) Заголовок Storm hits coast: время глагола. 4) Что значит City to build bridge? 5) Чем claim отличается от say? 6) Что значит according to? 7) Перескажите косвенной речью: He said: «I will come tomorrow.» 8) Как читается 2.5 million? 9) Чем rose by 5% отличается от rose to 5%? 10) Что такое hedging? 11) Ложный друг: magazine. 12) Критерий отбора слов (назовите два). 13) Что включает запись слова (три элемента)? 14) Какое слой чтения идёт первым? 15) Сколько предложений в пересказе?\nОтветы: 1) Who, What, When, Where, Why, How 2) самое важное в начале, детали дальше 3) Present Simple, значит недавнее прошлое 4) город построит мост (будущее) 5) claim — утверждает, часто без доказательств, say — нейтрально 6) согласно, по данным 7) He said he would come the next day. 8) two point five million 9) на 5 процентов, и достигло 5 процентов 10) осторожные формулировки (reportedly, is said to, may) 11) журнал, а не «магазин» 12) частотное, связано с темой, встретилось несколько раз, можете использовать 13) слово, контекст, сочетания, произношение 14) предсказание по заголовку 15) 4–6.\nОценка: 13–15 — отлично; 10–12 — хорошо, повторите слабые разделы; меньше 10 — вернитесь к теории и практике.\n\n## Раздел 20. План на 4 недели\nНеделя 1: структура новости (раздел 1), заголовки (раздел 2), стратегии чтения (раздел 4). Практика 1, 2. Текст A.\nНеделя 2: язык новостей (раздел 3), догадка по контексту (раздел 5), отбор слов (раздел 6). Практика 3, 4, 5, 7. Текст B.\nНеделя 3: пересказ (раздел 7), чтение вслух (раздел 8). Практика 6. Текст C. Диктовка.\nНеделя 4: свой материал (новость для изучающих язык), полный протокол: слои, 20 слов, пересказ, запись. Самооценка и тест.\n\n## Что стоит сверить в книгах\nI. S. P. Nation, «Learning Vocabulary in Another Language»; Cambridge Dictionary и Oxford Learner's Dictionaries (определения, примеры, аудио); Raymond Murphy, «English Grammar in Use» (косвенная речь, страдательный залог). Для чтения новостей на нужном уровне: ресурсы для изучающих язык вроде VOA Learning English и BBC Learning English (доступность и условия могут меняться).\nВажное замечание: упражнения и ключи составлены для самопроверки. Тексты в уроке вымышленные и учебные, реальные новости требуют критического отношения к источникам. Для оценки произношения и пересказа нужна обратная связь от человека, хорошо владеющего языком.\n", "w": [["article", "статья", "/ˈɑːrtɪkəl/"], ["journalist", "журналист", "/ˈdʒɜːrnəlɪst/"], ["source", "источник", "/sɔːrs/"], ["report", "сообщение, отчёт", "/rɪˈpɔːrt/"], ["announce", "объявлять", "/əˈnaʊns/"], ["confirm", "подтверждать", "/kənˈfɜːrm/"], ["deny", "отрицать", "/dɪˈnaɪ/"], ["claim", "утверждать", "/kleɪm/"], ["reveal", "раскрывать", "/rɪˈviːl/"], ["expected", "ожидаемый", "/ɪkˈspɛktɪd/"], ["increase", "рост, расти", "/ɪnˈkriːs/"], ["decrease", "снижение, снижаться", "/dɪˈkriːs/"], ["double", "удвоиться", "/ˈdʌbəl/"], ["percent", "процент", "/pərˈsɛnt/"], ["million", "миллион", "/ˈmɪljən/"], ["critic", "критик", "/ˈkrɪtɪk/"], ["supporter", "сторонник", "/səˈpɔːrtər/"], ["review", "пересматривать, обзор", "/rɪˈvjuː/"], ["summary", "краткое изложение", "/ˈsʌməri/"], ["retell", "пересказывать", "/riːˈtɛl/"]]}, {"t": "ИМПРОВИЗАЦИЯ ПО ЛЕГЕНДЕ\n\nЦель: говорить 5 минут подряд без долгих пауз, опираясь на легенду.\n\nКак делать:\n1) Поставьте таймер на 5 мину естественно, а не как учебник.\n\nКак учить: по 3 идиомы в день, каждую в своём предложении про вашу жизнь.\n\nПримеры:\n- Break the ice: заговорить и растопить лёд. 'Let's break the ice with a joke.'\n- Piece of cake: проще простого. 'The test was a piece of cake.'\n- Hit the road: отправиться в путь. 'It's late, let's hit the road.'\n- Under the weather: нездоровится. 'I'm a bit under the weather today.'\n- Call it a day: закончить на сегодня.\n\nВажно: сленг зависит от диалекта. 'Cheers' в Британии значит и 'спасибо', и 'пока', 'mate' это 'приятель', 'dude' типично американское.\nПроверка: употребите 5 идиом в 5-минутном разговоре естественно, не вставляя их силой.", "w": [["break the ice", "растопить лёд", "/breɪk ði aɪs/"], ["piece of cake", "проще простого", "/piːs əv keɪk/"], ["hit the road", "отправиться в путь", "/hɪt ðə roʊd/"], ["under the weather", "нездоровится", "/ˈʌndər ðə ˈwɛðər/"], ["call it a day", "закончить на сегодня", "/kɔːl ɪt ə deɪ/"], ["no big deal", "ничего страшного", "/noʊ bɪɡ diːl/"], ["catch you later", "до скорого", "/kætʃ juː ˈleɪtər/"], ["my bad", "моя вина (сленг)", "/maɪ bæd/"]]}, {"t": "ФИНАЛЬНЫЙ ЭКЗАМЕН\n\nЦель: проверить всё освоенное: произношение, лексику, скорость и спокойствие.\n\nФормат (30 минут):\n1) 2 минуты: легенда без бумажки.\n2) 3 минуты: бытовой диалог по роли (магазин, отель).\n3) 5 минут: допрос с неожиданными вопросами.\n4) 3 минуты: пересказ новости.\n5) Запись всего экзамена на диктофон.\n\nКритерии самооценки (по 5 баллов):\n- понятность речи;\n- темп и ритм;\n- отсутствие долгих пауз;\n- богатство лексики и идиом;\n- уверенность.\n\nПосле экзамена прослушайте запись, выпишите 5 слабых мест и вернитесь к соответствующим урокам.\nПроверка: 20 баллов и выше означает, что курс пройден; ниже — повторите слабые разделы.", "w": [["confident", "уверенный", "/ˈkɑːnfɪdənt/"], ["fluency", "беглость", "/ˈfluːənsi/"], ["accent", "акцент", "/ˈæksɛnt/"], ["improve", "улучшать", "/ɪmˈpruːv/"], ["score", "балл", "/skɔːr/"], ["challenge", "вызов", "/ˈtʃælɪndʒ/"], ["progress", "прогресс", "/ˈprɑːɡrɛs/"], ["level", "уровень", "/ˈlɛvəl/"]]}], "comm": [{"t": "УРОК 1. ПРИВЕТСТВИЯ И ЗНАКОМСТВО (РАСШИРЕННЫЙ КУРС)\nОбъём: 4 недели, 5–6 дней в неделю по 45–60 минут (около 20–25 часов). Уровень: A1 (с нуля).\nУчебный язык: объяснения по-русски, примеры по-английски.\n\n## Как устроен урок\nТеория (разделы 1–8), практика (разделы 9–16), контроль (разделы 17–19). Сначала прочитайте теорию целиком без заучивания, затем работайте с практикой и возвращайтесь к теории по мере необходимости. Для знакомства важнее всего автоматизм: фразы должны вылетать без раздумий.\n\n## Раздел 0. Научная основа метода\n1. Входной материал (input): язык усваивается, когда вы много слышите и читаете понятного. Поэтому в уроке есть диалоги, тексты и диктовка.\n2. Выходная речь (output): когда вы говорите и пишете, вы замечаете пробелы (идея лингвиста Мерилл Суэйн). Поэтому говорение и письмо обязательны.\n3. Активное вспоминание: вспоминать эффективнее, чем перечитывать. Закрывайте перевод и воспроизводите фразы.\n4. Интервальные повторения: возвращайтесь к материалу через 1, 3, 7, 14 дней. Для этого есть вкладка «Карточки».\n5. Обратная связь: ошибки нужно разбирать. Поэтому есть таблица ошибок и ключи.\n\n## Раздел 1. Приветствия, прощания, представление\nПриветствия по времени суток: Good morning (с утра до полудня), Good afternoon (после полудня до вечера), Good evening (вечером, при встрече). Good night используется только при прощании перед сном.\nРегистры:\n- Формальный: Good morning. How do you do? (очень официально; ответ повторяет вопрос) Pleased to meet you.\n- Нейтральный: Hello. Hi. How are you? Nice to meet you.\n- Неформальный: Hey. What's up? How's it going? You alright? (британский вариант).\nОтветы на How are you?: Fine, thanks. And you? / Good, thanks. / Not bad. / Pretty good. / Can't complain.\nВ США How are you? — приветствие, а не просьба рассказать о здоровье. Подробный ответ о проблемах здесь неуместен.\nПрощания: Goodbye (нейтрально), Bye, See you later, See you tomorrow, Take care, Have a nice day.\nОбращения: Mr /ˈmɪstər/ (мужчина), Mrs /ˈmɪsɪz/ (замужняя женщина), Ms /mɪz/ (универсальное, не указывает семейное положение), Dr (врач или учёная степень). Они используются с фамилией: Mr Brown.\nПредставление себя: Hi, I'm Lera. / My name is Lera. / Let me introduce myself. I'm Lera.\nПредставление другого: This is my friend, Dana. / Dana, this is Lera. Ответ: Nice to meet you. — Nice to meet you too.\n\n## Раздел 2. Глагол to be: полная теория\nВ русском настоящем времени глагол-связка опускается («Я студент»), в английском глагол обязателен.\nФормы: I am, you are, he is, she is, it is, we are, you are, they are.\nКраткие формы в речи: I'm /aɪm/, you're /jʊr/, he's /hiːz/, she's /ʃiːz/, it's /ɪts/, we're /wɪr/, they're /ðɛr/.\nОтрицание: I'm not; you aren't (are not); he/she/it isn't (is not); we/they aren't.\nВопрос: Am I...? Are you...? Is he/she/it...? Are we...? Are they...? Вспомогательный порядок: глагол выходит перед подлежащим. Are you from Almaty?\nКраткие ответы: Yes, I am. / No, I'm not. Yes, he is. / No, he isn't. Нельзя Yes, I'm. (краткая форма в утвердительном ответе недопустима).\nУпотребление be: имя, возраст, профессия, национальность, происхождение, состояние. I'm Lera. I'm 25. She is a teacher. We're from Kazakhstan. I'm tired.\nОсобенность: возраст передаётся через be. I'm 25 (years old). Нельзя I have 25 years.\nМестоимения: I, you, he, she, it, we, they. You — и «ты», и «вы». It — для вещей, животных и общего подлежащего (It's cold. It's 5 o'clock).\n\n## Раздел 3. Притяжательные местоимения, вопросительные слова, this/that\nmy (мой), your (твой, ваш), his (его), her (её), its (его, её; о вещи), our (наш), their (их).\nПравило: форма зависит от владельца. His name is Aidar. Her name is Lera.\nВопросительные слова: What? (что, какой), Where? (где, куда), Who? (кто), How? (как), How old? (сколько лет), How many? (сколько, исчисляемое), How much? (сколько стоит).\nПорядок: вопросительное слово + глагол + подлежащее: Where are you from? What is your name?\nthis / that / these / those: this is, that is, these are, those are. This is my friend (рядом, представление). That is my car (далеко).\nВ знакомстве чаще всего: This is my friend, Dana.\n\n## Раздел 4. Числа, возраст, телефон, алфавит\nЧисла 0–20: zero /ˈzɪroʊ/ (в телефонах часто oh), one, two, three, four, five, six, seven, eight, nine, ten, eleven, twelve, thirteen, fourteen, fifteen, sixteen, seventeen, eighteen, nineteen, twenty.\nДесятки: thirty, forty, fifty, sixty, seventy, eighty, ninety, a hundred.\nСоставные: twenty-one, thirty-four, sixty-seven. Через дефис.\nУдарение: в числах 13–19 ударение на последнем слоге (thirteen /ˌθɜːrˈtiːn/), в десятках на первом (thirty /ˈθɜːrti/). Это различение критично: 15 и 50 звучат похоже, если не слышать ударения. Фраза: fifteen /ˌfɪfˈtiːn/ и fifty /ˈfɪfti/.\nТелефонные номера читаются цифрами: 555-0198 → five five five, oh one nine eight. Двойные цифры: double five (британский вариант).\nВозраст: How old are you? — I'm twenty-five. Для вежливости: I'm in my twenties (мне двадцать с чем-то).\nАлфавит: A /eɪ/, B /biː/, C /siː/, D /diː/, E /iː/, F /ɛf/, G /dʒiː/, H /eɪtʃ/, I /aɪ/, J /dʒeɪ/, K /keɪ/, L /ɛl/, M /ɛm/, N /ɛn/, O /oʊ/, P /piː/, Q /kjuː/, R /ɑːr/, S /ɛs/, T /tiː/, U /juː/, V /viː/, W /ˈdʌbəl juː/, X /ɛks/, Y /waɪ/, Z /ziː/ (США) или /zɛd/ (Британия).\nЗапоминайте группами по гласному звуку: /eɪ/ A H J K; /iː/ B C D E G P T V Z; /ɛ/ F L M N S X; /aɪ/ I Y; /oʊ/ O; /juː/ Q U W; /ɑːr/ R.\nСпеллинг: How do you spell your name? — L-E-R-A. Для чётности: A as in Apple, B as in Boy (кодовые слова).\n\n## Раздел 5. Страны и национальности\nМодель: Where are you from? — I'm from Kazakhstan. Национальность: I'm Kazakhstani.\nСлово Kazakhstani указывает на гражданство, Kazakh на этническую принадлежность и язык. Это тонкое различие, при сомнении спросите, как человек сам себя называет.\nСуффиксы: -an (American /əˈmɛrɪkən/, Italian /ɪˈtæljən/, German /ˈdʒɜːrmən/, Russian /ˈrʌʃən/); -ish (British /ˈbrɪtɪʃ/, Turkish /ˈtɜːrkɪʃ/, Spanish /ˈspænɪʃ/); -ese (Chinese /tʃaɪˈniːz/, Japanese /ˌdʒæpəˈniːz/); -i (Kazakhstani, Pakistani); особые: French /frɛntʃ/, Dutch.\nНациональности и языки пишутся с заглавной буквы. Язык часто совпадает с прилагательным: She speaks Italian.\n\n## Раздел 6. Профессии и занятия\nВопросы: What do you do? / What's your job? / What do you do for a living?\nОтвет: I'm a teacher. / I'm an engineer. / I work as a trainer. / I'm a student.\nПрофессии: teacher /ˈtiːtʃər/, student /ˈstuːdənt/, doctor, nurse, engineer /ˌɛndʒɪˈnɪr/, manager, driver, coach /koʊtʃ/, trainer, bartender /ˈbɑːrtɛndər/, developer /dɪˈvɛləpər/, accountant /əˈkaʊntənt/, lawyer /ˈlɔːjər/.\nПредлоги: work at (место: at a bar, at a hospital), work for (организация: for a company), work in (сфера, помещение: in an office, in marketing). Различайте: I work at a gym. I work for a big company.\nАртикль с профессией обязателен: She is a doctor. He is an engineer. Без артикля нельзя (в русском его нет, отсюда ошибка).\n\n## Раздел 7. Small talk и культура общения\nSmall talk — лёгкая беседа для установления контакта. Темы: откуда вы, чем занимаетесь, погода, дорога, выходные, хобби. Избегайте в первом знакомстве: деньги, возраст (у взрослых), политика, религия.\nПриём «Ответ + деталь + встречный вопрос» (ответ, добавление, возвращение вопроса):\n— Where are you from? — I'm from Almaty. It's a beautiful city. Where are you from?\n— What do you do? — I'm a trainer. I work at a gym. And you?\nЭто превращает диалог из допроса в разговор.\nПолезные фразы для поддержки беседы: Really? That's interesting. Me too. Oh, nice! Sounds great. I see.\nЕсли не поняли: Sorry? / Pardon? / Could you repeat that, please? / Could you speak more slowly?\nКультура: рукопожатие короткое и уверенное, зрительный контакт; в США и Великобритании чаще используют имя; Mr и Ms применяют в формальной обстановке; вопрос о возрасте и доходах в знакомстве может быть неуместным.\n\n## Раздел 8. Произношение и интонация\nСлабые формы (в быстрой речи): Nice to meet you → /naɪs tə ˈmiːt ju/. Where are you from? → /wɛr ər ju frʌm/ (from слабое: /frəm/). What do you do? → /wʌt də ju duː/. How are you? → /haʊ ər ju/ или в быстрой речи /haʊr ju/. What's your name? → /wʌts jɔːr neɪm/.\nИнтонация: вопросы с вопросительным словом обычно падают к концу: What's your NAME? ↘ Общие вопросы (да/нет) обычно растут: Are you from ALmaty? ↗ Приветствие How are you? падает: How are YOU? ↘\nПеречисление: интонация растёт на каждом элементе, кроме последнего, где падает: I'm from Almaty ↗, I'm a trainer ↗ and I'm twenty-five ↘.\nРитм: хлопайте на ударных слогах и проговаривайте: NICE to MEET you.\nФонетический фокус урока (повторять ежедневно 3 минуты): /w/ в where, what, we; /ð/ в they, the; /θ/ в thanks; шва в слабых формах.\n\n## Раздел 9. Практика 1. Глагол to be\nВставьте am, is или are: 1) I ___ from Kazakhstan. 2) She ___ a teacher. 3) We ___ friends. 4) They ___ not at home. 5) ___ you a student? 6) He ___ not my brother. 7) It ___ a nice day. 8) My parents ___ doctors. 9) ___ she from Italy? 10) I ___ not tired.\n\n## Раздел 10. Практика 2. Исправьте ошибки\n1) I from Almaty. 2) I have 25 years. 3) I am agree. 4) She are my friend. 5) Yes, I'm. 6) He no is a student. 7) Where you are from? 8) My name are Lera.\n\n## Раздел 11. Практика 3. Вопросы к ответам\nСоставьте вопрос: 1) ___? I'm from Almaty. 2) ___? My name is Lera. 3) ___? I'm twenty-five. 4) ___? I'm a student. 5) ___? L-E-R-A. 6) ___? He is my brother.\n\n## Раздел 12. Практика 4. Числа\nЗапишите словами: 13, 30, 15, 50, 19, 90, 24, 67. Прочитайте номер 555-0198. Объясните разницу в ударении: fourteen и forty.\n\n## Раздел 13. Практика 5. Национальности\nОбразуйте национальность: Italy, Russia, Turkey, Japan, Germany, Spain, the USA, Kazakhstan, France, Britain, China.\n\n## Раздел 14. Практика 6. Диалоги\nДополните диалог своими ответами и разыграйте с партнёром:\nA: Hello! I'm ___. What's your name? B: ___.\nA: Nice to meet you. Where are you from? B: ___. And you?\nA: ___. What do you do? B: ___. And you?\nA: ___. How old are you? B: ___.\nЗатем придумайте диалог с формальным представлением (Good morning, Mr / Ms ___).\n\n## Раздел 15. Практика 7. Перевод\n1) Меня зовут Лера. 2) Мне двадцать пять лет. 3) Я из Алматы. 4) Он не студент. 5) Вы из Италии? 6) Это мой друг Айдар. 7) Приятно познакомиться. 8) Чем вы занимаетесь? 9) Повторите, пожалуйста. 10) Как пишется ваше имя?\n\n## Раздел 16. Практика 8. Чтение, диктовка, говорение, письмо\nЧтение. Прочитайте текст и ответьте на вопросы.\nHello! I'm Samal. I'm twenty-eight and I'm from Shymkent. I'm a nurse. My friend Arman is from Almaty. He's a driver. We aren't colleagues, we're neighbours. Our English teacher is Mr Brown. He's British, from Manchester.\nВопросы: 1) How old is Samal? 2) Where is she from? 3) What does Samal do? 4) Is Arman from Shymkent? 5) What is his job? 6) Are they colleagues? 7) Who is Mr Brown? 8) Where is he from?\nДиктовка (5 предложений): My name is Dana. I'm from Almaty. Are you a student? She isn't my sister. Nice to meet you too.\nГоворение (запись по 3–5 минут):\n1) Представьтесь формально и неформально.\n2) Представьте друга третьему человеку.\n3) Small talk 3 минуты с партнёром по приёму «ответ + деталь + вопрос».\n4) Назовите по буквам своё имя, фамилию, город и номер телефона.\n5) Разыграйте знакомство на работе.\nПисьмо. Напишите текст My introduction на 80–100 слов. Чек-лист: имя, возраст, город, профессия, 2 факта о себе, правильные be и артикли с профессией, нет типичных ошибок из раздела 18. Покажите текст партнёру и разберите ошибки.\n\n## Раздел 17. Ключи\nПрактика 1: am, is, are, are, Are, is, is, are, Is, am.\nПрактика 2: 1) I'm from Almaty. 2) I'm 25. 3) I agree. 4) She is my friend. 5) Yes, I am. 6) He isn't a student. 7) Where are you from? 8) My name is Lera.\nПрактика 3: 1) Where are you from? 2) What's your name? 3) How old are you? 4) What do you do? 5) How do you spell your name? 6) Who is he?\nПрактика 4: thirteen, thirty, fifteen, fifty, nineteen, ninety, twenty-four, sixty-seven; five five five, oh one nine eight. Fourteen /ˌfɔːrˈtiːn/ — ударение на втором слоге, forty /ˈfɔːrti/ — на первом.\nПрактика 5: Italian, Russian, Turkish, Japanese, German, Spanish, American, Kazakhstani, French, British, Chinese.\nПрактика 7: 1) My name is Lera. / I'm Lera. 2) I'm twenty-five (years old). 3) I'm from Almaty. 4) He isn't a student. 5) Are you from Italy? 6) This is my friend, Aidar. 7) Nice to meet you. 8) What do you do? 9) Could you repeat that, please? 10) How do you spell your name?\nПрактика 8 (чтение): 1) She is twenty-eight. 2) She is from Shymkent. 3) She is a nurse. 4) No, he is from Almaty. 5) He is a driver. 6) No, they are neighbours. 7) Their English teacher. 8) He is British, from Manchester.\n\n## Раздел 18. Таблица типичных ошибок\n- Опущение be: I from Almaty → I'm from Almaty.\n- Возраст через have: I have 25 years → I'm 25.\n- Be вместе с глаголом: I am agree → I agree.\n- Согласование: She are → She is.\n- Краткая форма в утверждении: Yes, I'm → Yes, I am.\n- Порядок слов в вопросе: Where you are from? → Where are you from?\n- Без артикля: I'm teacher → I'm a teacher.\n- Путаница his и her: Lera is a student. His name is Lera → Her name is Lera.\nВедите личный список ошибок и перечитывайте раз в неделю.\n\n## Раздел 19. Итоговый тест (15 баллов)\n1) She ___ (be) from Italy. 2) ___ you a student? 3) They ___ (not be) at home. 4) I ___ (be) 25. 5) Where ___ you from? 6) ___ is your name? 7) Is he a teacher? — Yes, ___. 8) Напишите словами число 40. 9) Национальность человека из Японии: ___. 10) Как поздороваться в 8 вечера? 11) Исправьте: I have 20 years. 12) Как читается буква W? 13) Ответ на How do you do? 14) How old ___ your brother? 15) She is ___ doctor. (a или an)\nОтветы: 1) is 2) Are 3) aren't 4) am 5) are 6) What 7) he is 8) forty 9) Japanese 10) Good evening 11) I'm 20 (years old) 12) /ˈdʌbəl juː/ 13) How do you do? 14) is 15) a.\nОценка: 13–15 — отлично, переходите к уроку 2; 10–12 — хорошо, повторите слабые разделы; меньше 10 — вернитесь к теории и практике, повторите две недели.\n\n## План на 4 недели\nНеделя 1: регистры, приветствия, прощания, представление (раздел 1), to be (раздел 2). Практика 1, 2. Ежедневно 10 минут карточек.\nНеделя 2: притяжательные, вопросительные, this/that (раздел 3), числа и алфавит (раздел 4). Практика 3, 4, диктовка.\nНеделя 3: страны и национальности (раздел 5), профессии (раздел 6), small talk (раздел 7), произношение (раздел 8). Практика 5, 6, говорение 1–3.\nНеделя 4: перевод (практика 7), чтение, письмо, говорение 4–5, итоговый тест, разбор ошибок.\n\n## Что стоит сверить в книгах\nRaymond Murphy, «English Grammar in Use» (to be, вопросы, числа); Michael Swan, «Practical English Usage»; Cambridge Dictionary и Oxford Learner's Dictionaries (произношение и примеры). Для фонетики: Peter Roach, «English Phonetics and Phonology».\nВажное замечание: упражнения и ключи составлены для самопроверки. Для оценки произношения и письма нужна обратная связь от человека, хорошо владеющего английским.\n", "w": [["hello", "привет", "/həˈloʊ/"], ["goodbye", "до свидания", "/ɡʊdˈbaɪ/"], ["name", "имя", "/neɪm/"], ["friend", "друг, подруга", "/frɛnd/"], ["from", "из, от", "/frʌm/"], ["where", "где, куда", "/wɛr/"], ["fine", "хорошо, в порядке", "/faɪn/"], ["welcome", "добро пожаловать", "/ˈwɛlkəm/"], ["introduce", "представлять", "/ˌɪntrəˈduːs/"], ["spell", "писать по буквам", "/spɛl/"], ["nationality", "национальность", "/ˌnæʃəˈnæləti/"], ["country", "страна", "/ˈkʌntri/"], ["age", "возраст", "/eɪdʒ/"], ["old", "старый", "/oʊld/"], ["student", "студент", "/ˈstuːdənt/"], ["teacher", "учитель", "/ˈtiːtʃər/"], ["pleased", "рад", "/pliːzd/"], ["morning", "утро", "/ˈmɔːrnɪŋ/"], ["evening", "вечер", "/ˈiːvnɪŋ/"], ["colleague", "коллега", "/ˈkɑːliːɡ/"]]}, {"t": "УРОК 2. Я И МОЯ СЕМЬЯ (РАСШИРЕННЫЙ КУРС)\nОбъём: 4 недели, 5–6 дней в неделю по 45–60 минут (около 20–25 часов). Уровень: A1 → A2.\nУчебный язык: объяснения по-русски, примеры по-английски.\n\n## Как устроен урок\nУрок состоит из трёх частей: теория (разделы 1–8), практика (разделы 9–16) и контроль (разделы 17–19). Сначала прочитайте теорию целиком один раз без заучивания, потом работайте с практикой и возвращайтесь к теории по мере необходимости. Это нормальный путь: так устроено усвоение грамматики, когда правило становится понятным только после нескольких применений.\n\n## Раздел 0. Научная основа метода\nНесколько принципов из прикладной лингвистики и когнитивной психологии определяют порядок работы:\n1. Входной материал (input). Язык усваивается, когда вы много слышите и читаете понятного. Поэтому в уроке есть тексты, диалоги и диктовка.\n2. Выходная речь (output). Исследовательница Мерилл Суэйн показала, что когда вы говорите и пишете, вы замечаете собственные пробелы. Поэтому говорение и письмо обязательны.\n3. Активное вспоминание (retrieval practice). Вспоминать полезнее, чем перечитывать.\n4. Интервальные повторения (spaced practice). Повторять лучше через разные промежутки, чем одним заходом.\n5. Обратная связь. Ошибки нужно разбирать, а не просто исправлять. Поэтому в уроке есть таблица ошибок и ключи.\nВывод: меньше пассивного чтения, больше работы руками и голосом.\n\n## Раздел 1. Лексика: семья и родственные связи\nЯдро: family /ˈfæmli/, parents /ˈpɛrənts/, mother (US mom, UK mum), father (dad), brother, sister, sibling /ˈsɪblɪŋ/ (брат или сестра), son, daughter /ˈdɔːtər/, child (мн. children), husband /ˈhʌzbənd/, wife /waɪf/, only child (единственный ребёнок), twins /twɪnz/.\nСтаршее и младшее поколение: grandmother (grandma), grandfather (grandpa), grandparents, grandson, granddaughter, grandchildren.\nРасширенная семья: aunt /ænt/ (UK /ɑːnt/), uncle /ˈʌŋkəl/, cousin /ˈkʌzən/, nephew /ˈnɛfjuː/, niece /niːs/, relatives /ˈrɛlətɪvz/ (родственники).\nРодственники по браку (in-laws): mother-in-law, father-in-law, brother-in-law, sister-in-law, son-in-law, daughter-in-law.\nСводные и единокровные: stepfather, stepmother, stepbrother, stepsister; half-brother, half-sister (общий один родитель).\nОтношения: partner, fiancé /ˌfiːɑːnˈseɪ/ (жених), fiancée (невеста; произносится так же), boyfriend, girlfriend, ex (бывший), spouse (супруг, супруга; официально).\nНюансы: слово cousin не указывает пол; в США family чаще воспринимается как нуклеарная семья (родители и дети), в британской речи часто шире. Слово relatives означает всех родственников, а parents означает только мать и отца, в отличие от русского «родители» с оттенками. Не путайте parents (родители) и relatives (родственники): оба слова легко спутать из-за схожести написания и перевода.\n\n## Раздел 2. Описание людей: внешность и характер\nВнешность: tall, short, medium height; slim (стройный), thin (худой, часто негативно), athletic, heavy, overweight (осторожно, может быть грубо); волосы: short / long, straight (прямые), wavy (волнистые), curly (кудрявые), dark, fair (светлые, UK), blond(e), red, grey, bald (лысый); other: beard /bɪrd/, moustache /ˈmʌstæʃ/, glasses, freckles.\nВозраст: He is in his twenties / thirties; middle-aged (средних лет); elderly (пожилой). Слово old в отношении человека может звучать грубо, лучше elderly.\nХарактер: kind, friendly, funny, shy, quiet, outgoing (общительный), generous /ˈdʒɛnərəs/, strict, patient, hard-working, lazy, honest /ˈɑːnɪst/ (h не произносится), polite, stubborn (упрямый).\nСтруктуры:\n- He is tall. He has short dark hair. (Здесь have/has без got в американской норме.)\n- She looks like her mother. (внешне похожа)\n- He takes after his father. (характером похож, унаследовал)\n- What is he like? = каков он по характеру? What does he look like? = как он выглядит? Это пара, которую русскоговорящие часто путают, потому что по-русски один вопрос.\nПорядок прилагательных (для справки): мнение, размер, возраст, цвет, происхождение, материал: a nice big old brown wooden table. Для описания человека достаточно: a tall young man, a kind old woman.\n\n## Раздел 3. Глагол have и конструкция have got\nЗначение: обладание, родственные связи, характеристики. I have two brothers. She has long hair.\nАмериканский вариант: I have, you have, he has; отрицание I don't have, вопрос Do you have...?\nБританский вариант: have got: I've got two brothers. He's got blue eyes. Отрицание: I haven't got; вопрос: Have you got...?\nСмысл одинаков. Для разговорной речи вне Великобритании выбирайте have.\nТипичные ошибки русскоговорящих:\n- У меня есть брат → At me is a brother ✗; I have a brother ✓ (в английском нужен субъект-обладатель и глагол, оборот «у меня» невозможен).\n- She have two sisters ✗ → She has two sisters ✓.\n- He hasn't brothers ✗ → He doesn't have any brothers / He hasn't got any brothers ✓ (после отрицания обычно any).\n- My sister has 25 years ✗ → My sister is 25 ✓ (возраст через be).\n\n## Раздел 4. Существительные: множественное число\nПравила:\n- Большинство: +s: sister → sisters.\n- После s, sh, ch, x, z и часто o: +es: box → boxes, watch → watches, tomato → tomatoes.\n- Согласная + y → ies: family → families, baby → babies. Гласная + y → ys: day → days.\n- f/fe → ves: wife → wives, leaf → leaves, knife → knives.\nНеправильные: man → men, woman /ˈwʊmən/ → women /ˈwɪmɪn/ (произношение разное!), child → children, person → people, foot → feet, tooth → teeth, mouse → mice.\nСложные слова с in-law: множественное число у главного слова: brothers-in-law.\nНулевое множественное: sheep, fish (в обычном значении), deer.\nПроизношение окончания -s/-es:\n- /s/ после глухих: books /bʊks/, parents /ˈpɛrənts/.\n- /z/ после звонких и гласных: brothers /ˈbrʌðərz/, days /deɪz/.\n- /ɪz/ после шипящих и свистящих: watches /ˈwɑːtʃɪz/, boxes /ˈbɑːksɪz/, nieces /ˈniːsɪz/.\nЭто же правило действует для 3 лица глагола и для 's.\n\n## Раздел 5. Притяжательный падеж ('s)\nФорма: существительное + 's: my mother's name. Для множественного числа на -s: апостроф после s: my parents' house. Для неправильного множественного числа: the children's toys.\nКогда использовать: для людей и животных. Для вещей чаще используют of: the door of the room, the end of the story.\nВопрос Whose? (чей): Whose bag is this? It's Lera's. (Lera's = Lera's bag.)\nТипичные ошибки: the car of my father (звучит неестественно) → my father's car; my parents's house ✗ → my parents' house ✓.\nНе путайте 's притяжательное и 's как сокращение от is/has: Lera's tall (Lera is tall), Lera's got a car (Lera has got a car), Lera's car (машина Леры). Определяйте по контексту.\n\n## Раздел 6. Артикли\nРусский язык артиклей не имеет, поэтому это самая устойчивая трудность.\na / an — неопределённый, для неизвестного, одного из многих, при первом упоминании: I have a sister.\nthe — определённый, для известного собеседнику, единственного в контексте или уже упомянутого: The sister is a doctor.\nВыбор a или an определяется ЗВУКОМ, а не буквой: an uncle /ʌ/, an hour /aʊər/ (h не произносится), an honest man; но a university /juː/, a one-hour lesson.\nНулевой артикль: с множественным числом и неисчисляемыми в общем значении (I like children), с названиями приёмов пищи (have dinner), с именами (Lera), с языками (speak English).\nthe: с уникальными объектами (the sun, the moon), с музыкальными инструментами (play the guitar), с профессиями-обобщениями в научных текстах.\nС профессиями: She is a doctor (a). He is an engineer (an).\nПрактическое правило для новичков: если вы говорите о человеке или предмете впервые, ставьте a/an; если уже говорили, ставьте the.\n\n## Раздел 7. Present Simple: теория\nНазначение: привычки, регулярные действия, факты, состояния, расписания. My mother works at a school. Water boils at 100 degrees.\nФорма утверждения: подлежащее + глагол в базовой форме; с he/she/it добавляется -s/-es.\nПравописание третьего лица:\n- +s: work → works, play → plays.\n- +es после s, sh, ch, x, z, o: watch → watches, wash → washes, go → goes, do → does.\n- согласная + y → ies: study → studies, try → tries.\n- have → has /hæz/.\nОтрицание: don't (do not) + базовая форма; doesn't (does not) + базовая форма. She doesn't work on Sundays. (Не doesn't works.)\nВопрос: Do + подлежащее + базовая форма? Does + he/she/it + базовая форма? Does she work? Краткие ответы: Yes, she does. No, she doesn't.\nНаречия частоты: always, usually, often, sometimes, rarely, never. Стоят перед основным глаголом и после be: I usually get up at seven. He is always late.\nВремя: every day, on Mondays, twice a week, in the morning.\nТипичные ошибки: He work ✗ → He works ✓; Does he works? ✗ → Does he work? ✓; She don't like ✗ → She doesn't like ✓; I am working every day ✗ → I work every day ✓ (постоянное, регулярное — Present Simple).\n\n## Раздел 8. Произношение и ритм в теме «Семья»\nУдарение: ˈfamily, ˈparents, ˈsibling, ˈgrandfather, reˈlative (в существительном relatives: ˈrɛlətɪv, ударение на первом слоге), ˈnephew, ˈcousin.\nНемые и необычные: daughter /ˈdɔːtər/ (gh не читается), grandfather /ˈɡrænfɑːðər/ (d часто не слышен в быстрой речи), honest /ˈɑːnɪst/, husband /ˈhʌzbənd/ (s как z).\nСлабые формы в предложениях: My mother is a teacher → /maɪ ˈmʌðər əz ə ˈtiːtʃər/. Do you have any brothers? → /dʒə hæv ɛni ˈbrʌðərz/.\nИнтонация: перечисление членов семьи идёт с подъёмом на каждом элементе, кроме последнего, где тон падает: I have a mother ↗, a father ↗, two brothers ↗ and a sister ↘.\nУпражнение по ритму: хлопайте на ударных слогах и проговаривайте: MY MOther TEACHES ENGlish AT a UniVERsity.\n\n## Раздел 9. Практика 1. Множественное число\nОбразуйте множественное: 1) box 2) baby 3) wife 4) child 5) man 6) day 7) person 8) brother-in-law 9) tooth 10) family.\n\n## Раздел 10. Практика 2. Третье лицо и произношение\nНапишите форму he/she/it и определите окончание: /s/, /z/ или /ɪz/. 1) watch 2) live 3) help 4) go 5) study 6) play 7) teach 8) have 9) work 10) wash.\n\n## Раздел 11. Практика 3. Притяжательный падеж\nП
