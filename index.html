в: 1) I enjoy ___ (read). 2) She wants ___ (travel). 3) He decided ___ (apply) for the job. 4) They finished ___ (work) at six. 5) I'm interested in ___ (learn) languages. 6) We hope ___ (see) you soon. 7) She avoids ___ (talk) about work. 8) I'd like ___ (try) it.\n\n## Раздел 11. Практика 3. Частота и наречия\nПоставьте наречие в правильное место: 1) I start at eight (usually). 2) He is late (always). 3) She works at weekends (rarely). 4) They go to the gym (often). 5) I eat breakfast (never). 6) We have meetings on Mondays (sometimes).\nСоставьте вопросы: 7) Ответ: Three times a week. 8) Ответ: I play football.\n\n## Раздел 12. Практика 4. Профессии и обязанности\nСоедините: 1) A nurse. 2) A driver. 3) An accountant. 4) A teacher. 5) A receptionist. 6) A developer.\nОбязанности: a) teaches students. b) takes care of patients. c) writes code. d) works with numbers and reports. e) welcomes guests and answers calls. f) takes people from place to place.\n\n## Раздел 13. Практика 5. Собеседование и письмо\nРасставьте реплики по порядку: a) Why do you want this job? b) Hello, please sit down. c) Tell me about yourself. d) I'm interested in this company and I'd like to develop my skills. e) Thank you. I'm a designer with three years of experience. f) Thank you for your time. We'll contact you soon.\nСоставьте письмо-обращение: напишите 3 вводных предложения для письма о вакансии (I'm writing to...).\n\n## Раздел 14. Практика 6. Перевод\n1) Кем вы работаете? 2) Я работаю в небольшой компании. 3) Я заканчиваю в пять часов. 4) Сейчас я работаю над новым проектом. 5) Я люблю читать и готовить. 6) Как часто вы играете в футбол? 7) Мне интересно изучать языки. 8) Я работаю по сменам. 9) Я отвечаю за команду из пяти человек. 10) Что вы делаете в свободное время?\n\n## Раздел 15. Практика 7. Чтение, диктовка, говорение, письмо\nЧтение. Прочитайте текст и ответьте.\nMy name is Dana and I work as a graphic designer in a small company. I usually start at nine and finish at five. This month I'm working on a big project for a client, so I'm sometimes working late. In my free time, I'm into photography. I go hiking at the weekend and take photos of the mountains. I started doing it five years ago. I'm also learning to play the guitar. I practise three times a week.\nВопросы: 1) What does Dana do? 2) When does she usually start and finish? 3) What is she working on this month? 4) What is her hobby? 5) When did she start photography? 6) What is she learning to play? 7) How often does she practise?\nДиктовка: I work as a manager. She is working on a new project. I enjoy reading and cooking. What do you do in your free time? I'm responsible for the team.\nГоворение (запись по 3–5 минут):\n1) Расскажите о своей работе: должность, место, график, обязанности, что нравится, что нет (8–10 предложений).\n2) Расскажите о типичном дне.\n3) Расскажите о хобби и как вы к нему пришли.\n4) Пройдите короткое собеседование с партнёром: Tell me about yourself. Why this job? Strengths and weaknesses.\n5) Разыграйте знакомство с коллегой: расскажите, чем занимаетесь, и спросите о нём.\nПисьмо. Напишите письмо с просьбой дать информацию о вакансии на 80–100 слов или текст о своём хобби на 120–150 слов. Чек-лист: обращение и завершение письма, вежливая просьба (Could you please...), Present Simple и Present Continuous по смыслу, -ing или to после глаголов, нет типичных ошибок из раздела 17.\n\n## Раздел 16. Ключи\nПрактика 1: 1) start 2) is writing 3) doesn't like 4) are working 5) Do, know 6) are having 7) works 8) are, doing.\nПрактика 2: 1) reading 2) to travel 3) to apply 4) working 5) learning 6) to see 7) talking 8) to try.\nПрактика 3: 1) I usually start at eight. 2) He is always late. 3) She rarely works at weekends. 4) They often go to the gym. 5) I never eat breakfast. 6) We sometimes have meetings on Mondays. 7) How often do you go to the gym? 8) What do you play?\nПрактика 4: 1-b, 2-f, 3-d, 4-a, 5-e, 6-c.\nПрактика 5: b, c, e, a, d, f. Письмо: I'm writing to ask about the position of designer. I'm writing to apply for the vacancy advertised on your website. I'm writing to ask for more information about the job.\nПрактика 6: 1) What do you do? / What's your job? 2) I work at a small company. 3) I finish at five. 4) I'm working on a new project now. 5) I like reading and cooking. 6) How often do you play football? 7) I'm interested in learning languages. 8) I work in shifts. 9) I'm in charge of a team of five. / I manage a team of five people. 10) What do you do in your free time?\nПрактика 7 (чтение): 1) She is a graphic designer. 2) She starts at nine and finishes at five. 3) A big project for a client. 4) Photography. 5) Five years ago. 6) The guitar. 7) Three times a week.\n\n## Раздел 17. Таблица типичных ошибок\n- Забытое -s: He work → He works.\n- Present Continuous с глаголами состояния: I'm knowing → I know.\n- Present Simple вместо Continuous: Now I work → Now I'm working.\n- -ing и to: I enjoy to read → I enjoy reading.\n- Артикль с профессией: I'm teacher → I'm a teacher.\n- Предлоги: work in the bank (допустимо) / at the bank (место); work for a company.\n- Время: I work here since 2020 → I've worked here since 2020.\n- Порядок слов: I always am late → I am always late.\n- Обращение: Dear Mr. Brown, (в США точка после Mr.) / Dear Mr Brown, (в Великобритании без точки).\nВедите личный список ошибок и перечитывайте раз в неделю.\n\n## Раздел 18. Самооценка\nПо 2 балла: □ я рассказываю о работе и обязанностях □ я различаю Present Simple и Continuous □ я правильно использую -ing и to □ я рассказываю о хобби и распорядке дня □ я могу написать деловое письмо □ я отвечаю на вопросы собеседования.\nРезультат: 10–12 баллов — переходите к уроку 9; 6–9 — повторите слабые разделы; меньше 6 — повторите неделю.\n\n## Раздел 19. Итоговый тест (15 баллов)\n1) Present Simple или Continuous: I ___ (work) in a bank (постоянно). 2) I ___ (work) on a project now. 3) Глагол состояния: know или knowing? 4) I enjoy ___ (read). 5) I want ___ (travel). 6) Место наречия: He is (always) late. 7) Как спросить о частоте? 8) Предлог: I work ___ a small company (for/at). 9) Как закончить письмо, если вы знаете имя? 10) Как начать письмо, если имя неизвестно? 11) Как произносится -s в watches? 12) Что значит be responsible for? 13) Что значит shift? 14) Как рассказать о хобби: I ___ into photography. 15) Назовите вопрос собеседования.\nОтветы: 1) work 2) am working 3) know 4) reading 5) to travel 6) He is always late. 7) How often do you...? 8) for (организация) или at (место) 9) Yours sincerely / Kind regards 10) Dear Sir or Madam 11) /ɪz/ 12) нести ответственность за 13) смена 14) am 15) Tell me about yourself.\nОценка: 13–15 — отлично, переходите к уроку 9; 10–12 — хорошо, повторите слабые разделы; меньше 10 — вернитесь к теории и практике.\n\n## Раздел 20. План на 4 недели\nНеделя 1: лексика работы (раздел 1), Present Simple (раздел 2). Практика 1, 3. Ежедневно 10 минут карточек.\nНеделя 2: Present Continuous (раздел 3), -ing и to (раздел 4). Практика 1, 2.\nНеделя 3: хобби и распорядок дня (разделы 5, 5а), письмо и собеседование (раздел 6), культура (раздел 7), произношение (раздел 8). Практика 4, 5, 6.\nНеделя 4: чтение, диктовка, говорение, письмо, итоговая запись, самооценка, тест, разбор ошибок.\n\n## Что стоит сверить в книгах\nRaymond Murphy, «English Grammar in Use» (Present Simple и Continuous, -ing и to); Michael Swan, «Practical English Usage»; Cambridge Dictionary и Oxford Learner's Dictionaries (произношение и примеры); «Business English» ресурсы вроде English for Work (Cambridge) для деловой лексики.\nВажное замечание: упражнения и ключи составлены для самопроверки. Правила деловой переписки и собеседований различаются по странам и отраслям. Для оценки произношения и письма нужна обратная связь от человека, хорошо владеющего языком.\n", "w": [["employer", "работодатель", "/ɪmˈplɔɪər/"], ["employee", "сотрудник", "/ɪmˈplɔɪiː/"], ["colleague", "коллега", "/ˈkɑːliːɡ/"], ["shift", "смена", "/ʃɪft/"], ["overtime", "сверхурочные", "/ˈoʊvərtaɪm/"], ["contract", "договор", "/ˈkɑːntrækt/"], ["freelance", "фриланс", "/ˈfriːlæns/"], ["deadline", "крайний срок", "/ˈdɛdlaɪn/"], ["meeting", "встреча, совещание", "/ˈmiːtɪŋ/"], ["promotion", "повышение", "/prəˈmoʊʃən/"], ["qualification", "квалификация", "/ˌkwɑːləfɪˈkeɪʃən/"], ["interview", "собеседование", "/ˈɪntərvjuː/"], ["resume", "резюме (США)", "/ˈrɛzumeɪ/"], ["responsible", "ответственный", "/rɪˈspɑːnsəbəl/"], ["hobby", "хобби", "/ˈhɑːbi/"], ["photography", "фотография", "/fəˈtɑːɡrəfi/"], ["collecting", "коллекционирование", "/kəˈlɛktɪŋ/"], ["gardening", "садоводство", "/ˈɡɑːrdnɪŋ/"], ["hiking", "пеший туризм", "/ˈhaɪkɪŋ/"], ["practise", "практиковаться", "/ˈpræktɪs/"]]}, {"t": "УРОК 9. ЗДОРОВЬЕ И ВРАЧ (РАСШИРЕННЫЙ КУРС)\nОбъём: 4 недели, 5–6 дней в неделю по 45–60 минут (около 20–25 часов). Уровень: A2 → B1.\nУчебный язык: объяснения по-русски, примеры по-английски. Основной вариант: американский, британские отличия отмечены.\n\nВажно: это языковой урок. Он учит описывать самочувствие и общаться с врачом, а не лечить. Советы в упражнениях общие и бытовые, не медицинские рекомендации. При плохом самочувствии обращайтесь к врачу. В экстренной ситуации звоните в службу спасения вашей страны (например, 911 в США, 999 в Великобритании, 112 в странах Европейского союза).\n\n## Как устроен урок\nТеория (разделы 1–8), практика (разделы 9–17), контроль (разделы 18–20). Прочитайте теорию целиком без заучивания, затем работайте с практикой и возвращайтесь к теории по мере необходимости. Цель урока: назвать части тела и симптомы, объяснить, что болит и как долго, записаться к врачу, понять вопросы врача и советы, купить лекарство в аптеке и сообщить о недомогании на работе.\n\n## Раздел 0. Научная основа метода\n1. Ситуативное обучение: визит к врачу и разговор в аптеке образуют предсказуемый сценарий (приветствие, жалобы, вопросы, диагноз, советы, прощание). Освоив сценарий, вы тратите меньше усилий на подбор фраз.\n2. Точность в важных ситуациях: в разговоре о здоровье ошибки могут иметь последствия, поэтому важны чёткие формулы, повторение услышанного и умение переспрашивать.\n3. Выходная речь: говорение и письмо заставляют замечать пробелы (идея Мерилл Суэйн).\n4. Интервальные повторения: возвращайтесь к лексике через 1, 3, 7, 14 дней (вкладка «Карточки»).\n5. Стратегии коммуникации: переспрашивать, перефразировать, подтверждать понятое (урок 6 курса КГБ, если вы его проходили).\n\n## Раздел 1. Лексика: тело и самочувствие\nЧасти тела: head, face, eye, ear, nose, mouth, tooth (мн. teeth), neck, throat /θroʊt/, shoulder, arm, elbow, hand, finger, chest, back, stomach /ˈstʌmək/, hip, leg, knee, foot (мн. feet), toe, skin, heart, lungs.\nСамочувствие: I feel well / fine / good / bad / tired / weak / dizzy /ˈdɪzi/ (кружится голова) / sick (подташнивает) / better / worse.\nЗаметка: в США sick означает «больной» вообще (I'm sick), а в Великобритании sick чаще означает «тошнит», для болезни используют ill. Различайте: I feel sick (мне плохо, тошнит) и I'm ill (я болен).\nСимптомы и недомогания: headache /ˈhɛdeɪk/, stomachache, toothache, backache, earache, sore throat, cough /kɔːf/, runny nose (насморк), sneeze (чихать), fever /ˈfiːvər/ (температура), temperature, rash (сыпь), itch (зуд), swelling (отёк), pain, ache, cramp, nausea /ˈnɔːziə/, diarrhea, vomit (рвота; vomiting).\nБолезни и состояния: cold, flu, infection /ɪnˈfɛkʃən/, allergy /ˈælərdʒi/, food poisoning, asthma /ˈæzmə/, migraine, high blood pressure.\nТравмы: injury /ˈɪndʒəri/, cut, bruise (синяк), burn, sprain (растяжение), fracture / broken bone (перелом), bandage /ˈbændɪdʒ/, plaster (Британия) / band-aid (США, бытовое название пластыря).\nМеста и люди: doctor, nurse, GP (Британия, врач общей практики) / family doctor / primary care doctor (США), specialist, dentist, pharmacist /ˈfɑːrməsɪst/, patient /ˈpeɪʃənt/, pharmacy /ˈfɑːrməsi/ (США также drugstore) / chemist (Британия), clinic, hospital, emergency room, ER (США) / A&E (Британия), ambulance /ˈæmbjələns/.\nЛечение: medicine /ˈmɛdɪsɪn/, tablet / pill, capsule, cream, drops, injection, treatment, prescription /prɪˈskrɪpʃən/ (рецепт), over-the-counter (без рецепта), insurance /ɪnˈʃʊrəns/, appointment, check-up, test, X-ray, recover /rɪˈkʌvər/ (выздоравливать), rest (отдых).\n\n## Раздел 2. Как описывать, что болит\nСтруктуры:\n- My head hurts. / I have a headache. / My back aches. / I have a pain in my chest.\n- I have a sore throat. / I've got a cough. / I have a fever.\n- I feel dizzy. / I feel sick. / I feel weak.\n- It hurts when I breathe/walk/swallow.\nРазличие hurt, ache, pain:\n- hurt: глагол (My leg hurts.), также причинить боль.\n- ache: тупая, длительная боль (backache, stomachache).\n- pain: острая боль или боль вообще (a sharp pain).\nОписание боли: sharp (острая), dull (тупая), constant (постоянная), comes and goes (то появляется, то исчезает), burning (жгучая), throbbing (пульсирующая).\nСтепень по шкале от 1 до 10: On a scale of one to ten, it's about six.\nКогда и сколько: It started two days ago. I've had it since Monday. I've had a fever for three days.\nЧто усиливает или облегчает: It gets worse when I... It's better when I rest.\nТемпература: в США обычно используют градусы Фаренгейта (нормальная около 98.6°F), в большинстве других стран градусы Цельсия (около 37°C). Это общеизвестные ориентиры, а не диагноз. Умейте назвать: I have a temperature of thirty-eight point five.\n\n## Раздел 3. Present Perfect для длительности и состояния\nФорма: have/has + третья форма глагола: I have had (I've had) a headache. She has been ill.\nУпотребление: действие или состояние началось в прошлом и продолжается сейчас.\n- I've had a cough for three days. (for + период)\n- I've felt dizzy since this morning. (since + момент начала)\n- How long have you had these symptoms?\nРазличие: Past Simple (завершённое действие в прошлом с точным временем): I had a headache yesterday. Present Perfect (связь с настоящим): I've had a headache since yesterday.\nВопросы: How long have you felt like this? Have you taken any medicine?\nКраткие ответы: Yes, I have. / No, I haven't.\nВремя: for two days, since Monday, all week, recently, lately.\nТипичные ошибки: I have a headache since Monday ✗ → I've had a headache since Monday ✓. I am ill since two days ✗ → I've been ill for two days ✓.\n\n## Раздел 4. Советы и рекомендации: модальные глаголы\nshould + глагол (совет, мягкая рекомендация): You should rest. You shouldn't go to work.\nought to + глагол (похоже на should, чуть формальнее): You ought to see a doctor.\nhad better + глагол (настоятельный совет, предупреждение о последствиях): You'd better stay home, or you'll get worse.\nmust / have to (необходимость): You must take the medicine. I have to take it three times a day (по указанию врача).\nПовелительное наклонение (прямые указания врача): Drink plenty of water. Get some rest. Take this medicine as directed. Don't skip meals.\nУсловия (Zero и First Conditional, урок 7): If you have a fever, you should stay in bed. If it gets worse, call me.\nПросьбы пациента: Could you explain that again? What should I do? Is it serious? Do I need a test?\n\n## Раздел 5. Сценарий приёма у врача\n1) Запись по телефону: Hello, I'd like to make an appointment, please. — What seems to be the problem? — I have a bad cough. — Is it urgent? — Could I see the doctor today? — The doctor is available at three o'clock tomorrow. — That's fine. — Could I have your name and date of birth? — I have travel/health insurance.\n2) Приветствие: Hello, please come in and sit down. How can I help you today?\n3) Жалобы: I've had a sore throat and a cough for three days. I also feel tired.\n4) Вопросы врача:\n- How long have you had these symptoms?\n- Do you have a fever?\n- Have you taken any medicine?\n- Are you allergic to anything?\n- Do you have any chronic conditions? (хронические заболевания)\n- Are you taking any other medication?\n- Does it hurt when I press here?\n- Have you had this before?\n5) Осмотр: Open your mouth, please. Take a deep breath. Breathe out. Does it hurt here? I'll take your temperature / blood pressure.\n6) Диагноз: It looks like a cold / an infection / an allergic reaction. It's nothing serious, but you need to rest. I'd like to run a few tests.\n7) Лечение и советы: I'll prescribe some medicine. Take one tablet twice a day (как указано). Drink plenty of fluids. Rest for a few days. Come back if you don't feel better.\n8) Вопросы пациента: How long will it take to recover? Can I go to work? Are there any side effects? Do I need to come back?\n9) Завершение: Thank you, doctor. I'll follow your advice. Goodbye.\nЕсли не поняли: Sorry, could you say that again? Could you speak more slowly? Could you write it down, please?\nПереводчик: Could you call an interpreter, please? (Можно вызвать переводчика?) В некоторых больницах он предоставляется.\n\n## Раздел 6. Аптека и лекарства\nВопросы и фразы:\n- Do you have anything for a headache / a cough / a sore throat?\n- Do I need a prescription for this?\n- How often should I take it? — Twice a day, after meals. (как указано на упаковке)\n- Are there any side effects? Can I take it with other medicine?\n- I'm allergic to penicillin. (пример; называйте своё)\n- Could I have a bandage / plaster, please?\n- Do you have this in a smaller size / another brand?\nЧтение инструкции: Take as directed. Do not exceed the recommended dose (не превышайте рекомендуемую дозу). Keep out of reach of children. Store in a cool, dry place. Side effects may include... Consult your doctor if symptoms persist.\nОбщие правила: лекарство принимайте только по рецепту врача или по инструкции. Если сомневаетесь, спросите фармацевта.\n\n## Раздел 7. Экстренные ситуации и сообщения о болезни\nЭкстренная ситуация: Call an ambulance! I need help! My friend is not breathing. I think he has broken his leg. There has been an accident. Назовите место: It's at 24 Park Road. Сохраняйте спокойствие, говорите медленно, повторяйте адрес.\nНомера экстренных служб зависят от стране: 911 (США), 999 (Великобритания), 112 (страны ЕС). Узнавайте номер заранее.\nСообщение о болезни на работе или учёбе:\n- I'm writing to let you know that I'm unwell and won't be able to come to work today.\n- I have a fever and a bad cough, and my doctor has advised me to rest for three days.\n- I'll send you a medical certificate (справка) when I return.\n- I'll keep you updated. Thank you for understanding.\nВопросы собеседника: How are you feeling? Are you feeling better? Get well soon! Take care.\nРеакция на болезнь другого: Oh, I'm sorry to hear that. I hope you feel better soon. Is there anything I can do?\n\n## Раздел 8. Произношение и интонация\nСлова: headache /ˈhɛdeɪk/, stomach /ˈstʌmək/, ache /eɪk/, cough /kɔːf/, throat /θroʊt/ (межзубный /θ/), fever /ˈfiːvər/, symptom /ˈsɪmptəm/, prescription /prɪˈskrɪpʃən/, pharmacy /ˈfɑːrməsi/, allergic /əˈlɜːrdʒɪk/, appointment /əˈpɔɪntmənt/, dizzy /ˈdɪzi/, nausea /ˈnɔːziə/, injury /ˈɪndʒəri/, medicine /ˈmɛdɪsɪn/ (часто два слога /ˈmɛdsən/), temperature /ˈtɛmprətʃər/ (часто три слога), recover /rɪˈkʌvər/.\nНе читаются: часть слов имеет непроизносимые буквы (headache: ch как /k/ в ache; doctor /ˈdɑːktər/).\nСлабые формы: Do you have → /dʒə hæv/; How long have you → /haʊ lɔːŋ həv ju/; I've had → /aɪv hæd/.\nИнтонация: вопросы врача да/нет с подъёмом: Are you allergic to anything? ↗ Вопросы с wh-словом с падением: How long have you had it? ↘ Сочувствие: Oh, I'm so sorry to hear that. ↘ с мягким, заботливым тоном.\nЯсность: говорите медленно и чётко о важных деталях (аллергия, лекарства, адрес).\n\n## Раздел 9. Практика 1. Лексика\nВставьте слово: 1) I have a ___ in my head (headache/ache). 2) My throat ___ (hurts/pain). 3) I feel ___ (dizzy/dizzily). 4) I have a ___ (cough/coughs). 5) I need a ___ (prescription/describe) for this medicine.\nСоедините симптом и состояние: 1) sneezing, runny nose, sore throat. 2) high temperature, aches, chills. 3) itchy skin, rash after eating something. a) allergy b) flu c) cold.\nНазовите части тела: ... (покажите на себе и назовите по-английски 15 частей).\n\n## Раздел 10. Практика 2. Советы\nДайте совет с should, shouldn't или had better (общие бытовые советы): 1) I have a cold. 2) I have a headache after working at the computer. 3) I can't sleep. 4) My friend has a fever. 5) I cut my finger. 6) I have a cough and it's getting worse.\n\n## Раздел 11. Практика 3. Present Perfect\nВставьте for или since и форму глагола: 1) I ___ (have) a headache ___ Monday. 2) She ___ (be) ill ___ three days. 3) He ___ (not feel) well ___ this morning. 4) How long ___ you ___ (have) these symptoms? 5) I ___ (cough) ___ a week. 6) They ___ (be) in hospital ___ yesterday.\n\n## Раздел 12. Практика 4. Порядок диалога\nРасставьте реплики по порядку: a) How long have you had these symptoms? b) Hello, please sit down. How can I help you? c) I'll prescribe some medicine. Take one tablet twice a day. d) I've had a sore throat and a cough. e) Thank you, doctor. f) Since Monday. Are you allergic to anything? g) No, I'm not.\n\n## Раздел 13. Практика 5. Телефонная запись\nЗаполните пропуски: A: Good morning, Green Clinic. How can I ___ you? B: Hello, I'd like to make an ___, please. A: What seems to be the ___? B: I have a bad ___ and a ___. A: Could I have your ___ and date of birth? B: It's Dana Nurova. A: The doctor is ___ at three o'clock tomorrow. B: That's ___. Thank you.\n\n## Раздел 14. Практика 6. Перевод\n1) У меня болит голова. 2) У меня температура. 3) Сколько времени вы это чувствуете? 4) У вас есть аллергия на что-нибудь? 5) Мне нужен рецепт? 6) Принимайте это дважды в день. 7) Вам нужно отдохнуть. 8) Выздоравливайте скорее! 9) Мне нужно записаться к врачу. 10) Я плохо себя чувствую.\n\n## Раздел 15. Практика 7. Чтение, диктовка, говорение, письмо\nЧтение. Прочитайте текст и ответьте.\nLast week I had a sore throat and a cough. I thought it was a cold, but after three days I still felt tired and I had a fever. I called the clinic and made an appointment. The doctor asked me about my symptoms and checked my throat. She said it was an infection and told me to rest and drink a lot of water. She also gave me a prescription. I went to the pharmacy, took the medicine as directed, and after a week I felt much better.\nВопросы: 1) What symptoms did the writer have at first? 2) How long did the writer wait before calling the clinic? 3) What did the doctor say it was? 4) What did the doctor advise? 5) What did the writer do at the pharmacy? 6) How did the writer feel after a week?\nДиктовка: I have a headache and a fever. How long have you had these symptoms? Are you allergic to anything? You should rest and drink plenty of water. I'd like to make an appointment.\nГоворение (запись по 3–5 минут):\n1) Разыграйте телефонный звонок в клинику для записи.\n2) Разыграйте визит к врачу: вы описываете симптомы, врач задаёт вопросы.\n3) Разыграйте разговор в аптеке.\n4) Расскажите, что вы делаете, чтобы оставаться здоровым (8 предложений).\n5) Сообщите на работе о болезни (устно по телефону).\nПисьмо. Напишите письмо руководителю, что вы больны и не сможете выйти на работу, на 60–80 слов. Чек-лист: вежливое обращение, симптомы, срок, обещание справки, благодарность, формула окончания (Kind regards).\n\n## Раздел 16. Ключи\nПрактика 1: 1) headache 2) hurts 3) dizzy 4) cough 5) prescription. 1-c, 2-b, 3-a.\nПрактика 2 (примеры общих бытовых советов): 1) You should rest and drink plenty of water. 2) You should take a break and look away from the screen. 3) You shouldn't drink coffee in the evening. 4) He should see a doctor. 5) You should clean it and put a bandage on it. 6) You'd better see a doctor.\nПрактика 3: 1) have had, since 2) has been, for 3) hasn't felt, since 4) have, had 5) have coughed (have been coughing), for 6) have been, since.\nПрактика 4: b, d, a, f, g, c, e.\nПрактика 5: help; appointment; problem; cough, fever (или cough и headache); name; available; fine.\nПрактика 6: 1) My head hurts. / I have a headache. 2) I have a fever. / I have a temperature. 3) How long have you had this? / How long have you felt like this? 4) Are you allergic to anything? 5) Do I need a prescription? 6) Take this twice a day. 7) You need to rest. / You should rest. 8) Get well soon! 9) I need to make an appointment with the doctor. 10) I don't feel well.\nПрактика 7 (чтение): 1) A sore throat and a cough. 2) Three days. 3) An infection. 4) To rest and drink a lot of water. 5) Got the medicine (по рецепту). 6) Much better.\n\n## Раздел 17. Таблица типичных ошибок\n- Present Perfect вместо Present Simple для длительности: I have a headache since Monday → I've had a headache since Monday.\n- Be вместо have: I am headache → I have a headache.\n- Перевод «Мне плохо»: I'm bad → I feel bad / I feel sick / I don't feel well.\n- Предлоги: I have a pain on my chest → in my chest.\n- Артикли: I have cold → I have a cold.\n- Просьба повторить: кивать вместо вопроса (лучше переспросить).\n- sick и ill: в британском sick чаще означает «тошнит».\n- Дозировка: не сообщайте и не запоминайте дозировку по памяти, всегда уточняйте у врача или по инструкции.\nВедите личный список ошибок.\n\n## Раздел 18. Самооценка\nПо 2 балла: □ я называю части тела и симптомы □ я описываю боль (где, когда, как долго) □ я использую Present Perfect с for и since □ я даю и понимаю советы (should, had better) □ я могу записаться к врачу и поговорить с ним □ я могу сообщить о болезни.\nРезультат: 10–12 баллов — переходите к уроку 10; 6–9 — повторите слабые разделы; меньше 6 — повторите неделю.\n\n## Раздел 19. Итоговый тест (15 баллов)\n1) Как сказать «У меня болит голова»? 2) Как сказать «У меня температура»? 3) Как сказать «Мне нужно записаться к врачу»? 4) Вставьте for или since: I've had a cough ___ Monday. 5) Вставьте for или since: ___ three days. 6) Исправьте: I have a headache since yesterday. 7) Как дать совет: ___ rest (should/must). 8) Что значит prescription? 9) Как спросить, есть ли аллергия? 10) Различие sick в США и Великобритании. 11) Как спросить, сколько времени длятся симптомы? 12) Что значит over-the-counter? 13) Как сказать «Выздоравливайте скорее»? 14) Как попросить повторить? 15) Как позвонить в экстренную службу в США?\nОтветы: 1) My head hurts. / I have a headache. 2) I have a fever. / I have a temperature. 3) I need to make an appointment with the doctor. 4) since 5) for 6) I've had a headache since yesterday. 7) should 8) рецепт 9) Are you allergic to anything? 10) В США sick чаще значит «больной», в Великобритании чаще «тошнит» 11) How long have you had these symptoms? 12) без рецепта 13) Get well soon! 14) Could you say that again, please? 15) 911.\nОценка: 13–15 — отлично, переходите к уроку 10; 10–12 — хорошо, повторите слабые разделы; меньше 10 — вернитесь к теории и практике.\n\n## Раздел 20. План на 4 недели\nНеделя 1: лексика тела и самочувствия (раздел 1), как описывать боль (раздел 2). Практика 1. Ежедневно 10 минут карточек.\nНеделя 2: Present Perfect (раздел 3), советы и модальные (раздел 4). Практика 2, 3.\nНеделя 3: сценарий приёма у врача (раздел 5), аптека (раздел 6), экстренные ситуации и сообщение о болезни (раздел 7), произношение (раздел 8). Практика 4, 5, 6.\nНеделя 4: чтение, диктовка, говорение, письмо, итоговая запись, самооценка, тест, разбор ошибок.\n\n## Что стоит сверить в книгах\nRaymond Murphy, «English Grammar in Use» (Present Perfect, modal verbs); Michael Swan, «Practical English Usage»; Cambridge Dictionary и Oxford Learner's Dictionaries (произношение и примеры). Для лексики здоровья: «Oxford English for Careers: Nursing» и «English for Medical Purposes» (ресурсы уровня B1 и выше).\nВажное замечание: урок учит языку, а не лечению. Реальные медицинские решения принимайте вместе с врачом. Номера экстренных служб и правила медицинской помощи различаются по странам. Для оценки произношения нужна обратная связь от человека, хорошо владеющего языком.\n", "w": [["symptom", "симптом", "/ˈsɪmptəm/"], ["headache", "головная боль", "/ˈhɛdeɪk/"], ["fever", "температура, жар", "/ˈfiːvər/"], ["cough", "кашель", "/kɔːf/"], ["ache", "ноющая боль", "/eɪk/"], ["injury", "травма", "/ˈɪndʒəri/"], ["allergy", "аллергия", "/ˈælərdʒi/"], ["prescription", "рецепт", "/prɪˈskrɪpʃən/"], ["pharmacy", "аптека", "/ˈfɑːrməsi/"], ["dizzy", "головокружение", "/ˈdɪzi/"], ["nausea", "тошнота", "/ˈnɔːziə/"], ["medicine", "лекарство", "/ˈmɛdɪsɪn/"], ["treatment", "лечение", "/ˈtriːtmənt/"], ["recover", "выздоравливать", "/rɪˈkʌvər/"], ["infection", "инфекция", "/ɪnˈfɛkʃən/"], ["bandage", "бинт", "/ˈbændɪdʒ/"], ["ambulance", "скорая помощь", "/ˈæmbjələns/"], ["emergency", "экстренная ситуация", "/ɪˈmɜːrdʒənsi/"], ["insurance", "страховка", "/ɪnˈʃʊrəns/"], ["appointment", "запись на приём", "/əˈpɔɪntmənt/"]]}, {"t": "УРОК 10. ПУТЕШЕСТВИЯ (РАСШИРЕННЫЙ КУРС)\nОбъём: 4 недели, 5–6 дней в неделю по 45–60 минут (около 20–25 часов). Уровень: A2 → B1.\nУчебный язык: объяснения по-русски, примеры по-английски. Основной вариант: американский, британские отличия отмечены.\n\nВажно: требования к документам, визам, таможенным правилам и ввозу вещей различаются по странам и меняются. Проверяйте их на официальных сайтах перед поездкой. Урок учит языку, а не оформлению документов.\n\n## Как устроен урок\nТеория (разделы 1–8), практика (разделы 9–17), контроль (разделы 18–20). Прочитайте теорию целиком без заучивания, затем работайте с практикой и возвращайтесь к теории по мере необходимости. Цель урока: спланировать поездку, забронировать билет и жильё, пройти аэропорт, решить проблему в пути, рассказать о путешествии и поговорить о мечтах и планах.\n\n## Раздел 0. Научная основа метода\n1. Ситуативное обучение: путешествие — набор сценариев (бронирование, аэропорт, отель, экскурсия, проблема). Освоив сценарии, вы легче справляетесь с неожиданностями.\n2. Опыт и рассказ: Present Perfect для опыта и Past Simple для рассказа об отдельной поездке тренируют различие времён на живом материале.\n3. Выходная речь: говорение и письмо заставляют замечать пробелы (идея Мерилл Суэйн).\n4. Интервальные повторения: возвращайтесь к лексике через 1, 3, 7, 14 дней (вкладка «Карточки»).\n5. Воображение: мечты и гипотетические ситуации (Second Conditional) расширяют грамматику и мотивацию.\n\n## Раздел 1. Лексика: планирование и документы\nПоездка: trip (короткая поездка), journey (путь, дорога), travel (путешествовать, неисчисляемое: Travel is fun), tour (экскурсия, тур), holiday (Британия) / vacation (США), weekend break, business trip, sightseeing /ˈsaɪtsiːɪŋ/ (осмотр достопримечательностей), itinerary /aɪˈtɪnəreri/ (маршрут, план поездки), destination /ˌdɛstɪˈneɪʃən/ (пункт назначения), abroad /əˈbrɔːd/ (за границей), foreign /ˈfɔːrən/.\nДокументы: passport /ˈpæspɔːrt/, visa /ˈviːzə/, ID card, ticket, boarding pass (посадочный талон), insurance /ɪnˈʃʊrəns/, booking confirmation, driving licence (Британия) / license (США), vaccination certificate (при необходимости).\nБронирование: book / reserve, reservation, booking, flight, seat, window seat, aisle seat, direct flight (прямой), connecting flight / layover (США) / stopover (пересадка), one-way, return (Британия) / round-trip (США), economy / business class, fare, discount, cancellation, refund.\nБагаж: luggage (Британия) / baggage (США), suitcase, backpack, hand luggage (Британия) / carry-on (США), checked baggage, baggage allowance (норма багажа), overweight, lost luggage.\nДеньги: currency /ˈkɜːrənsi/, exchange, exchange rate, cash, card, ATM, tip.\n\n## Раздел 2. Лексика: аэропорт и транспорт\nПроцесс: check in (регистрация), security (досмотр), passport control / immigration, customs /ˈkʌstəmz/ (таможня), gate (выход на посадку), board (садиться), take off (взлёт), land (посадка), delay, cancel, baggage claim (получение багажа), arrivals, departures.\nФразы: Where is the check-in desk? Which gate is it? My flight is delayed. I'd like a window seat, please. Could I check this bag? Is this the right gate for Flight 205? What time does boarding start? Where can I collect my luggage?\nПредлоги: arrive in (город, страна), arrive at (аэропорт, станция), travel by plane / train / bus (без артикля), on the plane, on the train, in a taxi, in a car, on foot.\nФразовые глаголы: check in, check out, set off (отправляться), get back (возвращаться), look around, pick up, drop off, stay in, take off, turn up (появляться).\n\n## Раздел 3. Лексика: жильё и осмотр\nЖильё: hotel, hostel /ˈhɑːstəl/ (хостел), guesthouse, apartment, bed and breakfast (B&B), campsite, single room, double room, twin room (с двумя кроватями), en-suite (с собственной ванной), breakfast included, Wi-Fi, air conditioning.\nДостопримечательности: sight, landmark, museum, castle, palace, monument, beach, mountain, lake, national park, market, tourist information office, guide (гид), guidebook, map, souvenir /ˌsuːvəˈnɪr/.\nОписание мест: beautiful, crowded, peaceful, expensive, cheap, famous, historic, modern, lively, safe, friendly.\nВопросы в туристическом офисе: Could you recommend a good restaurant? How do I get to the museum? What time does it open/close? How much is the entrance fee? Is there a guided tour?\n\n## Раздел 4. Present Perfect для опыта и Past Simple для рассказа\nPresent Perfect для опыта (без точного времени): Have you ever been to London? — Yes, I have. / No, I haven't. I've been to Italy twice. I've never been to Japan.\nPast Simple для рассказа о конкретной поездке: I went to Italy last summer. We stayed for ten days.\nПравило: когда названо время или место конкретного события, используем Past Simple. Вопрос об опыте задаём в Present Perfect, подробности в Past Simple.\n- Have you ever visited Paris? — Yes, I have. — When did you go there? — I went there in 2019.\nBeen и gone:\n- She has been to Paris. (Она бывала в Париже и вернулась.)\n- She has gone to Paris. (Она уехала в Париж и сейчас там или в пути.)\nМаркеры: ever, never, already, yet, just, twice, three times, before, so far.\nПримеры: I've already booked the hotel. Have you packed yet? I've just arrived.\nТипичные ошибки: I have been to Rome last year ✗ → I went to Rome last year ✓. Did you ever see ✗ → Have you ever seen... ✓ (для опыта).\n\n## Раздел 5. Сравнения и превосходная степень о местах\nСравнительная: The train is faster than the bus. Rome is more crowded than Florence. This hotel is cheaper than that one.\nПревосходная: the best, the most beautiful, the cheapest, the oldest. It's the most famous museum in the city.\nНе такой как: It's not as expensive as I thought. (не такой дорогой, как я думал)\nСтруктуры: one of the + превосходная + существительное во множественном числе: It's one of the best places I've ever visited.\nТакже: a lot, much, a bit, slightly (усилители): It's a lot more expensive.\n\n## Раздел 6. Правила и необходимость: must, mustn't, have to, don't have to, can't\nmust / have to: необходимость. You must show your passport. You have to check in two hours before the flight.\nmustn't: запрет, нельзя (по правилам). You mustn't take photos here.\ndon't have to: нет необходимости (можно, но не нужно). You don't have to pay to enter. You don't have to book in advance.\ncan't: нельзя, не разрешено. You can't smoke in the hotel.\nshould: совет. You should book early.\nСравните: You mustn't enter (запрещено) и You don't have to enter (не обязательно).\nЗнаки: No entry. No smoking. Keep off the grass. Mind the gap.\n\n## Раздел 7. Мечты и гипотетические ситуации: Second Conditional\nФорма: if + Past Simple, would + базовая форма.\n- If I had more time, I would travel around the world.\n- If I won the lottery, I would buy a house by the sea.\n- If I were you, I'd book the tickets now. (для всех лиц допустимо were)\nНазначение: нереальные или маловероятные ситуации в настоящем и будущем, мечты, советы (If I were you...).\nСравнение с First Conditional (урок 7): If I have time, I'll go (реально) и If I had time, I would go (маловероятно или нереально).\nСтруктуры для мечты: I'd love to visit..., I wish I could..., My dream is to..., Imagine if...\nОпасные ошибки: If I would have money ✗ → If I had money ✓.\n\n## Раздел 8. Сценарии, культура и произношение\nСценарии:\n1) Бронирование: I'd like to book a flight to Rome on the fifteenth of May. Is there a direct flight? How much is a return ticket? Could I choose a window seat?\n2) Регистрация: Here's my passport. I'd like to check in one bag. Is the flight on time? Could I have an aisle seat?\n3) Паспортный контроль: What's the purpose of your visit? — Tourism. How long will you stay? — Ten days. Where will you stay? — At the Grand Hotel.\n4) Багаж потерян: My luggage hasn't arrived. Could you help me, please? It's a blue suitcase. Here's my baggage claim ticket. Please send it to my hotel.\n5) Отель: I have a reservation under the name Nurov. Could I have a quiet room? The air conditioner doesn't work. What time is breakfast?\n6) Туристический офис: What do you recommend? How long does the tour take?\n7) Задержка или отмена рейса: Why is the flight delayed? What are my options? Can I get a refund or change my ticket?\n8) Потеря документа: I've lost my passport. Where is the nearest embassy / police station? (Говорите спокойно, предупредите об адресе и телефоне.)\nКультура:\n- Вежливость и терпение в очередях ценятся.\n- Чаевые в ресторанах и такси различаются по странам, уточняйте на месте.\n- Розетки, напряжение, часовые пояса и время работы магазинов отличаются.\n- Проверяйте требования к документам и ввозу вещей на официальных сайтах.\n- Уважайте местные обычаи и правила поведения.\nПроизношение: passport /ˈpæspɔːrt/, luggage /ˈlʌɡɪdʒ/, itinerary /aɪˈtɪnəreri/, souvenir /ˌsuːvəˈnɪr/, foreign /ˈfɔːrən/, destination /ˌdɛstɪˈneɪʃən/, customs /ˈkʌstəmz/, immigration /ˌɪməˈɡreɪʃən/, departure /dɪˈpɑːrtʃər/, currency /ˈkɜːrənsi/, accommodation /əˌkɑːməˈdeɪʃən/, tourist /ˈtʊrɪst/.\nСлабые формы: Have you ever been → /həv jə ˈɛvər bɪn/; I'd like to → /aɪd ˈlaɪk tə/; Could I have → /ˈkʊdaɪ hæv/.\nИнтонация: вопросы да/нет с подъёмом: Have you ever been to London? ↗ Вопросы с wh-словом с падением: Where did you go? ↘ Эмоциональное восхищение: It was AMAzing! ↘ с широким диапазоном.\n\n## Раздел 9. Практика 1. Порядок в аэропорту\nРасставьте шаги в логическом порядке: baggage claim, passport control, take off, check-in, security, land, book a ticket, board the plane, customs.\n\n## Раздел 10. Практика 2. Present Perfect\nВставьте been или gone: 1) She has ___ to Paris three times. 2) He isn't here. He has ___ to the airport. 3) Have you ever ___ to Japan? 4) They have ___ on holiday. They'll be back next week.\nСоставьте вопросы и ответьте: Have you ever visited a foreign country? (свой ответ), Have you ever lost your luggage? (свой ответ), Have you ever flown in a plane? (свой ответ).\nИсправьте ошибку: I have been to Rome last year.\n\n## Раздел 11. Практика 3. Сравнения\nВставьте форму: 1) The train is ___ (fast) than the bus. 2) This is the ___ (beautiful) beach I've ever seen. 3) The hotel is ___ (cheap) than the hostel. 4) It's not as ___ (expensive) as I thought. 5) Rome is ___ (crowded) than Florence. 6) It's one of the ___ (old) cities in Europe.\n\n## Раздел 12. Практика 4. Must, mustn't, don't have to\nВставьте must, mustn't или don't have to: 1) You ___ show your passport. 2) You ___ take photos in the museum (it's forbidden). 3) You ___ pay to enter (it's free). 4) You ___ book in advance (but it's a good idea). 5) You ___ smoke in the hotel. 6) You ___ arrive two hours before the flight.\n\n## Раздел 13. Практика 5. Second Conditional\nЗакончите предложение: 1) If I had more time, I ___ (visit) more places. 2) If I won the lottery, I ___ (travel) around the world. 3) If I ___ (be) you, I'd book the tickets now. 4) If she ___ (speak) Italian, she would live in Italy. 5) What would you do if you ___ (lose) your passport?\nНапишите 3 своих предложения о мечтах.\n\n## Раздел 14. Практика 6. Диалоги\nРасставьте реплики по порядку: a) What's the purpose of your visit? b) Good morning. May I see your passport? c) Tourism. d) How long will you stay? e) Ten days. f) Where will you stay? g) At the Grand Hotel. h) Thank you. Enjoy your stay.\nРазыграйте с партнёром: бронирование билета, регистрацию, потерю багажа, заселение в отель, вопрос в туристическом офисе.\n\n## Раздел 15. Практика 7. Перевод\n1) Я хочу забронировать билет в Рим. 2) У вас есть прямой рейс? 3) Можно место у окна? 4) Мой багаж не прибыл. 5) Где получить багаж? 6) У меня бронь на имя Нуров. 7) Вы когда-нибудь были в Лондоне? 8) Я был в Италии дважды. 9) Если бы у меня было больше времени, я бы поехал в отпуск. 10) Вам не нужно бронировать заранее.\n\n## Раздел 16. Практика 8. Чтение, диктовка, говорение, письмо\nЧтение. Прочитайте текст и ответьте.\nLast summer, I travelled to Italy for ten days with my sister. We flew to Rome and then took a train to Florence. The weather was hot, so we visited museums in the morning and relaxed by the river in the afternoon. My favourite moment was a cooking class where we learned to make pasta. The only problem was that my suitcase arrived a day late, but the airline delivered it to our hotel. If I had more time, I would stay for a month!\nВопросы: 1) How long did the writer travel? 2) Who did she travel with? 3) Where did they go first? 4) How did they get to Florence? 5) What did they do in the morning? 6) What was the favourite moment? 7) What was the problem? 8) What would the writer do if she had more time?\nДиктовка: Have you ever been to London? I'd like a window seat, please. My luggage hasn't arrived. You don't have to book in advance. If I had more time, I would travel more.\nГоворение (запись по 3–5 минут):\n1) Расскажите о своей лучшей поездке (Past Simple, 8–10 предложений).\n2) Расскажите, где вы бывали и где хотели бы побывать (Present Perfect и Second Conditional).\n3) Разыграйте проблему в аэропорту (потерян багаж или задержка рейса).\n4) Разыграйте заселение в отель и вопрос о достопримечательностях.\n5) Спланируйте поездку на выходные: куда, как добраться, где остановиться, что посмотреть.\nПисьмо. Напишите открытку или письмо другу о поездке на 80–100 слов, либо план поездки на 120–150 слов. Чек-лист: Past Simple, Present Perfect, сравнения, must и don't have to, Second Conditional, вежливые фразы.\n\n## Раздел 17. Ключи\nПрактика 1: book a ticket, check-in, security, passport control, board the plane, take off, land, baggage claim, customs.\nПрактика 2: 1) been 2) gone 3) been 4) gone. Исправление: I went to Rome last year.\nПрактика 3: 1) faster 2) most beautiful 3) cheaper 4) expensive 5) more crowded 6) oldest.\nПрактика 4: 1) must (have to) 2) mustn't 3) don't have to 4) don't have to 5) mustn't 6) must (have to).\nПрактика 5: 1) would visit 2) would travel 3) were 4) spoke 5) lost.\nПрактика 6: b, a, c, d, e, f, g, h.\nПрактика 7: 1) I'd like to book a ticket to Rome. 2) Is there a direct flight? 3) Could I have a window seat? 4) My luggage hasn't arrived. 5) Where can I collect my luggage? 6) I have a reservation under the name Nurov. 7) Have you ever been to London? 8) I've been to Italy twice. 9) If I had more time, I would go on holiday. 10) You don't have to book in advance.\nПрактика 8 (чтение): 1) Ten days. 2) With her sister. 3) To Rome. 4) By train. 5) They visited museums. 6) A cooking class. 7) Her suitcase arrived a day late. 8) She would stay for a month.\n\n## Раздел 18. Таблица типичных ошибок\n- Present Perfect с точным временем: I have been to Rome last year → I went to Rome last year.\n- Been и gone.\n- Second Conditional: If I would have time → If I had time.\n- Must и don't have to: путаница запрета и необязательности.\n- Предлоги: arrive to Rome → arrive in Rome; arrive to the airport → arrive at the airport.\n- Артикль: by the plane → by plane.\n- Исчисляемое: informations, luggages → information, luggage (неисчисляемые).\n- Вопрос: Did you ever be → Have you ever been.\nВедите личный список ошибок.\n\n## Раздел 19. Самооценка\nПо 2 балла: □ я бронирую билет и жильё □ я прохожу аэропорт и решаю проблемы □ я различаю Present Perfect и Past Simple □ я использую сравнения и must, don't have to □ я использую Second Conditional □ я рассказываю о путешествии.\nРезультат: 10–12 баллов — переходите к уроку 11; 6–9 — повторите слабые разделы; меньше 6 — повторите неделю.\n\n## Раздел 20. Итоговый тест (15 баллов)\n1) Что значит itinerary? 2) Различие been и gone. 3) Исправьте: I have been to Rome last year. 4) Вставьте: You ___ show your passport (must/mustn't). 5) Вставьте: You ___ pay to enter, it's free (don't have to/mustn't). 6) Второй условный: If I ___ (have) time, I would travel. 7) Британский вариант слова carry-on. 8) Предлог: arrive ___ the airport. 9) Предлог: arrive ___ Rome. 10) Как попросить место у окна? 11) Как сообщить о пропавшем багаже? 12) Вопрос об опыте поездки. 13) Сравнительная форма: cheap. 14) Превосходная форма: beautiful. 15) Что значит layover?\nОтветы: 1) маршрут, план поездки 2) been — бывал и вернулся, gone — уехал и ещё там 3) I went to Rome last year. 4) must 5) don't have to 6) had 7) hand luggage 8) at 9) in 10) Could I have a window seat, please? 11) My luggage hasn't arrived. 12) Have you ever been to ...? 13) cheaper 14) the most beautiful 15) пересадка (остановка между рейсами).\nОценка: 13–15 — отлично, переходите к уроку 11; 10–12 — хорошо, повторите слабые разделы; меньше 10 — вернитесь к теории и практике.\n\n## План на 4 недели\nНеделя 1: лексика планирования, документов, аэропорта, жилья (разделы 1–3). Практика 1. Ежедневно 10 минут карточек.\nНеделя 2: Present Perfect и Past Simple (раздел 4), сравнения (раздел 5), must и don't have to (раздел 6). Практика 2, 3, 4.\nНеделя 3: Second Conditional (раздел 7), сценарии, культура и произношение (раздел 8). Практика 5, 6, 7. Говорение 1–4.\nНеделя 4: чтение, диктовка, письмо, говорение 5, итоговая запись, самооценка, тест, разбор ошибок.\n\n## Что стоит сверить в книгах\nRaymond Murphy, «English Grammar in Use» (Present Perfect, Second Conditional, must и have to); Michael Swan, «Practical English Usage»; Cambridge Dictionary и Oxford Learner's Dictionaries (произношение и примеры); английские путеводители и сайты авиакомпаний для реальных формулировок.\nВажное замечание: упражнения и ключи составлены для самопроверки. Правила въезда, документов и багажа меняются, проверяйте актуальные требования на официальных сайтах. Для оценки произношения нужна обратная связь от человека, хорошо владеющего языком.\n", "w": [["passport", "паспорт", "/ˈpæspɔːrt/"], ["visa", "виза", "/ˈviːzə/"], ["customs", "таможня", "/ˈkʌstəmz/"], ["immigration", "паспортный контроль", "/ˌɪməˈɡreɪʃən/"], ["itinerary", "маршрут поездки", "/aɪˈtɪnəreri/"], ["destination", "пункт назначения", "/ˌdɛstɪˈneɪʃən/"], ["souvenir", "сувенир", "/ˌsuːvəˈnɪr/"], ["sightseeing", "осмотр достопримечательностей", "/ˈsaɪtsiːɪŋ/"], ["foreign", "иностранный", "/ˈfɔːrən/"], ["boarding", "посадка", "/ˈbɔːrdɪŋ/"], ["cancel", "отменять", "/ˈkænsəl/"], ["accommodation", "жильё", "/əˌkɑːməˈdeɪʃən/"], ["hostel", "хостел", "/ˈhɑːstəl/"], ["currency", "валюта", "/ˈkɜːrənsi/"], ["tourist", "турист", "/ˈtʊrɪst/"], ["abroad", "за границей", "/əˈbrɔːd/"], ["luggage", "багаж (UK)", "/ˈlʌɡɪdʒ/"], ["suitcase", "чемодан", "/ˈsuːtkeɪs/"], ["layover", "пересадка (US)", "/ˈleɪoʊvər/"], ["embassy", "посольство", "/ˈɛmbəsi/"]]}, {"t": "УРОК 11. МНЕНИЯ И АРГУМЕНТЫ (РАСШИРЕННЫЙ КУРС)\nОбъём: 4 недели, 5–6 дней в неделю по 45–60 минут (около 20–25 часов). Уровень: B1.\nУчебный язык: объяснения по-русски, примеры по-английски. Основной вариант: американский, британские отличия отмечены.\n\nТемы для практики в этом уроке нейтральные и повседневные (удалённая работа, обучение, транспорт, города). Мы не обсуждаем политику и религию. Цель урока: научиться высказывать и обосновывать мнение, соглашаться и спорить вежливо, сохраняя уважение к собеседнику.\n\n## Как устроен урок\nТеория (разделы 1–9), практика (разделы 10–17), контроль (разделы 18–20). Прочитайте теорию целиком без заучивания, затем работайте с практикой и возвращайтесь к теории по мере необходимости. Цель урока: выражать мнение, строить аргументацию (утверждение, причина, пример), выслушивать другую точку зрения, вежливо не соглашаться, находить компромисс и писать короткое эссе-рассуждение.\n\n## Раздел 0. Научная основа метода\n1. Аргументация как навык. Умение обосновывать мнение — часть коммуникативной компетенции уровня B1 и выше. Оно включает логику, язык и вежливость.\n2. Структура помогает говорить. Фиксированная схема (утверждение, обоснование, пример, вывод) снижает нагрузку: вы заполняете структуру, а не придумываете её каждый раз.\n3. Связки и дискурсивные маркеры. Слова вроде however, therefore, for example делают речь связной. Их нужно знать как готовые блоки.\n4. Выходная речь: говорение и письмо заставляют замечать пробелы (идея Мерилл Суэйн).\n5. Критическое мышление. Различение факта, мнения и ошибки рассуждения помогает слушать и отвечать грамотно.\n6. Интервальные повторения: возвращайтесь к фразам и связкам через 1, 3, 7, 14 дней (вкладка «Карточки»).\n\n## Раздел 1. Факт, мнение, убеждение\nФакт (fact): можно проверить. Almaty is a city in Kazakhstan. Water boils at 100°C (при нормальном давлении).\nМнение (opinion): личная оценка. Almaty is the most beautiful city.\nУбеждение (belief): глубокая вера, ценность.\nПредположение (assumption): допущение без проверки.\nПрактика: Прежде чем спорить, определите, о чём речь: о фактах (их можно проверить) или о мнениях (их можно обосновать, но не доказать). Маркеры мнения: I think, I believe, in my opinion, I feel, it seems to me, personally. Маркеры факта: according to, research shows, statistics show, it is known that.\n\n## Раздел 2. Как выразить мнение\nНейтральные формулы:\n- I think (that)...\n- I believe...\n- In my opinion, ...\n- Personally, I think...\n- From my point of view, ...\n- As far as I'm concerned, ...\n- It seems to me that...\n- The way I see it, ...\nБолее сильные: I'm convinced that... I'm sure that... I strongly believe...\nОсторожные (hedging): I tend to think... I'd say that... It might be a good idea... Perhaps... To some extent...\nВопросы о мнении: What do you think? How do you feel about...? What's your opinion? Do you agree? What's your view on...?\nНегативное мнение с I don't think: в английском отрицание обычно переносится в главную часть: I don't think it's a good idea. (не I think it isn't a good idea).\n\n## Раздел 3. Согласие и несогласие\nПолное согласие: I agree. I totally agree. Absolutely. Exactly. That's true. You're right. I couldn't agree more.\nЧастичное согласие: Yes, but... I see your point, but... That's true to some extent, but... You've got a point, but... I partly agree.\nВежливое несогласие: I'm afraid I disagree. I'm not sure I agree. I see it differently. That's not how I see it. I don't think that's quite right. Not necessarily.\nРезкое (избегайте): You're wrong. That's nonsense. That's stupid.\nСогласие или несогласие с утверждением: So do I / Neither do I / I do too / I don't either:\n- I like tea. — So do I. / Me too.\n- I don't like crowds. — Neither do I. / Me neither.\nУточнение: What do you mean exactly? Could you explain that? Do you mean that...?\nСмена позиции: You've convinced me. I hadn't thought of that.\nЗакрытие спора: Let's agree to disagree. We seem to have different views, but I respect yours.\n\n## Раздел 4. Структура аргумента: PEEL\nPEEL: Point (утверждение), Evidence (доказательство или пример), Explanation (объяснение), Link (вывод).\nПример:\n- Point: Remote work saves time.\n- Evidence: For example, many people spend two hours a day commuting.\n- Explanation: This means they can use that time for rest or family.\n- Link: Therefore, remote work can improve quality of life.\nКороткая схема для устной речи: Claim → Reason → Example → Conclusion.\nСтруктура рассуждения из трёх частей: введение (тема и мнение), основная часть (2–3 аргумента, один контраргумент), заключение (итог и вывод).\nПриём «за и против» (pros and cons): сначала перечислите преимущества и недостатки, затем сделайте вывод.\nКонтраргумент и ответ: Some people say that... However, I think that... / It is true that..., but...\n\n## Раздел 5. Связки и дискурсивные маркеры\nДобавление: and, also, in addition, moreover, furthermore, besides, as well as.\nКонтраст: but, however, on the other hand, nevertheless, still, yet.\nУступка: although, even though, though, despite (+ существительное или -ing), in spite of, while, whereas.\nПричина: because, since, as, due to (+ существительное).\nРезультат: so, therefore, as a result, consequently, that's why.\nПример: for example, for instance, such as, like.\nПоследовательность: first, second, finally, to begin with, next.\nУточнение: in other words, that is, I mean.\nВывод: in conclusion, to sum up, all in all, overall, in short.\nВыделение: in fact, actually, especially, above all.\nСравните: Although it's expensive, it's worth it. = It's expensive. However, it's worth it. = Despite being expensive, it's worth it.\nТипичные ошибки: Although... but ✗ (не используйте вместе) → Although it's expensive, it's worth it. Because of он vs because: because of + существительное; because + предложение.\n\n## Раздел 6. Грамматика аргументации: относительные придаточные\nНазначение: добавлять детали и определения в аргументы без повторений.\nОтносительные местоимения: who (люди), which (предметы), that (люди и предметы в ограничительных предложениях), whose (принадлежность), where (место), when (время).\nОграничительные (defining), без запятых: The man who lives next door is my teacher. The book that I read was interesting.\nНеограничительные (non-defining), с запятыми, дополнительная информация: My brother, who lives in Astana, is a designer. Almaty, which is near the mountains, is a beautiful city. В них нельзя that.\nОпускание местоимения: можно опустить, когда оно дополнение: The book (that) I read.\nПример: People who work from home save time. A city where public transport is good attracts residents.\n\n## Раздел 7. Грамматика аргументации: условные и модальные\nZero Conditional (общие истины): If you don't sleep, you feel tired.\nFirst Conditional (реальная возможность): If prices rise, people will buy less.\nSecond Conditional (гипотетические мнения): If I were the mayor, I would build more bike lanes. If I had more time, I would...\nМодальные: should (совет, мнение): Schools should teach practical skills. must (необходимость): We must protect the environment. might / could (возможность): It might be a problem.\nСтрадательный залог в общих утверждениях: It is said that..., It is believed that..., It is often argued that...\nГерундий как подлежащее: Learning languages is useful. Walking is healthy.\nСравнения: Public transport is cheaper than driving. Working in an office is as productive as working from home.\n\n## Раздел 8. Ошибки рассуждения (для критического слушания)\nЗнание типичных ошибок помогает замечать слабые аргументы:\n1) Ad hominem (переход на личность): You can't trust his idea because he's young.\n2) Поспешное обобщение (hasty generalization): I met two rude tourists, so all tourists are rude.\n3) Ложная дилемма (false dilemma): Either we ban all cars, or we ruin the planet.\n4) Апелляция к большинству (bandwagon): Everyone uses this app, so it must be good.\n5) Скользкая дорожка (slippery slope): If we allow this, soon everything will be allowed.\n6) Подмена причины (post hoc): I wore my lucky socks, and we won, so the socks caused the win.\nКак отвечать вежливо: Do you have any evidence for that? Is that always true? Are there other options? That's one example, but is it typical?\nВажно: обращайте внимание на ошибки в аргументах, а не на собеседника.\n\n## Раздел 9. Культура, произношение и интонация\nКультура:\n- Степень прямоты различается: в некоторых культурах принято говорить прямо, в других мягче. Англоговорящие часто смягчают несогласие (I see your point, but...). Прямолинейное несогласие может звучать грубо.\n- В small talk с новыми знакомыми обычно избегают острых тем (политика, религия, деньги). Выбирайте нейтральные.\n- Слушайте, не перебивайте: Sorry to interrupt, but... / Could I just say something? / May I add something?\n- Признавайте хорошие аргументы: That's a good point.\n- Выражайте уважение к другому мнению: I respect your opinion.\nПроизношение:\n- opinion /əˈpɪnjən/, argument /ˈɑːrɡjəmənt/, advantage /ədˈvæntɪdʒ/, disadvantage /ˌdɪsədˈvæntɪdʒ/, benefit /ˈbɛnɪfɪt/, drawback /ˈdrɔːbæk/, impact /ˈɪmpækt/, issue /ˈɪʃuː/, debate /dɪˈbeɪt/, persuade /pərˈsweɪd/, convince /kənˈvɪns/, reasonable /ˈriːzənəbəl/, logical /ˈlɑːdʒɪkəl/, oppose /əˈpoʊz/.\nИнтонация:\n- Вежливое несогласие с падением-подъёмом: I see your POINT, ↘↗ but I'm not sure I AGREE. ↘\n- Сильное согласие: I totally AGREE! ↘ с широким диапазоном голоса.\n- Вопрос о мнении: What do you THINK? ↘ Do you agree? ↗\n- Контраст: смысловое ударение на противопоставляемых словах: I like the IDEA, but not the PRICE.\nСлабые формы: I don't think so → /aɪ doʊnt ˈθɪŋk soʊ/ (с падением-подъёмом).\n\n## Раздел 10. Практика 1. Классификация фраз\nОпределите тип: выражение мнения, согласие, частичное согласие, несогласие, вопрос о мнении. 1) In my opinion, it's a good idea. 2) I couldn't agree more. 3) I see your point, but... 4) I'm afraid I disagree. 5) What do you think? 6) Not necessarily. 7) As far as I'm concerned, it's too expensive. 8) You've got a point, but...\n\n## Раздел 11. Практика 2. Связки\nВставьте although, however, because, so, in addition, for example, therefore, despite: 1) ___ it was raining, we went for a walk. 2) The hotel is cheap. ___, it's not very clean. 3) I stayed home ___ I was tired. 4) It was late, ___ I took a taxi. 5) ___ the rain, we enjoyed the trip. 6) Remote work saves time. ___, it can be lonely. 7) Many cities have problems. ___, Almaty has traffic jams. 8) I enjoy hiking. ___, I like swimming.\n\n## Раздел 12. Практика 3. Аргумент по PEEL\nСоставьте абзац по схеме Point, Evidence, Explanation, Link на одну из тем: 1) Studying online is better than studying in a classroom. 2) Public transport should be free. 3) Children should learn a second language early.\n\n## Раздел 13. Практика 4. Относительные придаточные\nСоедините предложения: 1) The man is my teacher. He lives next door. 2) The book was interesting. I read it last week. 3) My friend lives in Astana. He works as a designer. 4) The city is beautiful. We visited it. 5) The woman is a doctor. Her son is my friend. 6) The café is near the station. We had lunch there.\n\n## Раздел 14. Практика 5. Вежливое несогласие\nПерепишите вежливо: 1) You're wrong. 2) That's nonsense. 3) I don't like your idea. 4) No, that's not true. 5) You don't understand.\n\n## Раздел 15. Практика 6. Ошибки рассуждения\nОпределите тип ошибки: 1) Everyone uses this app, so it must be good. 2) I met two rude tourists, so all tourists are rude. 3) Either we ban all cars, or we ruin the planet. 4) You can't trust her idea because she's young.\n\n## Раздел 16. Практика 7. Формат дискуссии\nТемы: 1) Is it better to live in a big city or in a village? 2) Should students wear a school uniform? 3) Is working from home better than working in an office? 4) Is learning online as good as learning in a class? 5) Are electric scooters good for cities? 6) Is it better to travel alone or with friends?\nФорматы:\nА) Два минуты монолог: изложите мнение по PEEL.\nБ) Пара: один защищает, другой возражает вежливо, 3 минуты, затем меняются.\nВ) «Круг мнений»: каждый высказывается 30 секунд, затем реагирует на предыдущего.\nГ) Смена роли: защищайте позицию, с которой вы не согласны, чтобы понять другую сторону.\nД) Таблица «за и против»: заполните и сделайте вывод.\nЕ) Компромисс: найдите решение, подходящее обеим сторонам (How about...? What if we...?).\nПравило: слушайте, не перебивайте, ссылайтесь на слова собеседника (As you said, ...).\n\n## Раздел 17. Практика 8. Чтение, диктовка, говорение, письмо\nЧтение. Прочитайте текст и ответьте.\nWorking from home: good or bad?\nMany people believe that working from home is the best way to work. Personally, I think it has both advantages and disadvantages. On the one hand, you save time because you don't have to travel to the office. In addition, you can organize your day more flexibly. On the other hand, it can be lonely, and some people find it difficult to separate work from free time. For example, my cousin often works late because his laptop is always on the table. Although remote work is convenient, I believe the best solution is a mix of both: two days at home and three days in the office. In conclusion, flexibility is important, but so is contact with colleagues.\nВопросы: 1) What is the writer's opinion? 2) What is one advantage? 3) What is one disadvantage? 4) What example does the writer give? 5) What solution does the writer suggest? 6) How does the writer conclude?\nДиктовка: In my opinion, it's a good idea. I see your point, but I'm not sure I agree. Although it's expensive, it's worth it. People who work from home save time. In conclusion, flexibility is important.\nГоворение (запись по 3–5 минут): 1) Выскажите мнение по теме из раздела 16 по PEEL. 2) Проведите дискуссию с партнёром (вежливое несогласие). 3) Выслушайте аргумент и вежливо возразите. 4) Подведите итог обсуждения. 5) Найдите компромисс.\nПисьмо. Напишите эссе-рассуждение на 150–180 слов по одной из тем. Чек-лист: введение с мнением, 2–3 аргумента по PEEL, контраргумент и ответ на него, связки, заключение. Проверьте: нет ли ошибок из раздела 19.\n\n## Раздел 18. Ключи\nПрактика 1: 1) мнение 2) согласие 3) частичное согласие 4) несогласие 5) вопрос о мнении 6) несогласие (мягкое) 7) мнение 8) частичное согласие.\nПрактика 2: 1) Although 2) However 3) because 4) so 5) Despite 6) However 7) For example 8) In addition.\nПрактика 4: 1) The man who lives next door is my teacher. 2) The book (that) I read last week was interesting. 3) My friend, who works as a designer, lives in Astana. 4) The city (that) we visited is beautiful. 5) The woman whose son is my friend is a doctor. 6) The café where we had lunch is near the station.\nПрактика 5 (образцы): 1) I'm not sure I agree. / I see it differently. 2) I don't think that's quite right. 3) I'm afraid I don't really like that idea. 4) I'm afraid that's not quite true. 5) Perhaps I didn't explain it clearly. Could I try again?\nПрактика 6: 1) апелляция к большинству 2) поспешное обобщение 3) ложная дилемма 4) переход на личность.\nПрактика 8 (чтение): 1) Remote work has both advantages and disadvantages. 2) It saves time. 3) It can be lonely. 4) A cousin works late because his laptop is on the table. 5) A mix of both: two days at home, three in the office. 6) Flexibility is important, but so is contact with colleagues.\n\n## Раздел 19. Таблица типичных ошибок\n- Although... but: Although it's expensive, but it's good → Although it's expensive, it's good.\n- Because и because of: because of the rain / because it rained.\n- I think it isn't → I don't think it is.\n- Слишком резкое несогласие: You're wrong → I'm not sure I agree.\n- Переход на личность вместо аргумента.\n- Отсутствие примера: добавьте For example...\n- Забытые связки: речь звучит как список.\n- that в неограничительном предложении: My brother, that lives in Astana → who.\nВедите личный список ошибок.\n\n## Раздел 20. Самооценка и тест\nСамооценка по 2 балла: □ я выражаю мнение и обосновываю □ я использую PEEL □ я соглашаюсь и вежливо не соглашаюсь □ я использую связки □ я использую относительные придаточные □ я распознаю ошибки рассуждения.\nРезультат: 10–12 баллов — переходите к уроку 12; 6–9 — повторите слабые разделы; меньше 6 — повторите неделю.\nИтоговый тест (15 баллов): 1) Что значит PEEL? 2) Как вежливо не согласиться? 3) Как согласиться полностью? 4) Вставьте although или however: It's expensive. ___, it's good. 5) Ставьте right: I think it isn't good → I ___ think it is good. 6) Что такое hasty generalization? 7) Что такое ad hominem? 8) Относительное местоимение для людей. 9) Кому принадлежит whose? 10) Как закрыть спор? 11) Как ответить: I like tea. (согласие) 12) Как перебить вежливо? 13) Какая связка для вывода? 14) Что такое false dilemma? 15) Как выразить осторожное мнение?\nОтветы: 1) Point, Evidence, Explanation, Link 2) I'm afraid I disagree. / I see your point, but... 3) I couldn't agree more. 4) However 5) don't 6) вывод по слишком малому числу примеров 7) нападение на человека вместо аргумента 8) who 9) принадлежность, чей 10) Let's agree to disagree. 11) So do I. / Me too. 12) Sorry to interrupt, but... 13) In conclusion / To sum up 14) предлагаются только два варианта, хотя их больше 15) I tend to think... / It seems to me that...\nОценка: 13–15 — отлично, переходите к уроку 12; 10–12 — хорошо, повторите слабые разделы; меньше 10 — вернитесь к теории и практике.\n\n## План на 4 недели\nНеделя 1: факт и мнение (раздел 1), выражение мнения (раздел 2), согласие и несогласие (раздел 3). Практика 1. Ежедневно 10 минут карточек.\nНеделя 2: PEEL (раздел 4), связки (раздел 5). Практика 2, 3.\nНеделя 3: относительные придаточные (раздел 6), условные и модальные (раздел 7), ошибки рассуждения (раздел 8). Практика 4, 5, 6.\nНеделя 4: культура и произношение (раздел 9), дискуссии (практика 7), чтение, письмо эссе, самооценка, тест, разбор ошибок.\n\n## Что стоит сверить в книгах\nRaymond Murphy, «English Grammar in Use» (относительные придаточные, условные, связки); Michael Swan, «Practical English Usage»; Cambridge Dictionary и Oxford Learner's Dictionaries (произношение и примеры); «Cambridge Academic English» для аргументации и эссе.\nВажное замечание: упражнения и ключи составлены для самопроверки. Примеры ошибок рассуждения даны для критического слушания, а не для оценки людей. Для оценки произношения и письма нужна обратная связь от человека, хорошо владеющего языком.\n", "w": [["opinion", "мнение", "/əˈpɪnjən/"], ["argument", "аргумент, спор", "/ˈɑːrɡjəmənt/"], ["advantage", "преимущество", "/ədˈvæntɪdʒ/"], ["disadvantage", "недостаток", "/ˌdɪsədˈvæntɪdʒ/"], ["benefit", "польза", "/ˈbɛnɪfɪt/"], ["drawback", "недостаток", "/ˈdrɔːbæk/"], ["impact", "влияние", "/ˈɪmpækt/"], ["issue", "вопрос, проблема", "/ˈɪʃuː/"], ["debate", "дебаты", "/dɪˈbeɪt/"], ["persuade", "убеждать", "/pərˈsweɪd/"], ["convince", "убедить", "/kənˈvɪns/"], ["reasonable", "разумный", "/ˈriːzənəbəl/"], ["logical", "логичный", "/ˈlɑːdʒɪkəl/"], ["oppose", "возражать, противостоять", "/əˈpoʊz/"], ["support", "поддерживать", "/səˈpɔːrt/"], ["evidence", "доказательство", "/ˈɛvɪdəns/"], ["conclusion", "вывод", "/kənˈkluːʒən/"], ["agree", "соглашаться", "/əˈɡriː/"], ["disagree", "не соглашаться", "/ˌdɪsəˈɡriː/"], ["compromise", "компромисс", "/ˈkɑːmprəmaɪz/"]]}, {"t": "УРОК 12. СВОБОДНЫЙ ДИАЛОГ 15 МИНУТ (РАСШИРЕННЫЙ КУРС)\nОбъём: 4 недели, 5–6 дней в неделю по 45–60 минут (около 20–25 часов). Уровень: B1.\nУчебный язык: объяснения по-русски, примеры по-английски. Основной вариант: американский, британские отличия отмечены.\nЭто заключительный урок курса. Он объединяет материал уроков 1–11 и ведёт к итоговой записи свободного диалога.\n\n## Как устроен урок\nТеория (разделы 1–9), практика (разделы 10–17), контроль и итоговая оценка (разделы 18–21). Сначала прочитайте теорию целиком, затем работайте с практикой и возвращайтесь к теории по мере необходимости. Цель: вести разговор на английском 15 минут с партнёром на знакомые темы, поддерживая диалог вопросами, реакциями и переходами, и оценить свой прогресс по итоговой записи.\n\n## Раздел 0. Научная основа метода\n1. Диалог — взаимодействие. В свободном диалоге важны не только грамматика и словарь, но и умение слушать, реагировать, задавать вопросы, менять тему и корректировать непонимание (интерактивная компетенция).\n2. Структура помогает. Разговор имеет типовую структуру (открытие, основная часть, закрытие) и приёмы поддержки. Знание структуры снижает тревогу.\n3. Реплики-реакции (backchannels). Слушающий постоянно сигнализирует, что слушает (uh-huh, really?). Без этого партнёр чувствует, что говорит в пустоту.\n4. Беглость и точность. В диалоге вы балансируете между ними. Цель — понятность и естественность (см. урок 9 курса КГБ).\n5. Повторение задачи и обратная связь. Регулярные записи диалогов и их разбор повышают беглость и уверенность.\n6. Рефлексия. Итоговая оценка прогресса — часть обучения: она показывает, что вы уже умеете, и определяет цели.\n\n## Раздел 1. Структура диалога на 15 минут\nТипичный сценарий свободного диалога:\n1) Открытие (0–1 мин): приветствие, small talk. Hi! How are you? How's your week?\n2) Личные темы (1–4 мин): работа, семья, увлечения, планы на выходные.\n3) Основная тема 1 (4–8 мин): путешествия, работа и хобби, еда, фильмы, технологии.\n4) Основная тема 2 (8–11 мин): более глубокий разговор, история, рассказ, сравнение.\n5) Мнения и гипотетические вопросы (11–13 мин): What do you think about...? What would you do if...?\n6) Подведение итогов и закрытие (13–15 мин): благодарность, планы на будущее, прощание.\nСовет: не планируйте дословно, но держите в голове маршрут и запас вопросов.\nМнемоника для small talk: FORD — Family, Occupation, Recreation, Dreams (семья, работа, отдых, мечты). Эти темы подходят для знакомства.\n\n## Раздел 2. Как задавать вопросы и поддерживать тему\nОткрытые вопросы (требуют развёрнутого ответа): What do you like about...? How did you start...? Why do you think...? What was it like?\nЗакрытые (да/нет): Do you like...? Have you ever...? Они хороши для начала, но нужны уточнения.\nУточняющие вопросы (follow-up): And then what happened? How did you feel? Why is that? Can you tell me more about that? What do you mean?\nВопросы о чувствах и мнениях: How did you feel about it? What did you think of it? Do you agree?\nПравило «ответ + деталь + встречный вопрос» (урок 1): ответ, добавьте деталь, верните вопрос. I love hiking. I go every weekend. What about you?\nДайте партнёру говорить: баланс разговора примерно поровну. Не монополизируйте и не молчите.\nВежливые косвенные вопросы: I was wondering if you could tell me... / Do you mind if I ask...? / Would you mind telling me...?\nВопросы с How come? (почему так получилось, разговорное): How come you didn't call?\n\n## Раздел 3. Реплики-реакции и активное слушание\nКороткие реакции: Uh-huh. Mm-hmm. Right. I see. Yeah. Okay. Sure.\nРеакции с интересом: Really? Wow! That's interesting. That sounds great. How exciting! No way! (удивление, США)\nРеакции с сочувствием: Oh, I'm sorry to hear that. That must be hard. Poor you.\nРеакции согласия: Me too. So do I. Exactly. I know what you mean.\nУточняющие реакции: Sorry? Pardon? You mean...? Right, so...\nПовторение для подтверждения: So you moved to Almaty when you were six? Right.\nНевербально: кивайте, поддерживайте зрительный контакт (в вашей культуре), улыбайтесь.\nОшибка: слушать молча. Партнёр воспринимает это как отсутствие интереса.\n\n## Раздел 4. Смена темы и плавные переходы\nПереход к новой теме: By the way, ... / Speaking of which, ... / That reminds me, ... / On a different note, ... / Changing the subject, ...\nВозврат к предыдущей теме: Going back to what you said earlier, ... / As we were saying, ...\nЗавершение темы: Anyway, ... / Well, that's interesting. / I see.\nЕсли тема закончилась: заранее подготовьте 5–6 вопросов-запасных: What are you doing this weekend? Have you watched any good films lately? What's your favorite place in the city?\nТишина: короткая пауза нормальна. Заполните вопросом: So, tell me about your...\nПрерывание вежливо: Sorry to interrupt, but... Could I just add something? Can I say something here?\n\n## Раздел 5. Сторителлинг и описание\nРассказ строится по схеме: обстановка, завязка, развитие, развязка, оценка (урок 6).\nПриёмы живого рассказа: прямая речь (He said, \"...\"), эмоции (I was so nervous), детали (the room was cold), паузы, вопросы к слушателю (You know what happened next?).\nСравнения: That was the best/worst meal I've ever had. It was like...\nРассказ с Present Perfect: I've never been so tired in my life.\nЕсли не хватает слова: описывайте (урок 2 КГБ): It's something you use for...\n\n## Раздел 6. Повторение грамматики и лексики курса\nКонтрольный перечень (если что-то неуверенно, вернитесь к уроку):\n- Урок 1: be, представление, числа, алфавит.\n- Урок 2: семья, have, 's, артикли, Present Simple.\n- Урок 3: еда, исчисляемые и неисчисляемые, would like.\n- Урок 4: направления, непрямые вопросы.\n- Урок 5: покупки, цены, сравнения, too и enough.\n- Урок 6: Past Simple, Past Continuous, used to.\n- Урок 7: будущее (will, going to), First Conditional, might.\n- Урок 8: работа, хобби, Present Simple и Continuous, -ing и to.\n- Урок 9: здоровье, Present Perfect (for, since), should.\n- Урок 10: путешествия, Present Perfect для опыта, Second Conditional, must.\n- Урок 11: мнения, связки, PEEL, относительные придаточные.\n\n## Раздел 7. Дополнительные структуры для живой речи\nРазделительные вопросы (tag questions): утверждение + короткий вопрос, часто для проверки или вовлечения.\n- Положительное утверждение → отрицательный хвост: It's cold, isn't it?\n- Отрицательное → положительный: You don't like coffee, do you?\n- I am → aren't I?: I'm late, aren't I?\n- Повелительное: Open the door, will you? Let's go, shall we?\n- Падение тона: вы уверены (ждёте согласия). Подъём тона: вы действительно спрашиваете.\nКосвенная речь (reported speech): передача слов другого: She said (that) she was tired. He told me (that) he would call. Сдвиг времён: is → was, will → would, present perfect → past perfect. Для вопросов: He asked me where I lived.\nЖелание и сожаление: I wish I had more time. If only I could speak better English.\nПредпочтения: I'd rather stay at home. I prefer tea to coffee.\nВыражения неопределённости: sort of, kind of, I guess, maybe, probably.\nРазговорные усилители: really, totally, absolutely, pretty (довольно), quite (UK: довольно; US: очень).\n\n## Раздел 8. Темы для разговора и банк вопросов\nТемы и вопросы:\n1) Семья и друзья: Do you have a big family? What do you do together? Who do you spend the most time with?\n2) Работа и учёба: What do you do? What do you like about it? What was your first job?\n3) Хобби: What do you do in your free time? How did you start? How often do you do it?\n4) Путешествия: Where have you been? What was your best trip? Where would you like to go?\n5) Еда: What's your favorite dish? Can you cook? What was the best meal you've had?\n6) Фильмы и книги: What's the last film you watched? What kind of books do you like?\n7) Технологии: What apps do you use every day? Is technology good or bad for us?\n8) Город и жильё: What do you like about your city? What would you change?\n9) Здоровье и спорт: Do you exercise? How do you stay healthy?\n10) Прошлое и детство: What was your childhood like? What games did you play?\n11) Планы и мечты: What are you doing next weekend? What do you want to achieve this year?\n12) Культура и традиции: What traditions do you have? What holidays do you like?\nНейтральные темы для знакомства: избегайте политики, религии, денег. Если собеседник затрагивает острую тему, вежливо смените её: That's a complex topic. Anyway, ...\n\n## Раздел 9. Культура разговора и произношение\nКультура:\n- Зрительный контакт и жесты зависят от культуры. Следите за реакцией партнёра.\n- Принято задавать вопросы, чтобы показать интерес, но не слишком личные.\n- Перебивать допустимо мягко, но не постоянно.\n- Тишина 2–3 секунды допустима. Не бойтесь паузы.\n- Комплименты вежливы: That's a great idea. You speak very well.\nПроизношение и ритм:\n- Сохраняйте слабые формы и ударение (урок 7 КГБ).\n- Интонация: вопросы с падением (wh-вопросы), подъёмом (да/нет), падением-подъёмом (вежливое несогласие).\n- Реплики-реакции: Really? ↗ (удивление), I see. ↘ (понимание), That's interesting! ↘ (интерес, широкий диапазон).\n- Темп: средний, без спешки. Дышите между смысловыми группами.\n\n## Раздел 10. Практика 1. Уточняющие вопросы\nПридумайте 3 уточняющих вопроса к каждому утверждению: 1) I love hiking. 2) I work in a small company. 3) I went to Italy last summer. 4) I'm learning to play the guitar. 5) I have two sisters.\n\n## Раздел 11. Практика 2. Реплики-реакции\nПодберите реакцию: 1) I just won a prize! 2) I lost my phone yesterday. 3) I'm moving to London next year. 4) I don't like coffee. 5) I finished the project last night.\nВарианты: a) Me neither. b) Wow, congratulations! c) Oh, I'm sorry to hear that. d) That sounds exciting! e) Really? That's great.\n\n## Раздел 12. Практика 3. Смена темы\nСоставьте переход между парами тем: 1) работа → путешествия 2) еда → здоровье 3) хобби → планы на выходные. Используйте By the way, Speaking of which, That reminds me.\n\n## Раздел 13. Практика 4. Вежливые косвенные вопросы\nПерепишите: 1) Where do you live? 2) How old are you? 3) What do you do? 4) Do you like your job? 5) When did you start learning English?\n\n## Раздел 14. Практика 5. Разделительные вопросы и косвенная речь\nДобавьте хвост: 1) It's a nice day, ___? 2) You don't like coffee, ___? 3) She's from Almaty, ___? 4) They aren't coming, ___?\nПерескажите: 1) She said: \"I'm tired.\" 2) He said: \"I will call you.\" 3) She asked: \"Where do you live?\"\n\n## Раздел 15. Практика 6. Ролевые диалоги\nРазыграйте по 5–10 минут с записью:\n1) Знакомство на вечеринке (small talk, FORD).\n2) Встреча с другом после долгой разлуки (рассказ о новостях).\n3) Дискуссия на тему: большой город или деревня.\n4) Планирование поездки вдвоём.\n5) Рассказ о любимом фильме или книге и обсуждение.\n6) Обмен историями о смешных случаях.\n7) Разговор о планах на год.\n8) Свободная беседа на выбранную тему (10–15 минут).\nПартнёр следит за балансом, задаёт уточняющие вопросы и записывает расхождения.\n\n## Раздел 16. Практика 7. Чтение, диктовка, говорение, письмо\nОбразец диалога (вымышленный) с аннотацией приёмов:\nA: Hi, Dana! How's your week going? (открытие)\nB: Pretty good, thanks! A bit busy, but good. How about you?\nA: Same here. By the way, how was your weekend? (переход)\nB: Great! We went hiking in the mountains.\nA: Really? That sounds fun! Where did you go? (реакция, вопрос)\nB: To a place near the lake. The weather was perfect.\nA: Uh-huh. Do you hike often? (реакция)\nB: Not really, once a month or so. What about you? Do you have any hobbies?\nA: I'm learning to play the guitar. I've been practicing for about a year.\nB: Wow! How did you start? (вопрос, уточнение)\nA: A friend lent me his guitar, and I fell in love with it.\nB: That's so cool. Speaking of music, have you heard any good bands lately? (смена темы)\nВопросы: 1) What did Dana do at the weekend? 2) How often does she hike? 3) What is Arman learning? 4) How did he start? 5) Назовите три приёма поддержки беседы.\nДиктовка: How's your week going? That sounds interesting! Could I ask you something? By the way, how was your weekend? Speaking of music, do you play any instruments?\nГоворение: проведите 15-минутный свободный диалог с партнёром (раздел 1), запишите. Сделайте паузу и повторите с другой темой.\nПисьмо: напишите на 120–150 слов, что вам даётся легче и что сложнее в свободном диалоге и какие приёмы вы будете использовать дальше.\n\n## Раздел 17. Ключи\nПрактика 2: 1-b, 2-c, 3-d, 4-a, 5-e.\nПрактика 4 (образцы): 1) Could you tell me where you live? 2) Do you mind telling me how old you are? 3) I was wondering what you do. 4) Could you tell me if you like your job? 5) Do you remember when you started learning English?\nПрактика 5: 1) isn't it 2) do you 3) isn't she 4) are they. 1) She said she was tired. 2) He said he would call me. 3) She asked me where I lived.\nПрактика 7 (чтение): 1) She went hiking in the mountains. 2) About once a month. 3) The guitar. 4) A friend lent him a guitar. 5) Реакции (Really? Uh-huh. Wow!), открытые вопросы (How did you start?), переходы (By the way, Speaking of music).\n\n## Раздел 18. Итоговая запись и оце
