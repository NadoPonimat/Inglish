const LESSONS={"kgb": [{"t": "УРОК 1. АРТИКУЛЯЦИЯ: ПОСТАНОВКА ЗВУКОВ АМЕРИКАНСКОГО АНГЛИЙСКОГО (РАСШИРЕННЫЙ КУРС)\nОбъём: 4 недели, 5–6 дней в неделю по 45–60 минут (около 20–25 часов). Уровень: с нуля до уверенного.\nОсновной эталон: американский английский (General American). Британский вариант отмечен там, где он заметно отличается.\n\n## Как устроен урок\nУрок состоит из теории (разделы 1–9), практики (разделы 10–17) и контроля (разделы 18–20). Сначала один раз прочитайте теорию, затем работайте с практикой и возвращайтесь к теории по мере необходимости. Звуки ставятся ушами, ртом и записью. Без записи себя и сравнения с эталоном урок работать не будет.\n\n## Раздел 0. Научная основа метода\n1. Слух ведёт речь. Мы воспроизводим те различия, которые слышим. Русскоговорящий не слышит разницы между ship и sheep, пока слух не обучен. Поэтому начинаем с различения на слух, и только затем с произнесения.\n2. Артикуляционная база. Привычное положение языка и губ определяет акцент сильнее, чем отдельные ошибки (раздел 1).\n3. Минимальные пары. Слова, различающиеся одним звуком, показывают, какой именно контраст нужно слышать и произносить.\n4. Многократное осмысленное повторение. Короткие ежедневные занятия эффективнее редких длинных.\n5. Обратная связь. Запись голоса и сравнение с эталоном (шэдоуинг) дают объективную картину. Если есть возможность, один раз в неделю показывайте запись человеку, хорошо знающему язык.\n\n## Раздел 1. Артикуляционная база\nАртикуляционная база — привычное положение органов речи в покое и в речи.\nРусская база (упрощённо): язык часто выдвинут вперёд и приподнят к нёбу, много смягчённых (палатализованных) согласных, губы относительно неподвижны, безударные гласные сильно редуцируются.\nАнглийская база (американский вариант): язык оттянут назад и «собран», кончик активен, губы заметнее участвуют (особенно в /w/, /ɹ/, /ʃ/), согласные не смягчаются, ударные слоги длиннее и энергичнее, безударные слабые и короткие.\nУпражнение «база» (3 минуты в начале каждой тренировки):\n1) оттяните язык назад и расслабьте; 2) слегка округлите губы вперёд; 3) протяните /ɜː/ как в bird 10 секунд; 4) повторите /ɹ-ɹ-ɹ/ без дрожания кончика языка; 5) произнесите «ɜː, ɹ, w, ʃ» плавной цепочкой.\n\n## Раздел 2. Классификация согласных (для понимания, не для заучивания)\nСогласные описываются тремя признаками: место образования (где преграда), способ (как образуется) и звонкость (есть ли голос).\n- Взрывные: /p b/ (губы), /t d/ (кончик языка у альвеол), /k ɡ/ (спинка языка у мягкого нёба).\n- Щелевые (фрикативные): /f v/, /θ ð/, /s z/, /ʃ ʒ/, /h/.\n- Аффрикаты: /tʃ/ (church), /dʒ/ (judge).\n- Носовые: /m n ŋ/.\n- Сонорные: /l ɹ w j/.\nЗвонкие и глухие пары: p-b, t-d, k-ɡ, f-v, θ-ð, s-z, ʃ-ʒ, tʃ-dʒ. Чтобы проверить звонкость, положите пальцы на горло: при звонком звуке есть вибрация.\n\n## Раздел 3. Американская система гласных\nМонофтонги: /iː/ beat, /ɪ/ bit, /ɛ/ bet, /æ/ bat, /ɑː/ father, /ɔː/ thought, /ʊ/ book, /uː/ boot, /ʌ/ but, /ə/ about (шва), /ɝ/ bird.\nДифтонги: /eɪ/ bait, /aɪ/ time, /ɔɪ/ boy, /aʊ/ now, /oʊ/ boat.\nЗаметка: во многих американских вариантах /ɑː/ и /ɔː/ не различаются (слияние cot и caught). Это нормальный вариант. В британском (RP) эти гласные различаются.\nПризнаки: долгота (/iː/ длиннее /ɪ/), напряжённость (/iː/ с растянутыми губами, /ɪ/ расслабленный), положение языка (высоко/низко, вперёд/назад).\nГлавная трудность для русскоговорящего: в русском долгота гласных не различает слова, а в английском различает.\n\n## Раздел 4. Межзубные /θ/ и /ð/\nАртикуляция: кончик языка слегка высовывается между зубами или лежит у краёв верхних зубов. Воздух проходит в щель.\n/θ/ — глухой: think /θɪŋk/, three /θriː/, thank /θæŋk/, month /mʌnθ/.\n/ð/ — звонкий: this /ðɪs/, mother /ˈmʌðər/, they /ðeɪ/, breathe /briːð/.\nГде что: /ð/ обычно в служебных словах (the, this, that, they, then) и в словах типа mother, brother, weather; /θ/ в словах с содержанием (think, thing, thanks).\nТипичные ошибки и лечение:\n- /s, z/ вместо /θ, ð/: язык спрятан за зубами. Вытяните язык вперёд, смотрите в зеркало.\n- /f, v/: язык давит на нижнюю губу. Верхние зубы касаются языка, не губы.\n- /t, d/: язык упирается в нёбо, звук взрывной. Воздух должен идти непрерывно.\nМинимальные пары: think / sink; thank / tank; three / free / tree; thin / tin / sin; those / doze; then / den.\n\n## Раздел 5. /w/, /v/, /j/, /h/\n/w/: губы округлены и выдвинуты вперёд, затем быстро раскрываются. Зубы с губой не соприкасаются.\n/v/: верхние зубы касаются нижней губы, голос есть.\nПары: west / vest; wine / vine; worse / verse; wiper / viper.\n/j/ (yes /jɛs/): язык поднимается к нёбу и тут же уходит в гласный. Это не русский слоговой «й» и не мягкость согласного.\n/h/: простой выдох из горла без трения (house /haʊs/, behind /bɪˈhaɪnd/). Не русское «х».\n\n## Раздел 6. Американское /ɹ/ и /l/\n/ɹ/: язык не касается нёба, не дрожит. Два способа: загнутый (кончик поднят и чуть загнут назад, не касаясь нёба) и собранный (кончик опущен, спинка поднята, корень оттянут). Выберите тот, что получается легче, и держите стабильно. Губы слегка округлены в начале слова (red, right, road). Не вставляйте русское «р». Write не «райт», а /ɹaɪt/.\nБританский (RP): конечное r без последующего гласного не произносится (car /kɑː/). В американском произносится (car /kɑːɹ/).\n/l/: два варианта. Светлый /l/ перед гласными (like, leaf): кончик у альвеол, спинка не поднимается к нёбу. Тёмный /l/ в конце слога (full /fʊl/, milk): язык оттянут назад. Русскоговорящие часто смягчают /l/ как в «ль». Следите, чтобы /l/ в like не был мягким.\n\n## Раздел 7. Шипящие и аффрикаты, палатализация\n/ʃ/ (ship) не мягкое «щ» и не русское «ш» с округлёнными губами; губы слегка вытянуты вперёд. /ʒ/ (vision /ˈvɪʒən/) звонкая пара.\n/tʃ/ (church): состоит из /t/ и /ʃ/, не мягкий русский «ч». Не смягчайте: chip /tʃɪp/ не «чьип».\n/dʒ/ (job): как русский «дж», но без смягчения.\nПалатализация: русские согласные смягчаются перед /i/, /e/. В английском согласные остаются твёрдыми: tea /tiː/, deep /diːp/, sit /sɪt/ без смягчения.\nУпражнение: sheep, cheap, sip, chip; vision, television, usual; jam, gym, major.\n\n## Раздел 8. Гласные: контрасты\n- /ɪ/ и /iː/. Пары: ship / sheep; bit / beat; live / leave; sit / seat; hill / heel.\n- /ʊ/ и /uː/. Пары: full / fool; pull / pool; look / Luke.\n- /æ/ и /ɛ/. Пары: bad / bed; man / men; pan / pen; bat / bet.\n- /ʌ/ и /ɑː/. Пары: cup / cop; luck / lock; hut / hot.\nМетод: произносите пару, сначала утрируя разницу (долгий намного длиннее), потом снижая контраст до естественного.\nШва /ə/: самый частый звук английского, безударный нейтральный гласный: about /əˈbaʊt/, banana /bəˈnænə/. Его нужно слышать и произносить, а не заменять чёткими гласными.\n\n## Раздел 9. Придыхание, конечное озвончение и /ŋ/\nПридыхание (аспирация): /p t k/ в начале ударного слога произносятся с выдохом воздуха. Проверка: поднесите ладонь или лист бумаги ко рту. На pin лист колеблется, на spin почти нет. Пары: pin / spin; top / stop; kill / skill.\nКонечное озвончение: конечные звонкие остаются звонкими, а гласный перед ними длиннее. Русскоговорящие оглушают (bed → bet). Пары: bed / bet; bad / bat; back / bag; rice / rise; ice / eyes; seat / seed.\n/ŋ/: носовой звук, спинка языка поднята к мягкому нёбу, воздух идёт через нос, звука «г» нет. Контраст: singer /ˈsɪŋər/ (без г) и finger /ˈfɪŋɡər/ (с г).\n\n## Раздел 10. Практика 1. Диагностика (первый день)\nПрочитайте вслух и запишите на диктофон текст:\nOn Thursday, three friends thought about the weather. This was worse than last week, so they went west by ship with warm wine and thick bread. A sheep sat by the sea and sang a long song. Bob's bed was bad, but his red rug was good.\nПрослушайте и отметьте: где язык прятался за зубами, где звучало «в» вместо /w/, где звонкие в конце слова оглохли, где /ɹ/ дрожало. Сохраните запись: вы сравните её с записью в конце урока.\n\n## Раздел 11. Практика 2. Различение на слух и по транскрипции\nА) Определите, какой звук в слове: /θ/ или /ð/: think, this, mother, three, they, bath, breathe, thanks, weather, month.\nБ) Прочитайте транскрипцию и запишите слово: /ʃɪp/, /ʃiːp/, /wɛst/, /vaɪn/, /θriː/, /ˈmʌðər/, /bæd/, /bɛd/, /sɪŋ/, /ˈfɪŋɡər/.\nВ) Выберите слово с долгим гласным: sit / seat; full / fool; hill / heel; pull / pool; live / leave; bit / beat.\nГ) Выберите слово по смыслу и произнесите его с правильным конечным звуком: 1) I sleep in a ___ (bed / bet). 2) The weather is ___ today (bad / bat). 3) I carry my things in a ___ (back / bag). 4) The sun will ___ at six (rice / rise). 5) Please take a ___ (seat / seed). 6) Put some ___ in the drink (ice / eyes).\nД) Придыхание: в каких словах /p, t, k/ с придыханием: pin, spin, top, stop, kill, skill, cat, scat.\n\n## Раздел 12. Практика 3. Минимальные пары (по 5 кругов на пару)\n- Межзубные: think / sink; thank / tank; three / free / tree; thin / tin / sin; those / doze; then / den.\n- /w/ и /v/: west / vest; wine / vine; worse / verse.\n- Гласные: ship / sheep; bit / beat; full / fool; bad / bed; cup / cop.\n- Конечное озвончение: bed / bet; bad / bat; back / bag; rice / rise.\n- Придыхание: pin / spin; top / stop; kill / skill.\nМетод: сначала произнесите пару медленно с утрированным контрастом, затем в темпе, затем в предложении.\n\n## Раздел 13. Практика 4. Скороговорки (по 3 минуты, сначала медленно)\n- Three thin thieves thought they thrilled the throne.\n- This is the weather my mother likes.\n- Very well, we will visit Victoria's vineyard.\n- She sells sea shells by the sea shore.\n- A big black bug bit a big black bear.\nЦель: чёткость при росте темпа, а не скорость сама по себе.\n\n## Раздел 14. Практика 5. Чтение с акцентом на звуки\nПрочитайте вслух, следя за конкретными звуками:\n1) Thirty-three thin things. 2) Weather and whether. 3) Wine is sweet; vine is green. 4) The ship carries sheep. 5) He sings a song and brings a finger ring.\nОтметьте в каждом предложении звуки, которые вам даются хуже всего, и вернитесь к соответствующим разделам.\n\n## Раздел 15. Практика 6. Шэдоуинг (повтор за диктором)\nВыберите аудио 1–2 минуты (подкаст, диалог, фрагмент новостей) на американском английском. Прослушайте 3 раза, затем повторяйте вслух за диктором с задержкой в 1–2 слова. Цель: копировать звуки и интонацию. Запишите себя и сравните с оригиналом. Ежедневно по 10 минут с недели 2.\n\n## Раздел 16. Практика 7. Словарь урока\nВ словарь сайта добавляются 20 слов (отметьте тему пройденной). Для каждого слова запишите транскрипцию, произнесите 5 раз, составьте предложение и повторяйте по карточкам. Дополнительно ведите личный список слов, в которых вы ошибались в произношении.\n\n## Раздел 17. Практика 8. Мини-диалоги на целевые звуки\n1) A: Where's the vest? B: It's in the west room. A: Which vest? B: The warm one.\n2) A: Do you think this is the right weather? B: I think it's worse than Thursday.\n3) A: Is this a ship or a sheep? B: It's a sheep on a ship.\nРазыграйте с партнёром, затем поменяйтесь ролями, запишите, прослушайте.\n\n## Раздел 18. Ключи\nПрактика 2:\nА) think θ, this ð, mother ð, three θ, they ð, bath θ, breathe ð, thanks θ, weather ð, month θ.\nБ) ship, sheep, west, vine, three, mother, bad, bed, sing, finger.\nВ) seat, fool, heel, pool, leave, beat.\nГ) bed, bad, bag, rise, seat, ice.\nД) С придыханием: pin, top, kill, cat. Без: spin, stop, skill, scat.\n\n## Раздел 19. Итоговая диагностика и самооценка\nЗапишите тот же текст из практики 1 и сравните с первой записью. Оцените по 5 критериям, каждый от 0 до 2:\n1) межзубные /θ ð/; 2) /w/ против /v/; 3) /ɹ/ и /l/; 4) длинные и краткие гласные, конечное озвончение; 5) придыхание и чистота согласных без смягчения.\nРезультат: 8–10 баллов — урок усвоен, переходите к уроку 2; 5–7 — повторите слабые разделы две недели; меньше 5 — повторите весь урок.\n\n## Раздел 20. Итоговый тест (15 баллов)\n1) Какой звук в слове this? 2) Какой звук в слове think? 3) Прочитайте /wɛst/. 4) Что звучит с /v/: wine или vine? 5) Какое слово с долгим гласным: sit или seat? 6) Какая пара различается только долготой: ship / sheep или cup / cap? 7) Как произносится sing: /sɪŋ/ или /sɪŋɡ/? 8) Что значит конечное озвончение в слове bad? 9) Какой звук без придыхания: pin или spin? 10) Прочитайте /θriː/. 11) Какое слово имеет /ʃ/: ship или chip? 12) Прочитайте /ˈfɪŋɡər/. 13) В каком слове есть /ð/: mother или month? 14) Что такое шва? 15) Какое слово звонкое в конце: bed или bet?\nОтветы: 1) /ð/ 2) /θ/ 3) west 4) vine 5) seat 6) ship / sheep 7) /sɪŋ/ 8) конечный /d/ остаётся звонким и гласный перед ним длиннее 9) spin 10) three 11) ship 12) finger 13) mother 14) безударный нейтральный гласный /ə/ 15) bed.\nОценка: 13–15 — отлично; 10–12 — хорошо, повторите слабые разделы; меньше 10 — вернитесь к теории и практике.\n\n## План на 4 недели\nНеделя 1: диагностика, база, межзубные /θ ð/, /w v/, /j h/. Практика 1–3.\nНеделя 2: /ɹ/, /l/, шипящие, аффрикаты, палатализация. Практика 3–5, шэдоуинг по 10 минут.\nНеделя 3: гласные, придыхание, конечное озвончение, /ŋ/. Практика 3–6, диалоги.\nНеделя 4: повторение, итоговая диагностика, тест, самооценка.\n\n## Что стоит сверить в книгах\nPeter Roach, «English Phonetics and Phonology»; Ann Baker, «Ship or Sheep?» (тренировка минимальных пар); Cambridge Dictionary и Merriam-Webster (аудио и транскрипция). Транскрипции в разных словарях немного различаются, это нормально.\nВажное замечание: этот урок помогает поставить звуки, но тонкие различия лучше проверять живым слухом. Записывайте себя, сравнивайте с диктором и по возможности просите носителя или опытного преподавателя послушать вас.\n", "w": [["think", "думать", "/θɪŋk/"], ["thought", "мысль, подумал", "/θɔːt/"], ["three", "три", "/θriː/"], ["thin", "тонкий", "/θɪn/"], ["those", "те", "/ðoʊz/"], ["then", "тогда", "/ðɛn/"], ["mother", "мать", "/ˈmʌðər/"], ["weather", "погода", "/ˈwɛðər/"], ["west", "запад", "/wɛst/"], ["vest", "жилет", "/vɛst/"], ["wine", "вино", "/waɪn/"], ["vine", "лоза", "/vaɪn/"], ["ship", "корабль", "/ʃɪp/"], ["sheep", "овца", "/ʃiːp/"], ["full", "полный", "/fʊl/"], ["fool", "дурак", "/fuːl/"], ["bad", "плохой", "/bæd/"], ["bed", "кровать", "/bɛd/"], ["sing", "петь", "/sɪŋ/"], ["finger", "палец", "/ˈfɪŋɡər/"]]}, {"t": "УРОК 2. ЯДРО СЛОВ И ФРАЗЫ-«ПАРОЛИ» (РАСШИРЕННЫЙ КУРС)\nОбъём: 4 недели, 5–6 дней в неделю по 45–60 минут (около 20–25 часов). Уровень: A1–A2.\n\n## Как устроен урок\nТеория (разделы 1–7), практика (разделы 8–15), контроль (разделы 16–18). Сначала прочитайте теорию целиком, затем работайте с практикой и возвращайтесь к теории по мере необходимости. Главное правило урока: слово считается выученным, когда вы можете сами произнести его и использовать в предложении.\n\n## Раздел 0. Научная основа метода\n1. Частотность. Слова в языке распределены неравномерно (закон Ципфа в первом приближении): небольшая группа слов встречается постоянно, а основная масса редко. По оценкам корпусных исследований, несколько сотен частотных слов покрывают значительную долю обычной речи, а две-три тысячи слов обеспечивают понимание большинства повседневных разговоров. Точные цифры зависят от корпуса и метода подсчёта, но направление ясно: начинать нужно с ядра.\n2. Кривая забывания. Исследователь Герман Эббингауз показал, что без повторения новая информация быстро забывается. Повторение через возрастающие промежутки замедляет забывание.\n3. Глубина обработки. Слово запоминается лучше, если с ним что-то сделать: произнести, использовать в предложении, связать со своей жизнью.\n4. Активное вспоминание. Вспоминать полезнее, чем перечитывать.\n5. Выходная речь. Говорение и письмо заставляют замечать пробелы в знаниях.\n\n## Раздел 1. Пассивный и активный словарь, глубина знания слова\nПассивный словарь: слова, которые вы узнаёте при чтении и слушании. Активный: слова, которые вы можете сами произнести и написать. Знание слова включает: произношение, написание, значение, грамматику (часть речи, формы), сочетаемость и стиль. Цель урока — перевести ядро в активный словарь, а не просто узнавать его.\n\n## Раздел 2. Как запоминать слова\n1. Слово в контексте. Учите не travel, а I travel by train.\n2. Блоки (чанки). Английская речь состоит из готовых сочетаний: make a decision, take a break, have lunch. Учите сочетания целиком.\n3. Три контекста. Для каждого слова придумайте 3 предложения о своей жизни.\n4. Активное вспоминание. Закройте перевод и вспомните слово или фразу.\n5. Интервальные повторения. График: в день изучения, на следующий день, через 3, 7, 14 и 30 дней. В сайте для этого есть вкладка «Карточки».\n6. Звук и написание вместе. Произнесите вслух, запишите, проверьте транскрипцию.\n7. Группировка по темам и по словообразованию. Связанные слова запоминаются легче.\n8. Мнемоника. Придумайте образ или созвучие, но не полагайтесь только на него: в речи нужен быстрый доступ, а не история.\n\n## Раздел 3. Словообразование и многозначность\nПриставки и суффиксы расширяют словарь: un- (happy → unhappy), re- (start → restart), -er (teach → teacher, work → worker), -ly (slow → slowly, quick → quickly), -ful (care → careful), -able (read → readable).\nМногозначность: одно слово имеет несколько значений. right: правильный, правый, право; light: свет, лёгкий; play: играть, пьеса. Учите значения по контексту и записывайте примеры к каждому.\nУстойчивые сочетания (коллокации): make a decision / a mistake / a plan; do homework / the dishes / business; take a break / a photo / a bus; have breakfast / a shower / fun; get up / ready / tired; go home / shopping / by bus. Не переводите дословно: сочетание в английском может отличаться от русского.\n\n## Раздел 4. Мини-грамматика ядра\nПорядок слов: подлежащее + глагол + дополнение (I need help). Он фиксирован.\nBe, have, do: be (я есть, быть), have (иметь), do (делать; вспомогательный глагол). Вспомогательный do нужен для отрицаний и вопросов в Present Simple: I don't know. Do you understand? She doesn't know.\nМодальные глаголы: can (мочь, уметь), could (мог бы, вежливая просьба), must (должен), should (следует). После модального идёт глагол без to: I can help. Could you repeat that?\nПовелительное наклонение: глагол без подлежащего. Please sit down. Don't worry. Let's go.\nПредлоги (самые частые): in (внутри, месяцы, годы: in Almaty, in May, in 2026), on (поверхность, дни: on the table, on Monday), at (точка, время: at the station, at 7 o'clock, at night). Дополнительно: to (направление), from (откуда), with (с), for (для), by (на транспорте, около), about (о), after / before (после, до), between (между).\nВопросительные слова: what, where, when, why, who, how. Порядок: вопросительное слово + вспомогательный + подлежащее + глагол.\n\n## Раздел 5. Словарное ядро: блоки по теме\nБлок A. Люди: I (я), you (ты, вы), he (он), she (она), it (оно), we (мы), they (они), man (мужчина), woman (женщина), child (ребёнок), boy (мальчик), girl (девочка), friend (друг), family (семья), mother (мама), father (папа), brother (брат), sister (сестра), son (сын), daughter (дочь), people (люди), person (человек), name (имя), boss (начальник), neighbour (сосед).\nБлок B. Действия (глаголы): be (быть), have (иметь), do (делать), say (сказать), go (идти), get (получить, становиться), make (делать, создавать), know (знать), think (думать), take (брать), see (видеть), come (приходить), want (хотеть), look (смотреть), use (использовать), find (находить), give (давать), tell (рассказывать), work (работать), call (звонить, называть), try (пытаться), ask (спрашивать), need (нуждаться), feel (чувствовать), become (становиться), leave (уходить, оставлять), put (класть), mean (значить), keep (держать), let (позволять), begin (начинать), help (помогать), talk (говорить), turn (поворачивать), start (начинать), show (показывать), hear (слышать), play (играть), run (бегать), move (двигаться), like (нравиться), live (жить), believe (верить), hold (держать), bring (приносить), write (писать), sit (сидеть), stand (стоять), eat (есть), drink (пить), sleep (спать), read (читать), speak (говорить), listen (слушать), understand (понимать), learn (учить), buy (покупать), pay (платить), wait (ждать), finish (заканчивать).\nНеправильные формы запоминайте сразу: go — went — gone; see — saw — seen; take — took — taken; make — made — made; get — got — got/gotten (США); have — had — had; do — did — done; say — said — said; know — knew — known; think — thought — thought.\nБлок C. Существительные: time (время), year (год), day (день), way (путь, способ), thing (вещь), life (жизнь), world (мир), hand (рука), house (дом), room (комната), door (дверь), car (машина), phone (телефон), money (деньги), food (еда), water (вода), city (город), street (улица), shop (магазин), school (школа), hotel (отель), station (станция), work (работа), job (работа, профессия), place (место), problem (проблема), question (вопрос), answer (ответ), word (слово), number (номер, число), price (цена), ticket (билет), bag (сумка), key (ключ), table (стол), window (окно), book (книга), paper (бумага).\nБлок D. Время: today (сегодня), tomorrow (завтра), yesterday (вчера), now (сейчас), later (позже), always (всегда), never (никогда), often (часто), sometimes (иногда), soon (скоро), early (рано), late (поздно), morning (утро), evening (вечер), night (ночь), week (неделя), month (месяц), hour (час), minute (минута).\nБлок E. Качества: good (хороший), bad (плохой), big (большой), small (маленький), new (новый), old (старый), easy (лёгкий), difficult (трудный), hot (горячий), cold (холодный), fast (быстрый), slow (медленный), right (правильный), wrong (неправильный), free (бесплатный, свободный), busy (занятой), ready (готовый), open (открытый), closed (закрытый), near (близкий), far (далёкий), cheap (дешёвый), expensive (дорогой), young (молодой), happy (счастливый), tired (усталый), hungry (голодный), sure (уверенный).\nБлок F. Вопросы и связки: what (что), where (где), when (когда), why (почему), who (кто), how (как), because (потому что), but (но), and (и), or (или), if (если), so (поэтому), also (также), too (тоже, слишком), very (очень), really (действительно), just (только что, просто), only (только), again (снова), still (всё ещё), already (уже), maybe (возможно).\nБлок G. Предлоги: in, on, at, to, from, with, without, for, of, about, by, near, under, behind, between, after, before.\nПродолжайте по тому же принципу: числа 1–100, цвета, еда, части тела, одежда, погода, транспорт. Цель: около 300 слов за 4 недели, то есть около 12 новых слов в день.\n\n## Раздел 6. Фразы-«пароли»\nКогда не поняли:\n1) Sorry? / Pardon? 2) Sorry, I didn't catch that. (Извините, не расслышал.) 3) Could you say that again, please? (Повторите, пожалуйста.) 4) Could you speak more slowly? (Говорите медленнее.) 5) What does ... mean? (Что значит ...?) 6) How do you say ... in English? (Как сказать ... по-английски?) 7) How do you spell that? (Как это пишется?) 8) I don't understand. (Я не понимаю.)\nКогда не знаете слова:\n9) I don't know the word. 10) It's like a ... (Это что-то вроде ...) 11) What do you call this? (Как это называется?) 12) It's something you use for ... (Это то, чем пользуются для ...) 13) I mean ... (Я имею в виду ...) 14) Do you know what I mean? (Понимаете, о чём я?)\nКогда нужно время подумать:\n15) Let me think. 16) Just a moment, please. 17) Give me a second. 18) Well... 19) That's a good question.\nПросьбы и вежливость:\n20) Excuse me, could you help me? 21) Could I have ..., please? 22) Can I ask you a question? 23) Would you mind ...? (Вы не возражаете ...?) 24) Thank you so much. 25) You're welcome. 26) No problem. 27) Sorry to bother you. (Простите за беспокойство.)\nСогласие и несогласие:\n28) I agree. 29) I don't agree. 30) I'm not sure. 31) Maybe. 32) That's right. 33) Exactly.\nПомощь и срочные ситуации:\n34) I need help. 35) I'm lost. (Я заблудился.) 36) Where is the nearest ...? (Где ближайший ...?) 37) Is there anyone who speaks Russian? 38) I don't speak English very well. 39) Please call ... 40) It's an emergency. (Это срочно, чрезвычайная ситуация.) Номера экстренных служб зависят от страны: в США 911, в Великобритании 999, в странах ЕС 112.\nОсобенность: could вежливее, чем can. Could you ...? уместнее при просьбе незнакомому.\n\n## Раздел 7. Произношение: слабые формы и ритм\nСлабые формы (быстрая речь): Could you → /kʊd ju/ или /ˈkʊdʒə/. Don't know → /doʊn(t) noʊ/. Excuse me → /ɪkˈskjuːz mi/. Thank you → /ˈθæŋk ju/ или /ˈθæŋkjə/. What do you → /wʌdʒə/ в быстрой речи. Can → /kən/ слабое в середине фразы, /kæn/ в конце и при ударении.\nИнтонация: просьбы обычно с подъёмом в конце (Could you say that AGAIN? ↗), утверждения с падением (I don't know. ↘).\nТренировка: сначала фраза медленно и чётко, затем в темпе речи, затем с естественной интонацией.\n\n## Раздел 8. Практика 1. Фразы\nПереведите на английский: 1) Извините, я не расслышал. 2) Повторите, пожалуйста. 3) Говорите медленнее. 4) Что значит это слово? 5) Как это называется? 6) Дайте мне секунду. 7) Я не уверен. 8) Мне нужна помощь.\n\n## Раздел 9. Практика 2. Подберите слово\nВставьте слово из ядра: 1) I ___ to go home. (want) 2) Can you ___ me? (help) 3) She ___ English every day. (learns/speaks) 4) We need to ___ a taxi. (call/take) 5) Please ___ the door. (open/close) 6) I ___ the answer. (know) 7) He ___ at a hotel. (works/lives) 8) We ___ to the station. (go)\nДопустимы несколько ответов, главное, чтобы форма глагола была верной.\n\n## Раздел 10. Практика 3. Коллокации\nПодберите make, do, take, have, get или go: 1) ___ a decision. 2) ___ homework. 3) ___ a break. 4) ___ breakfast. 5) ___ up at seven. 6) ___ shopping. 7) ___ a mistake. 8) ___ a photo. 9) ___ a shower. 10) ___ the dishes.\n\n## Раздел 11. Практика 4. Предлоги in, on, at\n1) ___ Monday. 2) ___ 7 o'clock. 3) ___ May. 4) ___ the table. 5) ___ the station. 6) ___ Almaty. 7) ___ 2026. 8) ___ night. 9) ___ the weekend. 10) ___ the morning.\n\n## Раздел 12. Практика 5. Словообразование\nОбразуйте слово: quick → (наречие), work → (человек), kind → (противоположное), play → (человек), careful → (наречие).\nТрансформируйте просьбы в вежливые: 1) Can you help me? 2) Open the door. 3) Speak slower.\n\n## Раздел 13. Практика 6. Блиц и ролевая игра\nБлиц по таймеру: за 60 секунд назвать вслух с переводом 20 слов из блока B.\nРолевая игра: партнёр A говорит быстро и использует незнакомые слова, партнёр B реагирует только фразами-паролями (раздел 6). Меняйтесь ролями. 5 минут.\n\n## Раздел 14. Практика 7. Чтение и диктовка\nЧтение. Прочитайте текст и ответьте на вопросы.\nI am in a new city. I need a hotel. I ask a man in the street, \"Excuse me, could you help me? Where is the nearest hotel?\" He says, \"It's near the station, on Green Street.\" I say, \"Sorry, could you say that again, please?\" He repeats it slowly. I say, \"Thank you so much.\" He says, \"No problem.\"\nВопросы: 1) What does the man need? (Who needs a hotel?) 2) Where is the hotel? 3) Why does the man repeat it? 4) What does the man say at the end?\nДиктовка: Could you speak more slowly? I don't know the word. Where is the nearest station? Please give me a second. It's an emergency.\n\n## Раздел 15. Практика 8. Письмо\nВыберите 10 слов из ядра и по методу трёх контекстов составьте по 3 предложения про свою жизнь (всего 30). Проверьте: глаголы согласованы, артикли стоят, нет типичных ошибок.\n\n## Раздел 16. Ключи\nПрактика 1: 1) Sorry, I didn't catch that. 2) Could you say that again, please? 3) Could you speak more slowly? 4) What does this word mean? 5) What do you call this? 6) Give me a second. 7) I'm not sure. 8) I need help.\nПрактика 3: make a decision; do homework; take a break; have breakfast; get up at seven; go shopping; make a mistake; take a photo; have a shower; do the dishes.\nПрактика 4: on, at, in, on, at, in, in, at, on (США) / at (Британия), in.\nПрактика 5: quickly, worker, unkind, player, carefully. Вежливые просьбы: 1) Could you help me? 2) Could you open the door, please? 3) Could you speak more slowly, please?\nПрактика 7 (чтение): 1) Who needs a hotel: the narrator (я). 2) Near the station, on Green Street. 3) Because the narrator asks him to say it again. 4) No problem.\n\n## Раздел 17. Итоговая самооценка\nОцените по 5 критериям, каждый от 0 до 2:\n1) я знаю и произношу 250–300 слов без подсказок; 2) я использую слова в предложениях; 3) я произношу 40 паролей естественно; 4) я использую график интервальных повторений; 5) я правильно использую in, on, at и коллокации.\nРезультат: 8–10 баллов — переходите к уроку 3; 5–7 — повторите слабые разделы; меньше 5 — повторите урок.\n\n## Раздел 18. Итоговый тест (15 баллов)\n1) Как сказать «Я не расслышал»? 2) Как вежливо попросить говорить медленнее? 3) ___ Monday. 4) ___ 7 o'clock. 5) ___ homework (do или make). 6) Что вежливее: Can you или Could you? 7) «Дайте мне секунду» по-английски. 8) ___ do you call this? 9) Прошедшая форма go. 10) Множественное число child. 11) Что значит I'm lost? 12) Образуйте существительное от teach. 13) Напишите словами 15 и 50. 14) Sorry, could you ___ that again? 15) Какие слова нужно учить в первую очередь и почему?\nОтветы: 1) Sorry, I didn't catch that. 2) Could you speak more slowly? 3) on 4) at 5) do 6) Could you 7) Give me a second. 8) What 9) went 10) children 11) Я заблудился. 12) teacher 13) fifteen, fifty 14) say 15) Частотное ядро, потому что оно покрывает основную часть повседневной речи.\nОценка: 13–15 — отлично; 10–12 — хорошо, повторите слабые разделы; меньше 10 — вернитесь к теории и практике.\n\n## План на 4 недели\nНеделя 1: блок A, часть блока B (первые 25 глаголов), пароли 1–14. Мини-грамматика (раздел 4). Ежедневно 12 слов и 10 минут карточек.\nНеделя 2: остальные глаголы блока B и блок C, пароли 15–27. Практика 1–3.\nНеделя 3: блоки D, E, F, G, пароли 28–40. Практика 4–5, блиц.\nНеделя 4: повторение всех блоков, ролевые игры, чтение, письмо, итоговая самооценка и тест.\n\n## Что стоит сверить в книгах\nCambridge Dictionary, Oxford Learner's Dictionaries и список Oxford 3000 (рекомендуемые частотные слова); English Vocabulary in Use (Cambridge University Press); Raymond Murphy, «English Grammar in Use». Для слабых форм: Peter Roach, «English Phonetics and Phonology».\nВажное замечание: списки частотных слов в разных источниках немного различаются, это нормально. Главное — регулярность и использование слов в речи.\n", "w": [["could", "мог бы (вежливо)", "/kʊd/"], ["would", "бы (вежливо)", "/wʊd/"], ["please", "пожалуйста", "/pliːz/"], ["understand", "понимать", "/ˌʌndərˈstænd/"], ["speak", "говорить", "/spiːk/"], ["slowly", "медленно", "/ˈsloʊli/"], ["mean", "значить", "/miːn/"], ["sure", "уверенный", "/ʃʊr/"], ["maybe", "возможно", "/ˈmeɪbi/"], ["need", "нуждаться", "/niːd/"], ["want", "хотеть", "/wɑːnt/"], ["know", "знать", "/noʊ/"], ["problem", "проблема", "/ˈprɑːbləm/"], ["question", "вопрос", "/ˈkwɛstʃən/"], ["answer", "ответ", "/ˈænsər/"], ["mind", "ум, возражать", "/maɪnd/"], ["wait", "ждать", "/weɪt/"], ["ready", "готовый", "/ˈrɛdi/"], ["enough", "достаточно", "/ɪˈnʌf/"], ["catch", "поймать, расслышать", "/kætʃ/"]]}, {"t": "ЛЕГЕНДА: БИОГРАФИЯ НА АНГЛИЙСКОМ\n\nЦель: выучить наизусть связный рассказ о себе, который можно произнести автоматически, не переводя в голове.\n\nСтруктура (6 предложений):\n1) My name is ... and I'm from ... (Меня зовут ... и я из ...)\n2) I was born in ... in 19.. / 20.. (Я родился в ...)\n3) I live in ... with my family. (Живу в ... с семьёй.)\n4) I work as a ... (Работаю ...)\n5) In my free time I ... (В свободное время я ...)\n6) I'm learning English because ... (Учу английский, потому что ...)\n\nПроизношение: I was born /aɪ wəz bɔːrn/, слабая форма was. Ударение в engineer на последнем слоге.\nУпражнение: выучите легенду, расскажите её вслух 5 раз, затем запишите на диктофон.\nПроверка: расскажете легенду за 40 секунд без бумажки.", "w": [["born", "родился", "/bɔːrn/"], ["family", "семья", "/ˈfæməli/"], ["job", "работа", "/dʒɑːb/"], ["city", "город", "/ˈsɪti/"], ["engineer", "инженер", "/ˌɛndʒɪˈnɪr/"], ["live", "жить", "/lɪv/"], ["married", "женат/замужем", "/ˈmærid/"], ["hometown", "родной город", "/ˈhoʊmtaʊn/"]]}, {"t": "ШЭДОУИНГ (ТЕНЬ)\n\nЦель: перенять ритм, интонацию и скорость настоящей речи.\n\nКак делать (20 минут в день):\n1) Выберите аудио 1–2 минуты с текстом (подкаст, диалог). Акцент выбирайте тот, который хотите получить.\n2) Прослушайте 3 раза с текстом.\n3) Включите и повторяйте вслух за диктором с задержкой в 1–2 слова. Лучше ходить по комнате.\n4) Копируйте не только слова, но и паузы, подъёмы и падения голоса.\n5) Затем то же без текста.\n6) Запишите себя и сравните с оригиналом.\n\nОшибка новичка: говорить слишком чисто и медленно. Цель — темп диктора.\nПроверка: на одном и том же отрывке разрыв с диктором сократился до полусекунды.", "w": [["pace", "темп", "/peɪs/"], ["rhythm", "ритм", "/ˈrɪðəm/"], ["stress", "ударение", "/strɛs/"], ["repeat", "повторять", "/rɪˈpiːt/"], ["delay", "задержка", "/dɪˈleɪ/"], ["tone", "тон", "/toʊn/"], ["fluent", "беглый", "/ˈfluːənt/"], ["speed", "скорость", "/spiːd/"]]}, {"t": "ДИКТОВКА НА СЛУХ\n\nЦель: научить ухо различать слова в потоке речи, а руку писать их правильно.\n\nКак делать:\n1) Возьмите аудио 30–60 секунд.\n2) Слушайте по одному предложению. Пауза, запись, не подглядывайте.\n3) Каждое предложение можно переслушать не больше 3 раз.\n4) Сверьте с текстом. Ошибки выпишите в отдельный список.\n5) Отметьте, на чём ошибаетесь: окончания, слабые слова (a, the, of), связывание слов.\n\nПример слитной речи: 'Wanna go?' звучит как 'Want to go?'. 'Gonna' это 'going to'.\n\nУпражнение: 3 диктовки в неделю по 5 предложений.\nПроверка: меньше 3 ошибок на 10 предложений.", "w": [["listen", "слушать", "/ˈlɪsən/"], ["spell", "писать по буквам", "/spɛl/"], ["mistake", "ошибка", "/mɪˈsteɪk/"], ["sentence", "предложение", "/ˈsɛntəns/"], ["pause", "пауза", "/pɔːz/"], ["check", "проверять", "/tʃɛk/"], ["correct", "правильный", "/kəˈrɛkt/"], ["record", "записывать", "/rɪˈkɔːrd/"]]}, {"t": "БЫТОВЫЕ ДИАЛОГИ\n\nЦель: уверенно проходить типовые ситуации: магазин, такси, отель, телефонный звонок.\n\nПримеры фраз:\n- How much is this? (Сколько это стоит?)\n- Can I have a receipt, please? (Можно чек?)\n- I have a reservation under the name ... (У меня бронь на имя ...)\n- Could you take me to this address? (Отвезите меня по этому адресу.)\n- Hold on, please. I'll transfer you. (Подождите, я вас переведу.)\n\nПроизношение: reservation /ˌrɛzərˈveɪʃən/, ударение на veɪ. В 'Can I' слитно: /kənaɪ/.\nУпражнение: разыграйте с партнёром по 3 минуты каждую ситуацию, меняйтесь ролями.\nПроверка: диалог идёт без пауз и без перехода на русский.", "w": [["receipt", "чек", "/rɪˈsiːt/"], ["change", "сдача", "/tʃeɪndʒ/"], ["reservation", "бронь", "/ˌrɛzərˈveɪʃən/"], ["address", "адрес", "/əˈdrɛs/"], ["how much", "сколько стоит", "/haʊ mʌtʃ/"], ["room", "номер, комната", "/ruːm/"], ["ride", "поездка", "/raɪd/"], ["hold on", "подождите", "/hoʊld ɑːn/"]]}, {"t": "АКЦЕНТ: РИТМ, УДАРЕНИЕ, РЕДУКЦИЯ\n\nЦель: говорить по ритму английского, а не по слогам русского.\n\nПравила:\n1) Английский ритмизован по ударениям. Ударные слова (существительные, глаголы, прилагательные) длинные и чёткие, служебные (a, the, to, of) короткие и слабые.\n2) Слабые гласные превращаются в шва /ə/: about /əˈbaʊt/, banana /bəˈnænə/.\n3) Связывание: 'pick it up' звучит как 'pi-ki-tup'.\n4) Американское t между гласными превращается в быстрый d: water /ˈwɔːdər/.\n\nУпражнение: возьмите 5 предложений и отметьте ударные слова. Хлопайте на ударных и проговаривайте.\nПроверка: каждое предложение занимает примерно одинаковое время, независимо от числа слабых слов.", "w": [["stress", "ударение", "/strɛs/"], ["syllable", "слог", "/ˈsɪləbəl/"], ["schwa", "шва (слабый гласный)", "/ʃwɑː/"], ["linking", "связывание", "/ˈlɪŋkɪŋ/"], ["intonation", "интонация", "/ˌɪntəˈneɪʃən/"], ["reduce", "сокращать", "/rɪˈduːs/"], ["flap", "быстрый звук t", "/flæp/"], ["vowel", "гласный", "/ˈvaʊəl/"]]}, {"t": "ЧТЕНИЕ НОВОСТЕЙ\n\nЦель: расширить словарь живой лексикой и научиться пересказывать.\n\nКак делать:\n1) Выберите короткую новость, 150–200 слов.\n2) Прочитайте один раз, не останавливаясь.\n3) Выпишите 20 незнакомых слов, запомните ключевые 10.\n4) Перечитайте, проговорив вслух.\n5) Закройте текст и перескажите за минуту: Who? What? Where? When? Why?\n\nПолезные обороты пересказа:\n- According to the report, ... (Согласно сообщению ...)\n- The article says that ... (В статье говорится, что ...)\n- The main point is ... (Главное в том, что ...)\n\nПроизношение: government /ˈɡʌvərnmənt/, звук n в середине почти не слышен.\nПроверка: пересказ укладывается в 5–6 предложений.", "w": [["headline", "заголовок", "/ˈhɛdlaɪn/"], ["report", "сообщение", "/rɪˈpɔːrt/"], ["government", "правительство", "/ˈɡʌvərnmənt/"], ["economy", "экономика", "/ɪˈkɑːnəmi/"], ["announce", "объявлять", "/əˈnaʊns/"], ["according to", "согласно", "/əˈkɔːrdɪŋ tuː/"], ["election", "выборы", "/ɪˈlɛkʃən/"], ["source", "источник", "/sɔːrs/"]]}, {"t": "ИМПРОВИЗАЦИЯ ПО ЛЕГЕНДЕ\n\nЦель: говорить 5 минут подряд без долгих пауз, опираясь на легенду.\n\nКак делать:\n1) Поставьте таймер на 5 минут.\n2) Расскажите легенду, затем добавляйте детали: детство, учёба, работа, друзья, планы.\n3) Если не знаете слово, обойдите его другими словами, но не молчите.\n4) Паузы заполняйте английскими связками, а не 'эээ'.\n\nСвязки:\n- Well, let me think... (Ну, дайте подумать...)\n- Actually, ... (На самом деле...)\n- By the way, ... (Кстати...)\n- To be honest, ... (Честно говоря...)\n\nУпражнение: 3 раза в неделю по 5 минут, записывайте на аудио.\nПроверка: самая долгая пауза короче 3 секунд.", "w": [["actually", "на самом деле", "/ˈæktʃuəli/"], ["well", "ну", "/wɛl/"], ["let me think", "дайте подумать", "/lɛt miː θɪŋk/"], ["I mean", "то есть", "/aɪ miːn/"], ["by the way", "кстати", "/baɪ ðə weɪ/"], ["in fact", "фактически", "/ɪn fækt/"], ["as I said", "как я сказал", "/æz aɪ sɛd/"], ["to be honest", "честно говоря", "/tuː biː ˈɑːnɪst/"]]}, {"t": "ДОПРОС: НЕОЖИДАННЫЕ ВОПРОСЫ\n\nЦель: отвечать спокойно и связно, даже когда вопрос заста
