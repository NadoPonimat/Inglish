you doing this weekend? Do you have any plans for tonight?\nПриглашения: Would you like to go to the cinema? How about Saturday? Why don't we go for a walk? Let's meet at six. Shall we meet at the station?\nПринятие: I'd love to! Sounds great! That would be nice. Yes, why not?\nВежливый отказ: I'm afraid I can't. I'm busy that day. I'd love to, but I have other plans. Maybe another time. Thanks for asking.\nУточнение деталей: What time shall we meet? Where shall we meet? How long will it take?\nПодтверждение: So we're meeting at six at the cinema, right? Great, see you then!\nПеренос: I'm sorry, but I need to reschedule. Could we meet on Sunday instead?\nВремя и даты:\n- Порядковые числительные: 1st first, 2nd second, 3rd third, 4th fourth, 5th fifth, 12th twelfth, 20th twentieth, 21st twenty-first, 30th thirtieth, 31st thirty-first.\n- Дата: 15 September 2026 → the fifteenth of September, twenty twenty-six (UK) / September fifteenth, twenty twenty-six (US).\n- Формат дат различается: 03/04/2026 в США — 4 марта, в Великобритании — 3 апреля. Пишите месяц словами, чтобы избежать путаницы.\n- Выражения времени: tomorrow, the day after tomorrow, next week, in two days, at the weekend (UK) / on the weekend (US), by Friday (не позже пятницы), until Friday (до пятницы), in the morning, this evening, soon, later, in a month.\nПредлоги: in (месяцы, годы, части дня), on (дни и даты), at (время), by (срок), until (до).\n\n## Раздел 8. Произношение и интонация\nСлабые формы: I'll call → /aɪl kɔːl/; I'm going to → /aɪm ˈɡoʊɪŋ tə/ (или /ˈɡʌnə/ разговорно); will you → /wɪl jə/.\nWon't и want: won't /woʊnt/ (с долгим /oʊ/) и want /wɑːnt/ (американское /ɑː/). Различайте, они путают смысл: I won't go и I want to go.\nОкончание -th в порядковых: fifth /fɪfθ/, twelfth /twɛlfθ/, twentieth /ˈtwɛntiəθ/, sixth /sɪksθ/. Тренируйте межзубный звук (урок 1 КГБ, если проходили).\nМесяцы и дни: February /ˈfɛbjuɛri/ (также /ˈfɛbruɛri/), Wednesday /ˈwɛnzdeɪ/, Thursday /ˈθɜːrzdeɪ/, September /sɛpˈtɛmbər/.\nИнтонация: приглашения (вопросы да/нет) с подъёмом: Would you like to go to the cinema? ↗ Принятие с энтузиазмом: I'd LOVE to! ↘ Вежливый отказ с мягким падением: I'm afraid I can't. ↘ Подтверждение с подъёмом: So we're meeting at six? ↗\nРитм: хлопайте на ударных слогах: I'm GOing to STUdy MEdicine.\n\n## Раздел 9. Практика 1. Will, going to, Present Continuous\nВыберите форму: 1) I'm so thirsty. I ___ (get) some water. 2) Look at the clouds! It ___ (rain). 3) We ___ (meet) Dana at six tonight. I've already arranged it. 4) I've decided. I ___ (study) medicine. 5) The train ___ (leave) at 8:15. 6) A: The phone is ringing. B: I ___ (answer) it. 7) I promise I ___ (not tell) anyone. 8) What ___ you ___ (do) this weekend?\n\n## Раздел 10. Практика 2. Условия и придаточные времени\nВставьте нужную форму: 1) If it ___ (rain), we ___ (stay) home. 2) When I ___ (arrive), I ___ (call) you. 3) I ___ (wait) until you ___ (finish). 4) As soon as he ___ (come), we ___ (start). 5) If you ___ (not study), you ___ (fail) the exam. 6) She ___ (call) you when she ___ (get) home. 7) Before I ___ (leave), I ___ (lock) the door. 8) If I ___ (have) time, I ___ (help) you.\n\n## Раздел 11. Практика 3. Might и наречия\nПерепишите с might: 1) Maybe it will rain. 2) Perhaps I'll go to London. 3) It is possible that they won't win.\nПоставьте наречие правильно: 4) I'll call you (probably). 5) I won't forget (definitely). 6) I'm sure he will come (certainly).\n\n## Раздел 12. Практика 4. Даты и порядковые числительные\nЗапишите словами: 1st, 2nd, 3rd, 4th, 5th, 12th, 20th, 21st, 30th, 31st. Прочитайте дату: 15 September 2026. Объясните, как по-разному читается 03/04/2026 в США и Великобритании.\n\n## Раздел 13. Практика 5. Приглашение\nРасставьте реплики по порядку: a) How about Saturday? b) Hi Dana! Are you free this weekend? c) Saturday is perfect. What time shall we meet? d) Let's say six o'clock at the cinema. e) Sounds great. See you then! f) I'd love to! When shall we go? g) Yes, I am. What do you have in mind? h) Would you like to go to the cinema?\n\n## Раздел 14. Практика 6. Перевод\n1) Что ты делаешь на выходных? 2) Я собираюсь изучать английский. 3) Завтра, наверное, будет дождь. 4) Если будет время, я позвоню. 5) Я, возможно, поеду в Лондон. 6) Давай встретимся в шесть. 7) Я с удовольствием! 8) К сожалению, я не могу. 9) Поезд отправляется в 8:15. 10) Я позвоню тебе, когда приеду.\n\n## Раздел 15. Практика 7. Чтение, диктовка, говорение, письмо\nЧтение. Прочитайте переписку и ответьте.\nDana: Hi Arman, are you free on Saturday? We're going hiking in the mountains. We're meeting at the station at 8 a.m. The train leaves at 8:30. If the weather is bad, we'll go to the museum instead. Let me know!\nArman: Hi Dana, I'd love to come! I'll bring sandwiches and some tea. I might be a few minutes late because I have to take my sister to the airport at 7. I'll text you if I'm late. See you on Saturday!\nВопросы: 1) What are they going to do on Saturday? 2) Where and when do they meet? 3) What time does the train leave? 4) What will they do if the weather is bad? 5) What will Arman bring? 6) Why might he be late? 7) What will he do if he is late?\nДиктовка: I'm going to study English. It might rain tomorrow. If I have time, I'll call you. Are you free on Saturday? I'm afraid I can't.\nГоворение (запись по 3–5 минут):\n1) Расскажите о планах на ближайшие выходные (8 предложений).\n2) Расскажите о планах на следующий год и объясните, почему.\n3) Пригласите друга на встречу и договоритесь о времени и месте.\n4) Вежливо откажитесь от приглашения и предложите другое время.\n5) Расскажите о своей цели и о том, как вы её достигнете (SMART).\nПисьмо. Напишите сообщение другу с приглашением (50–60 слов) и ответ на него (50–60 слов), либо план на год на 120–150 слов. Чек-лист: will и going to по смыслу, Present Continuous для договорённости, придаточные времени, might, вежливая форма, даты.\n\n## Раздел 16. Ключи\nПрактика 1: 1) I'll get 2) is going to rain 3) are meeting 4) am going to study 5) leaves 6) I'll answer 7) won't tell 8) are, doing.\nПрактика 2: 1) rains, will stay 2) arrive, will call 3) will wait, finish 4) comes, will start 5) don't study, will fail 6) will call, gets 7) leave, will lock 8) have, will help.\nПрактика 3: 1) It might rain. 2) I might go to London. 3) They might not win. 4) I'll probably call you. 5) I definitely won't forget. 6) He will certainly come.\nПрактика 4: first, second, third, fourth, fifth, twelfth, twentieth, twenty-first, thirtieth, thirty-first. 15 September 2026: the fifteenth of September, twenty twenty-six (UK) / September fifteenth (US). 03/04/2026: в США 4 марта, в Великобритании 3 апреля.\nПрактика 5: b, g, h, f, a, c, d, e.\nПрактика 6: 1) What are you doing at the weekend? (US: on the weekend) 2) I'm going to learn English. 3) It will probably rain tomorrow. / It's probably going to rain tomorrow. 4) If I have time, I'll call. 5) I might go to London. 6) Let's meet at six. 7) I'd love to! 8) I'm afraid I can't. 9) The train leaves at 8:15. 10) I'll call you when I arrive.\nПрактика 7 (чтение): 1) They're going hiking in the mountains. 2) At the station at 8 a.m. 3) At 8:30. 4) They'll go to the museum. 5) Sandwiches and some tea. 6) He has to take his sister to the airport at 7. 7) He'll text Dana.\n\n## Раздел 17. Таблица типичных ошибок\n- Will в придаточном времени: When I will arrive → When I arrive.\n- Will в условии: If it will rain → If it rains.\n- Present Simple вместо будущего для личных планов: I go tomorrow → I'm going tomorrow.\n- Забытый to: I'm going study → I'm going to study.\n- Might с to: I might to go → I might go.\n- Won't и want: перепутаны.\n- Дата: 03/04 в разных странах читается по-разному.\n- Артикль и предлоги времени: in Monday → on Monday; at the morning → in the morning.\n- Будущее после hope: I hope it will rain (допустимо), но I hope it rains тоже встречается.\nВедите личный список ошибок и перечитывайте раз в неделю.\n\n## Раздел 18. Самооценка\nПо 2 балла: □ я различаю will и going to □ я использую Present Continuous для договорённостей □ я правильно строю придаточные времени и условия □ я говорю о возможности (might) □ я приглашаю и вежливо отказываю □ я произношу ключевые фразы естественно.\nРезультат: 10–12 баллов — переходите к уроку 8; 6–9 — повторите слабые разделы; меньше 6 — повторите неделю.\n\n## Раздел 19. Итоговый тест (15 баллов)\n1) Какая форма для спонтанного решения? 2) Какая форма для плана, принятого заранее? 3) Для чего Present Continuous в будущем? 4) Для чего Present Simple в будущем? 5) If it ___ (rain), we'll stay. 6) When I ___ (arrive), I'll call you. 7) Что значит might? 8) Порядковое числительное 21. 9) Правильное место наречия: I (probably) call you. 10) Как вежливо отказаться от приглашения? 11) Краткая форма will not. 12) Как читается 03/04/2026 в Великобритании? 13) Предлог: ___ Monday. 14) Предлог: ___ the morning. 15) Что выражает Shall we meet at six?\nОтветы: 1) will 2) going to 3) договорённость 4) расписание 5) rains 6) arrive 7) возможность 8) twenty-first 9) I'll probably call you 10) I'm afraid I can't. Thanks for asking. 11) won't 12) 3 April 13) on 14) in 15) предложение или предложение встретиться.\nОценка: 13–15 — отлично, переходите к уроку 8; 10–12 — хорошо, повторите слабые разделы; меньше 10 — вернитесь к теории и практике.\n\n## Раздел 20. План на 4 недели\nНеделя 1: will и going to (разделы 1–2). Практика 1. Ежедневно 10 минут карточек.\nНеделя 2: Present Continuous и Present Simple для будущего (раздел 3), придаточные и First Conditional (раздел 4), might (раздел 5). Практика 2, 3.\nНеделя 3: планы и цели (раздел 6), приглашения и даты (раздел 7), произношение (раздел 8). Практика 4, 5, 6. Говорение 1–4.\nНеделя 4: чтение, письмо плана, итоговая запись, самооценка, тест, разбор ошибок.\n\n## Что стоит сверить в книгах\nRaymond Murphy, «English Grammar in Use» (will, going to, Present Continuous для будущего, if и when); Michael Swan, «Practical English Usage» (будущее время); Cambridge Dictionary и Oxford Learner's Dictionaries (произношение и примеры). Для фонетики: Peter Roach, «English Phonetics and Phonology».\nВажное замечание: упражнения и ключи составлены для самопроверки. Выбор формы будущего зависит от контекста и интонации, поэтому разбирайте свои ошибки с преподавателем или носителем. Для оценки произношения нужна обратная связь от человека, хорошо владеющего языком.\n", "w": [["plan", "план, планировать", "/plæn/"], ["goal", "цель", "/ɡoʊl/"], ["intend", "намереваться", "/ɪnˈtɛnd/"], ["hope", "надеяться", "/hoʊp/"], ["expect", "ожидать", "/ɪkˈspɛkt/"], ["promise", "обещание", "/ˈprɑːmɪs/"], ["arrange", "договариваться, устраивать", "/əˈreɪndʒ/"], ["invite", "приглашать", "/ɪnˈvaɪt/"], ["invitation", "приглашение", "/ˌɪnvɪˈteɪʃən/"], ["schedule", "расписание", "/ˈskɛdʒuːl/"], ["deadline", "крайний срок", "/ˈdɛdlaɪn/"], ["probably", "вероятно", "/ˈprɑːbəbli/"], ["definitely", "определённо", "/ˈdɛfɪnətli/"], ["possible", "возможный", "/ˈpɑːsəbəl/"], ["tomorrow", "завтра", "/təˈmɑːroʊ/"], ["weekend", "выходные", "/ˈwiːkɛnd/"], ["decision", "решение", "/dɪˈsɪʒən/"], ["resolution", "решение, намерение", "/ˌrɛzəˈluːʃən/"], ["calendar", "календарь", "/ˈkælɪndər/"], ["reschedule", "перенести", "/riːˈskɛdʒuːl/"]]}, {"t": "УРОК 8. РАБОТА И ХОББИ (РАСШИРЕННЫЙ КУРС)\nОбъём: 4 недели, 5–6 дней в неделю по 45–60 минут (около 20–25 часов). Уровень: A2 → B1.\nУчебный язык: объяснения по-русски, примеры по-английски. Основной вариант: американский, британские отличия отмечены.\n\n## Как устроен урок\nТеория (разделы 1–8), практика (разделы 9–17), контроль (разделы 18–20). Прочитайте теорию целиком без заучивания, затем работайте с практикой и возвращайтесь к теории по мере необходимости. Цель урока: рассказать о своей работе, обязанностях, графике и увлечениях, ответить на вопросы о них, написать простое деловое письмо и пройти базовое собеседование.\n\n## Раздел 0. Научная основа метода\n1. Тема работы и хобби — одна из самых частых в разговоре. Она естественно сочетает повторяющиеся действия (Present Simple) и временные процессы (Present Continuous), поэтому на ней удобно закреплять оба времени.\n2. Контраст и выбор: формы лучше усваиваются при сравнении (Present Simple и Present Continuous, -ing и to с глаголом).\n3. Выходная речь: говорение и письмо заставляют замечать пробелы (идея Мерилл Суэйн).\n4. Интервальные повторения: возвращайтесь к лексике и конструкциям через 1, 3, 7, 14 дней (вкладка «Карточки»).\n5. Личная значимость: рассказ о своей реальной работе и увлечениях лучше запоминается, поэтому готовьте ответы про себя.\n\n## Раздел 1. Лексика: работа\nЛюди: employer /ɪmˈplɔɪər/ (работодатель), employee /ɪmˈplɔɪiː/ (сотрудник), colleague /ˈkɑːliːɡ/, coworker, boss, manager, team, client, customer, applicant (кандидат).\nМесто и организация: company, office, department, workplace, branch, factory, hospital, gym, restaurant.\nУсловия работы: full-time, part-time, shift /ʃɪft/ (смена), night shift, day shift, overtime (сверхурочные), contract, permanent (постоянная работа), temporary, freelance, remote (удалённо), flexible hours.\nДеятельность: project, task, deadline, meeting, report, presentation, schedule, appointment.\nКарьера: job, career, position, promotion, qualification, skill, experience, training, resume (США) / CV (Британия), cover letter, interview, application, apply for (a job).\nГлаголы: work, hire (нанимать), fire (увольнять), resign (уволиться по своей воле), quit (США), retire, apply, manage, organize, train, deal with (иметь дело с), be in charge of (отвечать за, руководить), be responsible for (нести ответственность за), take on (брать на себя).\nПрофессии: teacher, doctor, nurse, engineer, driver, trainer, manager, accountant /əˈkaʊntənt/, lawyer, developer, designer, bartender, receptionist, cashier, cleaner, electrician.\nВопросы о работе: What do you do? What's your job? Where do you work? Who do you work for? How long have you worked there? Do you like your job? What time do you start/finish? Do you work shifts?\nПредлоги: work at (место: at a gym), work for (организация: for a company), work in (сфера: in marketing), work as (должность: as a manager), work with (с кем или чем: with children).\n\n## Раздел 2. Present Simple: повтор и расширение\nНазначение: привычки, регулярные действия, факты, расписания. I work from nine to five. She starts at eight.\nФорма: основа (с he/she/it +s/-es). Отрицание: don't/doesn't + основа. Вопрос: Do/Does + подлежащее + основа.\nОкончание -s/-es: произносится /s/ (works), /z/ (plays, lives), /ɪz/ (watches, teaches).\nНаречия частоты: always, usually, often, sometimes, rarely, never. Стоят перед основным глаголом и после be: I usually start at nine. He is always late.\nВыражения частоты: every day, twice a week, once a month, on Mondays, in the evening. How often do you...? Ответ: Three times a week.\nОсобенность: работа по сменам и графику: I work in shifts. I start at 8 a.m. on Monday and finish at 4 p.m.\n\n## Раздел 3. Present Continuous: теория\nФорма: am/is/are + глагол с -ing: I'm working. She isn't sleeping. Are you studying?\nПравописание -ing: make → making (убрать e), run → running (удвоение), lie → lying, study → studying.\nУпотребление:\n1) Действие происходит сейчас: I'm writing an email right now.\n2) Временный процесс вокруг настоящего: I'm working on a new project this month. I'm learning English.\n3) Изменяющаяся ситуация: Prices are rising.\n4) Запланированное будущее (урок 7): I'm meeting a client tomorrow.\nРаздражение с always: He's always interrupting me.\nМаркеры: now, at the moment, today, this week, currently, right now.\nPresent Simple и Present Continuous в сравнении:\n- I work in a bank. (постоянно) / I'm working at a bank this summer. (временно)\n- She plays tennis every Sunday. / She's playing tennis now.\nГлаголы состояния (stative verbs), которые обычно не употребляются в Continuous: know, like, love, hate, want, need, understand, believe, belong, own, prefer, seem. I know the answer (не I'm knowing). Исключения: have в значении «обладать» (I have a car), но have в значении действия допускает Continuous: I'm having lunch.\n\n## Раздел 4. Глагол + -ing или to + инфинитив\nПосле некоторых глаголов следует -ing (герундий): enjoy, mind, finish, avoid, suggest, keep, practise, stop (прекратить делать). I enjoy reading. She finished working at six.\nПосле других глаголов следует to + инфинитив: want, need, decide, hope, plan, would like, learn, promise, agree. I want to travel. He decided to apply.\nПосле like, love, hate, prefer возможны оба: I like swimming / I like to swim. Разница небольшая. В американском варианте like to do часто о привычке, like doing — об удовольствии.\nДля увлечений чаще используют: I enjoy..., I love..., I'm into..., I'm keen on... (Британия), I'm interested in + -ing.\nПримеры: I'm into cooking. I'm interested in learning languages. I can't stand waiting in queues.\nОшибки: I enjoy to read ✗ → I enjoy reading ✓; I want going ✗ → I want to go ✓.\n\n## Раздел 5. Лексика: хобби и свободное время\nХобби: reading, cooking, baking, gardening, painting, drawing, photography, playing guitar / the piano, singing, dancing, writing, collecting (stamps, coins), traveling, hiking, camping, fishing, cycling, swimming, running, yoga, chess, board games, video games.\nСпорт и фитнес: play football/basketball/tennis (play + игра с мячом), go swimming/running/cycling (go + -ing для активности), do yoga/karate/gymnastics (do + вид занятий без мяча).\nСтруктуры:\n- My hobby is collecting coins. (My hobby is + -ing.)\n- I'm into photography.\n- In my free time I usually...\n- I spend a lot of time + -ing: I spend a lot of time reading.\n- I've been doing this for five years.\n- I started playing guitar when I was fifteen.\nВопросы: What do you do in your free time? What are your hobbies? How often do you play football? How long have you been doing it? Why do you like it?\nКомментарии: That sounds interesting. I'd love to try it. I used to do that too. Really? How did you get into it?\n\n## Раздел 5а. Как рассказывать о своём дне\nСтруктура: утро, работа, обед, вечер, свободное время.\nПример: I usually get up at seven. I have breakfast and go to work by bus. I start at nine and finish at five. At lunchtime, I eat with my colleagues. In the evening, I go to the gym or cook dinner. At weekends, I like walking in the park.\nСвязки: first, then, after that, later, in the evening, at the weekend.\nПодсказка: используйте разнообразные глаголы, а не только have и go.\n\n## Раздел 6. Деловое письмо и собеседование\nСтруктура делового письма:\n1) Тема (Subject): краткая и понятная.\n2) Обращение: Dear Mr/Ms Brown, / Dear Sir or Madam, (если имя неизвестно).\n3) Вводная фраза: I'm writing to ask about... / I'm writing to apply for...\n4) Основная часть: факты, вопрос или просьба.\n5) Просьба или следующий шаг: Could you please send me...? I look forward to hearing from you.\n6) Завершение: Kind regards, / Best regards, / Yours sincerely, (если вы знаете имя) / Yours faithfully, (если обращались Dear Sir or Madam).\n7) Подпись.\nПолезные формулы: Thank you for your email. I would be grateful if you could... Please find attached... I'm available on...\nТипичные вопросы на собеседовании:\n1) Tell me about yourself. — I'm a ... with ... years of experience in ...\n2) Why do you want this job? — I'm interested in ... and I'd like to develop my skills in ...\n3) What are your strengths? — I'm organized, reliable, and I work well in a team.\n4) What are your weaknesses? — I sometimes spend too much time on details, but I'm learning to prioritize.\n5) Where do you see yourself in five years? — I'd like to grow in this company and take on more responsibility.\n6) Do you have any questions for us? — Yes, what does a typical day look like in this position?\nСовет: отвечайте конкретно, с примерами. Не выдумывайте опыт.\n\n## Раздел 7. Культурные заметки\n- В англоязычных странах принято точно соблюдать время начала встреч. Опоздание объясняют заранее.\n- Small talk в начале рабочего разговора обычен: How was your weekend? How's it going?\n- Деловые письма вежливы и конкретны, без эмоций. Используйте modal verbs (could, would) для просьб.\n- Вопросы о зарплате на собеседовании лучше задавать позже и вежливо. Вопросы о возрасте, семье и религии обычно считаются неуместными.\n- Названия должностей различаются в разных странах и компаниях. Уточняйте, что именно входит в обязанности.\n\n## Раздел 8. Произношение и интонация\nСлова: employee /ɪmˈplɔɪiː/, employer /ɪmˈplɔɪər/, colleague /ˈkɑːliːɡ/, manager /ˈmænɪdʒər/, accountant /əˈkaʊntənt/, interview /ˈɪntərvjuː/, schedule /ˈskɛdʒuːl/, responsible /rɪˈspɑːnsəbəl/, photography /fəˈtɑːɡrəfi/, hobby /ˈhɑːbi/, guitar /ɡɪˈtɑːr/, collecting /kəˈlɛktɪŋ/.\nСлабые формы: What do you do → /wʌdʒə ˈduː/; I work as a → /aɪ ˈwɜːrk əz ə/; Do you like → /dʒə ˈlaɪk/.\nОкончание -s: следите за /s/, /z/ и /ɪz/.\nИнтонация: вопросы с wh-словом с падением: What do you DO? ↘ Вопросы да/нет с подъёмом: Do you like your JOB? ↗ Перечисление хобби: подъём на каждом, падение на последнем: I like reading ↗, cooking ↗ and hiking ↘.\nЭмоциональный интерес: That sounds INteresting! ↘ (с широким диапазоном голоса).\n\n## Раздел 9. Практика 1. Present Simple и Present Continuous\nВставьте нужную форму: 1) I usually ___ (start) work at nine. 2) Right now she ___ (write) an email. 3) He ___ (not/like) getting up early. 4) We ___ (work) on a new project this month. 5) ___ you ___ (know) his name? 6) They ___ (have) lunch at the moment. 7) My brother ___ (work) in a bank. 8) What ___ you ___ (do) now?\n\n## Раздел 10. Практика 2. -ing или to\nВставьте -ing или to + инфинитив: 1) I enjoy ___ (read). 2) She wants ___ (travel). 3) He decided ___ (apply) for the job. 4) They finished ___ (work) at six. 5) I'm interested in ___ (learn) languages. 6) We hope ___ (see) you soon. 7) She avoids ___ (talk) about work. 8) I'd like ___ (try) it.\n\n## Раздел 11. Практика 3. Частота и наречия\nПоставьте наречие в правильное место: 1) I start at eight (usually). 2) He is late (always). 3) She works at weekends (rarely). 4) They go to the gym (often). 5) I eat breakfast (never). 6) We have meetings on Mondays (sometimes).\nСоставьте вопросы: 7) Ответ: Three times a week. 8) Ответ: I play football.\n\n## Раздел 12. Практика 4. Профессии и обязанности\nСоедините: 1) A nurse. 2) A driver. 3) An accountant. 4) A teacher. 5) A receptionist. 6) A developer.\nОбязанности: a) teaches students. b) takes care of patients. c) writes code. d) works with numbers and reports. e) welcomes guests and answers calls. f) takes people from place to place.\n\n## Раздел 13. Практика 5. Собеседование и письмо\nРасставьте реплики по порядку: a) Why do you want this job? b) Hello, please sit down. c) Tell me about yourself. d) I'm interested in this company and I'd like to develop my skills. e) Thank you. I'm a designer with three years of experience. f) Thank you for your time. We'll contact you soon.\nСоставьте письмо-обращение: напишите 3 вводных предложения для письма о вакансии (I'm writing to...).\n\n## Раздел 14. Практика 6. Перевод\n1) Кем вы работаете? 2) Я работаю в небольшой компании. 3) Я заканчиваю в пять часов. 4) Сейчас я работаю над новым проектом. 5) Я люблю читать и готовить. 6) Как часто вы играете в футбол? 7) Мне интересно изучать языки. 8) Я работаю по сменам. 9) Я отвечаю за команду из пяти человек. 10) Что вы делаете в свободное время?\n\n## Раздел 15. Практика 7. Чтение, диктовка, говорение, письмо\nЧтение. Прочитайте текст и ответьте.\nMy name is Dana and I work as a graphic designer in a small company. I usually start at nine and finish at five. This month I'm working on a big project for a client, so I'm sometimes working late. In my free time, I'm into photography. I go hiking at the weekend and take photos of the mountains. I started doing it five years ago. I'm also learning to play the guitar. I practise three times a week.\nВопросы: 1) What does Dana do? 2) When does she usually start and finish? 3) What is she working on this month? 4) What is her hobby? 5) When did she start photography? 6) What is she learning to play? 7) How often does she practise?\nДиктовка: I work as a manager. She is working on a new project. I enjoy reading and cooking. What do you do in your free time? I'm responsible for the team.\nГоворение (запись по 3–5 минут):\n1) Расскажите о своей работе: должность, место, график, обязанности, что нравится, что нет (8–10 предложений).\n2) Расскажите о типичном дне.\n3) Расскажите о хобби и как вы к нему пришли.\n4) Пройдите короткое собеседование с партнёром: Tell me about yourself. Why this job? Strengths and weaknesses.\n5) Разыграйте знакомство с коллегой: расскажите, чем занимаетесь, и спросите о нём.\nПисьмо. Напишите письмо с просьбой дать информацию о вакансии на 80–100 слов или текст о своём хобби на 120–150 слов. Чек-лист: обращение и завершение письма, вежливая просьба (Could you please...), Present Simple и Present Continuous по смыслу, -ing или to после глаголов, нет типичных ошибок из раздела 17.\n\n## Раздел 16. Ключи\nПрактика 1: 1) start 2) is writing 3) doesn't like 4) are working 5) Do, know 6) are having 7) works 8) are, doing.\nПрактика 2: 1) reading 2) to travel 3) to apply 4) working 5) learning 6) to see 7) talking 8) to try.\nПрактика 3: 1) I usually start at eight. 2) He is always late. 3) She rarely works at weekends. 4) They often go to the gym. 5) I never eat breakfast. 6) We sometimes have meetings on Mondays. 7) How often do you go to the gym? 8) What do you play?\nПрактика 4: 1-b, 2-f, 3-d, 4-a, 5-e, 6-c.\nПрактика 5: b, c, e, a, d, f. Письмо: I'm writing to ask about the position of designer. I'm writing to apply for the vacancy advertised on your website. I'm writing to ask for more information about the job.\nПрактика 6: 1) What do you do? / What's your job? 2) I work at a small company. 3) I finish at five. 4) I'm working on a new project now. 5) I like reading and cooking. 6) How often do you play football? 7) I'm interested in learning languages. 8) I work in shifts. 9) I'm in charge of a team of five. / I manage a team of five people. 10) What do you do in your free time?\nПрактика 7 (чтение): 1) She is a graphic designer. 2) She starts at nine and finishes at five. 3) A big project for a client. 4) Photography. 5) Five years ago. 6) The guitar. 7) Three times a week.\n\n## Раздел 17. Таблица типичных ошибок\n- Забытое -s: He work → He works.\n- Present Continuous с глаголами состояния: I'm knowing → I know.\n- Present Simple вместо Continuous: Now I work → Now I'm working.\n- -ing и to: I enjoy to read → I enjoy reading.\n- Артикль с профессией: I'm teacher → I'm a teacher.\n- Предлоги: work in the bank (допустимо) / at the bank (место); work for a company.\n- Время: I work here since 2020 → I've worked here since 2020.\n- Порядок слов: I always am late → I am always late.\n- Обращение: Dear Mr. Brown, (в США точка после Mr.) / Dear Mr Brown, (в Великобритании без точки).\nВедите личный список ошибок и перечитывайте раз в неделю.\n\n## Раздел 18. Самооценка\nПо 2 балла: □ я рассказываю о работе и обязанностях □ я различаю Present Simple и Continuous □ я правильно использую -ing и to □ я рассказываю о хобби и распорядке дня □ я могу написать деловое письмо □ я отвечаю на вопросы собеседования.\nРезультат: 10–12 баллов — переходите к уроку 9; 6–9 — повторите слабые разделы; меньше 6 — повторите неделю.\n\n## Раздел 19. Итоговый тест (15 баллов)\n1) Present Simple или Continuous: I ___ (work) in a bank (постоянно). 2) I ___ (work) on a project now. 3) Глагол состояния: know или knowing? 4) I enjoy ___ (read). 5) I want ___ (travel). 6) Место наречия: He is (always) late. 7) Как спросить о частоте? 8) Предлог: I work ___ a small company (for/at). 9) Как закончить письмо, если вы знаете имя? 10) Как начать письмо, если имя неизвестно? 11) Как произносится -s в watches? 12) Что значит be responsible for? 13) Что значит shift? 14) Как рассказать о хобби: I ___ into photography. 15) Назовите вопрос собеседования.\nОтветы: 1) work 2) am working 3) know 4) reading 5) to travel 6) He is always late. 7) How often do you...? 8) for (организация) или at (место) 9) Yours sincerely / Kind regards 10) Dear Sir or Madam 11) /ɪz/ 12) нести ответственность за 13) смена 14) am 15) Tell me about yourself.\nОценка: 13–15 — отлично, переходите к уроку 9; 10–12 — хорошо, повторите слабые разделы; меньше 10 — вернитесь к теории и практике.\n\n## Раздел 20. План на 4 недели\nНеделя 1: лексика работы (раздел 1), Present Simple (раздел 2). Практика 1, 3. Ежедневно 10 минут карточек.\nНеделя 2: Present Continuous (раздел 3), -ing и to (раздел 4). Практика 1, 2.\nНеделя 3: хобби и распорядок дня (разделы 5, 5а), письмо и собеседование (раздел 6), культура (раздел 7), произношение (раздел 8). Практика 4, 5, 6.\nНеделя 4: чтение, диктовка, говорение, письмо, итоговая запись, самооценка, тест, разбор ошибок.\n\n## Что стоит сверить в книгах\nRaymond Murphy, «English Grammar in Use» (Present Simple и Continuous, -ing и to); Michael Swan, «Practical English Usage»; Cambridge Dictionary и Oxford Learner's Dictionaries (произношение и примеры); «Business English» ресурсы вроде English for Work (Cambridge) для деловой лексики.\nВажное замечание: упражнения и ключи составлены для самопроверки. Правила деловой переписки и собеседований различаются по странам и отраслям. Для оценки произношения и письма нужна обратная связь от человека, хорошо владеющего языком.\n", "w": [["employer", "работодатель", "/ɪmˈplɔɪər/"], ["employee", "сотрудник", "/ɪmˈplɔɪiː/"], ["colleague", "коллега", "/ˈkɑːliːɡ/"], ["shift", "смена", "/ʃɪft/"], ["overtime", "сверхурочные", "/ˈoʊvərtaɪm/"], ["contract", "договор", "/ˈkɑːntrækt/"], ["freelance", "фриланс", "/ˈfriːlæns/"], ["deadline", "крайний срок", "/ˈdɛdlaɪn/"], ["meeting", "встреча, совещание", "/ˈmiːtɪŋ/"], ["promotion", "повышение", "/prəˈmoʊʃən/"], ["qualification", "квалификация", "/ˌkwɑːləfɪˈkeɪʃən/"], ["interview", "собеседование", "/ˈɪntərvjuː/"], ["resume", "резюме (США)", "/ˈrɛzumeɪ/"], ["responsible", "ответственный", "/rɪˈspɑːnsəbəl/"], ["hobby", "хобби", "/ˈhɑːbi/"], ["photography", "фотография", "/fəˈtɑːɡrəfi/"], ["collecting", "коллекционирование", "/kəˈlɛktɪŋ/"], ["gardening", "садоводство", "/ˈɡɑːrdnɪŋ/"], ["hiking", "пеший туризм", "/ˈhaɪkɪŋ/"], ["practise", "практиковаться", "/ˈpræktɪs/"]]}, {"t": "УРОК 9. ЗДОРОВЬЕ И ВРАЧ (РАСШИРЕННЫЙ КУРС)\nОбъём: 4 недели, 5–6 дней в неделю по 45–60 минут (около 20–25 часов). Уровень: A2 → B1.\nУчебный язык: объяснения по-русски, примеры по-английски. Основной вариант: американский, британские отличия отмечены.\n\nВажно: это языковой урок. Он учит описывать самочувствие и общаться с врачом, а не лечить. Советы в упражнениях общие и бытовые, не медицинские рекомендации. При плохом самочувствии обращайтесь к врачу. В экстренной ситуации звоните в службу спасения вашей страны (например, 911 в США, 999 в Великобритании, 112 в странах Европейского союза).\n\n## Как устроен урок\nТеория (разделы 1–8), практика (разделы 9–17), контроль (разделы 18–20). Прочитайте теорию целиком без заучивания, затем работайте с практикой и возвращайтесь к теории по мере необходимости. Цель урока: назвать части тела и симптомы, объяснить, что болит и как долго, записаться к врачу, понять вопросы врача и советы, купить лекарство в аптеке и сообщить о недомогании на работе.\n\n## Раздел 0. Научная основа метода\n1. Ситуативное обучение: визит к врачу и разговор в аптеке образуют предсказуемый сценарий (приветствие, жалобы, вопросы, диагноз, советы, прощание). Освоив сценарий, вы тратите меньше усилий на подбор фраз.\n2. Точность в важных ситуациях: в разговоре о здоровье ошибки могут иметь последствия, поэтому важны чёткие формулы, повторение услышанного и умение переспрашивать.\n3. Выходная речь: говорение и письмо заставляют замечать пробелы (идея Мерилл Суэйн).\n4. Интервальные повторения: возвращайтесь к лексике через 1, 3, 7, 14 дней (вкладка «Карточки»).\n5. Стратегии коммуникации: переспрашивать, перефразировать, подтверждать понятое (урок 6 курса КГБ, если вы его проходили).\n\n## Раздел 1. Лексика: тело и самочувствие\nЧасти тела: head, face, eye, ear, nose, mouth, tooth (мн. teeth), neck, throat /θroʊt/, shoulder, arm, elbow, hand, finger, chest, back, stomach /ˈstʌmək/, hip, leg, knee, foot (мн. feet), toe, skin, heart, lungs.\nСамочувствие: I feel well / fine / good / bad / tired / weak / dizzy /ˈdɪzi/ (кружится голова) / sick (подташнивает) / better / worse.\nЗаметка: в США sick означает «больной» вообще (I'm sick), а в Великобритании sick чаще означает «тошнит», для болезни используют ill. Различайте: I feel sick (мне плохо, тошнит) и I'm ill (я болен).\nСимптомы и недомогания: headache /ˈhɛdeɪk/, stomachache, toothache, backache, earache, sore throat, cough /kɔːf/, runny nose (насморк), sneeze (чихать), fever /ˈfiːvər/ (температура), temperature, rash (сыпь), itch (зуд), swelling (отёк), pain, ache, cramp, nausea /ˈnɔːziə/, diarrhea, vomit (рвота; vomiting).\nБолезни и состояния: cold, flu, infection /ɪnˈfɛkʃən/, allergy /ˈælərdʒi/, food poisoning, asthma /ˈæzmə/, migraine, high blood pressure.\nТравмы: injury /ˈɪndʒəri/, cut, bruise (синяк), burn, sprain (растяжение), fracture / broken bone (перелом), bandage /ˈbændɪdʒ/, plaster (Британия) / band-aid (США, бытовое название пластыря).\nМеста и люди: doctor, nurse, GP (Британия, врач общей практики) / family doctor / primary care doctor (США), specialist, dentist, pharmacist /ˈfɑːrməsɪst/, patient /ˈpeɪʃənt/, pharmacy /ˈfɑːrməsi/ (США также drugstore) / chemist (Британия), clinic, hospital, emergency room, ER (США) / A&E (Британия), ambulance /ˈæmbjələns/.\nЛечение: medicine /ˈmɛdɪsɪn/, tablet / pill, capsule, cream, drops, injection, treatment, prescription /prɪˈskrɪpʃən/ (рецепт), over-the-counter (без рецепта), insurance /ɪnˈʃʊrəns/, appointment, check-up, test, X-ray, recover /rɪˈkʌvər/ (выздоравливать), rest (отдых).\n\n## Раздел 2. Как описывать, что болит\nСтруктуры:\n- My head hurts. / I have a headache. / My back aches. / I have a pain in my chest.\n- I have a sore throat. / I've got a cough. / I have a fever.\n- I feel dizzy. / I feel sick. / I feel weak.\n- It hurts when I breathe/walk/swallow.\nРазличие hurt, ache, pain:\n- hurt: глагол (My leg hurts.), также причинить боль.\n- ache: тупая, длительная боль (backache, stomachache).\n- pain: острая боль или боль вообще (a sharp pain).\nОписание боли: sharp (острая), dull (тупая), constant (постоянная), comes and goes (то появляется, то исчезает), burning (жгучая), throbbing (пульсирующая).\nСтепень по шкале от 1 до 10: On a scale of one to ten, it's about six.\nКогда и сколько: It started two days ago. I've had it since Monday. I've had a fever for three days.\nЧто усиливает или облегчает: It gets worse when I... It's better when I rest.\nТемпература: в США обычно используют градусы Фаренгейта (нормальная около 98.6°F), в большинстве других стран градусы Цельсия (около 37°C). Это общеизвестные ориентиры, а не диагноз. Умейте назвать: I have a temperature of thirty-eight point five.\n\n## Раздел 3. Present Perfect для длительности и состояния\nФорма: have/has + третья форма глагола: I have had (I've had) a headache. She has been ill.\nУпотребление: действие или состояние началось в прошлом и продолжается сейчас.\n- I've had a cough for three days. (for + период)\n- I've felt dizzy since this morning. (since + момент начала)\n- How long have you had these symptoms?\nРазличие: Past Simple (завершённое действие в прошлом с точным временем): I had a headache yesterday. Present Perfect (связь с настоящим): I've had a headache since yesterday.\nВопросы: How long have you felt like this? Have you taken any medicine?\nКраткие ответы: Yes, I have. / No, I haven't.\nВремя: for two days, since Monday, all week, recently, lately.\nТипичные ошибки: I have a headache since Monday ✗ → I've had a headache since Monday ✓. I am ill since two days ✗ → I've been ill for two days ✓.\n\n## Раздел 4. Советы и рекомендации: модальные глаголы\nshould + глагол (совет, мягкая рекомендация): You should rest. You shouldn't go to work.\nought to + глагол (похоже на should, чуть формальнее): You ought to see a doctor.\nhad better + глагол (настоятельный совет, предупреждение о последствиях): You'd better stay home, or you'll get worse.\nmust / have to (необходимость): You must take the medicine. I have to take it three times a day (по указанию врача).\nПовелительное наклонение (прямые указания врача): Drink plenty of water. Get some rest. Take this medicine as directed. Don't skip meals.\nУсловия (Zero и First Conditional, урок 7): If you have a fever, you should stay in bed. If it gets worse, call me.\nПросьбы пациента: Could you explain that again? What should I do? Is it serious? Do I need a test?\n\n## Раздел 5. Сценарий приёма у врача\n1) Запись по телефону: Hello, I'd like to make an appointment, please. — What seems to be the problem? — I have a bad cough. — Is it urgent? — Could I see the doctor today? — The doctor is available at three o'clock tomorrow. — That's fine. — Could I have your name and date of birth? — I have travel/health insurance.\n2) Приветствие: Hello, please come in and sit down. How can I help you today?\n3) Жалобы: I've had a sore throat and a cough for three days. I also feel tired.\n4) Вопросы врача:\n- How long have you had these symptoms?\n- Do you have a fever?\n- Have you taken any medicine?\n- Are you allergic to anything?\n- Do you have any chronic conditions? (хронические заболевания)\n- Are you taking any other medication?\n- Does it hurt when I press here?\n- Have you had this before?\n5) Осмотр: Open your mouth, please. Take a deep breath. Breathe out. Does it hurt here? I'll take your temperature / blood pressure.\n6) Диагноз: It looks like a cold / an infection / an allergic reaction. It's nothing serious, but you need to rest. I'd like to run a few tests.\n7) Лечение и советы: I'll prescribe some medicine. Take one tablet twice a day (как указано). Drink plenty of fluids. Rest for a few days. Come back if you don't feel better.\n8) Вопросы пациента: How long will it take to recover? Can I go to work? Are there any side effects? Do I need to come back?\n9) Завершение: Thank you, doctor. I'll follow your advice. Goodbye.\nЕсли не поняли: Sorry, could you say that again? Could you speak more slowly? Could you write it down, please?\nПереводчик: Could you call an interpreter, please? (Можно вызвать переводчика?) В некоторых больницах он предоставляется.\n\n## Раздел 6. Аптека и лекарства\nВопросы и фразы:\n- Do you have anything for a headache / a cough / a sore throat?\n- Do I need a prescription for this?\n- How often should I take it? — Twice a day, after meals. (как указано на упаковке)\n- Are there any side effects? Can I take it with other medicine?\n- I'm allergic to penicillin. (пример; называйте своё)\n- Could I have a bandage / plaster, please?\n- Do you have this in a smaller size / another brand?\nЧтение инструкции: Take as directed. Do not exceed the recommended dose (не превышайте рекомендуемую дозу). Keep out of reach of children. Store in a cool, dry place. Side effects may include... Consult your doctor if symptoms persist.\nОбщие правила: лекарство принимайте только по рецепту врача или по инструкции. Если сомневаетесь, спросите фармацевта.\n\n## Раздел 7. Экстренные ситуации и сообщения о болезни\nЭкстренная ситуация: Call an ambulance! I need help! My friend is not breathing. I think he has broken his leg. There has been an accident. Назовите место: It's at 24 Park Road. Сохраняйте спокойствие, говорите медленно, повторяйте адрес.\nНомера экстренных служб зависят от стране: 911 (США), 999 (Великобритания), 112 (страны ЕС). Узнавайте номер заранее.\nСообщение о болезни на работе или учёбе:\n- I'm writing to let you know that I'm unwell and won't be able to come to work today.\n- I have a fever and a bad cough, and my doctor has advised me to rest for three days.\n- I'll send you a medical certificate (справка) when I return.\n- I'll keep you updated. Thank you for understanding.\nВопросы собеседника: How are you feeling? Are you feeling better? Get well soon! Take care.\nРеакция на болезнь другого: Oh, I'm sorry to hear that. I hope you feel better soon. Is there anything I can do?\n\n## Раздел 8. Произношение и интонация\nСлова: headache /ˈhɛdeɪk/, stomach /ˈstʌmək/, ache /eɪk/, cough /kɔːf/, throat /θroʊt/ (межзубный /θ/), fever /ˈfiːvər/, symptom /ˈsɪmptəm/, prescription /prɪˈskrɪpʃən/, pharmacy /ˈfɑːrməsi/, allergic /əˈlɜːrdʒɪk/, appointment /əˈpɔɪntmənt/, dizzy /ˈdɪzi/, nausea /ˈnɔːziə/, injury /ˈɪndʒəri/, medicine /ˈmɛdɪsɪn/ (часто два слога /ˈmɛdsən/), temperature /ˈtɛmprətʃər/ (часто три слога), recover /rɪˈkʌvər/.\nНе читаются: часть слов имеет непроизносимые буквы (headache: ch как /k/ в ache; doctor /ˈdɑːktər/).\nСлабые формы: Do you have → /dʒə hæv/; How long have you → /haʊ lɔːŋ həv ju/; I've had → /aɪv hæd/.\nИнтонация: вопросы врача да/нет с подъёмом: Are you allergic to anything? ↗ Вопросы с wh-словом с падением: How long have you had it? ↘ Сочувствие: Oh, I'm so sorry to hear that. ↘ с мягким, заботливым тоном.\nЯсность: говорите медленно и чётко о важных деталях (аллергия, лекарства, адрес).\n\n## Раздел 9. Практика 1. Лексика\nВставьте слово: 1) I have a ___ in my head (headache/ache). 2) My throat ___ (hurts/pain). 3) I feel ___ (dizzy/dizzily). 4) I have a ___ (cough/coughs). 5) I need a ___ (prescription/describe) for this medicine.\nСоедините симптом и состояние: 1) sneezing, runny nose, sore throat. 2) high temperature, aches, chills. 3) itchy skin, rash after eating something. a) allergy b) flu c) cold.\nНазовите части тела: ... (покажите на себе и назовите по-английски 15 частей).\n\n## Раздел 10. Практика 2. Советы\nДайте совет с should, shouldn't или had better (общие бытовые советы): 1) I have a cold. 2) I have a headache after working at the computer. 3) I can't sleep. 4) My friend has a fever. 5) I cut my finger. 6) I have a cough and it's getting worse.\n\n## Раздел 11. Практика 3. Present Perfect\nВставьте for или since и форму глагола: 1) I ___ (have) a headache ___ Monday. 2) She ___ (be) ill ___ three days. 3) He ___ (not feel) well ___ this morning. 4) How long ___ you ___ (have) these symptoms? 5) I ___ (cough) ___ a week. 6) They ___ (be) in hospital ___ yesterday.\n\n## Раздел 12. Практика 4. Порядок диалога\nРасставьте реплики по порядку: a) How long have you had these symptoms? b) Hello, please sit down. How can I help you? c) I'll prescribe some medicine. Take one tablet twice a day. d) I've had a sore throat and a cough. e) Thank you, doctor. f) Since Monday. Are you allergic to anything? g) No, I'm not.\n\n## Раздел 13. Практика 5. Телефонная запись\nЗаполните пропуски: A: Good morning, Green Clinic. How can I ___ you? B: Hello, I'd like to make an ___, please. A: What seems to be the ___? B: I have a bad ___ and a ___. A: Could I have your ___ and date of birth? B: It's Dana Nurova. A: The doctor is ___ at three o'clock tomorrow. B: That's ___. Thank you.\n\n## Раздел 14. Практика 6. Перевод\n1) У меня болит голова. 2) У меня температура. 3) Сколько времени вы это чувствуете? 4) У вас есть аллергия на что-нибудь? 5) Мне нужен рецепт? 6) Принимайте это дважды в день. 7) Вам нужно отдохнуть. 8) Выздоравливайте скорее! 9) Мне нужно записаться к врачу. 10) Я плохо себя чувствую.\n\n## Раздел 15. Практика 7. Чтение, диктовка, говорение, письмо\nЧтение. Прочитайте текст и ответьте.\nLast week I had a sore throat and a cough. I thought it was a cold, but after three days I still felt tired and I had a fever. I called the clinic and made an appointment. The doctor asked me about my symptoms and checked my throat. She said it was an infection and told me to rest and drink a lot of water. She also gave me a prescription. I went to the pharmacy, took the medicine as directed, and after a week I felt much better.\nВопросы: 1) What symptoms did the writer have at first? 2) How long did the writer wait before calling the clinic? 3) What did the doctor say it was? 4) What did the doctor advise? 5) What did the writer do at the pharmacy? 6) How did the writer feel after a week?\nДиктовка: I have a headache and a fever. How long have you had these symptoms? Are you allergic to anything? You should rest and drink plenty of water. I'd like to make an appointment.\nГоворение (запись по 3–5 минут):\n1) Разыграйте телефонный звонок в клинику для записи.\n2) Разыграйте визит к врачу: вы описываете симптомы, врач задаёт вопросы.\n3) Разыграйте разговор в аптеке.\n4) Расскажите, что вы делаете, чтобы оставаться здоровым (8 предложений).\n5) Сообщите на работе о болезни (устно по телефону).\nПисьмо. Напишите письмо руководителю, что вы больны и не сможете выйти на работу, на 60–80 слов. Чек-лист: вежливое обращение, симптомы, срок, обещание справки, благодарность, формула окончания (Kind regards).\n\n## Раздел 16. Ключи\nПрактика 1: 1) headache 2) hurts 3) dizzy 4) cough 5) prescription. 1-c, 2-b, 3-a.\nПрактика 2 (примеры общих бытовых советов): 1) You should rest and drink plenty of water. 2) You should take a break and look away from the screen. 3) You shouldn't drink coffee in the evening. 4) He should see a doctor. 5) You should clean it and put a bandage on it. 6) You'd better see a doctor.\nПрактика 3: 1) have had, since 2) has been, for 3) hasn't felt, since 4) have, had 5) have coughed (have been coughing), for 6) have been, since.\nПрактика 4: b, d, a, f, g, c, e.\nПрактика 5: help; appointment; problem; cough, fever (или cough и headache); name; available; fine.\nПрактика 6: 1) My head hurts. / I have a headache. 2) I have a fever. / I have a temperature. 3) How long have you had this? / How long have you felt like this? 4) Are you allergic to anything? 5) Do I need a prescription? 6) Take this twice a day. 7) You need to rest. / You should rest. 8) Get well soon! 9) I need to make an appointment with the doctor. 10) I don't feel well.\nПрактика 7 (чтение): 1) A sore throat and a cough. 2) Three days. 3) An infection. 4) To rest and drink a lot of water. 5) Got the medicine (по рецепту). 6) Much better.\n\n## Раздел 17. Таблица типичных ошибок\n- Present Perfect вместо Present Simple для длительности: I have a headache since Monday → I've had a headache since Monday.\n- Be вместо have: I am headache → I have a headache.\n- Перевод «Мне плохо»: I'm bad → I feel bad / I feel sick / I don't feel well.\n- Предлоги: I have a pain on my chest → in my chest.\n- Артикли: I have cold → I have a cold.\n- Просьба повторить: кивать вместо вопроса (лучше переспросить).\n- sick и ill: в британском sick чаще означает «тошнит».\n- Дозировка: не сообщайте и не запоминайте дозировку по памяти, всегда уточняйте у врача или по инструкции.\nВедите личный список ошибок.\n\n## Раздел 18. Самооценка\nПо 2 балла: □ я называю части тела и симптомы □ я описываю боль (где, когда, как долго) □ я использую Present Perfect с for и since □ я даю и понимаю советы (should, had better) □ я могу записаться к врачу и поговорить с ним □ я могу сообщить о болезни.\nРезультат: 10–12 баллов — переходите к уроку 10; 6–9 — повторите слабые разделы; меньше 6 — повторите неделю.\n\n## Раздел 19. Итоговый тест (15 баллов)\n1) Как сказать «У меня болит голова»? 2) Как сказать «У меня температура»? 3) Как сказать «Мне нужно записаться к врачу»? 4) Вставьте for или since: I've had a cough ___ Monday. 5) Вставьте for или since: ___ three days. 6) Исправьте: I have a headache since yesterday. 7) Как дать совет: ___ rest (should/must). 8) Что значит prescription? 9) Как спросить, есть ли аллергия? 10) Различие sick в США и Великобритании. 11) Как спросить, сколько времени длятся симптомы? 12) Что значит over-the-counter? 13) Как сказать «Выздоравливайте скорее»? 14) Как попросить повторить? 15) Как позвонить в экстренную службу в США?\nОтветы: 1) My head hurts. / I have a headache. 2) I have a fever. / I have a temperature. 3) I need to make an appointment with the doctor. 4) since 5) for 6) I've had a headache since yesterday. 7) should 8) рецепт 9) Are you allergic to anything? 10) В США sick чаще значит «больной», в Великобритании чаще «тошнит» 11) How long have you had these symptoms? 12) без рецепта 13) Get well soon! 14) Could you say that again, please? 15) 911.\nОценка: 13–15 — отлично, переходите к уроку 10; 10–12 — хорошо, повторите слабые разделы; меньше 10 — вернитесь к теории и практике.\n\n## Раздел 20. План на 4 недели\nНеделя 1: лексика тела и самочувствия (раздел 1), как описывать боль (раздел 2). Практика 1. Ежедневно 10 минут карточек.\nНеделя 2: Present Perfect (раздел 3), советы и модальные (раздел 4). Практика 2, 3.\nНеделя 3: сценарий приёма у врача (раздел 5), аптека (раздел 6), экстренные ситуации и сообщение о болезни (раздел 7), произношение (раздел 8). Практика 4, 5, 6.\nНеделя 4: чтение, диктовка, говорение, письмо, итоговая запись, самооценка, тест, разбор ошибок.\n\n## Что стоит сверить в книгах\nRaymond Murphy, «English Grammar in Use» (Present Perfect, modal verbs); Michael Swan, «Practical English Usage»; Cambridge Dictionary и Oxford Learner's Dictionaries (произношение и примеры). Для лексики здоровья: «Oxford English for Careers: Nursing» и «English for Medical Purposes» (ресурсы уровня B1 и выше).\nВажное замечание: урок учит языку, а не лечению. Реальные медицинские решения принимайте вместе с врачом. Номера экстренных служб и правила медицинской помощи различаются по странам. Для оценки произношения нужна обратная связь от человека, хорошо владеющего языком.\n", "w": [["symptom", "симптом", "/ˈsɪmptəm/"], ["headache", "головная боль", "/ˈhɛdeɪk/"], ["fever", "температура, жар", "/ˈfiːvər/"], ["cough", "кашель", "/kɔːf/"], ["ache", "ноющая боль", "/eɪk/"], ["injury", "травма", "/ˈɪndʒəri/"], ["allergy", "аллергия", "/ˈælərdʒi/"], ["prescription", "рецепт", "/prɪˈskrɪpʃən/"], ["pharmacy", "аптека", "/ˈfɑːrməsi/"], ["dizzy", "головокружение", "/ˈdɪzi/"], ["nausea", "тошнота", "/ˈnɔːziə/"], ["medicine", "лекарство", "/ˈmɛdɪsɪn/"], ["treatment", "лечение", "/ˈtriːtmənt/"], ["recover", "выздоравливать", "/rɪˈkʌvər/"], ["infection", "инфекция", "/ɪnˈfɛkʃən/"], ["bandage", "бинт", "/ˈbændɪdʒ/"], ["ambulance", "скорая помощь", "/ˈæmbjələns/"], ["emergency", "экстренная ситуация", "/ɪˈmɜːrdʒənsi/"], ["insurance", "страховка", "/ɪnˈʃʊrəns/"], ["appointment", "запись на приём", "/əˈpɔɪntmənt/"]]}]};

let NETRAF=0;
function edgesFor(k){const m=METHODS[k],n=m.s.length,c=(D.links||{})[k];if(Array.isArray(c)&&c.length)return c;const E=[];for(let i=0;i<n-1;i++){E.push([i,i+1]);if(i%3===0&&i+3<n)E.push([i,i+3]);if(i%4===1&&i+2<n)E.push([i,i+2])}return E}
function net(){cancelAnimationFrame(NETRAF);const p=D.plan,k=p.m,m=METHODS[k],n=m.s.length,E=edgesFor(k),done=new Set(p.done);
const pre=i=>E.filter(e=>e[1]===i).map(e=>e[0]);
const nxt=new Set();for(let i=0;i<n;i++)if(!done.has(i)&&pre(i).every(j=>done.has(j)))nxt.add(i);
$("#v").innerHTML=`<div class="card"><h2>Нейронные связи: ${esc(m.n)}</h2><canvas id="cv" style="width:100%;height:60vh;border-radius:10px;background:#0b1020;touch-action:none;display:block"></canvas><p class="m"><span style="color:#ffcf40">●</span> пройдено &nbsp;<span style="color:#7fd1ff">●</span> можно изучать сейчас &nbsp;<span style="color:#5b6b8c">●</span> пока закрыто. Вращайте пальцем, нажмите на точку, чтобы увидеть тему.</p><div id="ni" class="m"></div><div class="row"><button class="g" id="nb">Построить связи с помощью ИИ</button></div></div>`;
const P=[];for(let i=0;i<n;i++){const a=i*.9,r=1+.3*((i%3)-1),y=n>1?(i/(n-1)-.5)*2.4:0;P.push([Math.cos(a)*r,y,Math.sin(a)*r])}
let ry=0,rx=.35,drag=null,sel=-1;const cv=$("#cv"),ctx=cv.getContext("2d");
const fit=()=>{const d=devicePixelRatio||1;cv.width=cv.clientWidth*d;cv.height=cv.clientHeight*d;ctx.setTransform(d,0,0,d,0,0)};fit();
const proj=q=>{const[x,y,z]=q,cy=Math.cos(ry),sy=Math.sin(ry),x1=x*cy+z*sy,z1=-x*sy+z*cy,cx=Math.cos(rx),sx=Math.sin(rx),y2=y*cx-z1*sx,z2=y*sx+z1*cx,W=cv.clientWidth,H=cv.clientHeight,s=Math.min(W,H)*.68/(3-z2);return[W/2+x1*s,H/2+y2*s,z2]};
const draw=t=>{if(!cv.isConnected)return;const W=cv.clientWidth,H=cv.clientHeight;ctx.clearRect(0,0,W,H);if(!drag)ry+=.004;const Q=P.map(proj);
ctx.lineWidth=1.2;E.forEach(([a,b])=>{if(!Q[a]||!Q[b])return;const lit=done.has(a)&&done.has(b);ctx.strokeStyle=lit?"rgba(255,207,64,.85)":done.has(a)?"rgba(127,209,255,.55)":"rgba(91,107,140,.35)";ctx.shadowColor=lit?"#ffcf40":"transparent";ctx.shadowBlur=lit?8:0;ctx.beginPath();ctx.moveTo(Q[a][0],Q[a][1]);ctx.lineTo(Q[b][0],Q[b][1]);ctx.stroke()});ctx.shadowBlur=0;
[...Q.keys()].sort((a,b)=>Q[a][2]-Q[b][2]).forEach(i=>{const[x,y,z]=Q[i],d=done.has(i),nx=nxt.has(i),c=d?"#ffcf40":nx?"#7fd1ff":"#5b6b8c",r=(d?7+1.5*Math.sin(t/300+i):nx?6:4.5)*(1+z*.15);ctx.fillStyle=c;ctx.shadowColor=c;ctx.shadowBlur=d?22:nx?14:0;ctx.beginPath();ctx.arc(x,y,Math.max(2,r),0,7);ctx.fill();ctx.shadowBlur=0;if(i===sel){ctx.strokeStyle="#fff";ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,r+5,0,7);ctx.stroke();ctx.lineWidth=1.2}ctx.fillStyle="rgba(255,255,255,.75)";ctx.font="11px system-ui";ctx.fillText(i+1,x+r+3,y+4)});
NETRAF=requestAnimationFrame(draw)};NETRAF=requestAnimationFrame(draw);
cv.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,m:false};cv.setPointerCapture(e.pointerId)};
cv.onpointermove=e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>3)drag.m=true;ry+=dx*.01;rx=Math.max(-1.2,Math.min(1.2,rx+dy*.01));drag.x=e.clientX;drag.y=e.clientY};
cv.onpointerup=e=>{if(drag&&!drag.m){const r=cv.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top;let b=-1,bd=1600;P.map(proj).forEach((q,i)=>{const d=(q[0]-px)**2+(q[1]-py)**2;if(d<bd){bd=d;b=i}});sel=b;
$("#ni").innerHTML=b<0?"":`<b>${b+1}. ${esc(m.s[b])}</b><br>${done.has(b)?"Пройдено.":nxt.has(b)?"Можно изучать сейчас.":"Сначала пройдите: "+pre(b).filter(j=>!done.has(j)).map(j=>j+1).join(", ")}${E.some(e=>e[0]===b)?"<br>Ведёт к: "+E.filter(e=>e[0]===b).map(e=>e[1]+1).join(", "):""}`}drag=null};

const ld=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
let LAST=Date.now(),TS=0,CM=null;["click","keydown","touchstart","scroll","pointerdown"].forEach(ev=>document.addEventListener(ev,()=>{LAST=Date.now()},{passive:true}));
setInterval(()=>{if(!ME||document.hidden||Date.now()-LAST>60000)return;D.time=D.time||{};const k=ld();D.time[k]=(D.time[k]||0)+15;TS++;if(TS%4===0)sv()},15000);
function cal(){const now=new Date();if(!CM)CM=new Date(now.getFullYear(),now.getMonth(),1);const y=CM.getFullYear(),mo=CM.getMonth(),days=new Date(y,mo+1,0).getDate(),off=(new Date(y,mo,1).getDay()+6)%7,T=D.time||{},G=D.log||{},key=d=>y+"-"+String(mo+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
const fm=s=>s>=3600?Math.floor(s/3600)+" ч "+Math.round(s%3600/60)+" м":Math.round(s/60)+" м";
let mt=0,act=0,dn=0,all=0;Object.values(T).forEach(v=>all+=v);for(let d=1;d<=days;d++){const k=key(d);mt+=T[k]||0;if(T[k]>=60)act++;dn+=(G[k]||[]).length}
let st=0;const dd=new Date();if(!(T[ld()]>=60))dd.setDate(dd.getDate()-1);for(;;){const k=dd.getFullYear()+"-"+String(dd.getMonth()+1).padStart(2,"0")+"-"+String(dd.getDate()).padStart(2,"0");if(T[k]>=60){st++;dd.setDate(dd.getDate()-1)}else break}
let cells="";for(let i=0;i<off;i++)cells+="<div></div>";
for(let d=1;d<=days;d++){const k=key(d),s=T[k]||0,g=(G[k]||[]).length,a=Math.min(1,s/3600);cells+=`<button class="g" data-k="${k}" style="padding:4px;min-height:54px;font-size:12px;${s?`background:rgba(79,195,161,${.15+a*.55})`:""}${k===ld()?";outline:2px solid var(--a)":""}"><b>${d}</b><br>${s?fm(s):""}${g?`<br>●${g}`:""}</button>`}
