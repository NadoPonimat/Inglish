ерепишите, используя 's или ': 1) the car of my father 2) the toys of the children 3) the house of my parents 4) the bag of Lera 5) the names of my sisters 6) the phone of my brother 7) the office of the doctor.\n\n## Раздел 12. Практика 4. Исправьте ошибки\n1) At me is a brother. 2) She have two sisters. 3) Have you a car? 4) He hasn't brothers. 5) My sister has got 25 years. 6) They has a big family. 7) Do she have a dog? 8) I am working every day.\n\n## Раздел 13. Практика 5. Преобразование\nСделайте отрицание и вопрос: 1) He works in Almaty. 2) They live with their parents. 3) She likes coffee. 4) My mother teaches English. Затем ответьте кратко: Does your mother work? Do you have brothers?\n\n## Раздел 14. Практика 6. Артикли\nВставьте a, an, the или поставьте прочерк (—): 1) I have ___ older brother. 2) ___ brother lives in Astana. 3) She is ___ doctor. 4) He is ___ honest man. 5) My mother is ___ teacher at ___ university. 6) We have ___ dinner at seven. 7) ___ sun is hot. 8) He plays ___ guitar.\n\n## Раздел 15. Практика 7. Перевод\n1) У меня две сестры. 2) Моего отца зовут Айдар. 3) Моя мама работает учителем. 4) Она похожа на свою бабушку. 5) Каков он по характеру? 6) Мои родители живут в Алматы. 7) Он не любит рано вставать. 8) Вы часто видитесь с кузенами? 9) Сколько лет вашему брату? 10) Это машина Леры.\n\n## Раздел 16. Практика 8. Чтение, диктовка, говорение, письмо\nЧтение. Прочитайте текст и ответьте на вопросы.\nMy name is Dana. I'm twenty-six and I live in Almaty with my parents and my younger brother. My father is a doctor. He works at a hospital and he often works at night. My mother is a teacher. She teaches English at a university. My brother, Timur, is nineteen. He is a student. He doesn't like mornings, so he usually wakes up late. We have a dog. His name is Max. My grandparents live in a village near the city. We visit them every weekend. My grandmother cooks delicious food and my grandfather tells funny stories.\nВопросы: 1) How old is Dana? 2) Who does she live with? 3) What does her father do? 4) Does her mother teach Russian? 5) Why does Timur wake up late? 6) What is the dog's name? 7) How often do they visit their grandparents? 8) Who tells funny stories?\nДиктовка (5 предложений, слушать по диктору или читать вслух партнёру, писать по памяти): My cousin lives in Astana. She doesn't work on Sundays. Does your brother play the guitar? My parents' house is near the park. He looks like his father but he takes after his mother.\nГоворение. Задания (по 5–10 минут каждое, с записью):\n1) Расскажите о своей семье, 8–10 предложений, используя have, has и 's.\n2) Опишите внешность и характер одного человека из семьи, 6–8 предложений.\n3) Задайте партнёру 8 вопросов о его семье и ответьте на 8 его вопросов.\n4) Опишите обычный день члена семьи в Present Simple, 8 предложений.\n5) Сыграйте диалог: вы знакомитесь с новым коллегой и говорите о семьях.\nПисьмо. Напишите текст My family на 120–150 слов. Чек-лист: названо не менее 4 членов семьи; есть не менее 3 описаний внешности или характера; 6 примеров Present Simple; 3 примера притяжательного 's; правильные артикли; проверены окончания -s у глаголов. Покажите текст партнёру или преподавателю и разберите ошибки.\n\n## Раздел 17. Ключи к практике\nПрактика 1: boxes, babies, wives, children, men, days, people, brothers-in-law, teeth, families.\nПрактика 2: watches /ɪz/, lives /z/, helps /s/, goes /z/, studies /z/, plays /z/, teaches /ɪz/, has /z/, works /s/, washes /ɪz/.\nПрактика 3: my father's car; the children's toys; my parents' house; Lera's bag; my sisters' names; my brother's phone; the doctor's office.\nПрактика 4: 1) I have a brother. 2) She has two sisters. 3) Do you have a car? / Have you got a car? 4) He doesn't have any brothers. / He hasn't got any brothers. 5) My sister is 25. 6) They have a big family. 7) Does she have a dog? 8) I work every day.\nПрактика 5: 1) He doesn't work in Almaty. Does he work in Almaty? 2) They don't live with their parents. Do they live with their parents? 3) She doesn't like coffee. Does she like coffee? 4) My mother doesn't teach English. Does my mother teach English?\nПрактика 6: 1) an; 2) The; 3) a; 4) an; 5) a, a; 6) —; 7) The; 8) the.\nПрактика 7: 1) I have two sisters. / I've got two sisters. 2) My father's name is Aidar. 3) My mother works as a teacher. / My mother is a teacher. 4) She looks like her grandmother. 5) What is he like? 6) My parents live in Almaty. 7) He doesn't like getting up early. 8) Do you often see your cousins? 9) How old is your brother? 10) It's Lera's car.\nПрактика 8 (чтение): 1) She is twenty-six. 2) With her parents and her younger brother. 3) He is a doctor. 4) No, she teaches English. 5) Because he doesn't like mornings. 6) Max. 7) Every weekend. 8) Her grandfather.\n\n## Раздел 18. Таблица типичных ошибок\n- Опущение be: I from Almaty → I'm from Almaty.\n- Have вместо be для возраста: I have 25 years → I'm 25.\n- Забытое -s: He work → He works.\n- Лишнее -s после does: Does he works → Does he work.\n- Отсутствие артикля: I have brother → I have a brother.\n- Of вместо 's для людей: the name of my mother → my mother's name.\n- Неверный выбор вопроса: How is he? (как дела) вместо What is he like? (каков он).\nВедите личный список ошибок и перечитывайте его раз в неделю.\n\n## Раздел 19. Итоговый тест (15 баллов)\n1) My sister ___ (live) in Astana. 2) ___ your brothers work? 3) She ___ (not have) any children. 4) This is my ___ (parents) house. 5) He ___ (be) tall. 6) What does he ___ like? (look или be) 7) I'm ___ only child. 8) Two ___ (child). 9) He ___ (teach) at a school. 10) ___ you got a cousin? 11) My grandfather ___ (go) to the park every day. 12) They ___ (not like) coffee. 13) How old ___ your sister? 14) I usually ___ (get up) at seven. 15) She ___ (look) like her father.\nОтветы: 1) lives 2) Do 3) doesn't have 4) parents' 5) is 6) look 7) an 8) children 9) teaches 10) Have 11) goes 12) don't like 13) is 14) get up 15) looks.\nОценка: 13–15 — отлично, переходите к уроку 3. 10–12 — хорошо, повторите слабые разделы и сдайте тест снова. Меньше 10 — вернитесь к теории и практике, повторите две недели.\n\n## План на 4 недели\nНеделя 1: лексика семьи (раздел 1), описание людей (раздел 2), have/have got (раздел 3). Практика 4 и 7 по этим темам. Ежедневно: 10 минут карточек.\nНеделя 2: множественное число (раздел 4), притяжательный падеж (раздел 5), артикли (раздел 6). Практика 1, 3, 6. Диктовка.\nНеделя 3: Present Simple (раздел 7), произношение (раздел 8). Практика 2, 5, 12. Говорение 1, 2, 4. Запись и самопроверка.\nНеделя 4: чтение и перевод (практика 7 и 8), письмо, говорение 3 и 5 с партнёром, итоговый тест. Разбор ошибок по таблице.\n\n## Что стоит сверить в книгах\nRaymond Murphy, «English Grammar in Use» (Present Simple, артикли, притяжательный падеж); Michael Swan, «Practical English Usage» (справочник по тонкостям); Cambridge Dictionary и Oxford Learner's Dictionaries (произношение и примеры). Для фонетики: Peter Roach, «English Phonetics and Phonology».\nВажное замечание: упражнения и ключи в этом уроке составлены для самопроверки. Для настоящей оценки произношения и письма нужна обратная связь от человека, который хорошо владеет английским.\n", "w": [["sibling", "брат или сестра", "/ˈsɪblɪŋ/"], ["parents", "родители", "/ˈpɛrənts/"], ["relatives", "родственники", "/ˈrɛlətɪvz/"], ["cousin", "двоюродный брат/сестра", "/ˈkʌzən/"], ["nephew", "племянник", "/ˈnɛfjuː/"], ["niece", "племянница", "/niːs/"], ["uncle", "дядя", "/ˈʌŋkəl/"], ["aunt", "тётя", "/ænt/"], ["husband", "муж", "/ˈhʌzbənd/"], ["wife", "жена", "/waɪf/"], ["daughter", "дочь", "/ˈdɔːtər/"], ["grandfather", "дедушка", "/ˈɡrænfɑːðər/"], ["grandmother", "бабушка", "/ˈɡrænmʌðər/"], ["twins", "близнецы", "/twɪnz/"], ["tall", "высокий", "/tɔːl/"], ["kind", "добрый", "/kaɪnd/"], ["shy", "застенчивый", "/ʃaɪ/"], ["strict", "строгий", "/strɪkt/"], ["generous", "щедрый", "/ˈdʒɛnərəs/"], ["honest", "честный", "/ˈɑːnɪst/"]]}, {"t": "УРОК 3. ЕДА И ЗАКАЗ В КАФЕ (РАСШИРЕННЫЙ КУРС)\nОбъём: 4 недели, 5–6 дней в неделю по 45–60 минут (около 20–25 часов). Уровень: A1 → A2.\nУчебный язык: объяснения по-русски, примеры по-английски. Основной вариант: американский, британские отличия отмечены.\n\n## Как устроен урок\nТеория (разделы 1–8), практика (разделы 9–16), контроль (разделы 17–19). Прочитайте теорию целиком без заучивания, затем работайте с практикой и возвращайтесь к теории по мере необходимости. Цель урока: самостоятельно сделать заказ, задать вопросы по меню, оплатить счёт и поддержать разговор за столом.\n\n## Раздел 0. Научная основа метода\n1. Ситуативное обучение: язык лучше всего усваивается в узнаваемых ситуациях. Кафе даёт повторяющийся сценарий (встреча, меню, заказ, оплата), который можно отрабатывать как ролевую игру.\n2. Готовые блоки: в бытовой речи много устойчивых фраз (I'd like..., Could I have...?). Их нужно знать целиком.\n3. Выходная речь: говорение и письмо заставляют замечать пробелы (идея Мерилл Суэйн). Поэтому в уроке много ролевых заданий.\n4. Интервальные повторения: возвращайтесь к лексике через 1, 3, 7, 14 дней (вкладка «Карточки»).\n5. Обратная связь: ошибки разбираются в таблице и по ключам.\n\n## Раздел 1. Лексика: еда, напитки, заведения\nПриёмы пищи: breakfast /ˈbrɛkfəst/, lunch /lʌntʃ/, dinner /ˈdɪnər/, supper (лёгкий ужин; в британской речи), snack /snæk/, brunch (поздний завтрак).\nЗаведения: cafe, restaurant, fast-food place, bar, canteen (столовая), food court.\nЛюди: waiter /ˈweɪtər/ (официант), waitress, server (США, нейтрально), chef /ʃɛf/, customer, guest.\nСтруктура меню: starter (UK) / appetizer (US) — закуска; main course (UK) / entrée (US: основное блюдо; во французском значении закуска, поэтому не путайте); side dish — гарнир; dessert /dɪˈzɜːrt/ — десерт; drinks — напитки; special — блюдо дня; soup of the day — суп дня.\nБлюда и продукты: soup, salad, sandwich, burger, pizza, pasta, rice, chicken, beef, fish, vegetables /ˈvɛdʒtəbəlz/, fruit, bread, cheese, egg, butter, sugar, salt, pepper.\nНапитки: water (still / sparkling), tea, coffee, juice, milk, soda (US) / fizzy drink (UK), beer, wine.\nВкусы и качества: sweet, sour, salty, bitter, spicy /ˈspaɪsi/ (острый), mild (нежный, не острый), fresh, hot, cold, delicious /dɪˈlɪʃəs/, tasty.\nДиеты: vegetarian /ˌvɛdʒəˈtɛriən/, vegan /ˈviːɡən/, gluten-free, halal /həˈlɑːl/, lactose-free. Аллергия: I'm allergic to nuts /əˈlɜːrdʒɪk/.\nСервис и оплата: table for two, reservation, menu /ˈmɛnjuː/, order, bill (UK) / check (US), tip, service charge, to go (US) / takeaway (UK), change (сдача), receipt /rɪˈsiːt/, card, cash.\n\n## Раздел 2. Исчисляемые и неисчисляемые существительные\nИсчисляемые: можно посчитать, есть множественное число: an apple, two apples; a sandwich, three sandwiches.\nНеисчисляемые: нельзя посчитать, нет множественного числа, не употребляется с a/an: water, rice, bread, milk, soup, cheese, sugar, salt. Нельзя two breads, two waters (в меню допустимо в значении порций: two waters, please).\nМногие продукты сочетаются с мерами: a cup of tea, a glass of water, a bottle of water, a slice of pizza, a piece of cake, a bowl of soup, a plate of rice.\nСлова some / any / a lot of:\n- some: в утверждениях и предложениях (Would you like some coffee?).\n- any: в отрицаниях и вопросах (I don't have any sugar. Do you have any tea?).\n- a lot of: много (a lot of rice).\nmuch / many:\n- many — с исчисляемыми (How many eggs?), much — с неисчисляемыми (How much sugar?).\n- в утверждении: a lot of, а не much (I eat a lot of rice).\nОсобенность: coffee, tea, juice могут быть и неисчисляемыми (I like coffee), и исчисляемыми в значении порции (Two coffees, please).\nРусскоговорящие часто ошибаются: a bread ✗ → a piece of bread / some bread ✓; much apples ✗ → many apples ✓.\n\n## Раздел 3. Вежливые просьбы и заказ\nI want... звучит слишком резко, как требование. В кафе используют:\n- I'd like... /aɪd laɪk/ (я бы хотел): I'd like a coffee, please.\n- Could I have...? (можно мне...?): Could I have the menu, please?\n- Can I have...? (менее формально, но допустимо).\n- I'll have... (я возьму): I'll have the chicken salad.\nКлючевые слова вежливости: please, thank you, excuse me, sorry. Интонация и мягкость важнее самой формы.\nПредложения со стороны персонала: Are you ready to order? Would you like something to drink? Anything else? Still or sparkling? For here or to go? (в США).\nМодальный would: Would you like tea or coffee? Would you like some more?\n\n## Раздел 4. Диалог в кафе: пошаговая схема\n1) Встреча. Waiter: Hello. Table for how many? You: Table for two, please.\n2) Меню. Waiter: Here's the menu. Can I get you something to drink? You: I'd like a tea, please.\n3) Вопросы по меню. You: What do you recommend? Is it spicy? Does it come with fries? Is there any meat in it?\n4) Заказ. You: I'll have the chicken salad, please.\n5) Уточнение. Waiter: Anything else? You: No, that's all, thank you.\n6) Во время еды. Waiter: Is everything okay? You: Yes, it's delicious, thank you.\n7) Оплата. You: Could we have the bill, please? Can I pay by card? Keep the change.\n8) Прощание. You: Thank you, have a nice day.\nТипичные вопросы: Is it spicy? (Это острое?) Does it come with...? (К этому подаётся...?) What's in it? (Что в составе?) How long will it take? (Сколько ждать?) Can I have it without onions? (Можно без лука?) Does this contain nuts? (Здесь есть орехи?)\nБезопасность: если у вас есть аллергия или диета, говорите об этом сразу и чётко: I'm allergic to nuts. I can't eat gluten. Is there any ... in it?\nТелефонное бронирование: I'd like to book a table for four at 7 p.m. tonight. Under the name Lera. Could I change my reservation to 8?\n\n## Раздел 5. Предпочтения и глаголы\nlike (нравится), love (очень нравится), enjoy (получать удовольствие), prefer (предпочитать), hate (ненавидеть), don't mind (не против).\nСтруктуры: I like pizza. I prefer tea to coffee. I'd rather have tea. (Я бы предпочёл чай.) I love spicy food. I can't stand fish. (терпеть не могу)\nPresent Simple для вкусов: She likes coffee. He doesn't like cheese. Do you like spicy food? (не забудьте -s и do/does, см. урок 2.)\nСравнения: Tea is cheaper than coffee. This soup is the best.\n\n## Раздел 6. Счёт, оплата, чаевые\nПросьба о счёте: Could I have the bill, please? (UK) / Could I get the check, please? (US).\nВопросы: Can I pay by card? Do you take cards? Is service included? Can we split the bill? (разделить счёт)\nЧаевые: в США они обычно ожидаются (ориентир 15–20 процентов от суммы, зависит от места). В Великобритании часто в счёт уже включена плата за обслуживание (service charge); проверьте чек. Правила различаются по странам и заведениям, при сомнении спросите: Is service included?\nФразы: Keep the change. (Сдачи не надо.) That's for you. Thanks, it was great.\n\n## Раздел 7. Культурные заметки\n- В США официант подходит сам, чтобы принять заказ и вскоре спросить, всё ли в порядке. Ждать «счёта по требованию» нужно, но принято, чтобы официант оставлял его без запроса.\n- В Великобритании заказ часто делают у стойки в пабах. Спросите, как принято в заведении.\n- Вопрос Is everything okay? — вежливость, а не повод для длинного разговора. Нормальный ответ: Yes, thanks.\n- Small talk за столом: How is your food? Have you been here before? Это поддерживает контакт.\n\n## Раздел 8. Произношение и интонация\nСлова, где русскоговорящие ошибаются:\n- menu /ˈmɛnjuː/ (первый слог ударный), salad /ˈsæləd/, vegetable /ˈvɛdʒtəbəl/ (три слога), chocolate /ˈtʃɔːklət/, sandwich /ˈsænwɪtʃ/ (d почти не слышен), coffee /ˈkɔːfi/, water /ˈwɔːtər/ (в американском t часто как d), tomato /təˈmeɪtoʊ/ (США) / /təˈmɑːtəʊ/ (Британия), dessert /dɪˈzɜːrt/ (ударение на втором слоге; desert /ˈdɛzərt/ пустыня), recommend /ˌrɛkəˈmɛnd/.\nСлабые формы: I'd like → /aɪd laɪk/; Could I have → /kʊd aɪ hæv/ или в быстрой речи /ˈkʊdaɪ hæv/; Would you like → /ˈwʊdʒə laɪk/; Can I have → /kənaɪ hæv/.\nИнтонация: просьбы и вопросы да/нет с подъёмом в конце: Could I have the menu, please? ↗ Выбор из двух: Would you like TEA ↗ or COFFEE? ↘ Утверждения с падением: I'll have the chicken. ↘\nПрактика: проговаривайте ключевые фразы вслух, хлопая на ударных слогах: I'D like a COFfee, PLEASE.\n\n## Раздел 9. Практика 1. Исчисляемые и неисчисляемые\nОпределите, какие слова исчисляемые (C), а какие неисчисляемые (U): apple, water, rice, egg, bread, sandwich, milk, tomato, soup, cheese.\n\n## Раздел 10. Практика 2. Меры, some/any, much/many\n1) a ___ of water (стакан) 2) a ___ of cake (кусок) 3) a ___ of soup (миска) 4) a ___ of tea (чашка) 5) a ___ of pizza (ломтик) 6) a ___ of water (бутылка).\nВставьте some, any, much, many: 1) How ___ sugar? 2) How ___ eggs? 3) I don't have ___ time. 4) There are ___ apples. 5) There isn't ___ milk. 6) Would you like ___ coffee?\n\n## Раздел 11. Практика 3. Вежливые формы\nПерепишите вежливо: 1) I want a table for two. 2) Give me the bill. 3) I want chicken. 4) Where is the toilet?\n\n## Раздел 12. Практика 4. Порядок диалога\nРасставьте реплики по порядку:\na) Anything else? b) Table for two, please. c) Here's the menu. d) I'll have the chicken salad, please. e) No, that's all. Thank you. f) Hello. Table for how many? g) Could we have the bill, please?\n\n## Раздел 13. Практика 5. Вопросы и ответы\nПодберите ответ к вопросу: 1) Is it spicy? 2) Does it come with fries? 3) What do you recommend? 4) Is there any meat in it? 5) How long will it take?\nОтветы: a) Yes, with fries or salad. b) No, it's mild. c) The fish is very good today. d) No, it's vegetarian. e) About fifteen minutes.\n\n## Раздел 14. Практика 6. Перевод\n1) Мне, пожалуйста, чай с лимоном. 2) Столик на двоих, пожалуйста. 3) Что вы порекомендуете? 4) У меня аллергия на орехи. 5) Можно счёт, пожалуйста? 6) Я возьму курицу. 7) Это острое? 8) Можно оплатить картой? 9) С собой, пожалуйста. 10) Сдачи не надо.\n\n## Раздел 15. Практика 7. Чтение, диктовка, говорение, письмо\nЧтение. Прочитайте меню и ответьте.\nGreen Cafe. Soup of the day $5. Chicken salad $9. Pasta with tomato sauce (vegetarian) $8. Fish and chips $11. Coffee $3. Tea $2.50. Orange juice $4. Special: lunch deal (main course + drink) $10.\nВопросы: 1) Which dish is vegetarian? 2) How much is fish and chips? 3) What costs $2.50? 4) What is in the lunch deal? 5) How much do you pay for pasta and orange juice with the lunch deal? 6) How much do you save?\nДиктовка: I'd like a coffee, please. Could we have the menu? Is it spicy? I'm allergic to nuts. Could I have the bill, please?\nГоворение (запись по 3–5 минут):\n1) Разыграйте полный диалог в кафе с партнёром (раздел 4), меняйтесь ролями.\n2) Забронируйте столик по телефону.\n3) Закажите для двоих, обсудив предпочтения (I prefer..., I'd rather...).\n4) Опишите любимую еду, 8 предложений.\n5) Разыграйте ситуацию с аллергией и вопросами о составе блюда.\nПисьмо. Напишите отзыв о кафе (review) на 80–100 слов или сообщение с бронью стола. Чек-лист: названо место, блюда, 2 оценки (delicious, a bit expensive), правильные a/an, some/any, much/many, нет типичных ошибок раздела 17.\n\n## Раздел 16. Ключи\nПрактика 1: C: apple, egg, sandwich, tomato. U: water, rice, bread, milk, soup, cheese.\nПрактика 2: 1) glass 2) piece 3) bowl 4) cup 5) slice 6) bottle. much, many, any, some (в утверждении There are some apples), any, some.\nПрактика 3: 1) I'd like a table for two, please. / Could we have a table for two? 2) Could I have the bill, please? 3) I'll have the chicken, please. 4) Excuse me, where is the restroom? (США) / toilet (Британия).\nПрактика 4: f, b, c, d, a, e, g.\nПрактика 5: 1-b, 2-a, 3-c, 4-d, 5-e.\nПрактика 6: 1) I'd like tea with lemon, please. 2) A table for two, please. 3) What do you recommend? 4) I'm allergic to nuts. 5) Could I have the bill, please? 6) I'll have the chicken. 7) Is it spicy? 8) Can I pay by card? 9) To go, please. / Takeaway, please. 10) Keep the change.\nПрактика 7 (чтение): 1) Pasta with tomato sauce. 2) $11. 3) Tea. 4) A main course and a drink. 5) $10. 6) $2 (8 + 4 = 12 без акции).\n\n## Раздел 17. Таблица типичных ошибок\n- Слишком прямо: I want coffee → I'd like a coffee, please.\n- Неисчисляемое во множественном числе: breads → some bread / pieces of bread.\n- much/many: much apples → many apples.\n- Артикль: I'd like coffee (допустимо в общем смысле, но порция: a coffee).\n- bill / check: bill (Британия), check (США).\n- Опущение be: It spicy? → Is it spicy?\n- Give me ✗ (звучит как приказ) → Could I have...?\n- Забытое -s: She like → She likes.\nВедите список ошибок и перечитывайте раз в неделю.\n\n## Раздел 18. Самооценка\nПо 2 балла: □ я делаю заказ вежливо, не звучу как приказ □ я различаю исчисляемые и неисчисляемые □ я задаю вопросы по меню □ я могу оплатить счёт и спросить про чаевые □ я говорю об аллергии и диете □ я произношу ключевые фразы естественно.\nРезультат: 10–12 баллов — переходите к уроку 4; 6–9 — повторите слабые разделы; меньше 6 — повторите неделю.\n\n## Раздел 19. Итоговый тест (15 баллов)\n1) Вежливо закажите кофе. 2) a ___ of water (glass/bottle). 3) How ___ sugar? 4) How ___ eggs? 5) Do you have ___ tea? (some/any) 6) Как попросить счёт в США? 7) Как спросить, острое ли блюдо? 8) I'll have the chicken означает... 9) Как сказать «у меня аллергия на орехи»? 10) Как спросить, включены ли чаевые? 11) Что значит to go? 12) Какое слово пишется как desert, но означает десерт? (dessert или desert) 13) ___ you like tea or coffee? (Would/Do) 14) Исправьте: I want a coffee. 15) Исправьте: two breads.\nОтветы: 1) I'd like a coffee, please. 2) glass или bottle 3) much 4) many 5) any 6) Could I get the check, please? 7) Is it spicy? 8) Я возьму курицу. 9) I'm allergic to nuts. 10) Is service included? 11) с собой 12) dessert 13) Would 14) I'd like a coffee, please. 15) two pieces of bread / some bread.\nОценка: 13–15 — отлично, переходите к уроку 4; 10–12 — хорошо, повторите слабые разделы; меньше 10 — вернитесь к теории и практике.\n\n## План на 4 недели\nНеделя 1: лексика еды и меню (раздел 1), исчисляемые и неисчисляемые (раздел 2). Практика 1, 2.\nНеделя 2: вежливые просьбы (раздел 3), диалог в кафе (раздел 4), предпочтения (раздел 5). Практика 3, 4, 5. Говорение 1–2.\nНеделя 3: счёт и чаевые (раздел 6), культура (раздел 7), произношение (раздел 8). Практика 6, диктовка. Говорение 3–5.\nНеделя 4: чтение меню, письмо, итоговая ролевая игра, самооценка, тест, разбор ошибок.\n\n## Что стоит сверить в книгах\nRaymond Murphy, «English Grammar in Use» (исчисляемые и неисчисляемые, some/any, much/many); Michael Swan, «Practical English Usage»; Cambridge Dictionary и Oxford Learner's Dictionaries (произношение и примеры).\nВажное замечание: упражнения и ключи составлены для самопроверки. Правила чаевых и сервиса различаются по странам и заведениям, уточняйте на месте. Для оценки произношения нужна обратная связь от человека, хорошо владеющего языком.\n", "w": [["menu", "меню", "/ˈmɛnjuː/"], ["waiter", "официант", "/ˈweɪtər/"], ["bill", "счёт", "/bɪl/"], ["tip", "чаевые", "/tɪp/"], ["order", "заказ, заказывать", "/ˈɔːrdər/"], ["dish", "блюдо", "/dɪʃ/"], ["spicy", "острый", "/ˈspaɪsi/"], ["sweet", "сладкий", "/swiːt/"], ["delicious", "очень вкусный", "/dɪˈlɪʃəs/"], ["breakfast", "завтрак", "/ˈbrɛkfəst/"], ["lunch", "обед", "/lʌntʃ/"], ["dinner", "ужин", "/ˈdɪnər/"], ["dessert", "десерт", "/dɪˈzɜːrt/"], ["vegetarian", "вегетарианский", "/ˌvɛdʒəˈtɛriən/"], ["allergic", "аллергичный", "/əˈlɜːrdʒɪk/"], ["recommend", "рекомендовать", "/ˌrɛkəˈmɛnd/"], ["table", "стол, столик", "/ˈteɪbəl/"], ["soup", "суп", "/suːp/"], ["chicken", "курица", "/ˈtʃɪkən/"], ["takeaway", "еда с собой", "/ˈteɪkəweɪ/"]]}, {"t": "УРОК 4. ТРАНСПОРТ И НАПРАВЛЕНИЯ (РАСШИРЕННЫЙ КУРС)\nОбъём: 4 недели, 5–6 дней в неделю по 45–60 минут (около 20–25 часов). Уровень: A2.\nУчебный язык: объяснения по-русски, примеры по-английски. Основной вариант: американский, британские отличия отмечены.\n\n## Как устроен урок\nТеория (разделы 1–8), практика (разделы 9–17), контроль (разделы 18–20). Прочитайте теорию целиком без заучивания, затем работайте с практикой и возвращайтесь к теории по мере необходимости. Цель урока: спросить дорогу и понять ответ, купить билет, ориентироваться в транспорте и вежливо поговорить с таксистом.\n\n## Раздел 0. Научная основа метода\n1. Ситуативное обучение: язык лучше усваивается в узнаваемых сценариях. Дорога, билет, пересадка дают повторяющиеся ситуации для ролевой игры.\n2. Готовые блоки: в бытовой речи много устойчивых фраз (How do I get to...?, Could you tell me where...?). Их нужно знать целиком.\n3. Выходная речь: говорение и письмо заставляют замечать пробелы (идея Мерилл Суэйн).\n4. Интервальные повторения: возвращайтесь к лексике через 1, 3, 7, 14 дней (вкладка «Карточки»).\n5. Слуховое восприятие: направления произносятся быстро и со слабыми формами, поэтому в уроке есть диктовка и шэдоуинг.\n\n## Раздел 1. Лексика: транспорт и город\nТранспорт: bus, tram, train, taxi, plane, ferry, bike, car, motorbike; subway (США) / underground или tube (Британия) / metro — метро; coach (Британия) — междугородний автобус.\nМеста: station /ˈsteɪʃən/, bus stop, platform /ˈplætfɔːrm/ (платформа), airport /ˈɛrpɔːrt/, terminal, gate (выход на посадку), parking lot (США) / car park (Британия), taxi rank (стоянка такси), crossing, corner, bridge, tunnel, roundabout /ˈraʊndəbaʊt/ (кольцо), traffic light, crossroads /ˈkrɔːsroʊdz/, intersection (США) / junction (Британия), block (США, квартал), sidewalk (США) / pavement (Британия).\nБилеты: ticket /ˈtɪkɪt/, single / one-way (в один конец), return (Британия) / round-trip (США) (туда и обратно), fare (стоимость проезда), pass (проездной), seat, window seat, aisle seat (проход), luggage (Британия) / baggage (США), boarding pass (посадочный талон).\nРасписание: timetable (Британия) / schedule (США), departure /dɪˈpɑːrtʃər/, arrival, delay /dɪˈleɪ/, on time, late, cancelled.\nДействия: get on / get off (автобус, поезд), get in / get out of (машина, такси), take a bus / train, catch (успеть) a train, miss (пропустить) a bus, change (пересаживаться), board (садиться на самолёт), check in, arrive in (город) / arrive at (станция), leave, go on foot.\nНюансы: in the bus ✗ → on the bus ✓; arrive to ✗ → arrive in Astana ✓; by taxi, by bus, by train (без артикля), on foot.\n\n## Раздел 2. Как дать и понять направление\nОсновной язык — повелительное наклонение (команды без подлежащего):\n- Go straight. / Go straight on (Британия). — Идите прямо.\n- Turn left. / Turn right. — Поверните налево/направо.\n- Take the first/second/third left/right. — Первый/второй/третий поворот налево/направо.\n- Cross the street. — Перейдите улицу.\n- Walk past the bank. — Пройдите мимо банка.\n- Continue until you see... / Keep going until... — Идите, пока не увидите...\n- Go along the river. — Идите вдоль реки.\n- Go through the park. — Идите через парк.\n- Go over the bridge. — Перейдите через мост.\nОписание положения:\n- It's on your left / on your right. — Слева / справа от вас.\n- It's next to the bank. — Рядом с банком.\n- It's opposite the cafe. — Напротив кафе.\n- It's behind the station. — За вокзалом.\n- It's between the bank and the shop. — Между банком и магазином.\n- It's at the end of the street. — В конце улицы.\n- It's at the corner of Green Street and Park Road. — На углу Грин-стрит и Парк-роуд.\n- You can't miss it. — Вы не пропустите.\nРасстояние: It's a five-minute walk. It's about two blocks away. It's 300 metres (Британия) / meters (США). It's far. It's near. It takes ten minutes.\nПорядковые числительные: first, second, third, fourth, fifth.\n\n## Раздел 3. Как спросить дорогу: прямые и непрямые вопросы\nПрямые вопросы: Where is the station? How do I get to the airport? Is there a bank near here?\nВежливые (непрямые) вопросы звучат мягче:\n- Excuse me, could you tell me where the station is?\n- Do you know where the bus stop is?\n- Could you tell me how to get to the airport?\n- I'm looking for the post office. (Я ищу почту.)\n- I'm lost. Could you help me? (Я заблудился.)\nГлавное правило непрямых вопросов: после вводной фразы порядок слов прямой, без инверсии и без do/does.\n- Where is the station? → Could you tell me where the station is? (не where is the station)\n- What time does the bus leave? → Do you know what time the bus leaves? (не does leave)\n- Does this train go to Astana? → Do you know if this train goes to Astana? (используйте if или whether)\nОтветы и уточнения: Sorry, I'm not from here. (Я не местный.) Could you repeat that, please? Could you say that more slowly? So I go straight and then turn left, right? (Подтверждение.) Thank you very much.\n\n## Раздел 4. Билеты, поезда, автобусы, такси\nПокупка билета:\n- A single ticket to Astana, please. / A return ticket to Astana, please.\n- How much is a ticket? / How much is the fare?\n- What time does the next train leave? / When is the next bus?\n- Which platform does the train leave from?\n- Is this the right train for Astana? / Does this bus go to the airport?\n- Where do I change? / Do I need to change?\n- How long does it take? — It takes about two hours.\n- Is this seat taken? / Excuse me, I think this is my seat.\n- Which stop is it for the museum?\nТакси:\n- Could you take me to the airport, please?\n- How much will it cost? / How long will it take?\n- Could you stop here, please? / Drop me off here, please.\n- Keep the change. / Can I pay by card?\nАэропорт: check-in desk, boarding pass, gate, passport control, security, baggage claim, delay. Фразы: Where is the check-in desk? Which gate is it? My flight is delayed. Is there a bus to the city centre?\nРасписание в Present Simple: The train leaves at 6:20. The bus arrives at 9:15. (Для расписаний и графиков используют Present Simple, даже когда речь о будущем.)\n\n## Раздел 5. Грамматика урока\nПовелительное наклонение: глагол без подлежащего. Go straight. Don't turn left. Please wait here. Для вежливости добавляйте please.\nThere is / There are: There is a bank on the corner. There are two stops near here. Вопрос: Is there a pharmacy near here? Ответ: Yes, there is. / No, there isn't.\nПредлоги места: in, on, at, next to, opposite, behind, in front of, between, near.\nПредлоги движения: to, from, along, across, through, past, over, under, into, out of.\nМодальные: can/could (Could you...?), have to (Do I have to change?), must (You must buy a ticket).\nСравнения: The metro is faster than the bus. The taxi is more expensive. This is the cheapest way. Образование: короткие прилагательные +er/-est (fast → faster → the fastest), длинные more/most (expensive → more expensive → the most expensive); исключения good → better → the best.\nВремя: How long does it take? It takes ten minutes. How far is it? It's about two kilometres.\nТекущее действие: I'm waiting for the bus. I'm looking for the station. (Present Continuous.)\nЧтение времени: 6:15 — a quarter past six / six fifteen; 6:30 — half past six / six thirty; 6:45 — a quarter to seven / six forty-five; 6:50 — ten to seven / six fifty. a.m. — до полудня, p.m. — после полудня. Формат 24 часов (18:20) используется в расписаниях: eighteen twenty.\n\n## Раздел 6. Культурные заметки\n- Левостороннее и правостороннее движение: в Великобритании левостороннее, в США и большинстве стран правостороннее. Смотрите по сторонам при переходе.\n- Объявление Mind the gap /maɪnd ðə ɡæp/ в британском метро предупреждает о зазоре между вагоном и платформой.\n- В США чаевые таксистам и водителям каршеринга обычно принято оставлять (ориентир 15–20 процентов, зависит от случая). В других странах правила разные, уточняйте на месте.\n- Многие города используют транспортные карты и бесконтактную оплату. Правила и стоимость различаются, смотрите на месте.\n- Не стесняйтесь переспросить: люди обычно охотно помогают, особенно если вы извиняетесь и благодарите.\n- Приложения и карты помогают, но разговор с людьми закрепляет язык.\n\n## Раздел 7. Произношение и интонация\nСлова: station /ˈsteɪʃən/, airport /ˈɛrpɔːrt/, platform /ˈplætfɔːrm/, ticket /ˈtɪkɪt/, direction /dəˈrɛkʃən/ (также /daɪˈrɛkʃən/), straight /streɪt/, opposite /ˈɑːpəzɪt/, sidewalk /ˈsaɪdwɔːk/, schedule /ˈskɛdʒuːl/ (США) / /ˈʃɛdjuːl/ (Британия), route /ruːt/ (в США также /raʊt/ в значении маршрута доставки), luggage /ˈlʌɡɪdʒ/, journey /ˈdʒɜːrni/.\nСлабые формы: Could you tell me → /kʊdʒə tɛl mi/; How do I get to → /haʊ də aɪ ɡɛt tə/; Do you know where → /dʒə noʊ wɛr/; It's on your left → /ɪts ɑːn jər lɛft/.\nИнтонация: перечисление шагов маршрута идёт с подъёмом на каждом шаге и падением на последнем: Go straight ↗, turn left at the bank ↗, and you'll see it on your right ↘.\nВопросы да/нет с подъёмом: Is it far from here? ↗ Вопросы с wh-словами с падением: Where is the station? ↘\nРитм: хлопайте на ударных слогах и проговаривайте: GO STRAIGHT and TURN LEFT at the BANK.\n\n## Раздел 8. Как слушать направления\nНаправления произносят быстро. Стратегия:\n1) Услышьте ключевые слова: straight, left, right, second, bridge, opposite.\n2) Повторите вслух для подтверждения: So I go straight and turn left at the second street?\n3) Запишите или запомните 2–3 шага, а не весь маршрут сразу.\n4) Если не поняли: Sorry, could you say that again? Could you speak more slowly?\n5) Спросите ориентир: Is there a landmark? What will I see?\n\n## Раздел 9. Практика 1. Британский и американский варианты\nСоедините: subway — ?, sidewalk — ?, intersection — ?, round-trip — ?, schedule — ?, parking lot — ?\nВарианты: junction, car park, pavement, timetable, return, underground.\n\n## Раздел 10. Практика 2. Описание маршрута\nПрочитайте и ответьте на вопросы.\nYou are at the station. Go out of the station and walk straight on Green Street. The post office is on the left, next to the cafe. Take the second right on Park Road. The bank is at the end of the street, on the right, opposite the library.\nВопросы: 1) Which street do you walk first? 2) Where is the post office? 3) Which turning do you take? 4) Where is the bank? 5) What is opposite the bank?\n\n## Раздел 11. Практика 3. Непрямые вопросы\nПерепишите вежливо, начиная с Could you tell me... или Do you know...: 1) Where is the station? 2) What time does the bus leave? 3) How much is a ticket? 4) Does this train go to Astana? 5) Where can I buy a ticket?\n\n## Раздел 12. Практика 4. Предлоги движения\nВставьте over, through, along, past, under: 1) Walk ___ the bridge. 2) Go ___ the park. 3) Walk ___ the river. 4) Walk ___ the bank. 5) The train goes ___ the river in a tunnel.\n\n## Раздел 13. Практика 5. Чтение времени\nЗапишите словами: 6:15, 7:30, 8:45, 9:50. Затем прочитайте расписание: The train leaves at 18:20 and arrives at 07:10.\n\n## Раздел 14. Практика 6. Перевод\n1) Извините, как пройти на вокзал? 2) Это далеко отсюда? 3) Идите прямо, затем поверните налево. 4) Автобусная остановка рядом с банком. 5) Один билет в один конец до Астаны, пожалуйста. 6) С какой платформы отправляется поезд? 7) Сколько ехать? 8) Отвезите меня в аэропорт, пожалуйста. 9) Остановите здесь, пожалуйста. 10) Я опоздал на автобус.\n\n## Раздел 15. Практика 7. Чтение, диктовка, говорение, письмо\nЧтение. Прочитайте информацию и ответьте.\nAlmaty to Astana. Train departs at 18:20 from platform 4 and arrives at 07:10. A one-way ticket costs $25. The taxi from the city centre to the station takes fifteen minutes.\nВопросы: 1) What time does the train leave? 2) Which platform? 3) When does it arrive? 4) How much is a one-way ticket? 5) How long does the taxi take?\nДиктовка: Could you tell me where the station is? Take the second left. It's a five-minute walk. A return ticket to Astana, please. Could you stop here, please?\nГоворение (запись по 3–5 минут):\n1) Один спрашивает дорогу в незнакомом городе, другой объясняет (используйте карту из практики 2).\n2) Разыграйте покупку билета на вокзале.\n3) Разыграйте поездку на такси: адрес, цена, остановка.\n4) Расскажите, как добраться от вас до работы или учёбы, 8 предложений.\n5) Разыграйте ситуацию «я опоздал на поезд».\nПисьмо. Напишите, как добраться до вашего дома от ближайшей станции или остановки, 80–100 слов. Чек-лист: повелительное наклонение, 4 предлога места или движения, 2 ориентира, расстояние или время, вежливая концовка.\n\n## Раздел 16. Ключи\nПрактика 1: subway — underground; sidewalk — pavement; intersection — junction; round-trip — return; schedule — timetable; parking lot — car park.\nПрактика 2: 1) Green Street. 2) On the left, next to the cafe. 3) The second right, on Park Road. 4) At the end of Park Road, on the right. 5) The library.\nПрактика 3: 1) Could you tell me where the station is? 2) Do you know what time the bus leaves? 3) Could you tell me how much a ticket is? 4) Do you know if this train goes to Astana? 5) Could you tell me where I can buy a ticket?\nПрактика 4: 1) over (или across) 2) through 3) along 4) past 5) under.\nПрактика 5: a quarter past six, half past seven, a quarter to nine, ten to ten. Расписание: eighteen twenty и seven ten (или ten past seven).\nПрактика 6: 1) Excuse me, how do I get to the station? 2) Is it far from here? 3) Go straight and then turn left. 4) The bus stop is next to the bank. 5) A single (one-way) ticket to Astana, please. 6) Which platform does the train leave from? 7) How long does it take? 8) Could you take me to the airport, please? 9) Stop here, please. / Could you stop here, please? 10) I missed the bus.\nПрактика 7 (чтение): 1) At 18:20. 2) Platform 4. 3) At 07:10. 4) $25. 5) Fifteen minutes.\n\n## Раздел 17. Таблица типичных ошибок\n- Порядок слов: How I can get to the station? → How can I get to the station? / How do I get to the station?\n- Непрямой вопрос: Could you tell me where is the station? → where the station is.\n- Предлог: in the bus → on the bus; arrive to Astana → arrive in Astana; go by foot → go on foot / walk.\n- Поворот: turn on the left → turn left.\n- Артикль: by the bus → by bus.\n- Билеты: a ticket in one way → a one-way ticket.\n- Время в расписании: The train will leave at 6 → The train leaves at 6 (Present Simple для расписаний).\n- Забытое -s: It take ten minutes → It takes ten minutes.\nВедите личный список ошибок и перечитывайте раз в неделю.\n\n## Раздел 18. Самооценка\nПо 2 балла: □ я могу спросить дорогу и понять ответ □ я использую непрямые вопросы с правильным порядком слов □ я понимаю повороты, предлоги движения, порядковые числительные □ я могу купить билет и спросить о расписании □ я читаю время в словах и на 24 часа □ я произношу ключевые фразы естественно.\nРезультат: 10–12 баллов — переходите к уроку 5; 6–9 — повторите слабые разделы; меньше 6 — повторите неделю.\n\n## Раздел 19. Итоговый тест (15 баллов)\n1) Вежливо спросите, где вокзал. 2) Как сказать «Идите прямо»? 3) Как сказать «Поверните налево»? 4) Выберите: in the bus или on the bus. 5) Выберите: arrive to или arrive in Astana. 6) Британский вариант слова sidewalk. 7) Что значит a return ticket? 8) Как сказать «Это недалеко»? 9) Как читается 6:15? 10) Как читается 8:45? 11) Поставьте вопрос: Do you know ___ the train leaves? (what time или what time does) 12) Как сказать «Остановите здесь, пожалуйста»? 13) Present Simple для расписаний: The train ___ at 18:20 (leave/leaves). 14) Как называется стоимость проезда? 15) Что нужно сделать, если вы не поняли направление?\nОтветы: 1) Excuse me, could you tell me where the station is? 2) Go straight. 3) Turn left. 4) on the bus 5) arrive in Astana 6) pavement 7) билет туда и обратно 8) It isn't far. / It's near. 9) a quarter past six 10) a quarter to nine 11) what time 12) Could you stop here, please? 13) leaves 14) fare 15) вежливо попросить повторить: Could you say that again, please?\nОценка: 13–15 — отлично, переходите к уроку 5; 10–12 — хорошо, повторите слабые разделы; меньше 10 — вернитесь к теории и практике.\n\n## Раздел 20. План на 4 недели\nНеделя 1: лексика транспорта и города (раздел 1), направления (раздел 2). Практика 1, 2. Ежедневно 10 минут карточек.\nНеделя 2: непрямые вопросы (раздел 3), билеты и такси (раздел 4). Практика 3, 4. Говорение 1–2.\nНеделя 3: грамматика (раздел 5), культура (раздел 6), произношение (раздел 7), слушание (раздел 8). Практика 5, 6. Диктовка. Говорение 3–5.\nНеделя 4: чтение, письмо, итоговая ролевая игра, самооценка, тест, разбор ошибок.\n\n## Что стоит сверить в книгах\nRaymond Murphy, «English Grammar in Use» (повелительное наклонение, there is/are, предлоги, время, сравнения); Michael Swan, «Practical English Usage» (непрямые вопросы, предлоги); Cambridge Dictionary и Oxford Learner's Dictionaries (произношение и примеры).\nВажное замечание: упражнения и ключи составлены для самопроверки. Правила транспорта, оплаты и чаевых различаются по странам и городам, уточняйте на месте. Для оценки произношения нужна обратная связь от человека, хорошо владеющего языком.\n", "w": [["station", "станция, вокзал", "/ˈsteɪʃən/"], ["ticket", "билет", "/ˈtɪkɪt/"], ["platform", "платформа", "/ˈplætfɔːrm/"], ["airport", "аэропорт", "/ˈɛrpɔːrt/"], ["direction", "направление", "/dəˈrɛkʃən/"], ["straight", "прямо", "/streɪt/"], ["corner", "угол", "/ˈkɔːrnər/"], ["crossing", "переход, перекрёсток", "/ˈkrɔːsɪŋ/"], ["bridge", "мост", "/brɪdʒ/"], ["traffic", "движение, трафик", "/ˈtræfɪk/"], ["timetable", "расписание (UK)", "/ˈtaɪmteɪbəl/"], ["passenger", "пассажир", "/ˈpæsɪndʒər/"], ["luggage", "багаж (UK)", "/ˈlʌɡɪdʒ/"], ["journey", "поездка", "/ˈdʒɜːrni/"], ["opposite", "напротив", "/ˈɑːpəzɪt/"], ["distance", "расстояние", "/ˈdɪstəns/"], ["route", "маршрут", "/ruːt/"], ["board", "садиться (на транспорт)", "/bɔːrd/"], ["departure", "отправление", "/dɪˈpɑːrtʃər/"], ["fare", "стоимость проезда", "/fɛr/"]]}, {"t": "УРОК 5. ПОКУПКИ И ЦЕНЫ (РАСШИРЕННЫЙ КУРС)\nОбъём: 4 недели, 5–6 дней в неделю по 45–60 минут (около 20–25 часов). Уровень: A2.\nУчебный язык: объяснения по-русски, примеры по-английски. Основной вариант: американский, британские отличия отмечены.\n\n## Как устроен урок\nТеория (разделы 1–8), практика (разделы 9–17), контроль (разделы 18–20). Прочитайте теорию целиком без заучивания, затем работайте с практикой и возвращайтесь к теории по мере необходимости. Цель урока: купить вещь, спросить цену и размер, примерить, оплатить, вернуть товар и пожаловаться на проблему, сохраняя вежливость.\n\n## Раздел 0. Научная основа метода\n1. Ситуативное обучение: покупки образуют узнаваемые сценарии (вход, консультация, выбор, оплата, возврат). Ролевая отработка закрепляет блоки речи.\n2. Готовые фразы: в магазине много устойчивых формул (Can I help you? I'm just looking. I'll take it.). Их нужно знать целиком.\n3. Выходная речь: говорение и письмо заставляют замечать пробелы (идея Мерилл Суэйн).\n4. Интервальные повторения: возвращайтесь к лексике через 1, 3, 7, 14 дней (вкладка «Карточки»).\n5. Числа в контексте: цифры и цены лучше запоминаются в реальных ситуациях, а не как отдельный список.\n\n## Раздел 1. Лексика: магазины, одежда, деньги\nМагазины: supermarket, grocery store, convenience store (магазин у дома), department store (универмаг), mall (США) / shopping centre (Британия), market, pharmacy или drugstore (США) / chemist (Британия), clothes shop / clothing store, shoe store, bookshop / bookstore, electronics store, bakery.\nОдежда: shirt, T-shirt, sweater, jacket, coat, dress, skirt, jeans /dʒiːnz/, trousers (Британия) / pants (США), shorts, socks, shoes, sneakers (США) / trainers (Британия), boots, hat, scarf, gloves.\nРазмеры и посадка: small, medium, large, extra large (XL); size, fit, tight (тесный), loose (свободный), too big, too small, try on (примерить), fitting room (США) / changing room (Британия).\nПокупки и оплата: buy, pay, cost, afford (позволить себе), price, discount, sale, bargain /ˈbɑːrɡən/ (выгодная покупка), receipt /rɪˈsiːt/, cash, card, change (сдача), bill (США, банкнота) / note (Британия), coin.\nВ магазине: basket, cart (США) / trolley (Британия), queue (Британия) / line (США), checkout / till (Британия), shop assistant (Британия) / sales associate / clerk (США), customer /ˈkʌstəmər/, bag.\nВозврат и жалоба: return, exchange (обменять), refund /ˈriːfʌnd/ (возврат денег), warranty (гарантия), faulty (неисправный, Британия) / defective (США), broken, doesn't work.\nОнлайн: add to cart, order, delivery, free shipping, track your order, out of stock.\n\n## Раздел 2. Цены, числа, проценты\nЧтение цен:\n- $5.99 → five ninety-nine (в разговоре) или five dollars and ninety-nine cents (полно).\n- £3.50 → three pounds fifty.\n- €10 → ten euros.\n- 5,000 tenge → five thousand tenge /ˈtɛŋɡeɪ/.\nБольшие числа: hundred, thousand, million. 120 → a hundred (and) twenty (в Британии с and, в США без): 1,250 → one thousand two hundred (and) fifty.\nДесятичные: 2.5 → two point five; 0.5 → zero point five (США) / nought point five (Британия).\nПроценты: 20% → twenty percent. 30% off → скидка тридцать процентов. Half price → полцены.\nУдарение в числах: 13 /ˌθɜːrˈtiːn/ и 30 /ˈθɜːrti/ (см. урок 1).\nРасчёты: total (итого), subtotal, tax, VAT (НДС, Британия и ЕС). В США цены на ценниках часто указаны без налога на продажи, он добавляется на кассе. В Великобритании и ЕС налог обычно уже включён. Правила зависят от страны и магазина.\n\n## Раздел 3. Как спросить цену и описать вещь\nHow much is it? (единственное число) / How much are they? (множественное). How much does it cost? How much is this shirt? How much are these shoes?\nПоказ предметов: this / that (единственное: этот, тот), these / those (множественное).\nОписание: It's too expensive. It's cheap (может иметь оттенок низкого качества; нейтральнее inexpensive, affordable). It's a good price. It's on sale.\nВыбор: I'd like the red one. / I'll take the blue ones. Слово one / ones заменяет существительное и избегает повторения.\nToo и enough:\n- too + прилагательное: чрезмерность (too expensive, too small).\n- прилагательное + enough: достаточность (big enough, not warm enough).\n- enough + существительное: enough money.\nРазличайте: The jacket is too big (слишком большая). The jacket isn't big enough (недостаточно большая).\n\n## Раздел 4. Грамматика урока\nИсчисляемые и неисчисляемые: money, clothing, shopping — неисчисляемые (some money, a lot of money, much money в вопросах и отрицаниях). Clothes всегда множественное: Your clothes are nice.\nmuch / many / a lot of: How much money? How many shoes? I don't have much time. I bought a lot of things.\nСравнения: короткие прилагательные +er/-est (cheap → cheaper → the cheapest; big → bigger → the biggest), длинные more/most (expensive → more expensive → the most expensive), исключения good → better → the best, bad → worse → the worst.\nСтруктуры сравнения: This phone is cheaper than that one. It's not as expensive as the other one. This is the best price.\nПредлоги: for ($5 for a kilo; pay for the shoes), per (per kilo, per night), on sale, in cash, by card, at the checkout.\nPay: pay for something (pay for the book), pay an amount (pay $20), pay the bill. Нельзя pay the book.\nПросьбы и вежливость: Could I try this on? Do you have this in a larger size? Is there a discount? Can I pay by card? Could I have a bag, please?\nМодальные: can/could (возможность и просьбы), would like (желание): I'd like to return this.\nУсловие: If it's too small, can I exchange it?\n\n## Раздел 5. Диалоги по ситуациям\n1) Вход и консультация.\nShop assistant: Hello, can I help you? You: I'm just looking, thanks. (Я просто смотрю.) / Yes, I'm looking for a jacket.\n2) Размер и цвет.\nYou: Do you have this in a larger size? Do you have it in blue? What sizes do you have?\n3) Примерка.\nYou: Can I try this on? Where is the fitting room? It doesn't fit. It's too tight. Do you have a smaller size?\n4) Цена.\nYou: How much is this? How much are these? Is there a discount? Is this on sale?\n5) Решение.\nYou: I'll take it. (Я беру.) I'll think about it. (Я подумаю.) It's too expensive for me. (Для меня дорого.)\n6) Оплата.\nCashier: Cash or card? Would you like a bag? Do you need a receipt? You: By card, please. Yes, please. Could I have a receipt?\n7) Возврат и обмен.\nYou: I'd like to return this. It doesn't fit. Here's my receipt. Could I exchange it for a different size? Could I get a refund?\n8) Жалоба.\nYou: I'm afraid there's a problem with this. It doesn't work. I bought it yesterday. I'd like a refund, please.\n9) Рынок и торг (где это принято).\nYou: How much is this? Is that your best price? Could you give me a discount? Are there any cheaper ones?\n10) Онлайн.\nYou: Where is my order? When will it arrive? Is delivery free?\n\n## Раздел 6. Культурные заметки\n- В США на кассе добавляется налог на продажи, в Великобритании и ЕС цена на ценнике обычно итоговая.\n- Условия возврата различаются по странам и магазинам: чек, срок, состояние вещи. Всегда уточняйте и сохраняйте чек.\n- Чаевые в магазинах обычно не принято оставлять.\n- Торговаться принято на некоторых рынках, но не в большинстве магазинов. Делайте это вежливо.\n- Периоды распродаж (например, Black Friday в США после Дня благодарения) обычно сопровождаются скидками, но проверяйте реальные цены.\n- В кассе часто спрашивают: Do you have a loyalty card? (карта лояльности). Ответьте: No, thanks.\n\n## Раздел 7. Произношение и интонация\nСлова: expensive /ɪkˈspɛnsɪv/, cheap /tʃiːp/, receipt /rɪˈsiːt/ (p не читается), clothes /kloʊðz/ (часто /kloʊz/), jeans /dʒiːnz/, size /saɪz/, discount (существительное) /ˈdɪskaʊnt/, refund (сущ.) /ˈriːfʌnd/, refund (глагол) /rɪˈfʌnd/, dollar /ˈdɑːlər/, pounds /paʊndz/, euros /ˈjʊroʊz/, customer /ˈkʌstəmər/, bargain /ˈbɑːrɡən/, afford /əˈfɔːrd/.\nСлабые формы: Can I help you? → /kən aɪ ˈhɛlp ju/; How much is it? → /haʊ ˈmʌtʃ ɪz ɪt/ или быстро /haʊ ˈmʌtʃɪzɪt/; Do you have → /dʒə hæv/; I'll take it → /aɪl ˈteɪkɪt/.\nИнтонация: вопросы да/нет с подъёмом: Do you have this in blue? ↗ Вопросы с wh-словом с падением: How much is it? ↘ Утверждения с падением: I'll take it. ↘ Выбор: Cash ↗ or card? ↘\nРитм: хлопайте на ударных слогах: HOW MUCH is it? I'll TAKE it.\n\n## Раздел 8. Как вести разговор в магазине\nСтратегия вежливости:\n1) Начните с приветствия: Hello. / Excuse me.\n2) Скажите, что вам нужно: I'm looking for... / Do you have...?\n3) Уточните детали: size, colour, price.\n4) Выразите решение чётко: I'll take it. / I'll think about it.\n5) Поблагодарите: Thank you. Have a nice day.\nЕсли не поняли: Sorry, could you say that again, please? Could you speak more slowly?\nЕсли ответ «нет»: No problem. Thank you anyway. (Ничего страшного, спасибо.)\n\n## Раздел 9. Практика 1. Британский и американский варианты\nСоедините: pants, sneakers, drugstore, mall, line, cart, bill (банкнота), fitting room.\nВарианты: trainers, chemist, shopping centre, queue, trolley, trousers, note, changing room.\n\n## Раздел 10. Практика 2. Цены словами\nНапишите словами: $5.99, £3.50, €10, 20%, 1,250, 0.5.\n\n## Раздел 11. Практика 3. Расчёты\n1) A shirt costs $40 and is 25% off. What is the new price? 2) Three T-shirts cost $8 each. What is the total? 3) A jacket was $80, now $60. How much cheaper is it?\n\n## Раздел 12. Практика 4. Сравнения, too и enough\nВставьте нужную форму: 1) This phone is ___ (cheap) than that one. 2) This is the ___ (expensive) jacket in the shop. 3) The shoes are ___ (too/enough) small. I need a bigger size. 4) I don't have ___ (enough/too) money.\n\n## Раздел 13. Практика 5. Порядок диалога\nРасставьте реплики по порядку: a) Cash or card? b) I'll take it. c) Hello, can I help you? d) How much is it? e) Card, please. f) Yes, I'm looking for a jacket. g) It's $60. h) Here's your receipt. Thank you.\n\n## Раздел 14. Практика 6. Перевод\n1) Сколько это стоит? 2) Сколько стоят эти туфли? 3) Я просто смотрю. 4) У вас есть это в большем размере? 5) Можно примерить? 6) Это слишком дорого. 7) Я возьму это. 8) Можно оплатить картой? 9) Я хочу вернуть это. 10) У вас есть скидка?\n\n## Раздел 15. Практика 7. Чтение, диктовка, говорение, письмо\nЧтение. Прочитайте объявление и ответьте.\nBig Sale. T-shirts $8 each or 3 for $20. Jeans $35, now $28. Sneakers $60, 30% off. Free shipping on orders over $50. Return within 30 days with receipt.\nВопросы: 1) How much are three T-shirts? 2) What is the new price of the jeans? 3) How much are the sneakers after the discount? 4) When is shipping free? 5) How many days can you return an item? 6) How much do you save when you buy three T-shirts for $20?\nДиктовка: How much are these shoes? Do you have this in a larger size? I'll take it. Can I pay by card? I'd like to return this.\nГоворение (запись по 3–5 минут):\n1) Разыграйте покупку одежды: консультация, размер, примерка, оплата.\n2) Разыграйте возврат вещи: чек, причина, возврат денег или обмен.\n3) Разыграйте торг на рынке (вежливо).\n4) Расскажите, где вы обычно покупаете продукты и одежду, 8 предложений.\n5) Разыграйте телефонный звонок в магазин с вопросом о наличии товара.\nПисьмо. Напишите жалобу на товар (email) на 80–100 слов: что купили, когда, в чём проблема, чего вы хотите (замена, возврат денег). Чек-лист: вежливое обращение, дата покупки, номер заказа (придумайте), конкретная проблема, просьба, благодарность, формула окончания (Kind regards).\n\n## Раздел 16. Ключи\nПрактика 1: pants — trousers; sneakers — trainers; drugstore — chemist; mall — shopping centre; line — queue; cart — trolley; bill — note; fitting room — changing room.\nПрактика 2: five ninety-nine (five dollars and ninety-nine cents); three pounds fifty; ten euros; twenty percent; one thousand two hundred (and) fifty; zero point five.\nПрактика 3: 1) $30. 2) $24. 3) $20 cheaper.\nПрактика 4: 1) cheaper 2) most expensive 3) too 4) enough.\nПрактика 5: c, f, d, g, b, a, e, h.\nПрактика 6: 1) How much is it? 2) How much are these shoes? 3) I'm just looking. 4) Do you have this in a larger size? 5) Can I try it on? 6) It's too expensive. 7) I'll take it. 8) Can I pay by card? 9) I'd like to return this. 10) Is there a discount?\nПрактика 7 (чтение): 1) $20. 2) $28. 3) $42. 4) On orders over $50. 5) 30 days. 6) $4 (3 по $8 = $24).\n\n## Раздел 17. Таблица типичных ошибок\n- Порядок слов: How much costs it? → How much does it cost? / How much is it?\n- Множественное: this shoes → these shoes; clothes is → clothes are.\n- Числа: five dollar → five dollars (после числа множественное).\n- Исчисляемое: a money → money; few money → not much money.\n- Pay: pay the shoes → pay for the shoes.\n- cheap: может звучать как «дешёвого качества», вежливее inexpensive.\n- Просьба: Give me a discount → Could I get a discount? / Is there a discount?\n- too и enough: The jacket is not enough big → The jacket isn't big enough.\n- Предлог: pay with card → pay by card (чаще); also: in cash → in cash.\n- Артикль: I'll take it (без артикля, местоимение) / I'll take the red one.\nВедите личный список ошибок и перечитывайте раз в неделю.\n\n## Раздел 18. Самооценка\nПо 2 балла: □ я спрашиваю цену и размер □ я различаю this/these, much/many □ я использую too и enough □ я могу вежливо вернуть товар и пожаловаться □ я читаю цены и проценты □ я произношу ключевые фразы естественно.\nРезультат: 10–12 баллов — переходите к уроку 6; 6–9 — повторите слабые разделы; меньше 6 — повторите неделю.\n\n## Раздел 19. Итоговый тест (15 баллов)\n1) Как спросить цену одной вещи? 2) Как спросить цену нескольких вещей? 3) Как сказать «Я просто смотрю»? 4) Как попросить размер больше? 5) Выберите: too или enough: The jacket isn't big ___. 6) Британский вариант слова sneakers. 7) Британский вариант слова line (очередь). 8) Как читается $5.99? 9) Рассчитайте: 40 минус 25%. 10) Как попросить примерить? 11) Как сказать «Я возьму это»? 12) Что значит refund? 13) Исправьте: How much costs it? 14) Исправьте: this shoes. 15) Выберите: pay the book или pay for the book.\nОтветы: 1) How much is it? 2) How much are they? 3) I'm just looking. 4) Do you have this in a larger size? 5) enough 6) trainers 7) queue 8) five ninety-nine 9) 30 10) Can I try this on? 11) I'll take it. 12) возврат денег 13) How much does it cost? 14) these shoes 15) pay for the book.\nОценка: 13–15 — отлично, переходите к уроку 6; 10–12 — хорошо, повторите слабые разделы; меньше 10 — вернитесь к теории и практике.\n\n## Раздел 20. План на 4 недели\nНеделя 1: лексика магазинов, одежды, денег (раздел 1), цены и числа (раздел 2). Практика 1, 2, 3. Ежедневно 10 минут карточек.\nНеделя 2: вопросы о цене и описание (раздел 3), грамматика (раздел 4). Практика 4, 5. Говорение 1.\nНеделя 3: диалоги (раздел 5), культура (раздел 6), произношение (раздел 7). Практика 6. Диктовка. Говорение 2–5.\nНеделя 4: чтение, письмо жалобы, итоговая ролевая игра, самооценка, тест, разбор ошибок.\n\n## Что стоит сверить в книгах\nRaymond Murphy, «English Grammar in Use» (сравнения, too и enough, much и many, this и these); Michael Swan, «Practical English Usage»; Cambridge Dictionary и Oxford Learner's Dictionaries (произношение и примеры).\nВажное замечание: упражнения и ключи составлены для самопроверки. Правила налогов, возврата и торга различаются по странам и магазинам, уточняйте на месте. Для оценки произношения нужна обратная связь от человека, хорошо владеющего языком.\n", "w": [["price", "цена", "/praɪs/"], ["cost", "стоить", "/kɔːst/"], ["cheap", "дешёвый", "/tʃiːp/"], ["expensive", "дорогой", "/ɪkˈspɛnsɪv/"], ["discount", "скидка", "/ˈdɪskaʊnt/"], ["receipt", "чек", "/rɪˈsiːt/"], ["refund", "возврат денег", "/ˈriːfʌnd/"], ["size", "размер", "/saɪz/"], ["fit", "подходить по размеру", "/fɪt/"], ["sale", "распродажа", "/seɪl/"], ["bargain", "выгодная покупка", "/ˈbɑːrɡən/"], ["cash", "наличные", "/kæʃ/"], ["customer", "покупатель", "/ˈkʌstəmər/"], ["shopping", "покупки", "/ˈʃɑːpɪŋ/"], ["basket", "корзина", "/ˈbæskɪt/"], ["queue", "очередь (UK)", "/kjuː/"], ["checkout", "касса", "/ˈtʃɛkaʊt/"], ["afford", "позволить себе", "/əˈfɔːrd/"], ["exchange", "обменять", "/ɪksˈtʃeɪndʒ/"], ["delivery", "доставка", "/dɪˈlɪvəri/"]]}, {"t": "УРОК 6. ПРОШЕДШЕЕ ВРЕМЯ В РАССКАЗАХ (РАСШИРЕННЫЙ КУРС)\nОбъём: 4 недели, 5–6 дней в неделю по 45–60 минут (около 20–25 часов). Уровень: A2 → B1.\nУчебный язык: объяснения по-русски, примеры по-английски. Основной вариант: американский, британские отличия отмечены.\n\n## Как устроен урок\nТеория (разделы 1–8), практика (разделы 9–17), контроль (разделы 18–20). Прочитайте теорию целиком без заучивания, затем работайте с практикой и возвращайтесь к теории по мере необходимости. Цель урока: свободно рассказать о том, что произошло (вчера, на выходных, в отпуске, в детстве), с правильными временами, связками и живыми деталями.\n\n## Раздел 0. Научная основа метода\n1. Рассказ как естественная единица речи. В жизни мы чаще всего используем прошедшее время для повествования. Рассказ объединяет грамматику, лексику, произношение и логику.\n2. Нарративная структура. Хороший рассказ имеет начало (обстановка), ход событий (завязка и кульминация) и конец (развязка). Освоив структуру, вы сможете рассказывать на любую тему.\n3. Выходная речь: рассказ заставляет замечать пробелы (идея Мерилл Суэйн). Поэтому в уроке много устных и письменных задач.\n4. Интервальные повторения: возвращайтесь к неправильным глаголам и сюжетам через 1, 3, 7, 14 дней.\n5. Образцы и имитация: слушайте и читайте хорошие рассказы, затем копируйте структуру и связки.\n\n## Раздел 1. Past Simple: теория\nНазначение: завершённые действия в прошлом, последовательность событий. Типичные маркеры времени: yesterday, last week, in 2019, two years ago, when I was a child.\nПравильные глаголы: основа + -ed: work → worked, live → lived, visit → visited.\nПравописание:\n- глагол на -e: +d (live → lived, move → moved);\n- согласная + y → ied (study → studied, try → tried); гласная + y → +ed (play → played);\n- краткие односложные глаголы с ударением на последнем слоге удваивают согласную (stop → stopped, plan → planned).\nПроизношение -ed:\n- /t/ после глухих: worked /wɜːrkt/, stopped /stɑːpt/, watched /wɑːtʃt/;\n- /d/ после звонких и гласных: lived /lɪvd/, played /pleɪd/, moved /muːvd/;\n- /ɪd/ после t и d: wanted /ˈwɑːntɪd/, needed /ˈniːdɪd/, started /ˈstɑːrtɪd/.\nОтрицание: didn't (did not) + базовая форма: I didn't go. Нельзя didn't went.\nВопрос: Did + подлежащее + базовая форма: Did you go? Нельзя Did you went?\nВопросы с wh-словом: Where did you go? What did you see? Who did you meet?\nКраткие ответы: Yes, I did. / No, I didn't.\nГлагол be: I/he/she/it was, you/we/they were. Вопрос: Was he tired? Were you at home? Отрицание: wasn't, weren't.\nСлабая форма was: /wəz/ в быстрой речи, сильная /wɑːz/ при выделении или в коротком ответе (Yes, it was).\n\n## Раздел 2. Неправильные глаголы (учите блоками)\nbe — was/were — been; begin — began — begun; break — broke — broken; bring — brought — brought; build — built — built; buy — bought — bought; catch — caught — caught; choose — chose — chosen; come — came — come; do — did — done; draw — drew — drawn; drink — drank — drunk; drive — drove — driven; eat — ate — eaten; fall — fell — fallen; feel — felt — felt; find — found — found; fly — flew — flown; forget — forgot — forgotten; get — got — got (США также gotten); give — gave — given; go — went — gone; grow — grew — grown; have — had — had; hear — heard — heard; keep — kept — kept; know — knew — known; leave — left — left; lose — lost — lost; make — made — made; meet — met — met; pay — paid — paid; put — put — put; read — read /rɛd/ — read /rɛd/; ride — rode — ridden; run — ran — run; say — said /sɛd/ — said; see — saw — seen; sell — sold — sold; send — sent — sent; sit — sat — sat; sleep — slept — slept; speak — spoke — spoken; spend — spent — spent; swim — swam — swum; take — took — taken; teach — taught — taught; tell — told — told; think — thought — thought; understand — understood — understood; wear — wore — worn; win — won — won; write — wrote — written.\nСовет: группируйте по схожести форм (buy-bought, think-thought, bring-brought, catch-caught; drive-drove-driven, ride-rode-ridden; break-broke-broken, speak-spoke-spoken). Повторяйте по карточкам.\nПроизношение: bought /bɔːt/, caught /kɔːt/, thought /θɔːt/, said /sɛd/, read /rɛd/ (прошедшее), taught /tɔːt/. Эти формы часто путают.\n\n## Раздел 3. Past Continuous: теория\nФорма: was/were + глагол с -ing: I was walking. They were playing.\nОтрицание: wasn't/weren't + -ing. Вопрос: Were you sleeping?\nНазначение:\n1) Процесс в определённый момент прошлого: At 8 o'clock last night I was watching TV.\n2) Фон для событий: It was raining when we left.\n3) Прерванное действие: I was walking home when I saw an accident. (Длительное в Past Continuous, короткое событие в Past Simple.)\n4) Два параллельных процесса: While she was cooking, he was reading.\nСвязки when и while:\n- while + Past Continuous: while I was walking;\n- when + Past Simple (короткое событие): when the phone rang.\nСравните: I was reading when he came. (Я читал, он пришёл.) / I read a book yesterday. (Я прочитал книгу вчера.)\nНе используются в Past Continuous глаголы состояния (know, like, want, understand, believe): I knew the answer (не I was knowing).\n\n## Раздел 4. Used to и would\nUsed to + базовая форма: привычки и состояния в прошлом, которых больше нет. I used to live in Taraz. She used to play the piano.\nОтрицание: didn't use to (без -d): I didn't use to like coffee. Вопрос: Did you use to play football?\nWould для повторяющихся действий в прошлом (не для состояний): When I was a child, we would visit my grandmother every summer.\nРазличие: I used to be shy (состояние, would нельзя). We would go fishing every Sunday (повторяющееся действие).\nНе путайте used to + глагол (раньше делал) и be used to + -ing (привык): I'm used to getting up early.\n\n## Раздел 5. Past Perfect (знакомство)\nФорма: had + третья форма глагола: I had finished.\nНазначение: действие, которое произошло раньше другого действия в прошлом: When I arrived, the train had already left.\nСравните: When I arrived, the train left. (Поезд ушёл после моего прихода.) / When I arrived, the train had left. (Поезд уже ушёл.)\nИспользуйте, когда нужно показать предысторию. В разговоре Past Simple с when, after, before часто достаточно.\n\n## Раздел 6. Структура рассказа и связки\nСтруктура:\n1) Обстановка (setting): когда, где, кто. Last summer, I was in Italy with my friend.\n2) Завязка: что-то случилось. One day, we decided to...\n3) Развитие событий и кульминация: Suddenly, ...\n4) Развязка: In the end, ... / Finally, ...\n5) Оценка или вывод: It was an unforgettable day. I learned that...\nСлова последовательности: first, then, next, after that, later, finally, in the end.\nВнезапность и контраст: suddenly, at that moment, all of a sudden, but, however, although.\nОдновременность: while, meanwhile, at the same time.\nРезультат и причина: because, so, as a result.\nОценка: fortunately, unfortunately, to my surprise, luckily.\nРеакции слушателя: Really? What happened next? No way! That's amazing! How awful!\nРазговорные вводные: You won't believe what happened. Guess what! Listen to this.\nПриём «деталь + чувство»: Добавляйте конкретику (погода, цвет, звук) и чувства (I was nervous, I felt happy).\n\n## Раздел 7. Время в рассказе: выбор формы\n- Основные события в хронологическом порядке: Past Simple.\n- Фон и длительные процессы: Past Continuous.\n- Предыстория: Past Perfect.\n- Привычки в прошлом: used to / would.\nОбразец: It was a cold evening. I was walking home when I heard a strange noise. I stopped and listened. Then I saw a small cat under a car. It had been there for hours.\nСовет: не меняйте время без причины. Если рассказ в прошедшем времени, держитесь его.\n\n## Раздел 8. Произношение и интонация в рассказе\nСлабые формы: I was → /aɪ wəz/, we were → /wi wər/, to → /tə/, and → /ən/, of → /əv/.\nОкончание -ed: следите за /t/, /d/, /ɪd/.\nИнтонация: в перечислении событий подъём на каждом, падение на последнем. Перед неожиданным событием пауза и повышение голоса: Suddenly... ↗ the car stopped. ↘ Эмоциональные слова выделяйте: It was AMAZing!\nТемп: замедляйтесь на кульминации, ускоряйтесь на описаниях. Паузы между смысловыми группами.\n\n## Раздел 9. Практика 1. Окончание -ed\nОпределите звук окончания (/t/, /d/ или /ɪd/): worked, lived, wanted, played, stopped, studied, needed, watched, moved, started.\n\n## Раздел 10. Практика 2. Неправильные глаголы\nНапишите форму Past Simple: go, see, take, make, buy, think, write, eat, drink, leave, meet, come, give, say, know.\n\n## Раздел 11. Практика 3. Отрицания и вопросы\nСоставьте отрицание и вопрос: 1) She visited her grandmother yesterday. 2) They went to the cinema. 3) He was tired.\n\n## Раздел 12. Практика 4. Past Simple и Past Continuous\nВставьте нужную форму: 1) I ___ (watch) TV when the phone ___ (ring). 2) While she ___ (cook), he ___ (read) a book. 3) I ___ (see) an accident while I ___ (walk) home. 4) It ___ (rain) when we ___ (leave). 5) What ___ you ___ (do) at 8 last night? 6) They ___ (not/sleep) when I ___ (call).\n\n## Раздел 13. Практика 5. Used to\nПерепишите с used to: 1) I played football every day when I was a child. Затем отрицание и вопрос: 2) I didn't like coffee. 3) Did you play the piano as a child?\n\n## Раздел 14. Практика 6. Исправьте ошибки\n1) Yesterday I go to the cinema. 2) She didn't went to school. 3) Did you saw him? 4) I was tired and I sleeped. 5) When I was a child, I use to play outside. 6) While I was walking, I was seeing a dog. 7) He was born in 1990 year. 8) We have been there last year.\n\n## Раздел 15. Практика 7. Порядок рассказа\nРасставьте предложения в логическом порядке: a) Then I opened the door. b) Last night I was at home. c) Suddenly, I heard a strange noise. d) It was my cat! e) I stood up and went to the hall. f) In the end, we both went to sleep.\n\n## Раздел 16. Практика 8. Чтение, диктовка, говорение, письмо\nЧтение. Прочитайте рассказ и ответьте на вопросы.\nLast winter, my friend Dana and I decided to visit a small village in the mountains. We left early in the morning, and the road was empty. While we were driving, it started to snow. Suddenly, the car stopped. We got out and looked at the engine, but we didn't know what to do. Fortunately, a farmer was passing by in his truck. He stopped, checked the car, and found the problem: we had no petrol! He gave us some from his tank, and we continued our journey. In the end, we arrived in the village at noon, tired but happy.\nВопросы: 1) Who went to the village? 2) When did they leave? 3) What was the weather like? 4) What happened to the car? 5) Why did the car stop? 6) Who helped them? 7) When did they arrive? 8) How did they feel?\nДиктовка: I was walking home when I saw an accident. She didn't go to school yesterday. We used to live in a small town. Did you see the film last night? In the end, we arrived at noon.\nГоворение (запись по 3–5 минут):\n1) Расскажите, что вы делали вчера (6–8 предложений).\n2) Расскажите о последнем отпуске или поездке.\n3) Расскажите смешной или необычный случай из жизни.\n4) Перескажите рассказ из чтения своими словами.\n5) Расскажите, как вы жили в детстве (used to, would).\nПартнёр задаёт вопросы: What happened next? How did you feel? Why did you do that?\nПисьмо. Напишите рассказ о необычном дне на 120–150 слов. Чек-лист: обстановка, завязка, кульминация, развязка; Past Simple и Past Continuous; хотя бы 3 неправильных глагола; 4 связки (suddenly, then, finally, while); одна оценка чувств; нет типичных ошибок из раздела 17.\n\n## Раздел 17. Ключи\nПрактика 1: worked /t/, lived /d/, wanted /ɪd/, played /d/, stopped /t/, studied /d/, needed /ɪd/, watched /t/, moved /d/, started /ɪd/.\nПрактика 2: went, saw, took, made, bought, thought, wrote, ate, drank, left, met, came, gave, said, knew.\nПрактика 3: 1) She didn't visit her grandmother yesterday. Did she visit her grandmother yesterday? 2) They didn't go to the cinema. Did they go to the cinema? 3) He wasn't tired. Was he tired?\nПрактика 4: 1) was watching, rang 2) was cooking, was reading 3) saw, was walking 4) was raining, left 5) were, doing 6) weren't sleeping, called.\nПрактика 5: 1) I used to play football every day when I was a child. 2) I didn't use to like coffee. 3) Did you use to play the piano as a child?\nПрактика 6: 1) Yesterday I went to the cinema. 2) She didn't go to school. 3) Did you see him? 4) I was tired and I slept. 5) I used to play outside. 6) I saw a dog. 7) He was born in 1990. 8) We went there last year. / We were there last year.\nПрактика 7: b, c, e, a, d, f.\nПрактика 8 (чтение): 1) The narrator and her friend Dana. 2) Early in the morning. 3) It was snowing. 4) It stopped. 5) There was no petrol. 6) A farmer. 7) At noon. 8) Tired but happy.\n\n## Раздел 18. Таблица типичных ошибок\n- Базовая форма после did: Did you saw → Did you see; didn't went → didn't go.\n- Правильные глаголы с -ed: sleeped → slept; goed → went.\n- Past Perfect вместо Past Simple без нужды: избегайте.\n- Время действия: We have been there last year → We went there last year (Present Perfect не сочетается с конкретным прошлым временем).\n- used to: I use to → I used to; Did you used to → Did you use to.\n- Past Continuous с глаголом состояния: I was knowing → I knew.\n- Предлог: in 1990 year → in 1990.\n- Смена времени в рассказе без причины.\nВедите личный список ошибок и перечитывайте раз в неделю.\n\n## Раздел 19. Самооценка\nПо 2 балла: □ я правильно образую Past Simple и неправильные глаголы □ я различаю Past Simple и Past Continuous □ я использую used to □ я структурирую рассказ □ я использую связки □ я произношу -ed правильно.\nРезультат: 10–12 баллов — переходите к уроку 7; 6–9 — повторите слабые разделы; меньше 6 — повторите неделю.\n\n## Раздел 20. Итоговый тест (15 баллов)\n1) Past Simple от go. 2) Past Simple от buy. 3) Звук -ed в worked. 4) Звук -ed в wanted. 5) I ___ (watch) TV when you called. 6) ___ you go to school yesterday? 7) He ___ (not like) the film. 8) Что значит used to? 9) Исправьте: Did you saw him? 10) Слово, обозначающее неожиданное событие. 11) ___ I was walking, it started to rain (while/when). 12) Как произносится прошедшая форма read? 13) Past Simple be для they. 14) Как образуется Past Continuous? 15) Назовите три части рассказа.\nОтветы: 1) went 2) bought 3) /t/ 4) /ɪd/ 5) was watching 6) Did 7) didn't like 8) привычка или состояние в прошлом, которых больше нет 9) Did you see him? 10) suddenly 11) While 12) /rɛd/ 13) were 14) was/were + глагол с -ing 15) обстановка (начало), ход событий (завязка и кульминация), развязка (конец).\nОценка: 13–15 — отлично, переходите к уроку 7; 10–12 — хорошо, повторите слабые разделы; меньше 10 — вернитесь к теории и практике.\n\n## План на 4 недели\nНеделя 1: Past Simple (раздел 1), неправильные глаголы (раздел 2). Практика 1, 2, 3. Ежедневно 10 минут карточек.\nНеделя 2: Past Continuous (раздел 3), used to (раздел 4). Практика 4, 5. Говорение 1–2.\nНеделя 3: Past Perfect (раздел 5), структура рассказа (раздел 6), выбор времени (раздел 7), произношение (раздел 8). Практика 6, 7. Диктовка. Говорение 3–5.\nНеделя 4: чтение, пересказ, письмо рассказа, итоговая запись, самооценка, тест, разбор ошибок.\n\n## Что стоит сверить в книгах\nRaymond Murphy, «English Grammar in Use» (Past Simple, Past Continuous, used to, Past Perfect); Michael Swan, «Practical English Usage»; Cambridge Dictionary и Oxford Learner's Dictionaries (произношение, примеры). Для фонетики: Peter Roach, «English Phonetics and Phonology».\nВажное замечание: упражнения и ключи составлены для самопроверки. Для оценки произношения и письма нужна обратная связь от человека, хорошо владеющего английским.\n", "w": [["yesterday", "вчера", "/ˈjɛstərdeɪ/"], ["once", "однажды, один раз", "/wʌns/"], ["suddenly", "внезапно", "/ˈsʌdənli/"], ["while", "пока, в то время как", "/waɪl/"], ["meanwhile", "тем временем", "/ˈmiːnwaɪl/"], ["fortunately", "к счастью", "/ˈfɔːrtʃənətli/"], ["unfortunately", "к сожалению", "/ʌnˈfɔːrtʃənətli/"], ["notice", "замечать", "/ˈnoʊtɪs/"], ["happen", "случаться", "/ˈhæpən/"], ["decide", "решать", "/dɪˈsaɪd/"], ["forget", "забывать", "/fərˈɡɛt/"], ["surprise", "сюрприз, удивление", "/sərˈpraɪz/"], ["adventure", "приключение", "/ədˈvɛntʃər/"], ["accident", "несчастный случай", "/ˈæksɪdənt/"], ["story", "рассказ, история", "/ˈstɔːri/"], ["moment", "момент", "/ˈmoʊmənt/"], ["event", "событие", "/ɪˈvɛnt/"], ["journey", "путешествие", "/ˈdʒɜːrni/"], ["continue", "продолжать", "/kənˈtɪnjuː/"], ["arrive", "прибывать", "/əˈraɪv/"]]}, {"t": "УРОК 7. ПЛАНЫ И БУДУЩЕЕ (РАСШИРЕННЫЙ КУРС)\nОбъём: 4 недели, 5–6 дней в неделю по 45–60 минут (около 20–25 часов). Уровень: A2 → B1.\nУчебный язык: объяснения по-русски, примеры по-английски. Основной вариант: американский, британские отличия отмечены.\n\n## Как устроен урок\nТеория (разделы 1–8), практика (разделы 9–17), контроль (разделы 18–20). Прочитайте теорию целиком без заучивания, затем работайте с практикой и возвращайтесь к теории по мере необходимости. Цель урока: говорить о планах, договорённостях, возможностях и целях, приглашать, соглашаться и вежливо отказываться.\n\n## Раздел 0. Научная основа метода\n1. Будущее в английском выражается не одной формой, а несколькими. Выбор зависит от того, когда принято решение, насколько вы уверены и есть ли договорённость. Поэтому важно понимать смысл каждой формы, а не заучивать правило «будущее время».\n2. Контраст и выбор: лучше всего формы усваиваются через сравнение (will и going to, Present Continuous и Present Simple для будущего).\n3. Выходная речь: говорение и письмо заставляют замечать пробелы (идея Мерилл Суэйн). Поэтому много устных и письменных задач.\n4. Интервальные повторения: возвращайтесь к формам и фразам через 1, 3, 7, 14 дней.\n5. Реальная польза: планы, приглашения и цели нужны каждый день, поэтому тренируйтесь на своих реальных планах.\n\n## Раздел 1. Will: теория\nФорма: will + глагол без to. Краткая форма: 'll /əl/. Отрицание: will not = won't /woʊnt/. Вопрос: Will you...? Краткие ответы: Yes, I will. / No, I won't.\nУпотребление:\n1) Спонтанное решение (принято в момент речи): It's cold. I'll close the window. I'll have the soup, please.\n2) Обещание: I'll call you tomorrow. I won't tell anyone.\n3) Предложение помощи: I'll carry your bag. Shall I open the door? (Shall используется с I и we для предложений и вопросов, чаще в британской речи; в США чаще Should I...? или Do you want me to...?)\n4) Предсказание, основанное на мнении или знании: I think it will rain tomorrow. She'll be a great doctor.\n5) Факты о будущем: The sun will rise at six. I will be 30 next year.\nНаречия: probably, definitely, certainly. Ставятся после will в утверждении (I'll probably call), перед won't в отрицании (I definitely won't forget).\nСлова-маркеры предсказаний: I think, I hope, I expect, I'm sure, probably, maybe.\n\n## Раздел 2. Be going to: теория\nФорма: be + going to + глагол без to: I'm going to study. She isn't going to come. Are you going to travel?\nУпотребление:\n1) План или намерение, принятое до момента речи: I'm going to study medicine. We're going to buy a house.\n2) Предсказание на основе очевидных признаков (вы видите причину): Look at the clouds! It's going to rain. Be careful! You're going to fall.\nСравните:\n- A: There's no sugar. B: I'll buy some. (спонтанное решение, will)\n- B: I'm going to buy some sugar after work. (уже решил, going to)\nВ быстрой речи going to часто произносится /ˈɡʌnə/ (gonna). Это разговорный вариант. В письме используйте going to.\n\n## Раздел 3. Present Continuous и Present Simple для будущего\nPresent Continuous для договорённостей (особенно с временем и участниками): I'm meeting Dana at six tonight. We're flying to Astana on Friday. What are you doing this weekend?\nРазличие: going to — намерение, Present Continuous — запланированное и обычно организованное (билеты куплены, время назначено).\nPresent Simple для расписаний и графиков: The train leaves at 8:15. The film starts at eight. The shop opens at nine tomorrow.\nНе используйте Present Simple для личных планов: I go to the cinema tomorrow (неверно) → I'm going to the cinema tomorrow.\n\n## Раздел 4. Придаточные времени и условия (First Conditional)\nПосле when, as soon as, before, after, until, if в придаточном предложении используется Present Simple, а не will:\n- When I arrive, I'll call you. (не When I will arrive)\n- I'll wait until you finish.\n- As soon as he comes, we'll start.\n- Before I leave, I'll lock the door.\nFirst Conditional: if + Present Simple, will + глагол.\n- If it rains, we'll stay at home.\n- If you don't study, you'll fail the exam.\n- If I have time, I'll help you.\nПорядок можно менять: We'll stay at home if it rains. (Запятая нужна, если if-часть в начале.)\nВозможность и совет: If you're tired, you should rest. If you need help, call me.\n\n## Раздел 5. Might, may, could: возможность\nmight / may + глагол без to: возможность 30–50 процентов.\n- It might rain this evening.\n- I may go to London next year.\n- She might not come. (отрицание: might not)\nCould для возможности: We could go to the beach. (мы могли бы...)\nСравните уверенность: I will go (уверен) → I'm going to go (намерен) → I might go (возможно).\nФразы возможности: Maybe I'll go. Perhaps we'll meet. It's possible that... I'm not sure yet. It depends.\n\n## Раздел 6. Планы, цели, намерения\nГлаголы и конструкции:\n- I'm planning to + глагол: I'm planning to move to a bigger city.\n- I intend to + глагол (формально).\n- I hope to + глагол: I hope to visit London.\n- I'm thinking of + -ing: I'm thinking of changing my job.\n- I want to / I'd like to + глагол.\n- My goal is to + глагол. My dream is to...\n- I'm looking forward to + -ing / существительное: I'm looking forward to the weekend.\nСтруктура целей (SMART): конкретная, измеримая, достижимая, реалистичная, ограниченная по времени. I'm going to learn 20 new words every day for three months.\nНовогодние решения (resolutions): I'm going to exercise more. I'm going to read one book a month.\nКак говорить о плане: цель, срок, шаги, возможные препятствия. My goal is to speak English fluently. I'm going to practise every day. It might be difficult, but I won't give up.\n\n## Раздел 7. Приглашения и договорённости\nВопросы о времени: Are you free on Saturday? What are
