const LESSONS={"kgb": [{"t": "УРОК 1. АРТИКУЛЯЦИЯ: ПОСТАНОВКА ЗВУКОВ АМЕРИКАНСКОГО АНГЛИЙСКОГО (РАСШИРЕННЫЙ КУРС)\nОбъём: 4 недели, 5–6 дней в неделю по 45–60 минут (около 20–25 часов). Уровень: с нуля до уверенного.\nОсновной эталон: американский английский (General American). Британский вариант отмечен там, где он заметно отличается.\n\n## Как устроен урок\nУрок состоит из теории (разделы 1–9), практики (разделы 10–17) и контроля (разделы 18–20). Сначала один раз прочитайте теорию, затем работайте с практикой и возвращайтесь к теории по мере необходимости. Звуки ставятся ушами, ртом и записью. Без записи себя и сравнения с эталоном урок работать не будет.\n\n## Раздел 0. Научная основа метода\n1. Слух ведёт речь. Мы воспроизводим те различия, которые слышим. Русскоговорящий не слышит разницы между ship и sheep, пока слух не обучен. Поэтому начинаем с различения на слух, и только затем с произнесения.\n2. Артикуляционная база. Привычное положение языка и губ определяет акцент сильнее, чем отдельные ошибки (раздел 1).\n3. Минимальные пары. Слова, различающиеся одним звуком, показывают, какой именно контраст нужно слышать и произносить.\n4. Многократное осмысленное повторение. Короткие ежедневные занятия эффективнее редких длинных.\n5. Обратная связь. Запись голоса и сравнение с эталоном (шэдоуинг) дают объективную картину. Если есть возможность, один раз в неделю показывайте запись человеку, хорошо знающему язык.\n\n## Раздел 1. Артикуляционная база\nАртикуляционная база — привычное положение органов речи в покое и в речи.\nРусская база (упрощённо): язык часто выдвинут вперёд и приподнят к нёбу, много смягчённых (палатализованных) согласных, губы относительно неподвижны, безударные гласные сильно редуцируются.\nАнглийская база (американский вариант): язык оттянут назад и «собран», кончик активен, губы заметнее участвуют (особенно в /w/, /ɹ/, /ʃ/), согласные не смягчаются, ударные слоги длиннее и энергичнее, безударные слабые и короткие.\nУпражнение «база» (3 минуты в начале каждой тренировки):\n1) оттяните язык назад и расслабьте; 2) слегка округлите губы вперёд; 3) протяните /ɜː/ как в bird 10 секунд; 4) повторите /ɹ-ɹ-ɹ/ без дрожания кончика языка; 5) произнесите «ɜː, ɹ, w, ʃ» плавной цепочкой.\n\n## Раздел 2. Классификация согласных (для понимания, не для заучивания)\nСогласные описываются тремя признаками: место образования (где преграда), способ (как образуется) и звонкость (есть ли голос).\n- Взрывные: /p b/ (губы), /t d/ (кончик языка у альвеол), /k ɡ/ (спинка языка у мягкого нёба).\n- Щелевые (фрикативные): /f v/, /θ ð/, /s z/, /ʃ ʒ/, /h/.\n- Аффрикаты: /tʃ/ (church), /dʒ/ (judge).\n- Носовые: /m n ŋ/.\n- Сонорные: /l ɹ w j/.\nЗвонкие и глухие пары: p-b, t-d, k-ɡ, f-v, θ-ð, s-z, ʃ-ʒ, tʃ-dʒ. Чтобы проверить звонкость, положите пальцы на горло: при звонком звуке есть вибрация.\n\n## Раздел 3. Американская система гласных\nМонофтонги: /iː/ beat, /ɪ/ bit, /ɛ/ bet, /æ/ bat, /ɑː/ father, /ɔː/ thought, /ʊ/ book, /uː/ boot, /ʌ/ but, /ə/ about (шва), /ɝ/ bird.\nДифтонги: /eɪ/ bait, /aɪ/ time, /ɔɪ/ boy, /aʊ/ now, /oʊ/ boat.\nЗаметка: во многих американских вариантах /ɑː/ и /ɔː/ не различаются (слияние cot и caught). Это нормальный вариант. В британском (RP) эти гласные различаются.\nПризнаки: долгота (/iː/ длиннее /ɪ/), напряжённость (/iː/ с растянутыми губами, /ɪ/ расслабленный), положение языка (высоко/низко, вперёд/назад).\nГлавная трудность для русскоговорящего: в русском долгота гласных не различает слова, а в английском различает.\n\n## Раздел 4. Межзубные /θ/ и /ð/\nАртикуляция: кончик языка слегка высовывается между зубами или лежит у краёв верхних зубов. Воздух проходит в щель.\n/θ/ — глухой: think /θɪŋk/, three /θriː/, thank /θæŋk/, month /mʌnθ/.\n/ð/ — звонкий: this /ðɪs/, mother /ˈmʌðər/, they /ðeɪ/, breathe /briːð/.\nГде что: /ð/ обычно в служебных словах (the, this, that, they, then) и в словах типа mother, brother, weather; /θ/ в словах с содержанием (think, thing, thanks).\nТипичные ошибки и лечение:\n- /s, z/ вместо /θ, ð/: язык спрятан за зубами. Вытяните язык вперёд, смотрите в зеркало.\n- /f, v/: язык давит на нижнюю губу. Верхние зубы касаются языка, не губы.\n- /t, d/: язык упирается в нёбо, звук взрывной. Воздух должен идти непрерывно.\nМинимальные пары: think / sink; thank / tank; three / free / tree; thin / tin / sin; those / doze; then / den.\n\n## Раздел 5. /w/, /v/, /j/, /h/\n/w/: губы округлены и выдвинуты вперёд, затем быстро раскрываются. Зубы с губой не соприкасаются.\n/v/: верхние зубы касаются нижней губы, голос есть.\nПары: west / vest; wine / vine; worse / verse; wiper / viper.\n/j/ (yes /jɛs/): язык поднимается к нёбу и тут же уходит в гласный. Это не русский слоговой «й» и не мягкость согласного.\n/h/: простой выдох из горла без трения (house /haʊs/, behind /bɪˈhaɪnd/). Не русское «х».\n\n## Раздел 6. Американское /ɹ/ и /l/\n/ɹ/: язык не касается нёба, не дрожит. Два способа: загнутый (кончик поднят и чуть загнут назад, не касаясь нёба) и собранный (кончик опущен, спинка поднята, корень оттянут). Выберите тот, что получается легче, и держите стабильно. Губы слегка округлены в начале слова (red, right, road). Не вставляйте русское «р». Write не «райт», а /ɹaɪt/.\nБританский (RP): конечное r без последующего гласного не произносится (car /kɑː/). В американском произносится (car /kɑːɹ/).\n/l/: два варианта. Светлый /l/ перед гласными (like, leaf): кончик у альвеол, спинка не поднимается к нёбу. Тёмный /l/ в конце слога (full /fʊl/, milk): язык оттянут назад. Русскоговорящие часто смягчают /l/ как в «ль». Следите, чтобы /l/ в like не был мягким.\n\n## Раздел 7. Шипящие и аффрикаты, палатализация\n/ʃ/ (ship) не мягкое «щ» и не русское «ш» с округлёнными губами; губы слегка вытянуты вперёд. /ʒ/ (vision /ˈvɪʒən/) звонкая пара.\n/tʃ/ (church): состоит из /t/ и /ʃ/, не мягкий русский «ч». Не смягчайте: chip /tʃɪp/ не «чьип».\n/dʒ/ (job): как русский «дж», но без смягчения.\nПалатализация: русские согласные смягчаются перед /i/, /e/. В английском согласные остаются твёрдыми: tea /tiː/, deep /diːp/, sit /sɪt/ без смягчения.\nУпражнение: sheep, cheap, sip, chip; vision, television, usual; jam, gym, major.\n\n## Раздел 8. Гласные: контрасты\n- /ɪ/ и /iː/. Пары: ship / sheep; bit / beat; live / leave; sit / seat; hill / heel.\n- /ʊ/ и /uː/. Пары: full / fool; pull / pool; look / Luke.\n- /æ/ и /ɛ/. Пары: bad / bed; man / men; pan / pen; bat / bet.\n- /ʌ/ и /ɑː/. Пары: cup / cop; luck / lock; hut / hot.\nМетод: произносите пару, сначала утрируя разницу (долгий намного длиннее), потом снижая контраст до естественного.\nШва /ə/: самый частый звук английского, безударный нейтральный гласный: about /əˈbaʊt/, banana /bəˈnænə/. Его нужно слышать и произносить, а не заменять чёткими гласными.\n\n## Раздел 9. Придыхание, конечное озвончение и /ŋ/\nПридыхание (аспирация): /p t k/ в начале ударного слога произносятся с выдохом воздуха. Проверка: поднесите ладонь или лист бумаги ко рту. На pin лист колеблется, на spin почти нет. Пары: pin / spin; top / stop; kill / skill.\nКонечное озвончение: конечные звонкие остаются звонкими, а гласный перед ними длиннее. Русскоговорящие оглушают (bed → bet). Пары: bed / bet; bad / bat; back / bag; rice / rise; ice / eyes; seat / seed.\n/ŋ/: носовой звук, спинка языка поднята к мягкому нёбу, воздух идёт через нос, звука «г» нет. Контраст: singer /ˈsɪŋər/ (без г) и finger /ˈfɪŋɡər/ (с г).\n\n## Раздел 10. Практика 1. Диагностика (первый день)\nПрочитайте вслух и запишите на диктофон текст:\nOn Thursday, three friends thought about the weather. This was worse than last week, so they went west by ship with warm wine and thick bread. A sheep sat by the sea and sang a long song. Bob's bed was bad, but his red rug was good.\nПрослушайте и отметьте: где язык прятался за зубами, где звучало «в» вместо /w/, где звонкие в конце слова оглохли, где /ɹ/ дрожало. Сохраните запись: вы сравните её с записью в конце урока.\n\n## Раздел 11. Практика 2. Различение на слух и по транскрипции\nА) Определите, какой звук в слове: /θ/ или /ð/: think, this, mother, three, they, bath, breathe, thanks, weather, month.\nБ) Прочитайте транскрипцию и запишите слово: /ʃɪp/, /ʃiːp/, /wɛst/, /vaɪn/, /θriː/, /ˈmʌðər/, /bæd/, /bɛd/, /sɪŋ/, /ˈfɪŋɡər/.\nВ) Выберите слово с долгим гласным: sit / seat; full / fool; hill / heel; pull / pool; live / leave; bit / beat.\nГ) Выберите слово по смыслу и произнесите его с правильным конечным звуком: 1) I sleep in a ___ (bed / bet). 2) The weather is ___ today (bad / bat). 3) I carry my things in a ___ (back / bag). 4) The sun will ___ at six (rice / rise). 5) Please take a ___ (seat / seed). 6) Put some ___ in the drink (ice / eyes).\nД) Придыхание: в каких словах /p, t, k/ с придыханием: pin, spin, top, stop, kill, skill, cat, scat.\n\n## Раздел 12. Практика 3. Минимальные пары (по 5 кругов на пару)\n- Межзубные: think / sink; thank / tank; three / free / tree; thin / tin / sin; those / doze; then / den.\n- /w/ и /v/: west / vest; wine / vine; worse / verse.\n- Гласные: ship / sheep; bit / beat; full / fool; bad / bed; cup / cop.\n- Конечное озвончение: bed / bet; bad / bat; back / bag; rice / rise.\n- Придыхание: pin / spin; top / stop; kill / skill.\nМетод: сначала произнесите пару медленно с утрированным контрастом, затем в темпе, затем в предложении.\n\n## Раздел 13. Практика 4. Скороговорки (по 3 минуты, сначала медленно)\n- Three thin thieves thought they thrilled the throne.\n- This is the weather my mother likes.\n- Very well, we will visit Victoria's vineyard.\n- She sells sea shells by the sea shore.\n- A big black bug bit a big black bear.\nЦель: чёткость при росте темпа, а не скорость сама по себе.\n\n## Раздел 14. Практика 5. Чтение с акцентом на звуки\nПрочитайте вслух, следя за конкретными звуками:\n1) Thirty-three thin things. 2) Weather and whether. 3) Wine is sweet; vine is green. 4) The ship carries sheep. 5) He sings a song and brings a finger ring.\nОтметьте в каждом предложении звуки, которые вам даются хуже всего, и вернитесь к соответствующим разделам.\n\n## Раздел 15. Практика 6. Шэдоуинг (повтор за диктором)\nВыберите аудио 1–2 минуты (подкаст, диалог, фрагмент новостей) на американском английском. Прослушайте 3 раза, затем повторяйте вслух за диктором с задержкой в 1–2 слова. Цель: копировать звуки и интонацию. Запишите себя и сравните с оригиналом. Ежедневно по 10 минут с недели 2.\n\n## Раздел 16. Практика 7. Словарь урока\nВ словарь сайта добавляются 20 слов (отметьте тему пройденной). Для каждого слова запишите транскрипцию, произнесите 5 раз, составьте предложение и повторяйте по карточкам. Дополнительно ведите личный список слов, в которых вы ошибались в произношении.\n\n## Раздел 17. Практика 8. Мини-диалоги на целевые звуки\n1) A: Where's the vest? B: It's in the west room. A: Which vest? B: The warm one.\n2) A: Do you think this is the right weather? B: I think it's worse than Thursday.\n3) A: Is this a ship or a sheep? B: It's a sheep on a ship.\nРазыграйте с партнёром, затем поменяйтесь ролями, запишите, прослушайте.\n\n## Раздел 18. Ключи\nПрактика 2:\nА) think θ, this ð, mother ð, three θ, they ð, bath θ, breathe ð, thanks θ, weather ð, month θ.\nБ) ship, sheep, west, vine, three, mother, bad, bed, sing, finger.\nВ) seat, fool, heel, pool, leave, beat.\nГ) bed, bad, bag, rise, seat, ice.\nД) С придыханием: pin, top, kill, cat. Без: spin, stop, skill, scat.\n\n## Раздел 19. Итоговая диагностика и самооценка\nЗапишите тот же текст из практики 1 и сравните с первой записью. Оцените по 5 критериям, каждый от 0 до 2:\n1) межзубные /θ ð/; 2) /w/ против /v/; 3) /ɹ/ и /l/; 4) длинные и краткие гласные, конечное озвончение; 5) придыхание и чистота согласных без смягчения.\nРезультат: 8–10 баллов — урок усвоен, переходите к уроку 2; 5–7 — повторите слабые разделы две недели; меньше 5 — повторите весь урок.\n\n## Раздел 20. Итоговый тест (15 баллов)\n1) Какой звук в слове this? 2) Какой звук в слове think? 3) Прочитайте /wɛst/. 4) Что звучит с /v/: wine или vine? 5) Какое слово с долгим гласным: sit или seat? 6) Какая пара различается только долготой: ship / sheep или cup / cap? 7) Как произносится sing: /sɪŋ/ или /sɪŋɡ/? 8) Что значит конечное озвончение в слове bad? 9) Какой звук без придыхания: pin или spin? 10) Прочитайте /θriː/. 11) Какое слово имеет /ʃ/: ship или chip? 12) Прочитайте /ˈfɪŋɡər/. 13) В каком слове есть /ð/: mother или month? 14) Что такое шва? 15) Какое слово звонкое в конце: bed или bet?\nОтветы: 1) /ð/ 2) /θ/ 3) west 4) vine 5) seat 6) ship / sheep 7) /sɪŋ/ 8) конечный /d/ остаётся звонким и гласный перед ним длиннее 9) spin 10) three 11) ship 12) finger 13) mother 14) безударный нейтральный гласный /ə/ 15) bed.\nОценка: 13–15 — отлично; 10–12 — хорошо, повторите слабые разделы; меньше 10 — вернитесь к теории и практике.\n\n## План на 4 недели\nНеделя 1: диагностика, база, межзубные /θ ð/, /w v/, /j h/. Практика 1–3.\nНеделя 2: /ɹ/, /l/, шипящие, аффрикаты, палатализация. Практика 3–5, шэдоуинг по 10 минут.\nНеделя 3: гласные, придыхание, конечное озвончение, /ŋ/. Практика 3–6, диалоги.\nНеделя 4: повторение, итоговая диагностика, тест, самооценка.\n\n## Что стоит сверить в книгах\nPeter Roach, «English Phonetics and Phonology»; Ann Baker, «Ship or Sheep?» (тренировка минимальных пар); Cambridge Dictionary и Merriam-Webster (аудио и транскрипция). Транскрипции в разных словарях немного различаются, это нормально.\nВажное замечание: этот урок помогает поставить звуки, но тонкие различия лучше проверять живым слухом. Записывайте себя, сравнивайте с диктором и по возможности просите носителя или опытного преподавателя послушать вас.\n", "w": [["think", "думать", "/θɪŋk/"], ["thought", "мысль, подумал", "/θɔːt/"], ["three", "три", "/θriː/"], ["thin", "тонкий", "/θɪn/"], ["those", "те", "/ðoʊz/"], ["then", "тогда", "/ðɛn/"], ["mother", "мать", "/ˈmʌðər/"], ["weather", "погода", "/ˈwɛðər/"], ["west", "запад", "/wɛst/"], ["vest", "жилет", "/vɛst/"], ["wine", "вино", "/waɪn/"], ["vine", "лоза", "/vaɪn/"], ["ship", "корабль", "/ʃɪp/"], ["sheep", "овца", "/ʃiːp/"], ["full", "полный", "/fʊl/"], ["fool", "дурак", "/fuːl/"], ["bad", "плохой", "/bæd/"], ["bed", "кровать", "/bɛd/"], ["sing", "петь", "/sɪŋ/"], ["finger", "палец", "/ˈfɪŋɡər/"]]}, {"t": "УРОК 2. ЯДРО СЛОВ И ФРАЗЫ-«ПАРОЛИ» (РАСШИРЕННЫЙ КУРС)\nОбъём: 4 недели, 5–6 дней в неделю по 45–60 минут (около 20–25 часов). Уровень: A1–A2.\n\n## Как устроен урок\nТеория (разделы 1–7), практика (разделы 8–15), контроль (разделы 16–18). Сначала прочитайте теорию целиком, затем работайте с практикой и возвращайтесь к теории по мере необходимости. Главное правило урока: слово считается выученным, когда вы можете сами произнести его и использовать в предложении.\n\n## Раздел 0. Научная основа метода\n1. Частотность. Слова в языке распределены неравномерно (закон Ципфа в первом приближении): небольшая группа слов встречается постоянно, а основная масса редко. По оценкам корпусных исследований, несколько сотен частотных слов покрывают значительную долю обычной речи, а две-три тысячи слов обеспечивают понимание большинства повседневных разговоров. Точные цифры зависят от корпуса и метода подсчёта, но направление ясно: начинать нужно с ядра.\n2. Кривая забывания. Исследователь Герман Эббингауз показал, что без повторения новая информация быстро забывается. Повторение через возрастающие промежутки замедляет забывание.\n3. Глубина обработки. Слово запоминается лучше, если с ним что-то сделать: произнести, использовать в предложении, связать со своей жизнью.\n4. Активное вспоминание. Вспоминать полезнее, чем перечитывать.\n5. Выходная речь. Говорение и письмо заставляют замечать пробелы в знаниях.\n\n## Раздел 1. Пассивный и активный словарь, глубина знания слова\nПассивный словарь: слова, которые вы узнаёте при чтении и слушании. Активный: слова, которые вы можете сами произнести и написать. Знание слова включает: произношение, написание, значение, грамматику (часть речи, формы), сочетаемость и стиль. Цель урока — перевести ядро в активный словарь, а не просто узнавать его.\n\n## Раздел 2. Как запоминать слова\n1. Слово в контексте. Учите не travel, а I travel by train.\n2. Блоки (чанки). Английская речь состоит из готовых сочетаний: make a decision, take a break, have lunch. Учите сочетания целиком.\n3. Три контекста. Для каждого слова придумайте 3 предложения о своей жизни.\n4. Активное вспоминание. Закройте перевод и вспомните слово или фразу.\n5. Интервальные повторения. График: в день изучения, на следующий день, через 3, 7, 14 и 30 дней. В сайте для этого есть вкладка «Карточки».\n6. Звук и написание вместе. Произнесите вслух, запишите, проверьте транскрипцию.\n7. Группировка по темам и по словообразованию. Связанные слова запоминаются легче.\n8. Мнемоника. Придумайте образ или созвучие, но не полагайтесь только на него: в речи нужен быстрый доступ, а не история.\n\n## Раздел 3. Словообразование и многозначность\nПриставки и суффиксы расширяют словарь: un- (happy → unhappy), re- (start → restart), -er (teach → teacher, work → worker), -ly (slow → slowly, quick → quickly), -ful (care → careful), -able (read → readable).\nМногозначность: одно слово имеет несколько значений. right: правильный, правый, право; light: свет, лёгкий; play: играть, пьеса. Учите значения по контексту и записывайте примеры к каждому.\nУстойчивые сочетания (коллокации): make a decision / a mistake / a plan; do homework / the dishes / business; take a break / a photo / a bus; have breakfast / a shower / fun; get up / ready / tired; go home / shopping / by bus. Не переводите дословно: сочетание в английском может отличаться от русского.\n\n## Раздел 4. Мини-грамматика ядра\nПорядок слов: подлежащее + глагол + дополнение (I need help). Он фиксирован.\nBe, have, do: be (я есть, быть), have (иметь), do (делать; вспомогательный глагол). Вспомогательный do нужен для отрицаний и вопросов в Present Simple: I don't know. Do you understand? She doesn't know.\nМодальные глаголы: can (мочь, уметь), could (мог бы, вежливая просьба), must (должен), should (следует). После модального идёт глагол без to: I can help. Could you repeat that?\nПовелительное наклонение: глагол без подлежащего. Please sit down. Don't worry. Let's go.\nПредлоги (самые частые): in (внутри, месяцы, годы: in Almaty, in May, in 2026), on (поверхность, дни: on the table, on Monday), at (точка, время: at the station, at 7 o'clock, at night). Дополнительно: to (направление), from (откуда), with (с), for (для), by (на транспорте, около), about (о), after / before (после, до), between (между).\nВопросительные слова: what, where, when, why, who, how. Порядок: вопросительное слово + вспомогательный + подлежащее + глагол.\n\n## Раздел 5. Словарное ядро: блоки по теме\nБлок A. Люди: I (я), you (ты, вы), he (он), she (она), it (оно), we (мы), they (они), man (мужчина), woman (женщина), child (ребёнок), boy (мальчик), girl (девочка), friend (друг), family (семья), mother (мама), father (папа), brother (брат), sister (сестра), son (сын), daughter (дочь), people (люди), person (человек), name (имя), boss (начальник), neighbour (сосед).\nБлок B. Действия (глаголы): be (быть), have (иметь), do (делать), say (сказать), go (идти), get (получить, становиться), make (делать, создавать), know (знать), think (думать), take (брать), see (видеть), come (приходить), want (хотеть), look (смотреть), use (использовать), find (находить), give (давать), tell (рассказывать), work (работать), call (звонить, называть), try (пытаться), ask (спрашивать), need (нуждаться), feel (чувствовать), become (становиться), leave (уходить, оставлять), put (класть), mean (значить), keep (держать), let (позволять), begin (начинать), help (помогать), talk (говорить), turn (поворачивать), start (начинать), show (показывать), hear (слышать), play (играть), run (бегать), move (двигаться), like (нравиться), live (жить), believe (верить), hold (держать), bring (приносить), write (писать), sit (сидеть), stand (стоять), eat (есть), drink (пить), sleep (спать), read (читать), speak (говорить), listen (слушать), understand (понимать), learn (учить), buy (покупать), pay (платить), wait (ждать), finish (заканчивать).\nНеправильные формы запоминайте сразу: go — went — gone; see — saw — seen; take — took — taken; make — made — made; get — got — got/gotten (США); have — had — had; do — did — done; say — said — said; know — knew — known; think — thought — thought.\nБлок C. Существительные: time (время), year (год), day (день), way (путь, способ), thing (вещь), life (жизнь), world (мир), hand (рука), house (дом), room (комната), door (дверь), car (машина), phone (телефон), money (деньги), food (еда), water (вода), city (город), street (улица), shop (магазин), school (школа), hotel (отель), station (станция), work (работа), job (работа, профессия), place (место), problem (проблема), question (вопрос), answer (ответ), word (слово), number (номер, число), price (цена), ticket (билет), bag (сумка), key (ключ), table (стол), window (окно), book (книга), paper (бумага).\nБлок D. Время: today (сегодня), tomorrow (завтра), yesterday (вчера), now (сейчас), later (позже), always (всегда), never (никогда), often (часто), sometimes (иногда), soon (скоро), early (рано), late (поздно), morning (утро), evening (вечер), night (ночь), week (неделя), month (месяц), hour (час), minute (минута).\nБлок E. Качества: good (хороший), bad (плохой), big (большой), small (маленький), new (новый), old (старый), easy (лёгкий), difficult (трудный), hot (горячий), cold (холодный), fast (быстрый), slow (медленный), right (правильный), wrong (неправильный), free (бесплатный, свободный), busy (занятой), ready (готовый), open (открытый), closed (закрытый), near (близкий), far (далёкий), cheap (дешёвый), expensive (дорогой), young (молодой), happy (счастливый), tired (усталый), hungry (голодный), sure (уверенный).\nБлок F. Вопросы и связки: what (что), where (где), when (когда), why (почему), who (кто), how (как), because (потому что), but (но), and (и), or (или), if (если), so (поэтому), also (также), too (тоже, слишком), very (очень), really (действительно), just (только что, просто), only (только), again (снова), still (всё ещё), already (уже), maybe (возможно).\nБлок G. Предлоги: in, on, at, to, from, with, without, for, of, about, by, near, under, behind, between, after, before.\nПродолжайте по тому же принципу: числа 1–100, цвета, еда, части тела, одежда, погода, транспорт. Цель: около 300 слов за 4 недели, то есть около 12 новых слов в день.\n\n## Раздел 6. Фразы-«пароли»\nКогда не поняли:\n1) Sorry? / Pardon? 2) Sorry, I didn't catch that. (Извините, не расслышал.) 3) Could you say that again, please? (Повторите, пожалуйста.) 4) Could you speak more slowly? (Говорите медленнее.) 5) What does ... mean? (Что значит ...?) 6) How do you say ... in English? (Как сказать ... по-английски?) 7) How do you spell that? (Как это пишется?) 8) I don't understand. (Я не понимаю.)\nКогда не знаете слова:\n9) I don't know the word. 10) It's like a ... (Это что-то вроде ...) 11) What do you call this? (Как это называется?) 12) It's something you use for ... (Это то, чем пользуются для ...) 13) I mean ... (Я имею в виду ...) 14) Do you know what I mean? (Понимаете, о чём я?)\nКогда нужно время подумать:\n15) Let me think. 16) Just a moment, please. 17) Give me a second. 18) Well... 19) That's a good question.\nПросьбы и вежливость:\n20) Excuse me, could you help me? 21) Could I have ..., please? 22) Can I ask you a question? 23) Would you mind ...? (Вы не возражаете ...?) 24) Thank you so much. 25) You're welcome. 26) No problem. 27) Sorry to bother you. (Простите за беспокойство.)\nСогласие и несогласие:\n28) I agree. 29) I don't agree. 30) I'm not sure. 31) Maybe. 32) That's right. 33) Exactly.\nПомощь и срочные ситуации:\n34) I need help. 35) I'm lost. (Я заблудился.) 36) Where is the nearest ...? (Где ближайший ...?) 37) Is there anyone who speaks Russian? 38) I don't speak English very well. 39) Please call ... 40) It's an emergency. (Это срочно, чрезвычайная ситуация.) Номера экстренных служб зависят от страны: в США 911, в Великобритании 999, в странах ЕС 112.\nОсобенность: could вежливее, чем can. Could you ...? уместнее при просьбе незнакомому.\n\n## Раздел 7. Произношение: слабые формы и ритм\nСлабые формы (быстрая речь): Could you → /kʊd ju/ или /ˈkʊdʒə/. Don't know → /doʊn(t) noʊ/. Excuse me → /ɪkˈskjuːz mi/. Thank you → /ˈθæŋk ju/ или /ˈθæŋkjə/. What do you → /wʌdʒə/ в быстрой речи. Can → /kən/ слабое в середине фразы, /kæn/ в конце и при ударении.\nИнтонация: просьбы обычно с подъёмом в конце (Could you say that AGAIN? ↗), утверждения с падением (I don't know. ↘).\nТренировка: сначала фраза медленно и чётко, затем в темпе речи, затем с естественной интонацией.\n\n## Раздел 8. Практика 1. Фразы\nПереведите на английский: 1) Извините, я не расслышал. 2) Повторите, пожалуйста. 3) Говорите медленнее. 4) Что значит это слово? 5) Как это называется? 6) Дайте мне секунду. 7) Я не уверен. 8) Мне нужна помощь.\n\n## Раздел 9. Практика 2. Подберите слово\nВставьте слово из ядра: 1) I ___ to go home. (want) 2) Can you ___ me? (help) 3) She ___ English every day. (learns/speaks) 4) We need to ___ a taxi. (call/take) 5) Please ___ the door. (open/close) 6) I ___ the answer. (know) 7) He ___ at a hotel. (works/lives) 8) We ___ to the station. (go)\nДопустимы несколько ответов, главное, чтобы форма глагола была верной.\n\n## Раздел 10. Практика 3. Коллокации\nПодберите make, do, take, have, get или go: 1) ___ a decision. 2) ___ homework. 3) ___ a break. 4) ___ breakfast. 5) ___ up at seven. 6) ___ shopping. 7) ___ a mistake. 8) ___ a photo. 9) ___ a shower. 10) ___ the dishes.\n\n## Раздел 11. Практика 4. Предлоги in, on, at\n1) ___ Monday. 2) ___ 7 o'clock. 3) ___ May. 4) ___ the table. 5) ___ the station. 6) ___ Almaty. 7) ___ 2026. 8) ___ night. 9) ___ the weekend. 10) ___ the morning.\n\n## Раздел 12. Практика 5. Словообразование\nОбразуйте слово: quick → (наречие), work → (человек), kind → (противоположное), play → (человек), careful → (наречие).\nТрансформируйте просьбы в вежливые: 1) Can you help me? 2) Open the door. 3) Speak slower.\n\n## Раздел 13. Практика 6. Блиц и ролевая игра\nБлиц по таймеру: за 60 секунд назвать вслух с переводом 20 слов из блока B.\nРолевая игра: партнёр A говорит быстро и использует незнакомые слова, партнёр B реагирует только фразами-паролями (раздел 6). Меняйтесь ролями. 5 минут.\n\n## Раздел 14. Практика 7. Чтение и диктовка\nЧтение. Прочитайте текст и ответьте на вопросы.\nI am in a new city. I need a hotel. I ask a man in the street, \"Excuse me, could you help me? Where is the nearest hotel?\" He says, \"It's near the station, on Green Street.\" I say, \"Sorry, could you say that again, please?\" He repeats it slowly. I say, \"Thank you so much.\" He says, \"No problem.\"\nВопросы: 1) What does the man need? (Who needs a hotel?) 2) Where is the hotel? 3) Why does the man repeat it? 4) What does the man say at the end?\nДиктовка: Could you speak more slowly? I don't know the word. Where is the nearest station? Please give me a second. It's an emergency.\n\n## Раздел 15. Практика 8. Письмо\nВыберите 10 слов из ядра и по методу трёх контекстов составьте по 3 предложения про свою жизнь (всего 30). Проверьте: глаголы согласованы, артикли стоят, нет типичных ошибок.\n\n## Раздел 16. Ключи\nПрактика 1: 1) Sorry, I didn't catch that. 2) Could you say that again, please? 3) Could you speak more slowly? 4) What does this word mean? 5) What do you call this? 6) Give me a second. 7) I'm not sure. 8) I need help.\nПрактика 3: make a decision; do homework; take a break; have breakfast; get up at seven; go shopping; make a mistake; take a photo; have a shower; do the dishes.\nПрактика 4: on, at, in, on, at, in, in, at, on (США) / at (Британия), in.\nПрактика 5: quickly, worker, unkind, player, carefully. Вежливые просьбы: 1) Could you help me? 2) Could you open the door, please? 3) Could you speak more slowly, please?\nПрактика 7 (чтение): 1) Who needs a hotel: the narrator (я). 2) Near the station, on Green Street. 3) Because the narrator asks him to say it again. 4) No problem.\n\n## Раздел 17. Итоговая самооценка\nОцените по 5 критериям, каждый от 0 до 2:\n1) я знаю и произношу 250–300 слов без подсказок; 2) я использую слова в предложениях; 3) я произношу 40 паролей естественно; 4) я использую график интервальных повторений; 5) я правильно использую in, on, at и коллокации.\nРезультат: 8–10 баллов — переходите к уроку 3; 5–7 — повторите слабые разделы; меньше 5 — повторите урок.\n\n## Раздел 18. Итоговый тест (15 баллов)\n1) Как сказать «Я не расслышал»? 2) Как вежливо попросить говорить медленнее? 3) ___ Monday. 4) ___ 7 o'clock. 5) ___ homework (do или make). 6) Что вежливее: Can you или Could you? 7) «Дайте мне секунду» по-английски. 8) ___ do you call this? 9) Прошедшая форма go. 10) Множественное число child. 11) Что значит I'm lost? 12) Образуйте существительное от teach. 13) Напишите словами 15 и 50. 14) Sorry, could you ___ that again? 15) Какие слова нужно учить в первую очередь и почему?\nОтветы: 1) Sorry, I didn't catch that. 2) Could you speak more slowly? 3) on 4) at 5) do 6) Could you 7) Give me a second. 8) What 9) went 10) children 11) Я заблудился. 12) teacher 13) fifteen, fifty 14) say 15) Частотное ядро, потому что оно покрывает основную часть повседневной речи.\nОценка: 13–15 — отлично; 10–12 — хорошо, повторите слабые разделы; меньше 10 — вернитесь к теории и практике.\n\n## План на 4 недели\nНеделя 1: блок A, часть блока B (первые 25 глаголов), пароли 1–14. Мини-грамматика (раздел 4). Ежедневно 12 слов и 10 минут карточек.\nНеделя 2: остальные глаголы блока B и блок C, пароли 15–27. Практика 1–3.\nНеделя 3: блоки D, E, F, G, пароли 28–40. Практика 4–5, блиц.\nНеделя 4: повторение всех блоков, ролевые игры, чтение, письмо, итоговая самооценка и тест.\n\n## Что стоит сверить в книгах\nCambridge Dictionary, Oxford Learner's Dictionaries и список Oxford 3000 (рекомендуемые частотные слова); English Vocabulary in Use (Cambridge University Press); Raymond Murphy, «English Grammar in Use». Для слабых форм: Peter Roach, «English Phonetics and Phonology».\nВажное замечание: списки частотных слов в разных источниках немного различаются, это нормально. Главное — регулярность и использование слов в речи.\n", "w": [["could", "мог бы (вежливо)", "/kʊd/"], ["would", "бы (вежливо)", "/wʊd/"], ["please", "пожалуйста", "/pliːz/"], ["understand", "понимать", "/ˌʌndərˈstænd/"], ["speak", "говорить", "/spiːk/"], ["slowly", "медленно", "/ˈsloʊli/"], ["mean", "значить", "/miːn/"], ["sure", "уверенный", "/ʃʊr/"], ["maybe", "возможно", "/ˈmeɪbi/"], ["need", "нуждаться", "/niːd/"], ["want", "хотеть", "/wɑːnt/"], ["know", "знать", "/noʊ/"], ["problem", "проблема", "/ˈprɑːbləm/"], ["question", "вопрос", "/ˈkwɛstʃən/"], ["answer", "ответ", "/ˈænsər/"], ["mind", "ум, возражать", "/maɪnd/"], ["wait", "ждать", "/weɪt/"], ["ready", "готовый", "/ˈrɛdi/"], ["enough", "достаточно", "/ɪˈnʌf/"], ["catch", "поймать, расслышать", "/kætʃ/"]]}, {"t": "УРОК 3. ЛЕГЕНДА: БИОГРАФИЯ НА АНГЛИЙСКОМ (РАСШИРЕННЫЙ КУРС)\nОбъём: 4 недели, 5–6 дней в неделю по 45–60 минут (около 20–25 часов). Уровень: A2 → B1.\nЭталон: американский английский, британские отличия отмечены.\nКурс «Школа разведчика» является учебной реконструкцией по открытым описаниям. «Легенда» здесь — это заученный и многократно отработанный рассказ о себе, который вы произносите автоматически. Используйте реальную биографию или вымышленную роль для тренировки и не вводите людей в заблуждение в жизни.\n\n## Как устроен урок\nТеория (разделы 1–8), практика (разделы 9–17), контроль (разделы 18–20). Сначала прочитайте теорию целиком, затем работайте с практикой. Цель: рассказать свою биографию на английском за 30 секунд, 2 минуты и 5 минут без бумажки, и уверенно ответить на неожиданные вопросы о ней.\n\n## Раздел 0. Научная основа метода\n1. Автоматизация. Знание правила и умение говорить без раздумий — разные вещи. Речь становится быстрой, когда фразы переходят в процедурную память, то есть выполняются автоматически. Для этого нужны многократные осмысленные повторения одного и того же материала.\n2. Личная значимость. Информация о себе запоминается лучше и вызывает меньше сопротивления: вам не нужно придумывать содержание, нужно лишь освоить язык.\n3. Блоки и связки. Рассказ состоит из готовых блоков (I was born in..., I grew up in...) и связок (then, after that, finally).\n4. Интервальные повторения. Возвращайтесь к рассказу через 1, 3, 7, 14, 30 дней.\n5. Выходная речь и обратная связь. Исследовательница Мерилл Суэйн показала, что говорение выявляет пробелы. Запись голоса и разбор ошибок обязательны.\n6. Стресс-тест. Умение сохранять связность под давлением (неожиданные вопросы, темп) тренируется отдельно.\n\n## Раздел 1. Структура биографии и «скелет» легенды\nЭтапы:\n1) Имя, возраст, откуда. 2) Рождение и семья. 3) Детство. 4) Школа. 5) Образование. 6) Работа и карьера. 7) Сегодняшняя жизнь. 8) Увлечения. 9) Цели и планы.\nСкелет (заполните своими данными):\nMy name is ___. I'm ___ years old. I was born on ___ in ___, but I grew up in ___.\nMy father was a ___ and my mother worked as a ___. I have ___ (brothers/sisters).\nI went to school in ___. After school, I studied ___ at ___, and I graduated in ___.\nThen I worked as a ___ at ___ for ___ years. In ___ I became a ___.\nNow I work at/for ___ and I ___ every day. I live in ___ and I have lived here since/for ___.\nIn my free time I ___. I'm learning English because ___. Next year I'm going to ___.\nПравило деталей: конкретные детали (год, название места, имя) делают рассказ убедительным и облегчают запоминание. Но следите за согласованностью: все факты должны совпадать при повторении.\n\n## Раздел 2. Прошедшее время (Past Simple): теория\nНазначение: завершённые действия в прошлом, указание на время (in 2010, last year, five years ago).\nПравильные глаголы: основа + -ed: work → worked, live → lived, move → moved. Правописание: после согласной y → ied (study → studied), удвоение согласной у коротких односложных глаголов с ударением на последнем слоге (stop → stopped, plan → planned).\nПроизношение -ed (важнейшее для речи):\n- /t/ после глухих: worked /wɜːrkt/, stopped /stɑːpt/, watched /wɑːtʃt/.\n- /d/ после звонких и гласных: lived /lɪvd/, played /pleɪd/, moved /muːvd/, studied /ˈstʌdid/.\n- /ɪd/ после t, d: wanted /ˈwɑːntɪd/, needed /ˈniːdɪd/, started /ˈstɑːrtɪd/.\nНеправильные глаголы (ядро): be — was/were; have — had; do — did; go — went; make — made; take — took; get — got; come — came; see — saw; begin — began; leave — left; meet — met; buy — bought; write — wrote; know — knew; think — thought; become — became; grow — grew; find — found; tell — told.\nОтрицание: didn't (did not) + базовая форма. I didn't enjoy it. Нельзя didn't enjoyed.\nВопрос: Did + подлежащее + базовая форма? Did you go to university? С be: Was he a student? Were you born in Almaty?\nВопросы с wh-: Where were you born? When did you graduate? Why did you change your job? Что именно: What did you study?\nbe в прошедшем: I was, you were, he/she/it was, we/they were. I was born in 1994. (Passive: родиться — be born, а не bear.)\n\n## Раздел 3. Время в биографии: ago, in, at, on, for, since, during\n- in + год/месяц/сезон: in 2016, in March, in summer.\n- on + дата/день: on 12 March, on Monday.\n- at the age of ten (в возрасте десяти лет); at 18.\n- ago: сколько времени назад (с Past Simple): I moved here ten years ago.\n- last year / last month / when I was a child.\n- during (в течение): during the summer.\n- for + период, since + точка отсчёта (с Present Perfect): I've lived here for ten years. I've lived here since 2016.\nPresent Perfect (кратко, как «мост» от прошлого к настоящему): have/has + третья форма глагола. I have lived (I've lived) in Almaty since 2000. She has worked here for three years. Используйте, когда действие началось в прошлом и продолжается.\nЧтение дат: 12 March 1994 — the twelfth of March, nineteen ninety-four (UK) / March twelfth, nineteen ninety-four (US). Годы: 1994 — nineteen ninety-four; 2005 — two thousand five / two thousand and five (UK); 2010 — twenty ten; 2026 — twenty twenty-six.\n\n## Раздел 4. Связки и структура рассказа\nПорядок событий: first, then, after that, later, finally, in the end.\nПричина и следствие: because (потому что), so (поэтому), that's why.\nКонтраст: but, however, although, even though (хотя).\nДобавление: also, and, besides, moreover.\nПаузы заполняйте связками: Well, ... / Actually, ... / You know, ... / I mean, ... (из урока 2).\nРассказ из одной фразы-тезиса, затем деталь: «I'm from Almaty. I was born in Taraz, but I grew up in Almaty.»\n\n## Раздел 5. Планы и настоящее\nНастоящее: Present Simple (I work at...), Present Continuous для текущего периода (I'm learning English).\nПланы: be going to + глагол (решённое намерение): I'm going to visit London next year. will + глагол (спонтанное решение, предположение): I think I'll move to a bigger city.\nЖелания: I want to..., I'd like to..., My dream is to...\nВыражение мотивации: I'm learning English because I want to travel / to work abroad / to talk to people.\n\n## Раздел 6. Лексика биографии\nbiography /baɪˈɑːɡrəfi/, childhood /ˈtʃaɪldhʊd/, grow up, school, university /ˌjuːnɪˈvɜːrsəti/, degree /dɪˈɡriː/, graduate /ˈɡrædʒueɪt/ (глагол), career /kəˈrɪr/, experience /ɪkˈspɪriəns/, move, hobby /ˈhɑːbi/, dream, ambition /æmˈbɪʃən/, achieve /əˈtʃiːv/, memory /ˈmɛməri/, background /ˈbækɡraʊnd/.\nОбразование: primary school, high school (США) / secondary school (Британия), college, university, bachelor's degree, master's degree, I studied economics / law / design.\nРабота: I work as a..., I'm in charge of..., I'm responsible for..., colleagues, manager, company, team.\nУвлечения: I'm into football. I enjoy reading. I like going for walks.\n\n## Раздел 7. Модель-образец (вымышленный персонаж)\nMy name is Arman Sarsenov. I was born on 12 March 1994 in Taraz, but I grew up in Almaty. My father was a driver and my mother worked as a teacher, so I had a happy and busy childhood. I have one older sister, Dana. I went to school in Almaty and I was good at sport. After school, I studied economics at a university, and I graduated in 2016. Then I worked in a bank for two years, but I didn't enjoy it, so I changed my career. In 2018 I became a web designer. Now I work for a small company and I design websites for clients. I have lived in Almaty since 2000 and I love this city. In my free time I play football and read. I'm learning English because I want to travel and to work with people from other countries. Next year I'm going to visit London.\nТри версии: 30 секунд (имя, откуда, чем занимаетесь, зачем учите язык), 2 минуты (весь скелет), 5 минут (с деталями, воспоминаниями, планами).\n\n## Раздел 8. Произношение и ритм повествования\nСлабые формы: I was born → /aɪ wəz bɔːrn/; I went to → /aɪ wɛn tə/; and → /ən/; of → /əv/; to → /tə/; was → /wəz/, were → /wər/.\nОкончание -ed: следите за /t/, /d/, /ɪd/ (раздел 2).\nИнтонация: перечисление этапов идёт с подъёмом на каждом элементе, с падением на последнем. После запятой пауза и подъём (продолжение), в конце предложения падение.\nТемп: 120–150 слов в минуту — комфортный уровень для ясной речи. Не торопитесь, но и не растягивайте.\nРитм: хлопайте на ударных слогах: I was BORN in alMAty, but I GREW up in ... .\n\n## Раздел 9. Практика 1. Окончание -ed\nОпределите звук окончания (/t/, /d/ или /ɪd/): worked, lived, wanted, played, stopped, studied, needed, watched, moved, started.\n\n## Раздел 10. Практика 2. Неправильные глаголы\nНапишите форму Past Simple: go, be, have, make, take, get, come, see, begin, leave, meet, buy, write, know, think.\n\n## Раздел 11. Практика 3. Вопросы и отрицания\n1) I was born in Almaty. Составьте вопрос с Where. 2) He studied at university. Сделайте отрицание. 3) She moved to Astana in 2015. Составьте вопрос с When. 4) They worked in a bank. Сделайте отрицание. 5) You graduated in 2016. Составьте вопрос с общим вопросом. 6) He became a designer. Составьте вопрос с What.\n\n## Раздел 12. Практика 4. for и since\nВставьте for или since: 1) I've lived here ___ 2016. 2) ___ ten years. 3) I've worked here ___ three years. 4) ___ last March. 5) ___ a long time. 6) ___ Monday.\n\n## Раздел 13. Практика 5. Предлоги времени\nВставьте in, on, at или ago: 1) I moved to Almaty ___ 2019. 2) I started school ___ the age of seven. 3) I met Lera five years ___. 4) She was born ___ 5 June. 5) We met ___ May.\n\n## Раздел 14. Практика 6. Исправьте ошибки\n1) I born in 1995. 2) I have 30 years. 3) I live here since 2016. 4) I go to university in 2012. 5) He didn't went. 6) Did you were there? 7) She studyed. 8) I work here three years.\n\n## Раздел 15. Практика 7. Ваша легенда\n1) Заполните скелет (раздел 1) своими данными, 12–15 предложений.\n2) Проверьте грамматику: Past Simple, -ed, неправильные глаголы, for и since.\n3) Запишите 30-секундную версию, 2-минутную и 5-минутную.\n4) Выучите 2-минутную версию наизусть, произнесите 10 раз.\n5) Запишите на диктофон и прослушайте.\n\n## Раздел 16. Практика 8. Допрос по легенде (партнёр задаёт вопросы)\nБанк вопросов (партнёр выбирает в произвольном порядке):\n1) What's your name? 2) How old are you? 3) Where were you born? 4) Where did you grow up? 5) What do your parents do? 6) Do you have brothers or sisters? 7) What was your childhood like? 8) Where did you go to school? 9) What did you study? 10) When did you graduate? 11) Why did you choose that subject? 12) What was your first job? 13) How long did you work there? 14) Why did you leave? 15) What do you do now? 16) How long have you lived here? 17) What do you do in your free time? 18) Why are you learning English? 19) What are your plans for next year? 20) What is your biggest achievement?\nПравила: отвечайте сразу, 2–3 предложения, согласованно с легендой. Партнёр записывает расхождения. Затем меняйтесь ролями. 10 минут, 2–3 раза в неделю.\nЧтение. Прочитайте модель из раздела 7 и ответьте: 1) Where was Arman born? 2) What did his mother do? 3) When did he graduate? 4) Why did he change his career? 5) What is his job now? 6) How long has he lived in Almaty? 7) Why is he learning English? 8) What is he going to do next year?\nДиктовка: I was born in Almaty. I graduated in 2016. She didn't enjoy her job. I have lived here since 2000. Next year I'm going to visit London.\n\n## Раздел 17. Практика 9. Письмо\nНапишите свою биографию на 150–180 слов. Чек-лист: порядок событий, связки (then, after that, finally), 3 примера Past Simple, 2 неправильных глагола, for и since, планы с going to. Проверьте текст по таблице ошибок и покажите партнёру.\n\n## Раздел 18. Ключи\nПрактика 1: worked /t/, lived /d/, wanted /ɪd/, played /d/, stopped /t/, studied /d/, needed /ɪd/, watched /t/, moved /d/, started /ɪd/.\nПрактика 2: went, was/were, had, made, took, got, came, saw, began, left, met, bought, wrote, knew, thought.\nПрактика 3: 1) Where were you born? 2) He didn't study at university. 3) When did she move to Astana? 4) They didn't work in a bank. 5) Did you graduate in 2016? 6) What did he become?\nПрактика 4: since, for, for, since, for, since.\nПрактика 5: in, at, ago, on, in.\nПрактика 6: 1) I was born in 1995. 2) I'm 30. 3) I've lived here since 2016. 4) I went to university in 2012. 5) He didn't go. 6) Were you there? 7) She studied. 8) I've worked here for three years.\nЧтение: 1) In Taraz. 2) She was a teacher. 3) In 2016. 4) He didn't enjoy the bank. 5) He is a web designer. 6) Since 2000. 7) He wants to travel and to work with people from other countries. 8) Visit London.\n\n## Раздел 19. Самооценка\nПо 2 балла: □ я рассказываю легенду 30 секунд, 2 минуты, 5 минут □ я правильно использую Past Simple и -ed □ я использую for и since □ я отвечаю на вопросы без долгих пауз □ мои ответы согласованы с легендой □ моя речь звучит ритмично.\nРезультат: 10–12 баллов — переходите к уроку 4; 6–9 — повторите слабые разделы; меньше 6 — повторите неделю.\n\n## Раздел 20. Итоговый тест (15 баллов)\n1) Образуйте Past Simple от go, have, make. 2) Звук окончания в worked. 3) Звук окончания в wanted. 4) Вставьте for/since: I've lived here ___ 2016. 5) Вставьте for/since: ___ ten years. 6) Исправьте: I born in 1994. 7) Исправьте: He didn't went. 8) Вопрос с Where к «I was born in Taraz». 9) Предлог: ___ 12 March (in/on). 10) Предлог: ___ 1994 (in/on). 11) Как сказать «Мне 30»? 12) Как читается 2010? 13) Что нужно для автоматизации речи? 14) be going to означает... 15) Назовите две связки для последовательности.\nОтветы: 1) went, had, made 2) /t/ 3) /ɪd/ 4) since 5) for 6) I was born in 1994. 7) He didn't go. 8) Where were you born? 9) on 10) in 11) I'm 30. 12) twenty ten 13) многократное осмысленное повторение 14) решённое намерение 15) then, after that (finally).\nОценка: 13–15 — отлично; 10–12 — хорошо, повторите слабые разделы; меньше 10 — вернитесь к теории и практике.\n\n## План на 4 недели\nНеделя 1: структура и скелет (раздел 1), Past Simple (раздел 2). Практика 1–3. Заполнение скелета.\nНеделя 2: время в биографии (раздел 3), связки (раздел 4), планы (раздел 5). Практика 4–6. 2-минутная версия наизусть.\nНеделя 3: лексика (раздел 6), модель (раздел 7), произношение (раздел 8). Практика 7. Запись трёх версий, допрос с партнёром.\nНеделя 4: допрос, письмо, итоговая запись, самооценка и тест. Разбор ошибок.\n\n## Что стоит сверить в книгах\nRaymond Murphy, «English Grammar in Use» (Past Simple, Present Perfect, for и since); Michael Swan, «Practical English Usage»; Cambridge Dictionary и Oxford Learner's Dictionaries (произношение). Для фонетики: Peter Roach, «English Phonetics and Phonology».\nВажное замечание: упражнения и ключи составлены для самопроверки. Для оценки произношения и письма нужна обратная связь от человека, хорошо владеющего английским.\n", "w": [["biography", "биография", "/baɪˈɑːɡrəfi/"], ["childhood", "детство", "/ˈtʃaɪldhʊd/"], ["grow up", "вырасти", "/ɡroʊ ʌp/"], ["graduate", "окончить (вуз)", "/ˈɡrædʒueɪt/"], ["university", "университет", "/ˌjuːnɪˈvɜːrsəti/"], ["degree", "степень, диплом", "/dɪˈɡriː/"], ["career", "карьера", "/kəˈrɪr/"], ["experience", "опыт", "/ɪkˈspɪriəns/"], ["move", "переезжать", "/muːv/"], ["hobby", "хобби", "/ˈhɑːbi/"], ["dream", "мечта", "/driːm/"], ["ago", "назад (о времени)", "/əˈɡoʊ/"], ["since", "с (какого-то момента)", "/sɪns/"], ["during", "в течение", "/ˈdʊrɪŋ/"], ["finally", "наконец", "/ˈfaɪnəli/"], ["although", "хотя", "/ɔːlˈðoʊ/"], ["achieve", "достигать", "/əˈtʃiːv/"], ["memory", "память, воспоминание", "/ˈmɛməri/"], ["background", "происхождение, фон", "/ˈbækɡraʊnd/"], ["ambition", "амбиция", "/æmˈbɪʃən/"]]}, {"t": "УРОК 4. ШЭДОУИНГ: ПОВТОР ЗА ДИКТОРОМ (РАСШИРЕННЫЙ КУРС)\nОбъём: 4 недели, 5–6 дней в неделю по 45–60 минут (около 20–25 часов). Уровень: A2 → B1.\nЭталон: американский английский, британские отличия отмечены.\nКурс «Школа разведчика» является учебной реконструкцией по открытым описаниям.\n\n## Как устроен урок\nТеория (разделы 1–8), практика (разделы 9–17), контроль (разделы 18–20). Сначала прочитайте теорию целиком, затем работайте с практикой. Цель: перенять ритм, интонацию и скорость настоящей речи и научиться тренироваться самостоятельно, записывая себя и сравнивая с диктором.\n\n## Раздел 0. Научная основа метода\n1. Шэдоуинг (от shadow, «тень») — повторение вслух речи диктора с минимальной задержкой, как тень. Этот приём применяют в подготовке синхронных переводчиков и в изучении языков.\n2. Связь восприятия и произнесения. Мы произносим то, что слышим. Чем точнее вы слышите ритм и интонацию, тем точнее воспроизводите их.\n3. Фонологическая петля (рабочая память для звуков). Повторение речи с задержкой нагружает её и тренирует удержание звукового образа.\n4. Просодия. Просодия — это ритм, ударение, интонация и пауза. Акцент определяется ею не меньше, чем отдельными звуками.\n5. Автоматизация. Многократное осмысленное повторение переводит произношение в процедурную память.\n6. Исследования (в частности, с изучающими английский как иностранный) указывают на пользу шэдоуинга для восприятия на слух и произношения. Результаты зависят от материала, регулярности и качества обратной связи, поэтому цифры в уроке не обещают гарантированного эффекта.\n7. Обратная связь. Запись голоса и сравнение с эталоном обязательны.\n\n## Раздел 1. Виды шэдоуинга\n1) Слушание без речи: прослушайте материал, не говоря.\n2) Бормотание (mumbling): повторяйте тихо, не выговаривая слова, только ритм и мелодию.\n3) Чтение вслух синхронно (read-along): читайте текст одновременно с диктором.\n4) Фразовый шэдоуинг: слушайте фразу, остановитесь, повторите.\n5) Полный шэдоуинг: повторяйте за диктором непрерывно с задержкой 0,5–1,5 секунды.\n6) Шэдоуинг с текстом и без.\n7) Шэдоуинг с акцентом на содержание: повторяйте и понимайте смысл.\n8) Просодический шэдоуинг: копируйте именно мелодию и ритм.\nНачинайте с простого (1–4) и двигайтесь к сложному (5–8).\n\n## Раздел 2. Протокол одной тренировки (25–45 минут)\n1) Выберите отрывок 30–90 секунд (раздел 3).\n2) Прослушайте 2–3 раза с текстом, поймите смысл.\n3) Проверьте незнакомые слова и произношение (словарь с аудио).\n4) Прочитайте текст вслух синхронно с диктором (read-along) 3 раза.\n5) Шэдоуинг с текстом 5–10 раз.\n6) Шэдоуинг без текста 5–10 раз.\n7) Запишите себя на диктофон одним отрывком.\n8) Сравните запись с оригиналом по 5 критериям (раздел 6) и заполните журнал.\n9) Через день и через неделю повторите тот же отрывок (интервальное повторение).\nПравило: не больше 20 минут непрерывного шэдоуинга. Устают слух и голос, качество падает.\n\n## Раздел 3. Как выбрать материал\nКритерии:\n- Уровень. Вы должны понимать 90 процентов слов. Сложность оставьте для ритма и произношения.\n- Длина: 30–90 секунд в одном отрывке.\n- Скорость: ясная речь, примерно 120–160 слов в минуту. Слишком быстро сорвёт точность.\n- Акцент: выберите один эталон на период (американский или британский) и не смешивайте на первом этапе.\n- Чёткий звук без шума и музыки.\n- Наличие текста для сверки.\nТипы источников: учебные подкасты, новостные ролики для изучающих язык, аудиокниги, диалоги из сериалов, лекции. Примеры сервисов с учебными аудио: VOA Learning English и BBC Learning English; доступность и условия использования могут меняться, смотрите на сайтах.\nЛестница сложности: медленная речь для изучающих (A2) → подкаст для изучающих (B1) → новости (B2) → интервью и диалоги → лекции и спонтанная речь.\nСкорость воспроизведения: можно замедлить до 0,8 для разбора, затем вернуться к 1,0. Ускорение выше 1,1 для обучения не рекомендуется.\n\n## Раздел 4. Что именно копировать: ритм и ударение\nАнглийский — язык с ударным ритмом: промежутки между ударными слогами примерно равны, а безударные слоги сжимаются. Поэтому фразы с разным числом слогов занимают сходное время:\n- DOGS EAT BONES.\n- The DOGS are EATing the BONES.\n- The DOGS will have been EATing the BONES.\nСмысловое ударение падает на содержательные слова (существительные, глаголы, прилагательные, наречия) и на слова, которые вы хотите выделить. Служебные слова слабые.\nПример: I'd LIKE a CUP of COFfee, please. Ударные: like, cup, coffee.\nГруппы по смыслу (thought groups): речь делится на короткие смысловые отрезки, между ними пауза или небольшая задержка. Пример: When I was young, / my family moved to a small town / near the sea.\nПравило: не делайте пауз внутри смысловой группы.\n\n## Раздел 5. Интонация и связная речь\nОсновные контуры:\n- Падение (↘): утверждения, вопросы с wh-словом, команды. Where do you live? ↘\n- Подъём (↗): вопросы да/нет, уточнения. Do you like tea? ↗\n- Падение-подъём: сомнение, оговорка, «но». I like it, ↘↗ but it's expensive.\n- Перечисление: подъём на каждом элементе, падение на последнем. I like tea ↗, coffee ↗ and juice ↘.\n- Удивление или переспрос: Really? ↗\nПриёмы связной речи (важно для слышимой скорости):\n- Связывание согласного с гласным: pick it up → /ˈpɪkɪˈtʌp/, turn it off → /ˈtɜːrnɪˈtɔːf/.\n- Американское t между гласными превращается в быстрый d: water → /ˈwɔːɾər/, better → /ˈbɛɾər/.\n- Ассимиляция (слияние): did you → /ˈdɪdʒu/, what do you → /ˈwʌdʒə/.\n- Выпадение звуков: next day → /nɛks ˈdeɪ/.\n- Слабые формы: and → /ən/, to → /tə/, of → /əv/, can → /kən/.\n- Разговорные сокращения (неформально): going to → /ˈɡʌnə/ (gonna), want to → /ˈwɑːnə/ (wanna), got to → /ˈɡɑːɾə/ (gotta). В письме их не используют.\nЭти приёмы не нужно «изобретать»: они возникают сами, когда вы повторяете речь с реальным темпом.\n\n## Раздел 6. Как сравнивать запись с оригиналом\nЗаписывайте себя на телефон. Оцените каждый критерий от 1 до 5:\n1) Ритм: совпадают ли ударные слоги по времени.\n2) Ударение: те ли слова выделены.\n3) Интонация: совпадают ли подъёмы и падения.\n4) Звуки: чистота проблемных звуков (урок 1).\n5) Скорость и плавность: нет ли лишних пауз и запинок.\nЖурнал: дата, отрывок, оценки по 5 критериям, 2 самых заметных отличия, что исправить в следующий раз.\nСовет: слушайте не только на предмет «я ошибся», но и «чем я отличаюсь». Различия определяют направление работы.\n\n## Раздел 7. Техника: поза, дыхание, темп\n- Говорите стоя или ходите по комнате. Тело помогает ритму.\n- Дыхание: делайте вдох на паузах между смысловыми группами, не в середине.\n- Громкость: громко, но без крика. Тихое бормотание годится только для этапа 2.\n- Задержка: 0,5–1,5 секунды. Не торопитесь догнать диктора.\n- Хлопайте или постукивайте по ударным слогам для ритма.\n- Не пытайтесь копировать тембр голоса, копируйте ритм и мелодию.\n- Усталость: после 20 минут делайте перерыв.\n\n## Раздел 8. Типичные ошибки\n- Выбран слишком трудный материал, и вместо ритма вы просто догоняете слова.\n- Нет записи себя, поэтому ошибки не слышны.\n- Один и тот же отрывок повторяется в один день, а через неделю не возвращаются.\n- Копируются слова, а не мелодия. Звучит как диктовка, а не речь.\n- Пауза в неверном месте (внутри смысловой группы).\n- Слишком быстрый темп в ущерб ясности.\n\n## Раздел 9. Практика 1. Смысловые группы\nРазделите на смысловые группы знаком /: 1) When I was young my family moved to a small town near the sea. 2) Every morning I get up at seven drink a cup of tea and walk to work. 3) If you don't understand please ask me to repeat it. 4) We travelled to the mountains last summer and slept in a tent.\n\n## Раздел 10. Практика 2. Ударение\nОтметьте ударные (содержательные) слова: 1) I'd like a cup of coffee, please. 2) She works in a small office near the station. 3) He doesn't like walking to work in the rain.\n\n## Раздел 11. Практика 3. Связная речь\nЗапишите, как звучит быстро: pick it up; turn it off; did you; what do you; next day; water.\n\n## Раздел 12. Практика 4. Интонация\nОтметьте ↗ или ↘: 1) Where do you live? 2) Do you like tea? 3) I like tea, coffee and juice. 4) Really? (удивление) 5) I like it, but it's expensive.\n\n## Раздел 13. Практика 5. Отрывки для шэдоуинга\nОтрывок A (уровень A2). Размечен смысловыми группами:\nMy name is Sam. / I live in a small flat / near the city centre. / Every morning, / I get up at seven, / drink a cup of tea, / and walk to work. / It takes me twenty minutes. / I like walking / because it helps me think.\nОтрывок B (уровень B1):\nLast summer, / my friends and I / travelled to the mountains. / We walked for hours, / carried heavy bags, / and slept in a tent. / It was tiring, / but the view from the top / was unforgettable. / I think / everyone should try it / at least once.\nОтрывок C (уровень B1+):\nWhen you learn a language, / you don't just learn words. / You learn a new way / of listening, speaking, / and even thinking. / At first, / it feels slow and uncomfortable, / but with regular practice, / your ear adapts / and your mouth follows. / That's why / repetition matters more / than talent.\nДля каждого отрывка найдите аудио (подкаст, ролик для изучающих) на ту же тему или прочитайте синхронно с вашим диктором-эталоном. Если нет подходящего аудио, запишите отрывок голосом носителя или попросите опытного человека прочитать, затем работайте по протоколу из раздела 2.\n\n## Раздел 14. Практика 6. Протокол недели\nДень 1: слушание и read-along отрывка A, 3 раза каждый.\nДень 2: фразовый шэдоуинг A, запись, журнал.\nДень 3: полный шэдоуинг A с текстом.\nДень 4: полный шэдоуинг A без текста, запись.\nДень 5: повторение A, новый отрывок B (read-along).\nДень 6: шэдоуинг B с текстом, запись.\nЕжедневно по 10 минут повторяйте отрывки прошлых дней.\n\n## Раздел 15. Практика 7. Журнал тренировок\nШаблон на каждый день: дата; отрывок; время; ритм (1–5); ударение (1–5); интонация (1–5); звуки (1–5); скорость (1–5); два главных отличия; что исправить. Заведите таблицу в заметках или на бумаге и подсчитывайте прогресс по неделям.\n\n## Раздел 16. Практика 8. Обсуждение и письмо\nГоворение: с партнёром возьмите один и тот же отрывок, запишитесь по очереди и сравните, чем вы отличаетесь друг от друга и от диктора. Опишите письменно, на 80–100 слов: что у вас получилось лучше всего, что хуже, чему научилась ваша речь за неделю.\n\n## Раздел 17. Ключи\nПрактика 1: 1) When I was young, / my family moved to a small town / near the sea. 2) Every morning, / I get up at seven, / drink a cup of tea, / and walk to work. 3) If you don't understand, / please ask me to repeat it. 4) We travelled to the mountains / last summer / and slept in a tent.\nПрактика 2: 1) like, cup, coffee (please слабее) 2) works, small, office, station 3) doesn't like, walking, work, rain.\nПрактика 3: pick it up /ˈpɪkɪˈtʌp/; turn it off /ˈtɜːrnɪˈtɔːf/; did you /ˈdɪdʒu/; what do you /ˈwʌdʒə/; next day /nɛks ˈdeɪ/; water /ˈwɔːɾər/ (США).\nПрактика 4: 1) ↘ 2) ↗ 3) ↗ ↗ ↘ (tea ↗, coffee ↗, juice ↘) 4) ↗ 5) like it ↘↗, but it's expensive ↘.\n\n## Раздел 18. Самооценка\nПо 2 балла: □ я различаю ударные и безударные слова □ я делю речь на смысловые группы □ я повторяю за диктором с задержкой 0,5–1,5 с □ я записываю себя и сравниваю □ я заполняю журнал □ мой ритм стал ближе к эталону.\nРезультат: 10–12 баллов — переходите к уроку 5; 6–9 — повторите слабые разделы; меньше 6 — повторите неделю.\n\n## Раздел 19. Итоговый тест (15 баллов)\n1) Что такое шэдоуинг? 2) Рекомендуемая задержка. 3) Сколько минут шэдоуинга подряд максимум? 4) Какие слова обычно ударные? 5) Какие слабые? 6) Какое слово слабое: of или coffee? 7) Интонация вопроса да/нет. 8) Интонация вопроса с wh-словом. 9) Как звучит быстро did you? 10) Что такое смысловая группа? 11) Как перечислять: ↗ или ↘ на последнем элементе? 12) Рекомендуемая длина отрывка. 13) Скорость воспроизведения для разбора. 14) Что оценивать при сравнении записи? 15) Через какое время повторять отрывок?\nОтветы: 1) повторение речи диктора вслух с задержкой 2) 0,5–1,5 с 3) 20 минут 4) существительные, глаголы, прилагательные, наречия 5) служебные слова (the, of, to, and) 6) of 7) подъём ↗ 8) падение ↘ 9) /ˈdɪdʒu/ 10) короткий смысловой отрезок речи 11) падение ↘ 12) 30–90 секунд 13) 0,8 (и затем 1,0) 14) ритм, ударение, интонация, звуки, скорость 15) через день и через неделю.\nОценка: 13–15 — отлично; 10–12 — хорошо, повторите слабые разделы; меньше 10 — вернитесь к теории и практике.\n\n## Раздел 20. План на 4 недели\nНеделя 1: теория (разделы 1–5), смысловые группы, ударения (практика 1–2). Слушание и read-along отрывка A. Ежедневно 10 минут.\nНеделя 2: связная речь и интонация (практика 3–4). Фразовый и полный шэдоуинг отрывка A, запись и журнал.\nНеделя 3: отрывки B и C, шэдоуинг без текста, запись, сравнение.\nНеделя 4: свой материал (подкаст или диалог), полный протокол, итоговая запись, самооценка и тест. Сравнение с первой записью.\n\n## Что стоит сверить в книгах\nAlexander Arguelles популяризировал шэдоуинг в изучении языков; о просодии и связной речи: Peter Roach, «English Phonetics and Phonology»; Rachel's English и словари Cambridge и Merriam-Webster для аудио. Для связной речи также Judy Gilbert, «Clear Speech».\nВажное замечание: шэдоуинг даёт ритм и мелодию, но не заменяет обратную связь от человека. Если есть возможность, раз в неделю показывайте запись носителю ou later", "до скорого", "/kætʃ juː ˈleɪtər/"], ["my bad", "моя вина (сленг)", "/maɪ bæd/"]]}, {"t": "ФИНАЛЬНЫЙ ЭКЗАМЕН\n\nЦель: проверить всё освоенное: произношение, лексику, скорость и спокойствие.\n\nФормат (30 минут):\n1) 2 минуты: легенда без бумажки.\n2) 3 минуты: бытовой диалог по роли (магазин, отель).\n3) 5 минут: допрос с неожиданными вопросами.\n4) 3 минуты: пересказ новости.\n5) Запись всего экзамена на диктофон.\n\nКритерии самооценки (по 5 баллов):\n- понятность речи;\n- темп и ритм;\n- отсутствие долгих пауз;\n- богатство лексики и идиом;\n- уверенность.\n\nПосле экзамена прослушайте запись, выпишите 5 слабых мест и вернитесь к соответствующим урокам.\nПроверка: 20 баллов и выше означает, что курс пройден; ниже — повторите слабые разделы.", "w": [["confident", "уверенный", "/ˈkɑːnfɪdənt/"], ["fluency", "беглость", "/ˈfluːənsi/"], ["accent", "акцент", "/ˈæksɛnt/"], ["improve", "улучшать", "/ɪmˈpruːv/"], ["score", "балл", "/skɔːr/"], ["challenge", "вызов", "/ˈtʃælɪndʒ/"], ["progress", "прогресс", "/ˈprɑːɡrɛs/"], ["level", "уровень", "/ˈlɛvəl/"]]}], "comm": [{"t": "УРОК 1. ПРИВЕТСТВИЯ И ЗНАКОМСТВО (РАСШИРЕННЫЙ КУРС)\nОбъём: 4 недели, 5–6 дней в неделю по 45–60 минут (около 20–25 часов). Уровень: A1 (с нуля).\nУчебный язык: объяснения по-русски, примеры по-английски.\n\n## Как устроен урок\nТеория (разделы 1–8), практика (разделы 9–16), контроль (разделы 17–19). Сначала прочитайте теорию целиком без заучивания, затем работайте с практикой и возвращайтесь к теории по мере необходимости. Для знакомства важнее всего автоматизм: фразы должны вылетать без раздумий.\n\n## Раздел 0. Научная основа метода\n1. Входной материал (input): язык усваивается, когда вы много слышите и читаете понятного. Поэтому в уроке есть диалоги, тексты и диктовка.\n2. Выходная речь (output): когда вы говорите и пишете, вы замечаете пробелы (идея лингвиста Мерилл Суэйн). Поэтому говорение и письмо обязательны.\n3. Активное вспоминание: вспоминать эффективнее, чем перечитывать. Закрывайте перевод и воспроизводите фразы.\n4. Интервальные повторения: возвращайтесь к материалу через 1, 3, 7, 14 дней. Для этого есть вкладка «Карточки».\n5. Обратная связь: ошибки нужно разбирать. Поэтому есть таблица ошибок и ключи.\n\n## Раздел 1. Приветствия, прощания, представление\nПриветствия по времени суток: Good morning (с утра до полудня), Good afternoon (после полудня до вечера), Good evening (вечером, при встрече). Good night используется только при прощании перед сном.\nРегистры:\n- Формальный: Good morning. How do you do? (очень официально; ответ повторяет вопрос) Pleased to meet you.\n- Нейтральный: Hello. Hi. How are you? Nice to meet you.\n- Неформальный: Hey. What's up? How's it going? You alright? (британский вариант).\nОтветы на How are you?: Fine, thanks. And you? / Good, thanks. / Not bad. / Pretty good. / Can't complain.\nВ США How are you? — приветствие, а не просьба рассказать о здоровье. Подробный ответ о проблемах здесь неуместен.\nПрощания: Goodbye (нейтрально), Bye, See you later, See you tomorrow, Take care, Have a nice day.\nОбращения: Mr /ˈmɪstər/ (мужчина), Mrs /ˈmɪsɪz/ (замужняя женщина), Ms /mɪz/ (универсальное, не указывает семейное положение), Dr (врач или учёная степень). Они используются с фамилией: Mr Brown.\nПредставление себя: Hi, I'm Lera. / My name is Lera. / Let me introduce myself. I'm Lera.\nПредставление другого: This is my friend, Dana. / Dana, this is Lera. Ответ: Nice to meet you. — Nice to meet you too.\n\n## Раздел 2. Глагол to be: полная теория\nВ русском настоящем времени глагол-связка опускается («Я студент»), в английском глагол обязателен.\nФормы: I am, you are, he is, she is, it is, we are, you are, they are.\nКраткие формы в речи: I'm /aɪm/, you're /jʊr/, he's /hiːz/, she's /ʃiːz/, it's /ɪts/, we're /wɪr/, they're /ðɛr/.\nОтрицание: I'm not; you aren't (are not); he/she/it isn't (is not); we/they aren't.\nВопрос: Am I...? Are you...? Is he/she/it...? Are we...? Are they...? Вспомогательный порядок: глагол выходит перед подлежащим. Are you from Almaty?\nКраткие ответы: Yes, I am. / No, I'm not. Yes, he is. / No, he isn't. Нельзя Yes, I'm. (краткая форма в утвердительном ответе недопустима).\nУпотребление be: имя, возраст, профессия, национальность, происхождение, состояние. I'm Lera. I'm 25. She is a teacher. We're from Kazakhstan. I'm tired.\nОсобенность: возраст передаётся через be. I'm 25 (years old). Нельзя I have 25 years.\nМестоимения: I, you, he, she, it, we, they. You — и «ты», и «вы». It — для вещей, животных и общего подлежащего (It's cold. It's 5 o'clock).\n\n## Раздел 3. Притяжательные местоимения, вопросительные слова, this/that\nmy (мой), your (твой, ваш), his (его), her (её), its (его, её; о вещи), our (наш), their (их).\nПравило: форма зависит от владельца. His name is Aidar. Her name is Lera.\nВопросительные слова: What? (что, какой), Where? (где, куда), Who? (кто), How? (как), How old? (сколько лет), How many? (сколько, исчисляемое), How much? (сколько стоит).\nПорядок: вопросительное слово + глагол + подлежащее: Where are you from? What is your name?\nthis / that / these / those: this is, that is, these are, those are. This is my friend (рядом, представление). That is my car (далеко).\nВ знакомстве чаще всего: This is my friend, Dana.\n\n## Раздел 4. Числа, возраст, телефон, алфавит\nЧисла 0–20: zero /ˈzɪroʊ/ (в телефонах часто oh), one, two, three, four, five, six, seven, eight, nine, ten, eleven, twelve, thirteen, fourteen, fifteen, sixteen, seventeen, eighteen, nineteen, twenty.\nДесятки: thirty, forty, fifty, sixty, seventy, eighty, ninety, a hundred.\nСоставные: twenty-one, thirty-four, sixty-seven. Через дефис.\nУдарение: в числах 13–19 ударение на последнем слоге (thirteen /ˌθɜːrˈtiːn/), в десятках на первом (thirty /ˈθɜːrti/). Это различение критично: 15 и 50 звучат похоже, если не слышать ударения. Фраза: fifteen /ˌfɪfˈtiːn/ и fifty /ˈfɪfti/.\nТелефонные номера читаются цифрами: 555-0198 → five five five, oh one nine eight. Двойные цифры: double five (британский вариант).\nВозраст: How old are you? — I'm twenty-five. Для вежливости: I'm in my twenties (мне двадцать с чем-то).\nАлфавит: A /eɪ/, B /biː/, C /siː/, D /diː/, E /iː/, F /ɛf/, G /dʒiː/, H /eɪtʃ/, I /aɪ/, J /dʒeɪ/, K /keɪ/, L /ɛl/, M /ɛm/, N /ɛn/, O /oʊ/, P /piː/, Q /kjuː/, R /ɑːr/, S /ɛs/, T /tiː/, U /juː/, V /viː/, W /ˈdʌbəl juː/, X /ɛks/, Y /waɪ/, Z /ziː/ (США) или /zɛd/ (Британия).\nЗапоминайте группами по гласному звуку: /eɪ/ A H J K; /iː/ B C D E G P T V Z; /ɛ/ F L M N S X; /aɪ/ I Y; /oʊ/ O; /juː/ Q U W; /ɑːr/ R.\nСпеллинг: How do you spell your name? — L-E-R-A. Для чётности: A as in Apple, B as in Boy (кодовые слова).\n\n## Раздел 5. Страны и национальности\nМодель: Where are you from? — I'm from Kazakhstan. Национальность: I'm Kazakhstani.\nСлово Kazakhstani указывает на гражданство, Kazakh на этническую принадлежность и язык. Это тонкое различие, при сомнении спросите, как человек сам себя называет.\nСуффиксы: -an (American /əˈmɛrɪkən/, Italian /ɪˈtæljən/, German /ˈdʒɜːrmən/, Russian /ˈrʌʃən/); -ish (British /ˈbrɪtɪʃ/, Turkish /ˈtɜːrkɪʃ/, Spanish /ˈspænɪʃ/); -ese (Chinese /tʃaɪˈniːz/, Japanese /ˌdʒæpəˈniːz/); -i (Kazakhstani, Pakistani); особые: French /frɛntʃ/, Dutch.\nНациональности и языки пишутся с заглавной буквы. Язык часто совпадает с прилагательным: She speaks Italian.\n\n## Раздел 6. Профессии и занятия\nВопросы: What do you do? / What's your job? / What do you do for a living?\nОтвет: I'm a teacher. / I'm an engineer. / I work as a trainer. / I'm a student.\nПрофессии: teacher /ˈtiːtʃər/, student /ˈstuːdənt/, doctor, nurse, engineer /ˌɛndʒɪˈnɪr/, manager, driver, coach /koʊtʃ/, trainer, bartender /ˈbɑːrtɛndər/, developer /dɪˈvɛləpər/, accountant /əˈkaʊntənt/, lawyer /ˈlɔːjər/.\nПредлоги: work at (место: at a bar, at a hospital), work for (организация: for a company), work in (сфера, помещение: in an office, in marketing). Различайте: I work at a gym. I work for a big company.\nАртикль с профессией обязателен: She is a doctor. He is an engineer. Без артикля нельзя (в русском его нет, отсюда ошибка).\n\n## Раздел 7. Small talk и культура общения\nSmall talk — лёгкая беседа для установления контакта. Темы: откуда вы, чем занимаетесь, погода, дорога, выходные, хобби. Избегайте в первом знакомстве: деньги, возраст (у взрослых), политика, религия.\nПриём «Ответ + деталь + встречный вопрос» (ответ, добавление, возвращение вопроса):\n— Where are you from? — I'm from Almaty. It's a beautiful city. Where are you from?\n— What do you do? — I'm a trainer. I work at a gym. And you?\nЭто превращает диалог из допроса в разговор.\nПолезные фразы для поддержки беседы: Really? That's interesting. Me too. Oh, nice! Sounds great. I see.\nЕсли не поняли: Sorry? / Pardon? / Could you repeat that, please? / Could you speak more slowly?\nКультура: рукопожатие короткое и уверенное, зрительный контакт; в США и Великобритании чаще используют имя; Mr и Ms применяют в формальной обстановке; вопрос о возрасте и доходах в знакомстве может быть неуместным.\n\n## Раздел 8. Произношение и интонация\nСлабые формы (в быстрой речи): Nice to meet you → /naɪs tə ˈmiːt ju/. Where are you from? → /wɛr ər ju frʌm/ (from слабое: /frəm/). What do you do? → /wʌt də ju duː/. How are you? → /haʊ ər ju/ или в быстрой речи /haʊr ju/. What's your name? → /wʌts jɔːr neɪm/.\nИнтонация: вопросы с вопросительным словом обычно падают к концу: What's your NAME? ↘ Общие вопросы (да/нет) обычно растут: Are you from ALmaty? ↗ Приветствие How are you? падает: How are YOU? ↘\nПеречисление: интонация растёт на каждом элементе, кроме последнего, где падает: I'm from Almaty ↗, I'm a trainer ↗ and I'm twenty-five ↘.\nРитм: хлопайте на ударных слогах и проговаривайте: NICE to MEET you.\nФонетический фокус урока (повторять ежедневно 3 минуты): /w/ в where, what, we; /ð/ в they, the; /θ/ в thanks; шва в слабых формах.\n\n## Раздел 9. Практика 1. Глагол to be\nВставьте am, is или are: 1) I ___ from Kazakhstan. 2) She ___ a teacher. 3) We ___ friends. 4) They ___ not at home. 5) ___ you a student? 6) He ___ not my brother. 7) It ___ a nice day. 8) My parents ___ doctors. 9) ___ she from Italy? 10) I ___ not tired.\n\n## Раздел 10. Практика 2. Исправьте ошибки\n1) I from Almaty. 2) I have 25 years. 3) I am agree. 4) She are my friend. 5) Yes, I'm. 6) He no is a student. 7) Where you are from? 8) My name are Lera.\n\n## Раздел 11. Практика 3. Вопросы к ответам\nСоставьте вопрос: 1) ___? I'm from Almaty. 2) ___? My name is Lera. 3) ___? I'm twenty-five. 4) ___? I'm a student. 5) ___? L-E-R-A. 6) ___? He is my brother.\n\n## Раздел 12. Практика 4. Числа\nЗапишите словами: 13, 30, 15, 50, 19, 90, 24, 67. Прочитайте номер 555-0198. Объясните разницу в ударении: fourteen и forty.\n\n## Раздел 13. Практика 5. Национальности\nОбразуйте национальность: Italy, Russia, Turkey, Japan, Germany, Spain, the USA, Kazakhstan, France, Britain, China.\n\n## Раздел 14. Практика 6. Диалоги\nДополните диалог своими ответами и разыграйте с партнёром:\nA: Hello! I'm ___. What's your name? B: ___.\nA: Nice to meet you. Where are you from? B: ___. And you?\nA: ___. What do you do? B: ___. And you?\nA: ___. How old are you? B: ___.\nЗатем придумайте диалог с формальным представлением (Good morning, Mr / Ms ___).\n\n## Раздел 15. Практика 7. Перевод\n1) Меня зовут Лера. 2) Мне двадцать пять лет. 3) Я из Алматы. 4) Он не студент. 5) Вы из Италии? 6) Это мой друг Айдар. 7) Приятно познакомиться. 8) Чем вы занимаетесь? 9) Повторите, пожалуйста. 10) Как пишется ваше имя?\n\n## Раздел 16. Практика 8. Чтение, диктовка, говорение, письмо\nЧтение. Прочитайте текст и ответьте на вопросы.\nHello! I'm Samal. I'm twenty-eight and I'm from Shymkent. I'm a nurse. My friend Arman is from Almaty. He's a driver. We aren't colleagues, we're neighbours. Our English teacher is Mr Brown. He's British, from Manchester.\nВопросы: 1) How old is Samal? 2) Where is she from? 3) What does Samal do? 4) Is Arman from Shymkent? 5) What is his job? 6) Are they colleagues? 7) Who is Mr Brown? 8) Where is he from?\nДиктовка (5 предложений): My name is Dana. I'm from Almaty. Are you a student? She isn't my sister. Nice to meet you too.\nГоворение (запись по 3–5 минут):\n1) Представьтесь формально и неформально.\n2) Представьте друга третьему человеку.\n3) Small talk 3 минуты с партнёром по приёму «ответ + деталь + вопрос».\n4) Назовите по буквам своё имя, фамилию, город и номер телефона.\n5) Разыграйте знакомство на работе.\nПисьмо. Напишите текст My introduction на 80–100 слов. Чек-лист: имя, возраст, город, профессия, 2 факта о себе, правильные be и артикли с профессией, нет типичных ошибок из раздела 18. Покажите текст партнёру и разберите ошибки.\n\n## Раздел 17. Ключи\nПрактика 1: am, is, are, are, Are, is, is, are, Is, am.\nПрактика 2: 1) I'm from Almaty. 2) I'm 25. 3) I agree. 4) She is my friend. 5) Yes, I am. 6) He isn't a student. 7) Where are you from? 8) My name is Lera.\nПрактика 3: 1) Where are you from? 2) What's your name? 3) How old are you? 4) What do you do? 5) How do you spell your name? 6) Who is he?\nПрактика 4: thirteen, thirty, fifteen, fifty, nineteen, ninety, twenty-four, sixty-seven; five five five, oh one nine eight. Fourteen /ˌfɔːrˈtiːn/ — ударение на втором слоге, forty /ˈfɔːrti/ — на первом.\nПрактика 5: Italian, Russian, Turkish, Japanese, German, Spanish, American, Kazakhstani, French, British, Chinese.\nПрактика 7: 1) My name is Lera. / I'm Lera. 2) I'm twenty-five (years old). 3) I'm from Almaty. 4) He isn't a student. 5) Are you from Italy? 6) This is my friend, Aidar. 7) Nice to meet you. 8) What do you do? 9) Could you repeat that, please? 10) How do you spell your name?\nПрактика 8 (чтение): 1) She is twenty-eight. 2) She is from Shymkent. 3) She is a nurse. 4) No, he is from Almaty. 5) He is a driver. 6) No, they are neighbours. 7) Their English teacher. 8) He is British, from Manchester.\n\n## Раздел 18. Таблица типичных ошибок\n- Опущение be: I from Almaty → I'm from Almaty.\n- Возраст через have: I have 25 years → I'm 25.\n- Be вместе с глаголом: I am agree → I agree.\n- Согласование: She are → She is.\n- Краткая форма в утверждении: Yes, I'm → Yes, I am.\n- Порядок слов в вопросе: Where you are from? → Where are you from?\n- Без артикля: I'm teacher → I'm a teacher.\n- Путаница his и her: Lera is a student. His name is Lera → Her name is Lera.\nВедите личный список ошибок и перечитывайте раз в неделю.\n\n## Раздел 19. Итоговый тест (15 баллов)\n1) She ___ (be) from Italy. 2) ___ you a student? 3) They ___ (not be) at home. 4) I ___ (be) 25. 5) Where ___ you from? 6) ___ is your name? 7) Is he a teacher? — Yes, ___. 8) Напишите словами число 40. 9) Национальность человека из Японии: ___. 10) Как поздороваться в 8 вечера? 11) Исправьте: I have 20 years. 12) Как читается буква W? 13) Ответ на How do you do? 14) How old ___ your brother? 15) She is ___ doctor. (a или an)\nОтветы: 1) is 2) Are 3) aren't 4) am 5) are 6) What 7) he is 8) forty 9) Japanese 10) Good evening 11) I'm 20 (years old) 12) /ˈdʌbəl juː/ 13) How do you do? 14) is 15) a.\nОценка: 13–15 — отлично, переходите к уроку 2; 10–12 — хорошо, повторите слабые разделы; меньше 10 — вернитесь к теории и практике, повторите две недели.\n\n## План на 4 недели\nНеделя 1: регистры, приветствия, прощания, представление (раздел 1), to be (раздел 2). Практика 1, 2. Ежедневно 10 минут карточек.\nНеделя 2: притяжательные, вопросительные, this/that (раздел 3), числа и алфавит (раздел 4). Практика 3, 4, диктовка.\nНеделя 3: страны и национальности (раздел 5), профессии (раздел 6), small talk (раздел 7), произношение (раздел 8). Практика 5, 6, говорение 1–3.\nНеделя 4: перевод (практика 7), чтение, письмо, говорение 4–5, итоговый тест, разбор ошибок.\n\n## Что стоит сверить в книгах\nRaymond Murphy, «English Grammar in Use» (to be, вопросы, числа); Michael Swan, «Practical English Usage»; Cambridge Dictionary и Oxford Learner's Dictionaries (произношение и примеры). Для фонетики: Peter Roach, «English Phonetics and Phonology».\nВажное замечание: упражнения и ключи составлены для самопроверки. Для оценки произношения и письма нужна обратная связь от человека, хорошо владеющего английским.\n", "w": [["hello", "привет", "/həˈloʊ/"], ["goodbye", "до свидания", "/ɡʊdˈbaɪ/"], ["name", "имя", "/neɪm/"], ["friend", "друг, подруга", "/frɛnd/"], ["from", "из, от", "/frʌm/"], ["where", "где, куда", "/wɛr/"], ["fine", "хорошо, в порядке", "/faɪn/"], ["welcome", "добро пожаловать", "/ˈwɛlkəm/"], ["introduce", "представлять", "/ˌɪntrəˈduːs/"], ["spell", "писать по буквам", "/spɛl/"], ["nationality", "национальность", "/ˌnæʃəˈnæləti/"], ["country", "страна", "/ˈkʌntri/"], ["age", "возраст", "/eɪdʒ/"], ["old", "старый", "/oʊld/"], ["student", "студент", "/ˈstuːdənt/"], ["teacher", "учитель", "/ˈtiːtʃər/"], ["pleased", "рад", "/pliːzd/"], ["morning", "утро", "/ˈmɔːrnɪŋ/"], ["evening", "вечер", "/ˈiːvnɪŋ/"], ["colleague", "коллега", "/ˈkɑːliːɡ/"]]}, {"t": "УРОК 2. Я И МОЯ СЕМЬЯ (РАСШИРЕННЫЙ КУРС)\nОбъём: 4 недели, 5–6 дней в неделю по 45–60 минут (около 20–25 часов). Уровень: A1 → A2.\nУчебный язык: объяснения по-русски, примеры по-английски.\n\n## Как устроен урок\nУрок состоит из трёх частей: теория (разделы 1–8), практика (разделы 9–16) и контроль (разделы 17–19). Сначала прочитайте теорию целиком один раз без заучивания, потом работайте с практикой и возвращайтесь к теории по мере необходимости. Это нормальный путь: так устроено усвоение грамматики, когда правило становится понятным только после нескольких применений.\n\n## Раздел 0. Научная основа метода\nНесколько принципов из прикладной лингвистики и когнитивной психологии определяют порядок работы:\n1. Входной материал (input). Язык усваивается, когда вы много слышите и читаете понятного. Поэтому в уроке есть тексты, диалоги и диктовка.\n2. Выходная речь (output). Исследовательница Мерилл Суэйн показала, что когда вы говорите и пишете, вы замечаете собственные пробелы. Поэтому говорение и письмо обязательны.\n3. Активное вспоминание (retrieval practice). Вспоминать полезнее, чем перечитывать.\n4. Интервальные повторения (spaced practice). Повторять лучше через разные промежутки, чем одним заходом.\n5. Обратная связь. Ошибки нужно разбирать, а не просто исправлять. Поэтому в уроке есть таблица ошибок и ключи.\nВывод: меньше пассивного чтения, больше работы руками и голосом.\n\n## Раздел 1. Лексика: семья и родственные связи\nЯдро: family /ˈfæmli/, parents /ˈpɛrənts/, mother (US mom, UK mum), father (dad), brother, sister, sibling /ˈsɪblɪŋ/ (брат или сестра), son, daughter /ˈdɔːtər/, child (мн. children), husband /ˈhʌzbənd/, wife /waɪf/, only child (единственный ребёнок), twins /twɪnz/.\nСтаршее и младшее поколение: grandmother (grandma), grandfather (grandpa), grandparents, grandson, granddaughter, grandchildren.\nРасширенная семья: aunt /ænt/ (UK /ɑːnt/), uncle /ˈʌŋkəl/, cousin /ˈkʌzən/, nephew /ˈnɛfjuː/, niece /niːs/, relatives /ˈrɛlətɪvz/ (родственники).\nРодственники по браку (in-laws): mother-in-law, father-in-law, brother-in-law, sister-in-law, son-in-law, daughter-in-law.\nСводные и единокровные: stepfather, stepmother, stepbrother, stepsister; half-brother, half-sister (общий один родитель).\nОтношения: partner, fiancé /ˌfiːɑːnˈseɪ/ (жених), fiancée (невеста; произносится так же), boyfriend, girlfriend, ex (бывший), spouse (супруг, супруга; официально).\nНюансы: слово cousin не указывает пол; в США family чаще воспринимается как нуклеарная семья (родители и дети), в британской речи часто шире. Слово relatives означает всех родственников, а parents означает только мать и отца, в отличие от русского «родители» с оттенками. Не путайте parents (родители) и relatives (родственники): оба слова легко спутать из-за схожести написания и перевода.\n\n## Раздел 2. Описание людей: внешность и характер\nВнешность: tall, short, medium height; slim (стройный), thin (худой, часто негативно), athletic, heavy, overweight (осторожно, может быть грубо); волосы: short / long, straight (прямые), wavy (волнистые)
